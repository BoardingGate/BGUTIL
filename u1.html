      // --- TRACKER DE ACTUALIZACIONES (VERSIÓN ROBUSTA + TRADUCCIÓN) ---
      const UpdateTracker = () => {
        const [updates, setUpdates] = useState([]);
        const [stats, setStats] = useState({ count: 0, avgDays: 0, range: '' });
        const [loading, setLoading] = useState(true);
        const [translating, setTranslating] = useState(false);
        const [error, setError] = useState(false);
        const [debugInfo, setDebugInfo] = useState('');

        // 1. FUNCIÓN DE TRADUCCIÓN (Google Translate 'gtx')
        // Intenta traducir, si falla, devuelve el inglés original sin romper nada.
        const fetchTranslation = async (text) => {
            if (!text) return "";
            try {
                const targetUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=${encodeURIComponent(text)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const googleData = JSON.parse(data.contents);
                
                if (googleData && googleData[0]) {
                    return googleData[0].map(item => item[0]).join('');
                }
                return text; 
            } catch (e) {
                return text; // Fallback silencioso
            }
        };

        useEffect(() => {
            const fetchUpdates = async () => {
                const cb = () => `&_cb=${Date.now()}`;

                // VOLVEMOS A LA URL QUE SÍ FUNCIONABA (Búsqueda amplia en Google News)
                // Quitamos filtros de fecha estrictos en la URL para asegurar que devuelva ALGO.
                const URL_BROAD = 'https://news.google.com/rss/search?q=site:notateslaapp.com+"Software+Update"&hl=en-US&gl=US&ceid=US:en';

                const attempts = [
                    // AllOrigins suele ser el más permisivo para Google RSS
                    { name: 'Google Broad (AO)', url: `https://api.allorigins.win/get?url=${encodeURIComponent(URL_BROAD)}` + cb() },
                    // Backup con CorsProxy
                    { name: 'Google Broad (CP)', url: `https://corsproxy.io/?${encodeURIComponent(URL_BROAD)}` + cb() }
                ];

                let rawItems = [];
                let successSource = '';

                // --- FASE 1: OBTENCIÓN (FETCH) ---
                for (const attempt of attempts) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout
                        
                        const response = await fetch(attempt.url, { signal: controller.signal });
                        clearTimeout(timeoutId);

                        let xmlText = '';
                        if (attempt.name.includes('(AO)')) {
                            const json = await response.json();
                            xmlText = json.contents;
                        } else {
                            xmlText = await response.text();
                        }

                        if (!xmlText || !xmlText.includes('<rss')) throw new Error("XML Inválido");

                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                        const items = Array.from(xmlDoc.querySelectorAll("item"));
                        const versionRegex = /\b202[4-9]\.\d+(\.\d+)?\b/;

                        rawItems = items.map(item => {
                            const title = item.querySelector("title")?.textContent || "";
                            const link = item.querySelector("link")?.textContent || "";
                            const pubDateRaw = item.querySelector("pubDate")?.textContent || "";
                            let descRaw = item.querySelector("description")?.textContent || "";

                            const match = title.match(versionRegex);
                            if (!match) return null;

                            const version = match[0];
                            const dateObj = new Date(pubDateRaw);
                            const dateStr = !isNaN(dateObj) ? dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) : "Reciente";

                            // Limpieza básica HTML
                            const tempDiv = document.createElement("div");
                            tempDiv.innerHTML = descRaw;
                            let cleanText = tempDiv.textContent || "";
                            cleanText = cleanText.split("Read more")[0].trim();
                            cleanText = cleanText.substring(0, 300); // Limitar caracteres

                            return { version, date: dateStr, dateObj, description: cleanText, link };
                        }).filter(Boolean);

                        if (rawItems.length > 0) {
                            successSource = attempt.name;
                            break; 
                        }
                    } catch (err) {
                        console.log(`Intento fallido: ${attempt.name}`);
                    }
                }

                if (rawItems.length === 0) {
                    setError(true);
                    setLoading(false);
                    return;
                }

                // --- FASE 2: PROCESADO ---
                // Ordenar por fecha (Más reciente primero)
                rawItems.sort((a, b) => b.dateObj - a.dateObj);
                
                // Unicidad (evitar duplicados)
                const uniqueVersions = [];
                const seen = new Set();
                rawItems.forEach(item => {
                    if (!seen.has(item.version) && item.version.length > 5) {
                        seen.add(item.version);
                        uniqueVersions.push(item);
                    }
                });

                setLoading(false);
                setDebugInfo(successSource);

                // --- FASE 3: TRADUCCIÓN ---
                setTranslating(true);
                
                // Traducimos
                const translatedUpdates = await Promise.all(uniqueVersions.map(async (item) => {
                    // Pequeño retardo aleatorio
                    await new Promise(r => setTimeout(r, Math.random() * 300));
                    const translatedDesc = await fetchTranslation(item.description);
                    return { ...item, description: translatedDesc };
                }));

                // --- FASE 4: ESTADÍSTICAS ---
                let totalDaysDiff = 0;
                let countDiffs = 0;
                const finalData = translatedUpdates.map((item, index) => {
                    let days = null;
                    if (index < translatedUpdates.length - 1) {
                        const diff = Math.abs(item.dateObj - translatedUpdates[index + 1].dateObj);
                        days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                        totalDaysDiff += days;
                        countDiffs++;
                    }
                    return { ...item, daysSincePrev: days };
                });

                const avg = countDiffs > 0 ? (totalDaysDiff / countDiffs).toFixed(1) : 0;
                const firstDate = finalData.length > 0 ? finalData[finalData.length-1].date : "";
                const lastDate = finalData.length > 0 ? finalData[0].date : "";

                setStats({ count: finalData.length, avgDays: avg, range: `${firstDate} ➔ ${lastDate}` });
                setUpdates(finalData);
                setTranslating(false);
            };

            fetchUpdates();
        }, []);

        return (
            <div className="space-y-6 animate-fade-in">
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                    
                    {/* CABECERA */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-xl font-display font-bold text-white flex items-center gap-2">
                                <Icons.List className="w-6 h-6 text-blue-400" /> Centro de Actualizaciones
                            </h2>
                            <p className="text-sm text-slate-400 mt-1 font-bold">Monitor de versiones en tiempo real</p>
                        </div>
                        {debugInfo && <div className="text-[10px] text-slate-600 font-mono border border-slate-800 px-2 py-1 rounded">Fuente: {debugInfo}</div>}
                    </div>

                    {/* BOTONES FUENTES OFICIALES */}
                    <div className="bg-blue-900/10 border border-blue-500/30 p-6 rounded-xl text-center mb-8">
                        <p className="text-xs text-blue-300 font-bold mb-4 uppercase tracking-wider flex items-center justify-center gap-2">
                            <Icons.Link className="w-4 h-4"/> Fuentes Oficiales de Referencia
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                            <a href="https://www.notateslaapp.com/software-updates/" target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-green-500 text-white font-bold py-4 px-6 rounded-xl transition-all group shadow-lg flex-1 max-w-xs">
                                <span className="text-2xl group-hover:scale-110 transition-transform">📝</span> 
                                <div className="text-left leading-tight"><div className="text-[10px] text-slate-400 uppercase font-bold">Notas Completas</div><div className="text-base text-green-400">NotATeslaApp</div></div>
                            </a>
                            <a href="https://www.teslafi.com/firmware.php" target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-blue-500 text-white font-bold py-4 px-6 rounded-xl transition-all group shadow-lg flex-1 max-w-xs">
                                <span className="text-2xl group-hover:scale-110 transition-transform">📊</span> 
                                <div className="text-left leading-tight"><div className="text-[10px] text-slate-400 uppercase font-bold">Rastreador Flota</div><div className="text-base text-blue-400">TeslaFi Tracker</div></div>
                            </a>
                        </div>
                    </div>

                    <div className="border-t border-slate-800 pt-6">
                        {loading && (
                            <div className="text-center py-10 bg-slate-800/30 rounded-xl border border-slate-800 border-dashed animate-pulse">
                                <div className="text-blue-400 font-bold text-sm">Consultando índice de Google...</div>
                            </div>
                        )}

                        {translating && (
                            <div className="text-center py-4 mb-4 bg-blue-900/20 rounded-xl border border-blue-500/30 border-dashed animate-pulse">
                                <div className="text-blue-300 font-bold text-xs flex items-center justify-center gap-2">
                                    <Icons.Settings className="w-4 h-4 animate-spin" />
                                    Traduciendo notas al español...
                                </div>
                            </div>
                        )}

                        {error && !loading && !translating && (
                            <div className="text-center py-8 bg-red-900/10 rounded-xl border border-red-900/30 border-dashed">
                                <p className="text-red-400 font-bold text-sm">No se pudieron cargar las noticias automáticamente.</p>
                                <p className="text-red-300/50 text-xs mt-1">Usa los botones de arriba para consultar directamente.</p>
                            </div>
                        )}

                        {!loading && !error && updates.length > 0 && (
                            <>
                                {/* ESTADÍSTICAS */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                    <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-center">
                                        <div className="text-xs text-slate-400 font-bold uppercase mb-1">Ritmo de Actualización</div>
                                        <div className="text-3xl font-bold text-green-400 font-display">{stats.avgDays} <span className="text-sm text-slate-500">días</span></div>
                                        <div className="text-[10px] text-slate-500">Media entre versiones</div>
                                    </div>
                                    <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-center">
                                        <div className="text-xs text-slate-400 font-bold uppercase mb-1">Versiones Detectadas</div>
                                        <div className="text-3xl font-bold text-white font-display">{stats.count}</div>
                                        <div className="text-[10px] text-slate-500">En el feed actual</div>
                                    </div>
                                    <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-center">
                                        <div className="text-xs text-slate-400 font-bold uppercase mb-1">Rango de Fechas</div>
                                        <div className="text-sm font-bold text-blue-300 font-mono mt-2">{stats.range}</div>
                                    </div>
                                </div>

                                <h3 className="text-sm font-bold text-slate-500 uppercase mb-4 flex items-center gap-2">
                                    <Icons.Activity className="w-4 h-4"/> Historial de Versiones (Traducido)
                                </h3>

                                <div className="relative border-l-2 border-slate-800 ml-3 md:ml-6 space-y-8 pb-4">
                                    {updates.map((update, idx) => (
                                        <div key={idx} className="relative pl-8 md:pl-12 group animate-fade-in">
                                            <div className={`absolute -left-[9px] top-0 w-5 h-5 rounded-full border-4 border-slate-900 ${idx === 0 ? 'bg-green-500 shadow-[0_0_15px_rgba(34,197,94,0.6)]' : 'bg-slate-600'}`}></div>
                                            
                                            <div className="bg-slate-800/40 border border-slate-700/50 rounded-xl p-5 hover:bg-slate-800/60 transition-colors group-hover:border-slate-600">
                                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3 border-b border-slate-700/50 pb-3">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-xl font-mono font-bold text-white">{update.version}</span>
                                                        {idx === 0 && <span className="bg-green-500/20 text-green-400 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-widest">MÁS RECIENTE</span>}
                                                    </div>
                                                    <div className="flex items-center gap-2 text-slate-400 text-xs font-bold uppercase">
                                                        <Icons.Calendar className="w-4 h-4" /> {update.date}
                                                    </div>
                                                </div>
                                                
                                                {update.daysSincePrev > 0 && (
                                                    <div className="text-xs text-blue-400 font-bold mb-3 bg-blue-900/20 inline-block px-2 py-1 rounded">
                                                        ⏱️ +{update.daysSincePrev} días de espera
                                                    </div>
                                                )}

                                                <div className="text-sm text-slate-300 leading-relaxed mb-4">
                                                    {update.description || <span className="italic text-slate-500">Sin descripción disponible.</span>}
                                                </div>
                                                
                                                <a href={update.link} target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 transition-colors">
                                                    Ver fuente original <Icons.Link className="w-3 h-3"/>
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            </div>
        );
      };

        
      // --- APP PRINCIPAL ---

      const App = () => {
        const [activeTab, setActiveTab] = useState('strategy'); 
          
        const [simParams, setSimParams] = usePersistentState('simParams', { speed: 120, temperature: 20, gradient: 0, windSpeed: 0, electricConsumptionRef: 14, batteryCapacity: 60 });
        const [simCosts, setSimCosts] = usePersistentState('simCosts', { electricityPrice: 0.08, gasPrice: 1.45, gasConsumptionRef: 6.5 });
        const [consumption, setConsumption] = useState(0);

        useEffect(() => { setConsumption(calculateConsumption(simParams)); }, [simParams]);

        const handleBack = () => { window.location.href = "https://boardinggate.github.io/Tesla/tesla.html"; };  

        const renderContent = () => {
            switch(activeTab) {
                case 'strategy': return <ChargingStrategy />;
                case 'curve': return <ChargeCurveCalculator />;
                case 'tariff': return <TariffComparator />;
                case 'drain': return <DrainCalculator />;
                case 'simulator': return (
                    <>
                        <Visualizer params={simParams} />
                        <ResultsDisplay consumption={consumption} params={simParams} costs={simCosts} />
                        <ControlPanel params={simParams} setParams={setSimParams} costs={simCosts} setCosts={setSimCosts} />
                        <SimpleSavingsSimulator params={simParams} costs={simCosts} />
                    </>
                );
                case 'amortization': return <AmortizationCalculator />;
                case 'calculator': return <ChargingCalculator />;
                case 'vin': return <VinDecoder />;    
                case 'updates': return <UpdateTracker />;    
                case 'nyland': return <NylandCalculator />;
                case 'equiv': return <EquivalenceCalculator />;
                case 'charge': return <PlaceholderTab />;
                default: return <PlaceholderTab />;
            }
        };

        const TabButton = ({ id, label }) => (
            <button onClick={() => setActiveTab(id)} className={`px-6 py-4 text-base font-bold transition-all uppercase tracking-wider whitespace-nowrap ${activeTab === id ? 'tab-active' : 'tab-inactive'}`}>{label}</button>
        );

        return (
            <div className="min-h-screen bg-[#0a0a0a] text-white p-4 md:p-8">
                <div className="max-w-6xl mx-auto">
                    <header className="mb-8">
                        <div className="flex justify-between items-end border-b border-slate-800 pb-4">
                            <div>
                                <h1 className="text-5xl md:text-6xl font-display font-bold"><span className="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Boarding</span><span className="text-red-600">Gate</span></h1>
                                <p className="text-slate-400 font-bold tracking-widest text-base mt-2">TESLA EFFICIENCY TOOLS</p>
                            </div>
                            <button onClick={handleBack} className="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl text-base font-bold transition-colors flex items-center gap-2"><Icons.LogOut className="w-6 h-6"/> Volver</button>
                        </div>
                        <div className="flex overflow-x-auto gap-4 border-b border-slate-800/50 mt-6 pb-2">
                            <TabButton id="strategy" label="Estrategia Carga" />
                            <TabButton id="curve" label="Curva Carga" />
                            <TabButton id="tariff" label="COMPARADOR TARIFAS" />
                            <TabButton id="drain" label="Drenaje" />
                            <TabButton id="simulator" label="Simulador" />
                            <TabButton id="amortization" label="Amortización" />
                            <TabButton id="calculator" label="Calculadora" />
                            <TabButton id="vin" label="DECODE VIN" />
                            <TabButton id="updates" label="UPDATES" />
                            <TabButton id="nyland" label="Bjørn Nyland" />
                            <TabButton id="equiv" label="Equivalencia" />
                            <TabButton id="charge" label="+EXCEL" />
                        </div>
                    </header>
                    <main className="animate-fade-in keyboard-padding">{renderContent()}</main>

                </div>
            </div>
        );
      };
          
   
      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
