                </div>
                <div className="flex items-center gap-3">
                    <button onClick={() => adjust(onChangeKey, -step, min, max)} className="w-8 h-8 flex items-center justify-center bg-slate-700 hover:bg-slate-600 rounded text-white font-bold text-lg select-none">-</button>
                    <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => handleChange(onChangeKey, e.target.value)} className="flex-1 h-2 bg-slate-700 rounded-lg cursor-pointer accent-blue-500"/>
                    <button onClick={() => adjust(onChangeKey, step, min, max)} className="w-8 h-8 flex items-center justify-center bg-slate-700 hover:bg-slate-600 rounded text-white font-bold text-lg select-none">+</button>
                </div>
            </div>
        );

        return (
            <div className="space-y-6 animate-fade-in pb-10">
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg">
                    <h2 className="text-lg font-display font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2"><Icons.Settings className="w-5 h-5 text-slate-400" /> Laboratorio de Presión</h2>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 flex flex-col justify-center">
                            <label className="text-xs font-bold text-yellow-500 uppercase block mb-3">Referencia (Etiqueta Puerta)</label>
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-3xl font-mono font-bold text-white">{state.recPressure} <span className="text-sm text-slate-500">bar</span></span>
                                <span className="text-xl font-mono font-bold text-slate-400">{toPsi(state.recPressure)} <span className="text-xs text-slate-500">PSI</span></span>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => adjust('recPressure', -0.1, 2.2, 3.4)} className="w-8 h-8 bg-slate-700 hover:bg-slate-600 rounded text-yellow-500 font-bold">-</button>
                                <input type="range" min="2.2" max="3.4" step="0.1" value={state.recPressure} onChange={e => handleChange('recPressure', e.target.value)} className="flex-1 h-3 bg-slate-700 rounded-lg accent-yellow-500 cursor-pointer"/>
                                <button onClick={() => adjust('recPressure', 0.1, 2.2, 3.4)} className="w-8 h-8 bg-slate-700 hover:bg-slate-600 rounded text-yellow-500 font-bold">+</button>
                            </div>
                        </div>

                        <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 space-y-4">
                            <label className="text-xs font-bold text-blue-400 uppercase block border-b border-slate-700 pb-1">Inflado Inicial</label>
                            
                            <div>
                                <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-600 mb-2">
                                    <button onClick={() => setState(p => ({...p, gasType: 'air'}))} className={`flex-1 py-2 text-[10px] font-bold uppercase rounded transition-all ${state.gasType === 'air' ? 'bg-slate-600 text-white' : 'text-slate-500 hover:text-slate-300'}`}>Aire</button>
                                    <button onClick={() => setState(p => ({...p, gasType: 'nitro'}))} className={`flex-1 py-2 text-[10px] font-bold uppercase rounded transition-all ${state.gasType === 'nitro' ? 'bg-green-600 text-white' : 'text-slate-500 hover:text-slate-300'}`}>Nitrógeno</button>
                                </div>
                                <p className="text-[10px] text-slate-500 italic leading-tight">
                                    {state.gasType === 'air' 
                                        ? "El aire normal contiene humedad que se expande más con el calor." 
                                        : "El nitrógeno es un gas seco y más estable a cambios de temperatura."}
                                </p>
                            </div>

                            <PrecisionSlider label="Presión Puesta" value={state.startPressure} min={1.5} max={4.0} step={0.1} onChangeKey="startPressure" unit="bar" showPsi={true} />
                            <PrecisionSlider label="Temp. Ambiente" value={state.refTemp} min={-10} max={45} step={1} onChangeKey="refTemp" unit="ºC" colorClass="text-orange-400" />
                        </div>

                        <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 space-y-4">
                            <label className="text-xs font-bold text-cyan-400 uppercase block border-b border-slate-700 pb-1">Condiciones Rodaje</label>
                            <PrecisionSlider label="Temp. Exterior" value={state.targetTemp} min={-20} max={50} step={1} onChangeKey="targetTemp" unit="ºC" colorClass="text-cyan-400" />
                            <div className="mt-4 pt-2 cursor-pointer" onClick={() => setState(p => ({...p, highwayMode: !p.highwayMode}))}><div className="flex items-center justify-between"><span className="text-xs font-bold text-slate-300">Modo Autopista</span><div className={`w-10 h-6 rounded-full p-1 transition-colors ${state.highwayMode ? 'bg-green-500' : 'bg-slate-700'}`}><div className={`bg-white w-4 h-4 rounded-full transition-transform ${state.highwayMode ? 'translate-x-4' : 'translate-x-0'}`}></div></div></div><div className="text-[9px] text-slate-500 mt-1 italic text-right">{state.highwayMode ? "+25ºC fricción rodadura" : "Sin fricción extra"}</div></div>
                        </div>
                    </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden relative shadow-2xl min-h-[450px]">
                    <div className="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur px-3 py-1 rounded border border-slate-700">
                        <div className="text-xs font-bold text-slate-400 uppercase flex items-center gap-2">
                            <Icons.Activity className="w-4 h-4"/> Simulación Visual (2D + 3D)
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-12 h-full pt-12">
                        <div className="col-span-3 md:col-span-2 border-r border-slate-800 bg-slate-900/50 flex items-center justify-center">
                            <Manometer2D currentBar={resultPressureBar} targetBar={state.recPressure} />
                        </div>
                        
                        <div className="col-span-9 md:col-span-10 relative flex items-center justify-center">
                            <Tire3DScene currentBar={resultPressureBar} targetBar={state.recPressure} />
                            
                            <div className="absolute bottom-4 right-4 flex gap-4 pointer-events-none z-20">
                                <div className="bg-slate-900/90 border border-slate-600 px-4 py-2 rounded-xl text-center shadow-xl backdrop-blur-md">
                                    <div className="text-[10px] font-bold text-slate-400 uppercase">PRESIÓN REAL</div>
                                    <div className={`text-2xl font-mono font-bold ${statusColor}`}>{resultPressureBar.toFixed(2)} bar</div>
                                    <div className="text-xs font-bold text-white">{toPsi(resultPressureBar)} PSI</div>
                                </div>
                                <div className="bg-slate-900/90 border border-slate-600 px-4 py-2 rounded-xl text-center shadow-xl backdrop-blur-md hidden sm:block">
                                    <div className="text-[10px] font-bold text-slate-400 uppercase">TEMP GAS</div>
                                    <div className="text-2xl font-mono font-bold text-orange-300">{effectiveTargetTemp.toFixed(0)}°C</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className={`p-6 rounded-xl border-2 shadow-lg flex flex-col justify-center items-center text-center transition-colors ${statusColor.includes('red') ? 'bg-red-900/20 border-red-500/50' : statusColor.includes('blue') ? 'bg-blue-900/20 border-blue-500/50' : 'bg-green-900/20 border-green-500/50'}`}>
                        <WearIcon className={`w-12 h-12 mb-2 ${statusColor}`} />
                        <h3 className={`text-2xl font-black uppercase leading-tight mb-2 ${statusColor}`}>{wearText}</h3>
                        <p className="text-slate-300 text-sm font-medium">
                            {val < p * 0.96 ? "Neumático aplastado. Riesgo de reventón y desgaste rápido en hombros." : 
                             val > p * 1.05 ? "Neumático abombado. Desgaste central y menor superficie de frenada." : 
                             "Pisada óptima. Máxima adherencia y vida útil."}
                        </p>
                    </div>

                    <div className="bg-slate-800/40 border border-slate-700 rounded-xl p-6 flex flex-col justify-center">
                        <div className="flex justify-between items-center mb-4 border-b border-slate-700/50 pb-2"><h4 className="text-sm font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2"><Icons.Zap className="w-4 h-4 text-yellow-400"/> Impacto en Autonomía</h4></div>
                        <div className="grid grid-cols-2 gap-4 text-center">
                            <div><div className="text-xs text-slate-500 font-bold uppercase mb-1">Rango (100km)</div><div className={`text-2xl font-mono font-bold ${kmDiff < -0.1 ? 'text-red-400' : kmDiff > 0.1 ? 'text-green-400' : 'text-white'}`}>{kmDiff > 0 ? '+' : ''}{kmDiff.toFixed(1)} <span className="text-sm text-slate-500">km</span></div></div>
                            <div><div className="text-xs text-slate-500 font-bold uppercase mb-1">Consumo Extra</div><div className={`text-2xl font-mono font-bold ${extraConsumptionKwh > 0.01 ? 'text-red-400' : extraConsumptionKwh < -0.01 ? 'text-green-400' : 'text-white'}`}>{extraConsumptionKwh > 0 ? '+' : ''}{extraConsumptionKwh.toFixed(2)} <span className="text-sm text-slate-500">kWh</span></div></div>
                        </div>
                        
                        <div className="mt-4 pt-3 border-t border-slate-700/50 text-[10px] text-slate-400 leading-relaxed bg-slate-900/30 p-2 rounded">
                            <strong>¿Por qué ocurre esto?</strong> Una presión baja aumenta la superficie de contacto del neumático con el suelo (resistencia a la rodadura), lo que obliga al motor a usar más energía (kWh) para mover el coche, reduciendo los km totales.
                        </div>
                    </div>
                </div>

                <div className="mt-2 p-4 bg-slate-800 border border-slate-700 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
                    <div className="text-left"><div className="flex items-center gap-2 mb-1"><Icons.Zap className="w-5 h-5 text-orange-500" /><span className="text-sm font-bold text-slate-300 uppercase">Herramienta Recomendada</span></div><p className="text-xs text-slate-400 max-w-lg">Ajusta la presión en frío donde quieras con el compresor Xiaomi Portable 2 Pro. Digital y exacto.</p></div>
                    <a href="https://www.amazon.es/s?k=xiaomi+portable+electric+air+compressor+2" target="_blank" className="bg-orange-600 hover:bg-orange-500 text-white text-sm font-bold px-6 py-3 rounded-xl transition-all shadow-lg whitespace-nowrap">Ver en Amazon ➜</a>
                </div>
            </div>
        );
      };


      // --- GUÍA DE ROTACIÓN DE NEUMÁTICOS (V2 - INTERVALO PERSONALIZABLE + 3D) ---
      const TireRotationGuide = () => {
        const [state, setState] = usePersistentState('tireRotState_v2', {
            currentKm: 0,
            lastRotKm: 0,
            rotationInterval: 10000, 
            isStaggered: false, 
            isDirectional: false,
            treadFront: 6.5,
            treadRear: 5.5,
            model: 'Y'
        });

        const Rotation3DScene = ({ moves }) => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                if (!mountRef.current || !window.THREE) return;

                const width = mountRef.current.offsetWidth;
                const height = 350;
                const scene = new THREE.Scene();
                scene.background = null; 

                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
                camera.position.set(0, 35, 25); // Vista isométrica elevada
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                
                while (mountRef.current.firstChild) {
                    mountRef.current.removeChild(mountRef.current.firstChild);
                }
                mountRef.current.appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);

                const carGroup = new THREE.Group();
                scene.add(carGroup);

                const chassisGeo = new THREE.BoxGeometry(14, 1, 32);
                const chassisMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true, transparent: true, opacity: 0.3 });
                const chassis = new THREE.Mesh(chassisGeo, chassisMat);
                carGroup.add(chassis);

                const cabinGeo = new THREE.BoxGeometry(12, 4, 15);
                const cabin = new THREE.Mesh(cabinGeo, chassisMat);
                cabin.position.y = 2.5;
                cabin.position.z = 2; 
                carGroup.add(cabin);

                const dirShape = new THREE.Shape();
                dirShape.moveTo(0, 0);
                dirShape.lineTo(-2, 3);
                dirShape.lineTo(2, 3);
                dirShape.lineTo(0, 0);
                const arrowGeo = new THREE.ShapeGeometry(dirShape);
                const arrowMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
                const frontArrow = new THREE.Mesh(arrowGeo, arrowMat);
                frontArrow.rotation.x = -Math.PI / 2;
                frontArrow.position.set(0, 0.6, -18); 
                carGroup.add(frontArrow);

                const createTire = () => {
                    const group = new THREE.Group();
                    const tireGeo = new THREE.CylinderGeometry(3, 3, 2.5, 32);
                    const tireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
                    const tireMesh = new THREE.Mesh(tireGeo, tireMat);
                    tireMesh.rotation.z = Math.PI / 2;
                    group.add(tireMesh);
                    const rimGeo = new THREE.CylinderGeometry(2, 2, 2.6, 16);
                    const rimMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.6, roughness: 0.3 });
                    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
                    rimMesh.rotation.z = Math.PI / 2;
                    group.add(rimMesh);
                    return group;
                };

                const POSITIONS = [
                    new THREE.Vector3(-8, 2, -10), // 0: FL (Delantera Izq)
                    new THREE.Vector3( 8, 2, -10), // 1: FR (Delantera Der)
                    new THREE.Vector3(-8, 2,  10), // 2: RL (Trasera Izq)
                    new THREE.Vector3( 8, 2,  10), // 3: RR (Trasera Der)
                ];

                const tires = [];
                for (let i = 0; i < 4; i++) {
                    const t = createTire();
                    t.position.copy(POSITIONS[i]);
                    carGroup.add(t);
                    tires.push({ mesh: t, originalIdx: i });
                }

                let time = 0;
                const animDuration = 120;
                const pauseDuration = 60;
                let frameId;

                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    
                    time++;
                    const cycle = animDuration + pauseDuration;
                    const progress = time % cycle;

                    if (progress === 0) {
                        tires.forEach((t, i) => {
                            t.mesh.position.copy(POSITIONS[i]);
                            t.mesh.rotation.x = 0;
                            t.mesh.rotation.y = 0;
                        });
                    }

                    if (progress < animDuration && moves && moves.length > 0) {
                        const t = progress / animDuration;
                        const ease = t * t * (3 - 2 * t);

                        moves.forEach(move => {
                            const tireObj = tires[move.start];
                            const startPos = POSITIONS[move.start];
                            const endPos = POSITIONS[move.end];

                            tireObj.mesh.position.lerpVectors(startPos, endPos, ease);
                            
                            const jumpHeight = 8;
                            tireObj.mesh.position.y = 2 + (Math.sin(ease * Math.PI) * jumpHeight);
                            tireObj.mesh.rotation.x = ease * Math.PI * 2;
                            tireObj.mesh.rotation.y = ease * Math.PI; 
                        });
                    } else if (progress >= animDuration) {
                         moves.forEach(move => {
                            const tireObj = tires[move.start];
                            tireObj.mesh.position.copy(POSITIONS[move.end]);
                            tireObj.mesh.position.y = 2;
                            tireObj.mesh.rotation.set(0,0,0);
                         });
                    }
                    renderer.render(scene, camera);
                };

                animate();

                const handleResize = () => {
                    if (!mountRef.current) return;
                    const w = mountRef.current.offsetWidth;
                    camera.aspect = w / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, height);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(frameId);
                    if (mountRef.current && renderer) mountRef.current.removeChild(renderer.domElement);
                };
            }, [moves]);

            return <div ref={mountRef} className="w-full h-[350px] cursor-pointer" title="Visualización 3D" />;
        };


        const MAX_DIFF_MM = 1.5; 
        const MIN_LEGAL = 1.6;
        const MIN_SAFE = 3.0;
        const TORQUE_NM = 175; 

        const interval = state.rotationInterval || 10000; 
        const kmSinceLast = state.currentKm - state.lastRotKm;
        const wearDiff = Math.abs(state.treadFront - state.treadRear);
        const needsRotationByKm = kmSinceLast >= interval;
        
        let patternName = "Cruzado Trasero (Rearward Cross)";

      const TireCalculator = () => {
        const [config, setConfig] = usePersistentState('tireConfigV2', {
            baseRange: 554,   
            batteryKwh: 60,   
            priceKwh: 0.09,
            annualKm: 20000
        });

        const [setupA, setSetupA] = usePersistentState('tireSetupA_V2', { size: 18, width: 235, profile: 45, hasCaps: true });
        const [setupB, setSetupB] = usePersistentState('tireSetupB_V2', { size: 19, width: 235, profile: 40, hasCaps: false });

        const Wheel3DScene = ({ data }) => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                if (!mountRef.current || !window.THREE) return;

                const width = mountRef.current.offsetWidth;
                const height = 220; 
                const scene = new THREE.Scene();
                scene.background = null; 

                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                
                camera.position.set(0, 0, 130); 

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                
                while (mountRef.current.firstChild) {
                    mountRef.current.removeChild(mountRef.current.firstChild);
                }
                mountRef.current.appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
                dirLight.position.set(10, 10, 20);
                scene.add(dirLight);
                const rimLight = new THREE.PointLight(0x3b82f6, 0.5);
                rimLight.position.set(-10, -10, 10);
                scene.add(rimLight);

                const wheelGroup = new THREE.Group();
                scene.add(wheelGroup);

                const rimRadius = (data.size * 2.54) / 2;
                const tireWidth = data.width / 10;
                const sidewallHeight = (data.width * (data.profile / 100)) / 10;
                const totalRadius = rimRadius + sidewallHeight;

                const tireGeo = new THREE.CylinderGeometry(totalRadius, totalRadius, tireWidth, 64);
                const tireMat = new THREE.MeshStandardMaterial({ 
                    color: 0x1f2937, 
                    roughness: 0.9, 
                    metalness: 0.1 
                });
                const tireMesh = new THREE.Mesh(tireGeo, tireMat);
                tireMesh.rotation.x = Math.PI / 2; 
                wheelGroup.add(tireMesh);

                const treadGeo = new THREE.TorusGeometry(totalRadius, 0.2, 16, 100);
                const treadMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
                const tread1 = new THREE.Mesh(treadGeo, treadMat);
                const tread2 = new THREE.Mesh(treadGeo, treadMat);
                tread1.position.z = tireWidth / 4;
                tread2.position.z = -tireWidth / 4;
                wheelGroup.add(tread1);
                wheelGroup.add(tread2);

                const rimGeo = new THREE.CylinderGeometry(rimRadius, rimRadius, tireWidth * 0.9, 64); 
                const rimMat = new THREE.MeshStandardMaterial({ 
                    color: data.hasCaps ? 0x2d3748 : 0xc0c0c0, 
                    roughness: 0.4, 
                    metalness: 0.8 
                });
                const rimMesh = new THREE.Mesh(rimGeo, rimMat);
                rimMesh.rotation.x = Math.PI / 2;
                wheelGroup.add(rimMesh);

                if (data.hasCaps) {
                    const capGeo = new THREE.CylinderGeometry(rimRadius * 0.95, rimRadius * 0.98, 1, 32);
                    const capMat = new THREE.MeshStandardMaterial({ color: 0x1a202c, roughness: 0.5, metalness: 0.5 });
                    const cap = new THREE.Mesh(capGeo, capMat);
                    cap.rotation.x = Math.PI / 2;
                    cap.position.z = (tireWidth / 2) + 0.1; 
                    wheelGroup.add(cap);
                    
                    const centerGeo = new THREE.CylinderGeometry(2, 2, 1.2, 32);
                    const centerCap = new THREE.Mesh(centerGeo, new THREE.MeshStandardMaterial({color: 0x999999}));
                    centerCap.rotation.x = Math.PI / 2;
                    centerCap.position.z = (tireWidth / 2) + 0.2;
                    wheelGroup.add(centerCap);

                } else {
                    const numSpokes = 10;
                    const spokeGeo = new THREE.BoxGeometry(2, rimRadius * 0.8, 1);
                    const spokeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.2 });
                    
                    for (let i = 0; i < numSpokes; i++) {
                        const spoke = new THREE.Mesh(spokeGeo, spokeMat);
                        const angle = (i / numSpokes) * Math.PI * 2;
                        spoke.position.x = Math.cos(angle) * (rimRadius / 2);
                        spoke.position.y = Math.sin(angle) * (rimRadius / 2);
                        spoke.position.z = (tireWidth / 2) - 0.5; 
                        spoke.rotation.z = angle - (Math.PI / 2);
                        spoke.rotation.x = 0.2; 
                        wheelGroup.add(spoke);
                    }
                    
                    const centerGeo = new THREE.CylinderGeometry(2.5, 2.5, 1, 32);
                    const centerCap = new THREE.Mesh(centerGeo, new THREE.MeshStandardMaterial({color: 0x111827}));
                    centerCap.rotation.x = Math.PI / 2;
                    centerCap.position.z = (tireWidth / 2) - 0.5;
                    wheelGroup.add(centerCap);
                }

                let frameId;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    
                    wheelGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.5; 
                    wheelGroup.rotation.x += 0.01; 

                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (!mountRef.current) return;
                    const w = mountRef.current.offsetWidth;
                    camera.aspect = w / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, height);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(frameId);
                    if (mountRef.current && renderer) mountRef.current.removeChild(renderer.domElement);
                };
            }, [data]); 

            return <div ref={mountRef} className="w-full h-[220px] cursor-grab active:cursor-grabbing" title="Modelo 3D" />;
        };


        const presets = [
            { label: "M3 18\" Aero", s: 18, w: 235, p: 45, caps: true },
            { label: "M3 19\" Nova", s: 19, w: 235, p: 40, caps: false },
            { label: "M3 20\" Perf", s: 20, w: 235, p: 35, caps: false }, 
            { label: "MY 19\" Gemini", s: 19, w: 255, p: 45, caps: true },
            { label: "MY 20\" Induc", s: 20, w: 255, p: 40, caps: false },
            { label: "MY 21\" Uber", s: 21, w: 275, p: 35, caps: false }, 
            { label: "MS 21\" Arach", s: 21, w: 295, p: 30, caps: false },

        const handleConfig = (k, v) => setConfig(prev => ({...prev, [k]: parseFloat(v) || 0}));

        const calculateStats = (setup) => {
            let penalty = 0;
            const rimPenalties = { 18: 0, 19: 0.05, 20: 0.09, 21: 0.12 };
            penalty += rimPenalties[setup.size] || 0;
            const widthDiff = Math.max(0, setup.width - 235);
            const widthPenalty = (widthDiff / 10) * 0.015; 
            penalty += widthPenalty;
            if (!setup.hasCaps) penalty += 0.04;

            const efficiencyFactor = 1 - penalty;
            const realRange = config.baseRange * efficiencyFactor;
            const consumption = config.batteryKwh / (realRange / 100); 
            const annualCost = (consumption * config.annualKm / 100) * config.priceKwh;
            const diameterMm = (setup.width * (setup.profile / 100) * 2) + (setup.size * 25.4);

            return { realRange, consumption, annualCost, penalty, diameterMm };
        };

        const statsA = calculateStats(setupA);
        const statsB = calculateStats(setupB);

        const diffKm = statsB.realRange - statsA.realRange;
        const diffCost = statsB.annualCost - statsA.annualCost;
        const diffPct = ((statsB.realRange - statsA.realRange) / statsA.realRange) * 100;
        const diameterDiffPct = ((statsB.diameterMm - statsA.diameterMm) / statsA.diameterMm) * 100;
        const speedReading = 120 + (120 * (diameterDiffPct/100)); 

        const WheelSelector = ({ title, state, setState, stats }) => (

                    <div className="absolute bottom-2 bg-black/60 px-2 py-1 rounded text-[10px] text-white font-mono border border-white/10 pointer-events-none">

                </div>

                <div className="space-y-3">
                    <div className="flex flex-wrap gap-1 justify-center mb-2">
                        {presets.slice(0,4).map((p, i) => (
                            <button key={i} onClick={() => setState({size: p.s, width: p.w, profile: p.p, hasCaps: p.caps})} 
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded text-[9px] text-slate-300 font-bold">
                                {p.label}
                            </button>

                    </div>

                    <div className="grid grid-cols-3 gap-2">
                        <div>
                            <label className="text-[9px] font-bold text-slate-500 block text-center">ANCHO</label>
                            <select value={state.width} onChange={e => setState({...state, width: parseInt(e.target.value)})} className="w-full bg-slate-800 text-white text-xs font-bold p-1 rounded border border-slate-600 text-center">
                                {[235, 245, 255, 265, 275, 285, 295].map(w => <option key={w} value={w}>{w}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="text-[9px] font-bold text-slate-500 block text-center">PERFIL</label>
                            <select value={state.profile} onChange={e => setState({...state, profile: parseInt(e.target.value)})} className="w-full bg-slate-800 text-white text-xs font-bold p-1 rounded border border-slate-600 text-center">
                                {[30, 35, 40, 45, 50, 55].map(p => <option key={p} value={p}>{p}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="text-[9px] font-bold text-slate-500 block text-center">LLANTA</label>
                            <select value={state.size} onChange={e => setState({...state, size: parseInt(e.target.value)})} className="w-full bg-slate-800 text-white text-xs font-bold p-1 rounded border border-slate-600 text-center">
                                {[18, 19, 20, 21].map(s => <option key={s} value={s}>{s}"</option>)}

                    </div>

                    <button onClick={() => setState({...state, hasCaps: !state.hasCaps})} 
                        className={`w-full py-2 text-xs font-bold uppercase rounded border transition-colors ${state.hasCaps ? 'bg-green-900/40 border-green-500 text-green-400' : 'bg-slate-800 border-slate-600 text-slate-400'}`}>
                        {state.hasCaps ? 'Aero Caps: SÍ' : 'Aero Caps: NO'}
                    </button>

                    <div className="mt-2 pt-2 border-t border-slate-700/50 text-center">
                        <div className="text-2xl font-display font-bold text-white">{formatDecimal(stats.realRange, 0)} km</div>
                        <div className="text-[10px] font-bold text-slate-400">Rango Real Estimado</div>
                    </div>
                </div>
            </div>
        );

        return (
            <div className="max-w-5xl mx-auto space-y-8 animate-fade-in pb-10">
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                    <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                        <Icons.Settings /> Datos Base del Vehículo
                    </h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label className="text-sm font-bold text-slate-400 block mb-2">Autonomía WLTP (Ref. 18")</label>
                            <FormattedInput value={config.baseRange} onChange={v => handleConfig('baseRange', v)} grouped={true} />
                            <div className="text-[10px] text-slate-500 mt-1">* Ej: 554 (M3H RWD), 629 (M3H LR), 455 (MY RWD)</div>
                        </div>
                        <div>
                            <label className="text-sm font-bold text-slate-400 block mb-2">Precio Electricidad (€/kWh)</label>
                            <FormattedInput value={config.priceKwh} decimals={3} onChange={v => handleConfig('priceKwh', v)} />
                        </div>
                        <div>
                            <label className="text-sm font-bold text-slate-400 block mb-2">Kilómetros Anuales</label>
                            <FormattedInput value={config.annualKm} grouped={true} onChange={v => handleConfig('annualKm', v)} />
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                    <WheelSelector title="Opción A (Origen)" state={setupA} setState={setSetupA} stats={statsA} />
                    <WheelSelector title="Opción B (Destino)" state={setupB} setState={setSetupB} stats={statsB} />
                </div>

                <div className={`border rounded-xl p-6 shadow-2xl relative overflow-hidden transition-colors duration-500
                    ${diffKm > 0 ? 'bg-green-900/20 border-green-500/30' : diffKm < 0 ? 'bg-red-900/20 border-red-500/30' : 'bg-slate-900/50 border-slate-700'}
                `}>
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6 relative z-10">
                        
                        <div className="text-center md:text-left">
                            <div className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Impacto en Autonomía</div>
                            <div className={`text-5xl font-display font-bold ${diffKm >= 0 ? 'text-green-400' : 'text-red-500'}`}>
                                {diffKm > 0 ? '+' : ''}{formatDecimal(diffKm, 0)} km
                            </div>
                            <div className="text-lg font-bold text-white mt-1">
                                {formatDecimal(diffPct, 1)}% <span className="text-sm font-normal text-slate-400">de diferencia</span>
                            </div>
                        </div>

                        <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 min-w-[250px]">
                            <div className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 flex items-center gap-2">
                                <Icons.Euro className="w-4 h-4"/> Impacto Económico
                            </div>
                            <div className="flex justify-between items-end border-b border-slate-700 pb-2 mb-2">
                                <span className="text-sm text-slate-300">Consumo:</span>
                                <span className={`font-mono font-bold ${diffKm >= 0 ? 'text-green-300' : 'text-red-300'}`}>
                                    {diffKm > 0 ? '-' : '+'}{formatDecimal(Math.abs(statsB.consumption - statsA.consumption), 1)} kWh/100
                                </span>

                            <div className="flex justify-between items-end">
                                <span className="text-sm text-slate-300">Coste Anual:</span>
                                <span className={`font-mono font-bold text-xl ${diffCost <= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                    {diffCost > 0 ? '+' : ''}{formatDecimal(diffCost)} €
                                </span>
                            </div>

                    </div>
                </div>

                <div className={`mt-4 p-4 rounded-xl border flex items-start gap-3 ${Math.abs(diameterDiffPct) > 3 ? 'bg-orange-900/20 border-orange-500/50' : 'bg-slate-800/50 border-slate-700'}`}>
                    <div className="p-2 bg-slate-900 rounded text-slate-300 font-mono text-xs text-center min-w-[60px]">
                        <div>Ø Diám.</div>
                        <div className={Math.abs(diameterDiffPct) > 3 ? 'text-orange-400 font-bold' : 'text-green-400 font-bold'}>
                            {diffKm > 0 ? '+' : ''}{formatDecimal(diameterDiffPct, 1)}%
                        </div>
                    </div>
                    <div>

                        <p className="text-xs text-slate-400 leading-relaxed">

                            {Math.abs(diameterDiffPct) > 3 && " Revisa la normativa de ITV, cambios superiores al 3% suelen requerir homologación."}

                <div className="text-xs text-center text-slate-500 max-w-3xl mx-auto mt-4">
                    * Cálculos físicos aproximados: +1" de llanta ≈ 4-5% pérdida. +10mm de ancho ≈ 1.5% pérdida. Quitar tapacubos ≈ 4% pérdida (autopista).

      // --- COMPONENTE: GUÍA Y CALCULADORA ITV (V6 - REMOLQUE & CÚTER) ---
      const ITVGuide = () => {
        const [state, setState] = usePersistentState('itvState_v2', {
            purchaseDate: '',
            lastItvDate: ''
        });

        const parseManualDate = (dateStr) => {
            if (!dateStr) return null;
            const parts = dateStr.replace(/-/g, '/').split('/');
            if (parts.length !== 3) return null;
            
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);

            if (isNaN(day) || isNaN(month) || isNaN(year)) return null;
            if (year < 2000 || year > 2100) return null;

            return new Date(year, month - 1, day);
        };

        const calculateITV = () => {
            const purchase = parseManualDate(state.purchaseDate);
            const last = parseManualDate(state.lastItvDate);
            const now = new Date();
            
            if (!purchase) return null;

            const ageInMilliseconds = now - purchase;
            const ageInYears = ageInMilliseconds / (1000 * 60 * 60 * 24 * 365.25);

            let nextDate = new Date();
            let periodicity = "";

            if (!last) {
                nextDate = new Date(purchase);
                nextDate.setFullYear(purchase.getFullYear() + 4);
                periodicity = "Exento (hasta los 4 años)";
            } else {
                nextDate = new Date(last);
                if (ageInYears < 10) {
                    nextDate.setFullYear(last.getFullYear() + 2);
                    periodicity = "Bienal (cada 2 años)";
                } else {
                    nextDate.setFullYear(last.getFullYear() + 1);
                    periodicity = "Anual (cada año)";
                }
            }

            const diffTime = nextDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

            return {
                nextDateStr: nextDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }),
                daysLeft: diffDays,
                periodicity,
                age: ageInYears
            };
        };

        const result = calculateITV();

        const StepCard = ({ number, title, icon: Icon, children }) => (
            <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-5 relative overflow-hidden">
                <div className="absolute top-0 right-0 p-4 opacity-10">
                    <Icon className="w-16 h-16 text-slate-400" />
                </div>
                <div className="flex gap-4 relative z-10">
                    <div className="flex-shrink-0 w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg border border-blue-400">
                        {number}
                    </div>
                    <div className="flex-1">
                        <h3 className="text-lg font-bold text-white mb-2">{title}</h3>
                        <div className="text-sm text-slate-300 leading-relaxed space-y-3">
                            {children}
                        </div>
                    </div>
                </div>
            </div>
        );

        return (
            <div className="max-w-4xl mx-auto space-y-8 animate-fade-in pb-10">
                
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6 shadow-xl">
                    <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                        <Icons.Calendar /> Calculadora Próxima ITV
                    </h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label className="text-sm font-bold text-slate-400 block mb-2">Fecha Matrícula / Compra</label>
                            <input 
                                type="text" inputMode="numeric" placeholder="DD/MM/AAAA"
                                value={state.purchaseDate} onFocus={(e) => scrollToSafeZone(e.target)}
                                onChange={(e) => setState({...state, purchaseDate: e.target.value})}
                                className="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white font-mono font-bold focus:border-blue-500 outline-none text-center tracking-widest"
                            />
                        </div>
                        <div>
                            <label className="text-sm font-bold text-slate-400 block mb-2">Fecha Última ITV (Opcional)</label>
                            <input 
                                type="text" inputMode="numeric" placeholder="DD/MM/AAAA"
                                value={state.lastItvDate} onFocus={(e) => scrollToSafeZone(e.target)}
                                onChange={(e) => setState({...state, lastItvDate: e.target.value})}
                                className="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white font-mono font-bold focus:border-blue-500 outline-none text-center tracking-widest"
                            />
                        </div>
                    </div>

                    {result && (
                        <div className={`rounded-xl p-6 border flex flex-col md:flex-row justify-between items-center gap-4 transition-colors
                            ${result.daysLeft < 0 ? 'bg-red-900/20 border-red-500/50' : result.daysLeft < 30 ? 'bg-yellow-900/20 border-yellow-500/50' : 'bg-green-900/20 border-green-500/50'}
                        `}>
                            <div className="text-center md:text-left">
                                <div className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Tu próxima inspección</div>
                                <div className="text-3xl font-display font-bold text-white">{result.nextDateStr}</div>
                                <div className="text-sm font-bold text-slate-400 mt-1">{result.periodicity}</div>
                            </div>
                            <div className="text-center">
                                <div className={`text-4xl font-bold ${result.daysLeft < 0 ? 'text-red-500' : result.daysLeft < 30 ? 'text-yellow-500' : 'text-green-500'}`}>
                                    {result.daysLeft < 0 ? 'CADUCADA' : `${result.daysLeft} días`}
                                </div>
                                {result.daysLeft < 0 && <div className="text-xs text-red-300 font-bold mt-1">¡Pide cita urgente!</div>}
                            </div>
                        </div>
                    )}
                </div>

                <div className="space-y-4">

      // --- CALCULADORA RENTING VS PROPIEDAD (V12 - MEJORAS SOLICITADAS) ---
      const RentingCalculator = () => {
        const [data, setData] = usePersistentState('rentingDataV12', {
            years: 15,
            kmPerYear: 20000,

            propPrice: 45000,
            propAid: 8500, 
            propResaleValuePct: 4, 
            propInsurance: 850, 
            propTax: 100, 
            propMaint: 100, 
            propBreakdownPct: 5, 
            propCons: 16.0, 
            propEnergyPrice: 0.10, 
            
            rentMonthly: 400, 
            rentEntry: 1000, 
            rentExtraAnnual: 0, 
            rentCons: 16.0, 
            rentEnergyPrice: 0.10 
        });

        const [showTable, setShowTable] = useState(true);

        const num = (v) => parseFloat(v) || 0;
        const yearsProjected = Math.max(1, Math.round(num(data.years)));

        // Costes Energéticos
        const propAnnualEnergy = (num(data.kmPerYear) / 100) * num(data.propCons) * num(data.propEnergyPrice);
        const rentAnnualEnergy = (num(data.kmPerYear) / 100) * num(data.rentCons) * num(data.rentEnergyPrice);

        // Costes Averías
        // Interpretamos el % de averías como un porcentaje sobre el valor del coche a gastar en TOTAL durante esos años
        const propTotalBreakdownCost = num(data.propPrice) * (num(data.propBreakdownPct) / 100);
        const propAnnualBreakdown = propTotalBreakdownCost / yearsProjected;

        // Totales Anuales Operativos
        const propAnnualTotal = num(data.propInsurance) + num(data.propTax) + num(data.propMaint) + propAnnualBreakdown + propAnnualEnergy;
        const rentAnnualTotal = (num(data.rentMonthly) * 12) + num(data.rentExtraAnnual) + rentAnnualEnergy;

        // Desembolsos Iniciales y Finales (Usuario)
        const propInitialOut = num(data.propPrice) - num(data.propAid);
        const rentInitialOut = num(data.rentEntry);
        const finalResidualValue = num(data.propPrice) * (num(data.propResaleValuePct) / 100);

        // --- CÁLCULO PRECIO EQUILIBRIO ---
        // Coste Total Renting Absoluto
        const totalRentingAbsolute = rentInitialOut + (rentAnnualTotal * yearsProjected);
        // Coste Total Compra (Sin vender el coche)
        const totalPropAbsoluteNoSale = propInitialOut + (propAnnualTotal * yearsProjected);
        // Para que (Compra - Venta) = Renting  ->  Venta = Compra - Renting
        const equilibriumPrice = totalPropAbsoluteNoSale - totalRentingAbsolute;

        const tableRows = useMemo(() => {
            const rows = [];
            for (let i = 0; i <= yearsProjected; i++) {
                const rentAccum = rentInitialOut + (rentAnnualTotal * i);
                let propAccum = propInitialOut + (propAnnualTotal * i);

                if (i === yearsProjected) {
                    propAccum = propAccum - finalResidualValue;
                }

                rows.push({
                    year: i,
                    propVal: propAccum,
                    rentVal: rentAccum,
                    diff: rentAccum - propAccum
                });
            }
            return rows;
        }, [data, yearsProjected, propInitialOut, propAnnualTotal, rentInitialOut, rentAnnualTotal, finalResidualValue]);

        const finalRow = tableRows[tableRows.length - 1];
        const totalSavings = finalRow.diff;
        const winner = totalSavings > 0 ? "COMPRA" : "RENTING";
        
        const totalMonths = yearsProjected * 12;
        const monthlyProp = finalRow.propVal / totalMonths;
        const monthlyRent = finalRow.rentVal / totalMonths;
        const annualProp = finalRow.propVal / yearsProjected;
        const annualRent = finalRow.rentVal / yearsProjected;

        let crossOverYear = "N/A";
        let crossOverWinner = "";
        
        for(let i = 1; i < tableRows.length; i++) {
            const prevRow = tableRows[i-1];
            const currRow = tableRows[i];
            const prevWin = prevRow.rentVal < prevRow.propVal ? 'Renting' : 'Compra';
            const currWin = currRow.rentVal < currRow.propVal ? 'Renting' : 'Compra';
            if (prevWin !== currWin) { crossOverYear = currRow.year; crossOverWinner = currWin; break; }
        }
        if (crossOverYear === "N/A") {
            crossOverYear = "Siempre";
            crossOverWinner = tableRows[0].rentVal < tableRows[0].propVal ? "Renting" : "Compra";
        }

        const RentingCSSChart = ({ rows }) => {
            const maxVal = Math.max(...rows.map(r => Math.max(r.propVal, r.rentVal)));
            const step = 5000; 
            const yMax = Math.ceil((maxVal * 1.05) / step) * step;
            
            const ticks = [];
            for (let i = 0; i <= yMax; i += step) {
                ticks.push(i);
            }

            return (
                <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 relative h-[500px] flex flex-col">
                    <div className="flex justify-between items-center mb-6 px-2">
                        <div className="text-xs font-bold uppercase text-slate-400">Evolución Coste Acumulado</div>
                        <div className="flex gap-4 text-[10px] font-bold uppercase">
                            <div className="flex items-center gap-2"><div className="w-3 h-3 bg-blue-600 rounded"></div> Compra</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 bg-orange-600 rounded"></div> Renting</div>
                        </div>
                    </div>

                    <div className="flex-1 relative flex items-end ml-10 mb-6 border-l border-b border-slate-600">
                        <div className="absolute inset-0 pointer-events-none">
                            {ticks.map((tickVal) => (
                                <div key={tickVal} className="absolute w-full flex items-center" style={{ bottom: `${(tickVal / yMax) * 100}%` }}>
                                    <div className={`w-full border-t ${tickVal === 0 ? 'border-white' : 'border-slate-500'}`}></div>
                                    <span className="absolute -left-10 text-[9px] font-bold text-slate-400 w-8 text-right font-mono">
                                        {(tickVal / 1000).toFixed(0)}k
                                    </span>
                                </div>
                            ))}
                        </div>

                        <div className="w-full h-full flex items-end justify-between px-2 z-10">
                            {rows.map((row) => (
                                <div key={row.year} className="flex-1 flex flex-col justify-end items-center h-full group relative gap-1 mx-0.5">
                                    <div className="w-full flex gap-0.5 items-end h-full justify-center">
                                        <div 
                                            className="w-1/2 bg-blue-600 rounded-t-sm transition-all duration-500 hover:bg-blue-500 relative min-h-[1px]"
                                            style={{ height: `${(row.propVal / yMax) * 100}%` }}
                                        >
                                            <div className="opacity-0 group-hover:opacity-100 absolute bottom-full left-1/2 -translate-x-1/2 mb-1 bg-black/90 text-white text-[10px] px-2 py-1 rounded whitespace-nowrap z-20 pointer-events-none border border-blue-500/50 shadow-xl">
                                                Compra: {formatMoney(row.propVal)}€
                                            </div>
                                        </div>
                                        <div 
                                            className="w-1/2 bg-orange-600 rounded-t-sm transition-all duration-500 hover:bg-orange-500 relative min-h-[1px]"
                                            style={{ height: `${(row.rentVal / yMax) * 100}%` }}
                                        >
                                            <div className="opacity-0 group-hover:opacity-100 absolute bottom-full left-1/2 -translate-x-1/2 mb-8 bg-black/90 text-white text-[10px] px-2 py-1 rounded whitespace-nowrap z-20 pointer-events-none border border-orange-500/50 shadow-xl">
                                                Renting: {formatMoney(row.rentVal)}€
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-[10px] text-slate-500 font-bold absolute -bottom-6">{row.year}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const handleChange = (field, value) => setData({...data, [field]: parseFloat(value) || 0});
        
        // Manejador especial para editar el valor de reventa en Euros y recalcular el %
        const handleResaleEuroChange = (euroValue) => {
            const price = num(data.propPrice);
            if (price > 0) {
                const newPct = (euroValue / price) * 100;
                setData({...data, propResaleValuePct: newPct});
            }
        };

        return (
            <div className="space-y-6">
                {/* KPI HEADER */}
                <div className="bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-700 rounded-2xl p-6 text-center shadow-2xl">
                    <h3 className="text-slate-300 text-sm font-display uppercase tracking-widest mb-6 font-bold">Resumen Económico Final ({data.years} años)</h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-stretch">
                        
                        {/* 1. OPCIÓN MÁS RENTABLE (DATOS COMBINADOS) */}
                        <div className={`rounded-xl p-5 border-2 flex flex-col justify-center lg:col-span-1 shadow-lg ${totalSavings > 0 ? 'bg-blue-900/20 border-blue-500/50' : 'bg-orange-900/20 border-orange-500/50'}`}>
                             <div className="text-xs text-slate-300 mb-2 uppercase font-bold tracking-wider">Mejor Opción: {winner}</div>
                             
                             <div className="text-4xl font-bold font-display text-white mb-1">
                                Ahorro: {formatMoney(Math.abs(totalSavings))}€
                             </div>
                             
                             <div className="w-full h-px bg-white/10 my-3"></div>
                             
                             <div className="flex justify-between w-full text-sm px-2">
                                <div className="text-left">
                                    <div className="text-[10px] text-blue-400 uppercase font-bold">Total Compra</div>
                                    <div className="font-mono font-bold text-slate-200">{formatMoney(finalRow.propVal)}€</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-[10px] text-orange-400 uppercase font-bold">Total Renting</div>
                                    <div className="font-mono font-bold text-slate-200">{formatMoney(finalRow.rentVal)}€</div>
                                </div>
                             </div>
                             {/* NUEVO: Dato de Equilibrio en Estadísticas */}
                             <div className="mt-3 text-[10px] text-slate-400 bg-black/20 rounded p-1">
                                 Precio Venta Equilibrio: <span className="font-bold text-white">{formatMoney(equilibriumPrice)}€</span>
                             </div>
                        </div>
                        
                        {/* 2. COSTE MENSUAL */}
                        <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 flex flex-col justify-center">
                            <div className="text-[10px] text-slate-400 mb-3 uppercase font-bold tracking-wider text-center">Coste Medio Neto / Mes</div>
                            <div className="grid grid-cols-2 gap-4 text-center divide-x divide-slate-700">
                                <div>
                                    <div className="text-blue-400 text-[10px] font-bold mb-1 uppercase">Compra</div>
                                    <div className="text-xl font-bold text-white">{formatMoney(monthlyProp)}€<span className="text-[10px] text-slate-500">/mes</span></div>
                                    <div className="text-xs text-slate-400 mt-1 font-mono">{formatMoney(annualProp)}€/año</div>
                                </div>
                                <div>
                                    <div className="text-orange-400 text-[10px] font-bold mb-1 uppercase">Renting</div>
                                    <div className="text-xl font-bold text-white">{formatMoney(monthlyRent)}€<span className="text-[10px] text-slate-500">/mes</span></div>
                                    <div className="text-xs text-slate-400 mt-1 font-mono">{formatMoney(annualRent)}€/año</div>
                                </div>
                            </div>
                        </div>

                        {/* 3. PUNTO DE INFLEXIÓN */}
                        <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 flex flex-col justify-center">
                            <div className="text-[10px] text-slate-300 mb-2 uppercase font-bold">Punto de Inflexión (Cruce)</div>
                            <div className="text-3xl font-bold font-display text-white">
                                {crossOverYear === "Siempre" ? "Sin cambios" : `Año ${crossOverYear}`}
                            </div>
                            <div className="text-xs font-bold text-slate-400 mt-2 bg-black/20 px-3 py-1 rounded-full inline-block mx-auto">
                                {crossOverYear === "Siempre" 
                                    ? `Siempre es mejor ${crossOverWinner}` 
                                    : `A partir de aquí gana ${crossOverWinner}`}
                            </div>
                        </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

      // --- CALCULADORA SOLAR FOTOVOLTAICA V2 (DESGLOSE EV/CASA + PRECIOS DUALES) ---
      const SolarCalculator = () => {
        const [solar, setSolar] = usePersistentState('solarStateV2', {
            // Hardware
            panels: 10,
            powerPerPanel: 450, // W
            efficiency: 0.85, // Pérdidas del sistema
            
            // Ubicación y Orientación
            latitude: 40.41, 
            userAzimuth: 180, // 180 = Sur
            tilt: 30,

            // Consumo y Batería
            annualConsumption: 5000, // kWh casa
            batteryKwh: 0,
            
            // Financiero Avanzado
            investment: 6000, 
            priceBuyPeak: 0.22, // €/kWh Punta (Ahorro Casa)
            priceBuyValley: 0.10, // €/kWh Valle (Ahorro Coche)
            priceSell: 0.08, // €/kWh Excedente
            
            // EV Integration
            evConsumption: 16.0, 
            evSolarChargePct: 50 // % del excedente destinado al coche
        });

        const handleNum = (k, v) => setSolar(prev => ({...prev, [k]: parseFloat(v) || 0}));

        // --- MOTOR DE CÁLCULO SOLAR AVANZADO ---
        const calculateSolarData = () => {
            const installedPowerKw = (solar.panels * solar.powerPerPanel) / 1000;
            
            // Factores geográficos (Simplificados para España)
            const latFactor = 1 + ((40.4 - solar.latitude) * 0.025);
            const azimRad = (solar.userAzimuth - 180) * (Math.PI / 180);
            const orientFactor = Math.max(0.6, Math.cos(azimRad / 1.5)); 
            const baseHSP = 1550; 
            const estimatedGeneration = installedPowerKw * baseHSP * latFactor * orientFactor * solar.efficiency;

            // Distribución mensual
            const monthWeights = [0.045, 0.055, 0.075, 0.095, 0.115, 0.125, 0.130, 0.115, 0.090, 0.070, 0.050, 0.040];
            
            const monthlyData = monthWeights.map((weight, idx) => {
                const prod = estimatedGeneration * weight;
                const consHouse = solar.annualConsumption / 12; // Consumo base casa
                
                // 1. Autoconsumo VIVIENDA
                // Sin batería ~35%, Con batería sube según capacidad
                let ratioHouse = solar.batteryKwh > 0 ? 0.70 + (solar.batteryKwh * 0.02) : 0.35;
                if (prod < consHouse * 0.5) ratioHouse = 1.0; // Poca producción = todo pa casa
                ratioHouse = Math.min(0.98, ratioHouse);
                
                const selfHouse = Math.min(prod, consHouse * ratioHouse);
                const surplusAfterHouse = Math.max(0, prod - selfHouse);

                // 2. Autoconsumo COCHE (EV)
                // Se lleva un % del excedente que sobra de la casa
                const selfEV = surplusAfterHouse * (solar.evSolarChargePct / 100);
                
                // 3. Vertido a RED
                const exported = Math.max(0, surplusAfterHouse - selfEV);

                return { 
                    month: idx, 
                    prod, 
                    consHouse, 
                    selfHouse, 
                    selfEV, 
                    exported 
                };
            });

            // Totales Anuales kWh
            const sumProd = monthlyData.reduce((acc, m) => acc + m.prod, 0);
            const sumHouse = monthlyData.reduce((acc, m) => acc + m.selfHouse, 0);
            const sumEV = monthlyData.reduce((acc, m) => acc + m.selfEV, 0);
            const sumExport = monthlyData.reduce((acc, m) => acc + m.exported, 0);

            // Totales Económicos
            const savingHouse = sumHouse * solar.priceBuyPeak; // Se ahorra a precio caro (día)
            const savingEV = sumEV * solar.priceBuyValley;     // Se ahorra a precio barato (noche)
            const incomeExport = sumExport * solar.priceSell;  // Compensación
            
            const totalBenefitAnnual = savingHouse + savingEV + incomeExport;
            const roiYears = totalBenefitAnnual > 0 ? solar.investment / totalBenefitAnnual : 99;
            const evKmAdded = solar.evConsumption > 0 ? (sumEV / solar.evConsumption) * 100 : 0;

            return { 
                installedPowerKw, 
                monthlyData,
                totals: { kwh: sumProd, eur: totalBenefitAnnual },
                house: { kwh: sumHouse, eur: savingHouse },
                ev: { kwh: sumEV, eur: savingEV, km: evKmAdded },
                grid: { kwh: sumExport, eur: incomeExport },
                roiYears
            };
        };

        const results = calculateSolarData();
        // Max value for chart Y-axis scaling
        const maxChartVal = Math.max(...results.monthlyData.map(m => Math.max(m.prod, m.consHouse)));

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-fade-in pb-10">
                
                {/* COLUMNA IZQUIERDA: CONFIGURACIÓN */}
                <div className="lg:col-span-4 space-y-6">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                        <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                            <Icons.Sun className="text-yellow-500"/> Configuración Solar
                        </h2>
                        
                        <div className="space-y-4">
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Inversión Total (€)</label><FormattedInput value={solar.investment} onChange={v => handleNum('investment', v)} grouped={true} /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs font-bold text-slate-400 block mb-1">Nº Paneles</label><FormattedInput value={solar.panels} decimals={0} onChange={v => handleNum('panels', v)} /></div>
                                <div><label className="text-xs font-bold text-slate-400 block mb-1">Potencia (Wp)</label><FormattedInput value={solar.powerPerPanel} decimals={0} onChange={v => handleNum('powerPerPanel', v)} /></div>
                            </div>
                            <div className="p-2 bg-slate-800 rounded border border-slate-700 text-center mb-2">
                                <span className="text-xs text-slate-400 uppercase font-bold">Potencia Pico:</span> <span className="text-lg font-bold text-yellow-400">{formatDecimal(results.installedPowerKw, 2)} kWp</span>
                            </div>
                        </div>

                        <div className="mt-6 pt-4 border-t border-slate-800 space-y-4">
                            <label className="text-sm font-bold text-blue-400 block uppercase">Ubicación</label>
                            <div><label className="text-xs font-bold text-slate-400 block mb-1">Latitud</label><FormattedInput value={solar.latitude} decimals={4} onChange={v => handleNum('latitude', v)} /></div>
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-2">Orientación ({solar.userAzimuth}º)</label>
                                <input type="range" min="0" max="360" value={solar.userAzimuth} onChange={e => handleNum('userAzimuth', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg cursor-pointer accent-yellow-500"/>
                                <div className="flex justify-between text-[9px] text-slate-500 font-bold mt-1"><span>N(0)</span><span>E(90)</span><span className="text-yellow-500">S(180)</span><span>O(270)</span><span>N</span></div>
                            </div>
                        </div>

                        <div className="mt-6 pt-4 border-t border-slate-800 space-y-4">
                            <label className="text-sm font-bold text-green-400 block uppercase">Consumo y Precios</label>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs font-bold text-slate-400 block mb-1">Consumo Casa (kWh/año)</label><FormattedInput value={solar.annualConsumption} grouped={true} onChange={v => handleNum('annualConsumption', v)} /></div>
                                <div><label className="text-xs font-bold text-slate-400 block mb-1">Batería (kWh)</label><FormattedInput value={solar.batteryKwh} decimals={1} onChange={v => handleNum('batteryKwh', v)} /></div>
                            </div>
                            <div className="bg-slate-800/50 p-3 rounded border border-slate-700">
                                <label className="text-[10px] font-bold text-slate-300 uppercase mb-2 block">Tarifas Compra (Ahorro)</label>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><label className="text-[9px] text-red-300 block">Punta (Casa)</label><FormattedInput value={solar.priceBuyPeak} decimals={3} onChange={v => handleNum('priceBuyPeak', v)} /></div>
                                    <div><label className="text-[9px] text-blue-300 block">Valle (Coche)</label><FormattedInput value={solar.priceBuyValley} decimals={3} onChange={v => handleNum('priceBuyValley', v)} /></div>
                                </div>
                            </div>
                            <div><label className="text-xs font-bold text-slate-400 block mb-1">Precio Excedentes (€/kWh)</label><FormattedInput value={solar.priceSell} decimals={3} onChange={v => handleNum('priceSell', v)} /></div>
                        </div>

                        <div className="mt-6 pt-4 border-t border-slate-800 space-y-4">
                            <label className="text-sm font-bold text-purple-400 block uppercase">Carga Vehículo</label>
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-2">% Excedente destinado al Coche</label>
                                <div className="flex items-center gap-3">
                                    <input type="range" min="0" max="100" value={solar.evSolarChargePct} onChange={e => handleNum('evSolarChargePct', e.target.value)} className="flex-1 h-2 bg-slate-700 rounded-lg cursor-pointer accent-blue-500"/>
                                    <span className="text-sm font-bold text-white w-8">{solar.evSolarChargePct}%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                {/* COLUMNA DERECHA: RESULTADOS */}
                <div className="lg:col-span-8 space-y-6">
                    
                    {/* KPI AMORTIZACIÓN */}
                    <div className="flex flex-col md:flex-row gap-4">
                        <div className="flex-1 bg-gradient-to-r from-green-900/40 to-slate-900 border border-green-500/30 p-5 rounded-xl shadow-lg flex items-center justify-between">
                            <div>
                                <div className="text-xs font-bold text-green-400 uppercase tracking-wider mb-1">Retorno Económico</div>
                                <div className="text-3xl font-display font-bold text-white">{formatMoney(results.totals.eur)} <span className="text-sm font-sans text-slate-400">€/año</span></div>
                            </div>
                            <div className="text-right">
                                <div className="text-xs font-bold text-slate-400 uppercase">Amortización</div>
                                <div className="text-2xl font-bold text-white">{formatDecimal(results.roiYears, 1)} <span className="text-sm text-slate-500">años</span></div>
                            </div>
                        </div>
                    </div>

                    {/* GRÁFICA DE BARRAS APILADAS */}
                    <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 h-96 flex flex-col relative">
                        <h3 className="text-sm font-bold text-slate-300 uppercase mb-6 flex justify-between items-center">
                            <span>Distribución de Energía (kWh)</span>
                            <div className="flex gap-3 text-[9px] uppercase font-bold bg-slate-800 p-2 rounded border border-slate-700">
                                <div className="flex items-center gap-1"><div className="w-2 h-2 bg-yellow-500 rounded-sm"></div> Red</div>
                                <div className="flex items-center gap-1"><div className="w-2 h-2 bg-blue-500 rounded-sm"></div> Coche</div>
                                <div className="flex items-center gap-1"><div className="w-2 h-2 bg-green-500 rounded-sm"></div> Casa</div>
                                <div className="w-px h-3 bg-slate-600 mx-1"></div>
                                <div className="flex items-center gap-1"><div className="w-2 h-2 border border-slate-500 rounded-sm"></div> Demanda Casa</div>
                            </div>
                        </h3>
                        
                        {/* Eje Y (kWh) */}
                        <div className="absolute top-12 bottom-8 left-0 w-8 flex flex-col justify-between text-[9px] text-slate-500 font-bold text-right pr-1 pointer-events-none">
                            <span>{Math.round(maxChartVal)}</span>
                            <span>{Math.round(maxChartVal * 0.75)}</span>
                            <span>{Math.round(maxChartVal * 0.5)}</span>
                            <span>{Math.round(maxChartVal * 0.25)}</span>
                            <span>0</span>
                        </div>

                        <div className="flex-1 flex items-end gap-2 relative z-10 pl-8 border-l border-slate-700/50 border-b">
                            {results.monthlyData.map((m, i) => {
                                const hTotal = (m.prod / maxChartVal) * 100;
                                const hCons = (m.consHouse / maxChartVal) * 100;
                                
                                // Alturas relativas dentro de la barra apilada
                                const pExport = (m.exported / m.prod) * 100;
                                const pEV = (m.selfEV / m.prod) * 100;
                                const pHouse = (m.selfHouse / m.prod) * 100;

                                const monthName = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'][i];

                                return (
                                    <div key={i} className="flex-1 flex flex-col justify-end items-center h-full group relative">
                                        <div className="w-full flex items-end justify-center h-full relative">
                                            {/* Barra Demanda Casa (Fondo transparente con borde) */}
                                            <div className="absolute bottom-0 w-full rounded-t-sm border-x border-t border-slate-600/30 bg-slate-700/10 z-0 pointer-events-none" style={{height: `${hCons}%`}}></div>
                                            
                                            {/* Barra Producción Apilada */}
                                            <div className="w-2/3 bg-slate-800 rounded-t-sm relative overflow-hidden flex flex-col justify-end transition-all hover:scale-105 z-10 shadow-lg" style={{height: `${hTotal}%`}}>
                                                {/* Tooltip */}
                                                <div className="opacity-0 group-hover:opacity-100 absolute bottom-full left-1/2 -translate-x-1/2 mb-2 p-3 bg-slate-900 border border-slate-500 rounded text-[10px] text-white z-50 whitespace-nowrap shadow-2xl backdrop-blur-md">
                                                    <div className="font-bold border-b border-slate-700 pb-1 mb-1 text-center text-slate-300">{monthName}</div>
                                                    <div className="flex justify-between gap-4"><span className="text-yellow-400">A Red:</span> <span>{Math.round(m.exported)} kWh</span></div>
                                                    <div className="flex justify-between gap-4"><span className="text-blue-400">Coche:</span> <span>{Math.round(m.selfEV)} kWh</span></div>
                                                    <div className="flex justify-between gap-4"><span className="text-green-400">Casa:</span> <span>{Math.round(m.selfHouse)} kWh</span></div>
                                                    <div className="border-t border-slate-700 mt-1 pt-1 text-slate-500 text-right">Prod Total: {Math.round(m.prod)}</div>
                                                </div>

                                                {/* Segmentos */}
                                                <div className="w-full bg-yellow-500/80 border-t border-white/10" style={{height: `${pExport}%`}}></div>
                                                <div className="w-full bg-blue-600/80 border-t border-white/10" style={{height: `${pEV}%`}}></div>
                                                <div className="w-full bg-green-600/80" style={{height: `${pHouse}%`}}></div>
                                            </div>
                                        </div>
                                        <span className="text-[9px] font-bold text-slate-500 mt-2">{monthName.charAt(0)}</span>
                                    </div>
                                );
                            })}
                            
                            {/* Grid lines */}
                            <div className="absolute inset-0 pointer-events-none flex flex-col justify-between z-0">

                                <div className="text-xs font-bold text-slate-300 bg-blue-900/30 px-2 py-1 rounded border border-blue-500/20">~{formatMoney(results.ev.km)} km Gratis</div>

                                <div className="text-sm font-bold text-yellow-400">+{formatMoney(results.grid.eur)}€ <span className="text-[10px] text-slate-500 font-normal uppercase">Compensación</span></div>
