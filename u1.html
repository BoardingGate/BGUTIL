    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; -webkit-tap-highlight-color: transparent; }
      .font-display { font-family: 'Orbitron', sans-serif; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1a1a1a; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      
      @keyframes road-move { 0% { background-position: 0 0; } 100% { background-position: -60px 0; } }
      .animate-road-move { animation-name: road-move; animation-timing-function: linear; animation-iteration-count: infinite; }
      
      @keyframes wind-flow-head { 0% { transform: translateX(0%); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateX(-200%); opacity: 0; } }
      .wind-particle-head { animation: wind-flow-head 1s linear infinite; }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .animate-spin-fast { animation: spin 0.3s linear infinite; }

      @keyframes charge-pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
      .animate-charge { animation: charge-pulse 2s infinite ease-in-out; }
      
      .animate-fade-in { animation: fadeIn 0.5s ease-in; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* Aumentado tamaño fuente tabs */
      .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; background: rgba(59, 130, 246, 0.1); font-size: 1.1rem; }
      .tab-inactive { border-bottom: 2px solid transparent; color: #94a3b8; font-size: 1.1rem; }
      .tab-inactive:hover { color: #e2e8f0; background: rgba(255, 255, 255, 0.05); }
      
      /* Aumentado tamaño fuente tablas */
      .custom-table th { padding: 0.75rem; text-align: left; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #334155; }
      .custom-table td { padding: 0.75rem; font-size: 1rem; color: #cbd5e1; border-bottom: 1px solid #1e293b; font-family: monospace; text-align: right; }
      .custom-table tr:last-child td { border-bottom: none; }
      .custom-table tr:hover td { background-color: rgba(30, 41, 59, 0.5); }
      
      /* Slider thumb más grande */
      .slider-thumb::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #1e293b; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); transition: background 0.2s; }
      .slider-thumb::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #1e293b; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); transition: background 0.2s; }
      
      /* Estilo específico para sliders de solo lectura (grises) */
      .slider-readonly::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 0; height: 0; display: none; }
      .slider-readonly::-moz-range-thumb { width: 0; height: 0; display: none; }
      .slider-track-only { pointer-events: none; }

      .btn-step { @apply w-10 h-10 flex items-center justify-center rounded bg-slate-700 text-slate-300 hover:bg-slate-600 hover:text-white active:bg-blue-600 transition-colors font-bold text-xl select-none; }

      .toggle-btn-active { @apply bg-blue-600 border-blue-500 text-white; }
      .toggle-btn-inactive { @apply bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700; }

<body>
    <div id="root"></div>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (message && message.indexOf('Script error') > -1) return;
        console.error(error);
        const root = document.getElementById('root');
        if(root && root.innerHTML === "") {
           document.body.innerHTML = '<div style="color:#ff9999; padding:20px; background:#330000; font-family:monospace;"><h2>⚠️ Error de inicialización:</h2><p>' + message + '</p><p>Intenta recargar la página.</p></div>';
        }
      };
    </script>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;
      const { createRoot } = ReactDOM;
      
      // --- CUSTOM HOOK: PERSISTENT STATE ---
      const usePersistentState = (key, initialValue) => {
        const [state, setState] = useState(() => {
            try {
                const item = window.localStorage.getItem(key);
                return item ? { ...initialValue, ...JSON.parse(item) } : initialValue;
            } catch (error) {
                console.warn(`Error reading localStorage key "${key}":`, error);
                return initialValue;
            }
        });

        useEffect(() => {
            try {
                window.localStorage.setItem(key, JSON.stringify(state));
            } catch (error) {
                console.warn(`Error setting localStorage key "${key}":`, error);
            }
        }, [key, state]);

        return [state, setState];
      };

      // --- GLOBAL FORMATTERS ---
      const formatMoney = (val) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: 0, maximumFractionDigits: 0, useGrouping: true}).format(val);
      const formatDecimal = (val, digits = 2) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: digits, maximumFractionDigits: digits }).format(val);
      
      const formatTime = (min) => {
          if(!min || !isFinite(min)) return "00:00:00";
          const h = Math.floor(min / 60);
          const m = Math.floor(min % 60);
          const s = Math.round((min * 60) % 60);
          return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      };

      const formatTimeShort = (min) => {
          if(!min || !isFinite(min)) return "00:00";
          const h = Math.floor(min / 60);
          const m = Math.round(min % 60);
          return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
      };

      // --- ROBUST INPUT COMPONENT (MODIFICADO PARA SOPORTAR GROUPED) ---
      const FormattedInput = ({ value, onChange, decimals = 0, grouped = false }) => {
        const getDisplayString = (val) => {
            if (val === null || val === undefined || val === '') return '';
            return new Intl.NumberFormat('es-ES', { 
                minimumFractionDigits: 0, 
                maximumFractionDigits: Math.max(decimals, 6), 
                useGrouping: grouped // Controlado por prop (default false para no romper compatibilidad)
            }).format(val);
        };

        const [localValue, setLocalValue] = useState(() => getDisplayString(value));
        const [isFocused, setIsFocused] = useState(false);

        useEffect(() => {
            if (!isFocused) {
                setLocalValue(getDisplayString(value));
            }
        }, [value, isFocused, decimals, grouped]);

        const handleChange = (e) => {
            const inputVal = e.target.value;
            setLocalValue(inputVal); 

            if (inputVal === '' || inputVal === '-') return;
            // Permitimos puntos si grouped es true
            if (!/^[\d.,-]+$/.test(inputVal)) return;

            let normalized = inputVal;
            
            // Si está agrupado (tiene puntos de millar), los eliminamos antes de parsear
            if (grouped) {
                normalized = inputVal.replace(/\./g, '').replace(/,/g, '.');
            } else {
                normalized = inputVal.replace(/,/g, '.');
            }

            if (normalized.endsWith('.')) return;

            const num = parseFloat(normalized);
            if (!isNaN(num)) {
                onChange(num);
            }
        };

        const handleFocus = () => {
            setIsFocused(true);
            if (value !== null && value !== undefined) {
                // Si está agrupado, mostramos el formato bonito al editar también, si no, formato simple
                if (grouped) {
                    setLocalValue(getDisplayString(value));
                } else {
                    setLocalValue(value.toString().replace('.', ','));
                }
            }
        };

        const handleBlur = () => {
            setIsFocused(false);
        };
        
        const handleKeyDown = (e) => {
            if(e.key === 'Enter') {
                e.target.blur();
            }
        }

        return (
            <input
                type="text"
                inputMode="decimal"
                value={localValue}
                onChange={handleChange}
                onFocus={handleFocus}
                onBlur={handleBlur}
                onKeyDown={handleKeyDown}
                className="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-3 text-yellow-300 font-mono font-bold focus:outline-none focus:border-yellow-500 text-lg placeholder-zinc-500 transition-colors text-right shadow-inner"
            />
        );
      };

        BatteryCharging: ({className}) => <svg className={className || "w-5 h-5"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 18H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.19M15 6h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3.19"/><line x1="23" y1="13" x2="23" y2="11"/><polyline points="11 6 7 12 13 12 9 18"/></svg>,

      // --- COMPONENTE PLACEHOLDER (TEXTO MÁS GRANDE Y CLARO) ---
      const PlaceholderTab = () => (
        <div className="flex flex-col items-center justify-center h-96 bg-slate-900/30 rounded-3xl border border-slate-800 border-dashed p-8 text-center">
            <div className="bg-slate-800 p-4 rounded-full mb-4 text-slate-400"><Icons.Construction className="w-8 h-8" /></div>

            <p className="text-slate-300 font-bold text-lg max-w-md mb-8">Esta funcionalidad estará disponible próximamente. Mientras tanto, puedes utilizar la versión completa en Excel.</p>
            <a href="https://docs.google.com/spreadsheets/d/1bLZmgVGTBqg2bS2E45JpORjs9eK2nb05AWXYLLDY-RI/edit?usp=drivesdk" 
               target="_blank"
               className="bg-green-600 hover:bg-green-500 text-white px-8 py-4 rounded-xl font-medium text-lg transition-all shadow-lg hover:shadow-green-900/20 flex items-center gap-2">
                <Icons.Piggy className="w-6 h-6"/>
                VERSIÓN EN EXCEL de Google Drive
            </a>
            <p className="text-sm font-bold text-slate-400 mt-4">(haga un duplicado para su uso particular)</p>
         </div>
      );

      // --- FÍSICA (Simulador) ---
      const calculateConsumption = (params) => {
        const mass = 1800; const cr = 0.006; const g = 9.81;
        const rho = 1.225; const cd = 0.219; const area = 2.22; 
        const drivetrainEfficiency = 0.90;
        const speedMs = params.speed / 3.6; 
        const gradientRad = Math.atan(params.gradient / 100);
        const fRoll = mass * g * cr * Math.cos(gradientRad);
        const relativeSpeed = speedMs - (params.windSpeed / 3.6);
        const fAero = 0.5 * rho * cd * area * Math.sign(relativeSpeed) * (relativeSpeed ** 2);
        const fGrade = mass * g * Math.sin(gradientRad);
        const totalForce = fRoll + fAero + fGrade;
        let powerWatts = totalForce * speedMs;
        let finalPowerKw = powerWatts > 0 ? (powerWatts / 1000) / drivetrainEfficiency : (powerWatts / 1000) * 0.7; 
        const tempDiff = Math.abs(20 - params.temperature);
        const climatePowerKw = 0.5 + (tempDiff * 0.15);
        const totalPowerKw = finalPowerKw + climatePowerKw;
        let consumption = 0;
        if (params.speed > 0) consumption = (totalPowerKw / params.speed) * 100;
        const BASE_PHYSICS_REF = 14.0; 
        const scalar = params.electricConsumptionRef / BASE_PHYSICS_REF;
        consumption = consumption * scalar;
        return Math.max(consumption < -10 ? -10 : consumption, -10); 
      };

      // --- COMPONENTES DEL SIMULADOR (LETRAS MÁS GRANDES) ---
      const ControlPanel = ({ params, setParams, costs, setCosts }) => {
        const handleChange = (key, value) => setParams(prev => ({ ...prev, [key]: parseFloat(value) }));

                <div className="space-y-6">

      // --- NUEVO COMPONENTE: SIMULADOR SIMPLE AHORRO ---
      const SimpleSavingsSimulator = ({ params, costs }) => {
        // Estado inicial cambiado a 400.000 como solicitado

        const presets = [
            { label: "100", val: 100 },
            { label: "1.000", val: 1000 },
            { label: "10.000", val: 10000 },
            { label: "20.000", val: 20000 },
            { label: "50.000", val: 50000 },
            { label: "100.000", val: 100000 },
            { label: "200.000", val: 200000 },
            { label: "300.000", val: 300000 },
            { label: "400.000", val: 400000 },
            { label: "500.000", val: 500000 }
        ];

        // Cálculos usando los valores de Configuración Avanzada
        const costEV = (distance / 100) * params.electricConsumptionRef * costs.electricityPrice;
        const costICE = (distance / 100) * costs.gasConsumptionRef * costs.gasPrice;
        const savings = costICE - costEV;
        const percent = costICE > 0 ? (savings / costICE) * 100 : 0;

        return (
            <div className="mt-6 bg-slate-900/50 backdrop-blur-lg border border-slate-800 rounded-2xl p-6 shadow-xl animate-fade-in">
                <h3 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2 border-b border-slate-800 pb-4">
                    <Icons.Piggy className="w-6 h-6 text-green-400" />

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                    {/* Columna Izquierda: Input y Botones */}
                    <div className="space-y-6">
                        <div>
                            <label className="text-sm font-bold text-slate-400 block mb-2">KM. REALIZADOS</label>

                        </div>
                        
                        <div>
                            <label className="text-xs font-bold text-slate-500 block mb-2 uppercase tracking-wider">Selección Rápida</label>

                                {presets.map((preset) => (
                                    <button 
                                        key={preset.val}
                                        onClick={() => setDistance(preset.val)}
                                        className={`px-3 py-2 text-xs font-bold rounded border transition-colors ${distance === preset.val ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-slate-200'}`}
                                    >
                                        {preset.label} km
                                    </button>

                    {/* Columna Derecha: Resultados */}
                    <div className="bg-slate-900/80 rounded-xl p-6 border border-slate-700 h-full flex flex-col justify-center">

                                    {costs.gasConsumptionRef}L/100 @ {costs.gasPrice}€

                                <div className="text-xs font-bold text-blue-400 uppercase mb-1">Coste Eléctrico</div>
                                <div className="text-2xl font-bold text-white">{formatMoney(costEV)}€</div>
                                {/* Fuente aumentada aquí */}
                                <div className="text-sm font-bold text-slate-400 font-mono mt-1">
                                    {params.electricConsumptionRef}kWh/100 @ {costs.electricityPrice}€

                            <div className="text-sm font-bold text-green-300">
                                {formatDecimal(percent, 1)}% más barato
                            </div>

      const ResultsDisplay = ({ consumption, params, costs }) => {
        const costPer100ElecRaw = consumption * costs.electricityPrice;
        const costPer100GasRaw = costs.gasConsumptionRef * costs.gasPrice;
        const costPerKmElec = (costPer100ElecRaw / 100);
        const costPerKmGas = (costPer100GasRaw / 100);
        const savingsRaw = costPer100GasRaw - costPer100ElecRaw;
        const extraKm = Math.max(0, (costPerKmElec > 0.0001 ? (savingsRaw / parseFloat(costPerKmElec)) : 0));
        const range = consumption > 0.1 ? ((params.batteryCapacity / consumption) * 100) : 0;

        return (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="text-slate-300 font-bold text-base mb-1 flex items-center gap-2"><Icons.Zap className="w-5 h-5"/> Consumo</div>
                    <div className="text-5xl font-display font-bold text-white tabular-nums">{formatDecimal(consumption)}<span className="text-xl text-slate-400 ml-2 font-sans font-normal">kWh/100</span></div>
                    <div className="text-base text-blue-400 mt-2 font-bold">Autonomía: {formatMoney(range)} km</div>
                </div>

                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-start shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-green-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="flex flex-col items-center w-full mb-4">
                        <div className="text-slate-300 font-bold text-base mb-1 flex items-center gap-2"><Icons.Euro className="w-5 h-5"/> Coste Eléctrico</div>
                        <div className="text-5xl font-display font-bold text-green-400 tabular-nums">{formatDecimal(costPer100ElecRaw)}€<span className="text-xl text-slate-400 ml-2 font-sans font-normal">/100km</span></div>
                        <div className="text-base text-green-300/70 mt-1 font-mono font-bold">{formatDecimal(costPerKmElec)} €/km</div>
                        <div className="text-sm font-bold text-slate-400 mt-1">Ref: {costs.electricityPrice} €/kWh</div>
                    </div>
                    <div className="w-full h-px bg-slate-700 mb-3"></div>

                        <div className="flex items-baseline gap-3">
                            <span className="text-xl font-bold text-white">+{formatDecimal(savingsRaw)}€</span>
                            <span className="text-sm text-slate-400">➜</span>
                            <span className="text-xl font-bold text-blue-400">+{formatMoney(extraKm)} km</span>
                        </div>
                        <div className="text-xs font-bold text-slate-400 mt-0">por cada 100km recorridos</div>

                </div>

                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-orange-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="text-slate-300 font-bold text-base mb-1 flex items-center gap-2"><Icons.Fuel className="w-5 h-5"/> Consumo en Térmico</div>
                    <div className="text-5xl font-display font-bold text-orange-400 tabular-nums">{formatDecimal(costPer100GasRaw)}€<span className="text-xl text-slate-400 ml-2 font-sans font-normal">/100km</span></div>
                    <div className="text-base text-orange-300/70 mt-2 font-mono font-bold">{formatDecimal(costPerKmGas)} €/km</div>
                    <div className="text-sm font-bold text-slate-400 mt-4">Ref: {costs.gasConsumptionRef}L/100 a {costs.gasPrice}€/L</div>
                </div>
            </div>
        );
      };

      const Visualizer = ({ params }) => {
        const isMoving = params.speed > 0;
        const isHeadwind = params.windSpeed < 0;
        const windParticles = Array.from({ length: Math.abs(params.windSpeed) * 1.5 }).map((_, i) => ({
            id: i, top: Math.random() * 100 + '%', delay: Math.random() * 2 + 's',
        }));

        return (
            <div className="relative h-80 w-full bg-gradient-to-b from-[#2a0808] to-slate-950 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl mb-8">
                 <div className="absolute top-4 left-4 right-4 flex justify-between z-20">
                    <div className="space-y-2">
                        <div className="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-full border border-slate-700 text-sm font-bold font-mono text-blue-400 flex items-center gap-2"><Icons.Gauge className="w-4 h-4" /> {params.speed} km/h</div>
                        <div className="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-full border border-slate-700 text-sm font-bold font-mono text-green-400 flex items-center gap-2"><Icons.TrendingUp className="w-4 h-4" /> {params.gradient}% Desnivel</div>
                    </div>
                    <div className="space-y-2 text-right">
                        <div className="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-full border border-slate-700 text-sm font-bold font-mono text-orange-400 flex items-center gap-2 ml-auto"><Icons.Thermometer className="w-4 h-4" /> {params.temperature}°C</div>
                        <div className="bg-slate-900/80 backdrop-blur px-4 py-2 rounded-full border border-slate-700 text-sm font-bold font-mono text-cyan-400 flex items-center gap-2 ml-auto"><Icons.Wind className="w-4 h-4" /> {Math.abs(params.windSpeed)} km/h {isHeadwind ? 'Contra' : 'Favor'}</div>
                    </div>
                </div>
                <div className="absolute inset-0 bg-red-900/10"></div>
                {params.windSpeed !== 0 && (
                    <div className="absolute inset-0 pointer-events-none z-10">
                        {windParticles.map(p => (
                            <div key={p.id} className={`absolute h-0.5 bg-white/20 rounded-full ${isHeadwind ? 'wind-particle-head' : 'wind-particle-tail'}`}
                                style={{ top: p.top, left: isHeadwind ? '100%' : '-10%', width: Math.random() * 50 + 50 + 'px', animationDuration: '0.8s', animationDelay: p.delay }} />
                        ))}
                    </div>
                )}
                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-[400px] h-[200px] z-20 transition-transform duration-300" style={{ transform: `translateX(-50%) rotate(${-params.gradient}deg)` }}>
                    <img src="tesla_model_3.png" alt="Tesla Model 3" className="w-full h-full object-contain relative z-10 filter drop-shadow-2xl contrast-125 brightness-90" />
                    <div className={`absolute bottom-[20.5%] left-[12.8%] w-[12.1%] aspect-square rounded-full border-2 border-slate-400/30 border-t-white/80 z-20 ${isMoving ? 'animate-spin-fast' : ''}`}></div>
                    <div className={`absolute bottom-[20.5%] right-[13%] w-[12.1%] aspect-square rounded-full border-2 border-slate-400/30 border-t-white/80 z-20 ${isMoving ? 'animate-spin-fast' : ''}`}></div>

                     <div className={`absolute top-10 left-0 right-0 h-1 w-full ${isMoving ? 'animate-road-move' : ''}`} 
                        style={{ backgroundImage: 'linear-gradient(90deg, rgba(100,116,139,1) 50%, transparent 50%)', backgroundSize: '60px 100%', animationDuration: isMoving && params.speed > 0 ? `${200 / params.speed}s` : '0s' }}></div>
                </div>

      };

      // --- CALCULADORA DE AMORTIZACIÓN (LETRAS MÁS GRANDES) ---
      const AmortizationCalculator = () => {
        const [data, setData] = usePersistentState('amortData', {
            priceEV: 43000, priceICE: 45000, moves: 8500, aidICE: 2200,
            kmPerYear: 20000, consumptionEV: 16.0, consumptionICE: 6.0,
            priceElec: 0.10, priceFuel: 1.45, 
            yearsToProject: 20,
            maintenanceEV: 60, maintenanceICE: 300,
            breakdownRateEV: 25, breakdownRateICE: 10,
            taxSavingsEV: 50, taxSavingsICE: 0
        });
        
        const [showTable, setShowTable] = useState(true);

        const handleChange = (field, value) => setData({...data, [field]: parseFloat(value) || 0});

        // Cálculos
        const netPriceEV = data.priceEV - data.moves;
        const netPriceICE = data.priceICE - data.aidICE;
        const initialDifference = netPriceEV - netPriceICE;
        
        const totalBreakdownEV = data.priceEV * (data.breakdownRateEV / 100);
        const totalBreakdownICE = data.priceICE * (data.breakdownRateICE / 100);
        const annualBreakdownEV = totalBreakdownEV / data.yearsToProject;
        const annualBreakdownICE = totalBreakdownICE / data.yearsToProject;

        const annualFuelCost = (data.kmPerYear / 100) * data.consumptionICE * data.priceFuel;
        const annualElecCost = (data.kmPerYear / 100) * data.consumptionEV * data.priceElec;
        
        const totalAnnualCostEV = annualElecCost + data.maintenanceEV + annualBreakdownEV - data.taxSavingsEV;
        const totalAnnualCostICE = annualFuelCost + data.maintenanceICE + annualBreakdownICE - data.taxSavingsICE;

        const totalAnnualSavings = totalAnnualCostICE - totalAnnualCostEV;

        const breakEvenYears = initialDifference > 0 ? (initialDifference / totalAnnualSavings) : 0;
        const breakEvenKm = initialDifference > 0 ? (breakEvenYears * data.kmPerYear) : 0;
        
        const totalSavingsProjected = (totalAnnualSavings * data.yearsToProject) - initialDifference;
        const effectiveCost = netPriceEV - (totalAnnualSavings * data.yearsToProject);

        const tableRows = [];
        for (let i = 0; i <= data.yearsToProject; i++) {
            const cumCostEV = netPriceEV + (totalAnnualCostEV * i);
            const cumCostICE = netPriceICE + (totalAnnualCostICE * i);
            const currentKm = data.kmPerYear * i;
            tableRows.push({ year: i, km: currentKm, ev: cumCostEV, ice: cumCostICE, diff: cumCostICE - cumCostEV });
        }

        return (
            <div className="space-y-6">
                <div className="bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-700 rounded-2xl p-8 text-center shadow-2xl">
                    <h3 className="text-slate-300 text-sm font-display uppercase tracking-widest mb-4 font-bold">Análisis de Rentabilidad</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                        <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 relative overflow-hidden">
                            <div className="relative z-10">
                                <div className="text-sm text-green-400 mb-2 uppercase font-bold">Ahorro Neto ({data.yearsToProject} años)</div>
                                <div className={`text-5xl font-bold font-display ${totalSavingsProjected >= 0 ? 'text-green-400' : 'text-red-400'}`}>{totalSavingsProjected > 0 ? '+' : ''}{formatMoney(totalSavingsProjected)}€</div>
                            </div>
                        </div>
                        <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 relative overflow-hidden">
                             <div className="relative z-10">
                                <div className="text-sm text-blue-300 mb-2 uppercase font-bold">Coste Real vs Térmico</div>
                                <div className="text-4xl font-bold font-display text-white">{formatMoney(effectiveCost)}€</div>
                                <div className="text-xs font-bold text-slate-400 leading-tight mt-2">Precio EV menos ahorro generado</div>
                            </div>
                        </div>
                         <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 relative overflow-hidden">
                            <div className="text-sm text-slate-300 mb-3 uppercase font-bold">Punto de Equilibrio</div>
                            <div className="flex justify-around items-center">
                                <div><div className={`text-3xl font-bold font-display ${initialDifference <= 0 ? 'text-green-400' : 'text-white'}`}>{initialDifference <= 0 ? "0" : breakEvenYears.toFixed(1)} <span className="text-sm font-sans font-normal text-slate-400">años</span></div></div>
                                <div className="h-8 w-px bg-slate-700"></div>
                                <div><div className={`text-3xl font-bold font-display ${initialDifference <= 0 ? 'text-green-400' : 'text-white'}`}>{initialDifference <= 0 ? "0" : formatMoney(breakEvenKm)} <span className="text-sm font-sans font-normal text-slate-400">km</span></div></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                        <h4 className="text-blue-400 font-display font-bold mb-4 flex items-center gap-2 text-lg"><Icons.Zap /> Vehículo Eléctrico</h4>
                        <div className="space-y-4">
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Precio Compra (€)</label><FormattedInput value={data.priceEV} onChange={val=>handleChange('priceEV', val)} /></div>
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Ayudas / MOVES (€)</label><FormattedInput value={data.moves} onChange={val=>handleChange('moves', val)} /></div>
                            <div className="pt-2 border-t border-slate-800"><h5 className="text-sm font-bold text-slate-300 mb-2 flex gap-2 items-center"><Icons.Wrench className="w-4 h-4"/> Mantenimiento y Averías</h5><div className="grid grid-cols-3 gap-4"><div><label className="text-xs font-bold text-slate-400 block mb-1">Mtto. Anual</label><FormattedInput value={data.maintenanceEV} onChange={val=>handleChange('maintenanceEV', val)} /></div><div><label className="text-xs font-bold text-slate-400 block mb-1 whitespace-nowrap">% Averías <span className="text-slate-500 font-normal">[{formatMoney(totalBreakdownEV)}€]</span></label><FormattedInput decimals={1} value={data.breakdownRateEV} onChange={val=>handleChange('breakdownRateEV', val)} /></div><div><label className="text-xs font-bold text-slate-400 block mb-1">Ahorro Impuestos</label><FormattedInput value={data.taxSavingsEV} onChange={val=>handleChange('taxSavingsEV', val)} /></div></div></div>
                            <div className="pt-2 border-t border-slate-800"><h5 className="text-sm font-bold text-slate-300 mb-2">Consumo</h5><div className="grid grid-cols-2 gap-6"><div><label className="text-xs font-bold text-slate-400 block mb-1">kWh/100km</label><FormattedInput decimals={1} value={data.consumptionEV} onChange={val=>handleChange('consumptionEV', val)} /></div><div><label className="text-xs font-bold text-slate-400 block mb-1">Precio €/kWh</label><FormattedInput decimals={3} value={data.priceElec} onChange={val=>handleChange('priceElec', val)} /></div></div></div>
                        </div>
                    </div>
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                        <h4 className="text-orange-400 font-display font-bold mb-4 flex items-center gap-2 text-lg"><Icons.Fuel /> Vehículo Térmico</h4>
                        <div className="space-y-4">
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Precio Compra (€)</label><FormattedInput value={data.priceICE} onChange={val=>handleChange('priceICE', val)} /></div>
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Ayudas / Plan Renove (€)</label><FormattedInput value={data.aidICE} onChange={val=>handleChange('aidICE', val)} /></div>
                            <div className="pt-2 border-t border-slate-800"><h5 className="text-sm font-bold text-slate-300 mb-2 flex gap-2 items-center"><Icons.Wrench className="w-4 h-4"/> Mantenimiento y Averías</h5><div className="grid grid-cols-3 gap-4"><div><label className="text-xs font-bold text-slate-400 block mb-1">Mtto. Anual</label><FormattedInput value={data.maintenanceICE} onChange={val=>handleChange('maintenanceICE', val)} /></div><div><label className="text-xs font-bold text-slate-400 block mb-1 whitespace-nowrap">% Averías <span className="text-slate-500 font-normal">[{formatMoney(totalBreakdownICE)}€]</span></label><FormattedInput decimals={1} value={data.breakdownRateICE} onChange={val=>handleChange('breakdownRateICE', val)} /></div><div><label className="text-xs font-bold text-slate-400 block mb-1">Ahorro Impuestos</label><FormattedInput value={data.taxSavingsICE} onChange={val=>handleChange('taxSavingsICE', val)} /></div></div></div>
                            <div className="pt-2 border-t border-slate-800"><h5 className="text-sm font-bold text-slate-300 mb-2">Consumo</h5><div className="grid grid-cols-2 gap-6"><div><label className="text-xs font-bold text-slate-400 block mb-1">L/100km</label><FormattedInput decimals={1} value={data.consumptionICE} onChange={val=>handleChange('consumptionICE', val)} /></div><div><label className="text-xs font-bold text-slate-400 block mb-1">Precio €/L</label><FormattedInput decimals={3} value={data.priceFuel} onChange={val=>handleChange('priceFuel', val)} /></div></div></div>
                        </div>
                    </div>
                </div>
                
                <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                    <h4 className="text-slate-300 font-bold mb-4 text-base">Variables de Comparación</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label className="text-sm font-bold text-slate-400 block mb-1">Kilómetros Anuales</label><FormattedInput value={data.kmPerYear} onChange={val=>handleChange('kmPerYear', val)} /></div>
                        <div><label className="text-sm font-bold text-slate-400 block mb-1">Años a proyectar</label><FormattedInput value={data.yearsToProject} onChange={val=>handleChange('yearsToProject', val)} /></div>

                <div className="mt-8">
                    <button onClick={() => setShowTable(!showTable)} className="w-full py-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-base font-medium text-slate-300 transition-colors flex items-center justify-center gap-2"><Icons.Table /> {showTable ? 'Ocultar Desglose' : 'Ver Desglose Detallado Año a Año'}</button>
                    {showTable && (
                        <div className="mt-4 overflow-x-auto rounded-xl border border-slate-800 animate-fade-in">
                            <table className="w-full custom-table">
                                <thead className="bg-slate-900"><tr><th>Año</th><th className="text-right">Kms Totales</th><th className="text-right">Coste Acumulado EV</th><th className="text-right">Coste Acumulado ICE</th><th className="text-right">Diferencia (Ahorro)</th></tr></thead>
                                <tbody className="bg-slate-900/50">{tableRows.map((row) => (<tr key={row.year}><td className="font-bold text-slate-400">{row.year}</td><td className="text-slate-300">{formatMoney(row.km)}</td><td className="text-blue-300">{formatMoney(row.ev)}€</td><td className="text-orange-300">{formatMoney(row.ice)}€</td><td className={row.diff >= 0 ? 'text-green-400 font-bold' : 'text-red-400'}>{row.diff > 0 ? '+' : ''}{formatMoney(row.diff)}€</td></tr>))}</tbody>

                    <p>(*) Si quieres comprar un Tesla puedes usar mi referido: <a href="https://ts.la/juancarlos162231" target="_blank" className="text-blue-400 font-bold underline hover:text-blue-300">https://ts.la/juancarlos162231</a></p>

      // --- CALCULADORA DE CARGA (LETRAS MÁS GRANDES) ---
      const ChargingCalculator = () => {
        const [state, setState] = usePersistentState('chargeState', { 
            capacity: 60, 
            startPct: 20, 
            targetPct: 80, 
            power: 7.4, 
            consumption: 14.5, 
            energyPrice: 0.07, 
            dailyKm: 50,
            batType: 'LFP' // Default
        });

        // CURVE DATA (DUPLICATED FOR SAFETY)
        const curvePoints = {
            LFP: [{p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}],
            NCA: [{p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}]
        };

        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const points = curvePoints[type];
            const baseRef = type === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);
            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;
            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            return (p1.v + (ratio * (p2.v - p1.v))) * scaleFactor;
        };

        const validTarget = Math.max(state.startPct, state.targetPct);
        const percentAdded = validTarget - state.startPct;
        const energyAdded = state.capacity * (percentAdded / 100);
        
        // LINEAR CALC
        const timeHoursLin = state.power > 0 ? energyAdded / state.power : 0;
        const minutesLin = timeHoursLin * 60;
        
        // CURVE CALC
        let minutesCurve = 0;
        const kwhPerPercent = state.capacity / 100;
        for (let i = state.startPct; i < validTarget; i++) {
            const limit = getBatteryLimitAtSoC(i, state.batType, state.power);
            const realPower = Math.min(state.power, limit);
            if (realPower > 0) minutesCurve += (kwhPerPercent / realPower) * 60;
        }

        const rangeAdded = state.consumption > 0 ? (energyAdded / state.consumption) * 100 : 0;
        const totalCost = energyAdded * state.energyPrice;
        const totalRangeAtTarget = state.consumption > 0 ? (state.capacity * (validTarget/100) / state.consumption) * 100 : 0;
        const dailyCost = (state.dailyKm / 100) * state.consumption * state.energyPrice;
        const monthlyCost = dailyCost * 30.41; 
        const annualCost = dailyCost * 365;

        const handleChange = (k, v) => {
            const val = parseFloat(v) || 0;
            setState(prev => {
                let updates = { [k]: val };
                if (k === 'power') updates.energyPrice = val < 11 ? 0.07 : 0.45;
                return { ...prev, ...updates };
            });
        };
        
        const powerPresets = [ { l: "Schuko", v: 2.3 }, { l: "GreenUp", v: 3.7 }, { l: "Wallbox 1F", v: 7.4 }, { l: "Wallbox 3F", v: 11 }, { l: "AC Público", v: 22 }, { l: "DC 50", v: 50 }, { l: "Supercharger", v: 150 } ];

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                        <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.BatteryCharging /> Parámetros de Carga</h2>
                        
                        {/* Battery Type Selector */}
                        <div className="flex gap-2 mb-4 bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                             <button onClick={() => setState(p => ({...p, batType: 'LFP'}))} className={`flex-1 py-3 text-sm font-bold rounded-md transition-colors ${state.batType === 'LFP' ? 'bg-green-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>LFP (RWD)</button>
                             <button onClick={() => setState(p => ({...p, batType: 'NCA'}))} className={`flex-1 py-3 text-sm font-bold rounded-md transition-colors ${state.batType === 'NCA' ? 'bg-red-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>NCA/NMC (LR,PF)</button>
                        </div>

                        <div className="space-y-6">
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Capacidad Batería (kWh)</label><FormattedInput value={state.capacity} onChange={v => handleChange('capacity', v)} decimals={1}/></div>
                            <div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Porcentaje de Inicio</label><span className="text-base font-bold text-white">{state.startPct}%</span></div><input type="range" min="0" max="100" value={state.startPct} onChange={e => { const val = parseInt(e.target.value); setState(prev => ({...prev, startPct: val, targetPct: Math.max(val, prev.targetPct)})); }} className="w-full h-4 bg-slate-700 rounded-lg accent-yellow-500" /></div>
                            <div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Objetivo de Carga</label><span className="text-base font-bold text-green-400">{state.targetPct}%</span></div><input type="range" min="0" max="100" value={state.targetPct} onChange={e => handleChange('targetPct', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg accent-green-500" /></div>
                            <div className="pt-4 border-t border-slate-800"><label className="text-sm font-bold text-slate-400 block mb-2">Potencia de Carga (kW)</label><FormattedInput value={state.power} onChange={v => handleChange('power', v)} decimals={1}/><div className="flex flex-wrap gap-3 mt-4">{powerPresets.map(p => (<button key={p.v} onClick={() => handleChange('power', p.v)} className={`px-3 py-2 text-xs rounded border transition-colors font-bold ${state.power === p.v ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{p.l}</button>))}</div></div>
                            <div className="pt-4 grid grid-cols-2 gap-6"><div><label className="text-sm font-bold text-slate-400 block mb-1">Consumo (kWh/100)</label><FormattedInput value={state.consumption} onChange={v => handleChange('consumption', v)} decimals={1}/></div><div><label className="text-sm font-bold text-slate-400 block mb-1">Precio Energía (€/kWh)</label><FormattedInput value={state.energyPrice} onChange={v => handleChange('energyPrice', v)} decimals={3}/></div></div>
                        </div>
                    </div>
                </div>
                <div className="lg:col-span-7 space-y-6">
                     <div className="bg-black/40 border border-slate-800 rounded-xl p-8 flex items-center justify-center relative overflow-hidden h-48">
                        <div className="relative w-full max-w-md h-28 border-4 border-slate-600 rounded-2xl p-1 flex items-center">
                            <div className="absolute -right-4 top-1/2 -translate-y-1/2 w-4 h-10 bg-slate-600 rounded-r-md"></div>
                            <div className="h-full bg-slate-800 rounded-l-lg" style={{width: `${state.startPct}%`}}></div>
                            <div className="h-full bg-green-500 animate-charge" style={{width: `${Math.max(0, percentAdded)}%`}}><div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTAgMTBMMTAgMFYxMEgwWiIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjEpIi8+PC9zdmc+')] opacity-30"></div></div>
                            <div className="flex-grow"></div>
                             <div className="absolute inset-0 flex items-center justify-center text-4xl font-display font-bold text-white drop-shadow-md z-10">{state.startPct}% <span className="text-slate-400 mx-4">➔</span> <span className="text-green-400">{state.targetPct}%</span></div>
                        </div>
                     </div>
                     <div className="grid grid-cols-2 gap-4">
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center">
                            <div className="text-slate-300 font-bold text-sm uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.Clock className="w-5 h-5"/> Tiempo Estimado</div>
                            <div className="text-5xl font-display font-bold text-white">{formatTimeShort(minutesCurve)}</div>
                            <div className="text-xs font-bold text-slate-400 mt-2">Teórico: {formatTimeShort(minutesLin)} (a {state.power} kW)</div>
                        </div>
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-300 font-bold text-sm uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.Euro className="w-5 h-5"/> Coste Recarga</div><div className="text-5xl font-display font-bold text-white">{formatDecimal(totalCost)}<span className="text-xl text-slate-400">€</span></div><div className="text-xs font-bold text-slate-400 mt-2">a {state.energyPrice} €/kWh</div></div>
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-300 font-bold text-sm uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.Zap className="w-5 h-5"/> Energía Añadida</div><div className="text-5xl font-display font-bold text-green-400">+{formatDecimal(energyAdded)} <span className="text-xl text-green-400/50">kWh</span></div><div className="text-xs font-bold text-slate-400 mt-2">del {state.startPct}% al {state.targetPct}%</div></div>
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-300 font-bold text-sm uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.TrendingUp className="w-5 h-5"/> Km Añadidos</div><div className="text-5xl font-display font-bold text-blue-400">+{formatMoney(rangeAdded)} <span className="text-xl text-blue-400/50">km</span></div><div className="text-xs font-bold text-slate-400 mt-2">Autonomía Total: <span className="text-white">{formatMoney(totalRangeAtTarget)} km</span></div></div>
                     </div>
                     <div className="mt-8 pt-6 border-t border-slate-800 animate-fade-in"><h3 className="text-xl font-display font-bold text-slate-300 mb-4 flex items-center gap-2"><Icons.Calendar /> Proyección de Costes</h3><div className="grid grid-cols-1 md:grid-cols-4 gap-6 items-center bg-slate-900/80 p-6 rounded-xl border border-slate-700"><div className="col-span-1"><label className="text-sm font-bold text-slate-400 block mb-2">Kilómetros Diarios</label><FormattedInput value={state.dailyKm} onChange={v => handleChange('dailyKm', v)} /></div><div className="col-span-3 grid grid-cols-3 gap-4"><div className="bg-slate-800/50 rounded p-4 text-center"><div className="text-xs font-bold text-slate-400 uppercase">Diario</div><div className="text-2xl font-bold text-white">{formatDecimal(dailyCost)}€</div></div><div className="bg-slate-800/50 rounded p-4 text-center"><div className="text-xs font-bold text-slate-400 uppercase">Mensual</div><div className="text-2xl font-bold text-white">{formatDecimal(monthlyCost)}€</div></div><div className="bg-slate-800/50 rounded p-4 text-center"><div className="text-xs font-bold text-slate-400 uppercase">Anual</div><div className="text-2xl font-bold text-blue-400">{formatMoney(annualCost)}€</div></div></div></div></div>
                     <div className="mt-6 p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-sm font-bold text-slate-400 text-center">
                        <p>(*) La mejor app del mercado para controlar y gestionar tu Tesla, según mi experiencia es Tessie. Referido: <a href="https://share.tessie.com/JDukqlINZMb" target="_blank" className="text-purple-400 font-bold underline hover:text-purple-300">https://share.tessie.com/JDukqlINZMb</a></p>
                     </div>
                </div>
            </div>
        );
      };
      
      // --- DRENAJE (LETRAS MÁS GRANDES) ---
      const DrainCalculator = () => {
        const [state, setState] = usePersistentState('drainState', {
            battery: 60, days: 15, startPct: 80, isGarage: true, temperature: 16, sentryMode: false, sentryTraffic: 'low', sentryHours: 24, sentryDisablePct: 20, preconditioning: false, appChecks: 7,
        });
        const handleChange = (k, v) => setState(prev => ({...prev, [k]: v}));

        let dailyBaseRate = state.isGarage ? 0.2 : 0.4;
        const tempDiff = Math.abs(state.temperature - 20);
        dailyBaseRate += (tempDiff * 0.015);

        let dailySentryPotential = 5.5; 
        if (state.sentryTraffic === 'med') dailySentryPotential += 0.3;
        if (state.sentryTraffic === 'high') dailySentryPotential += 0.8;
        
        const hourlySentryRate = dailySentryPotential / 24;
        const dailySentryAdded = hourlySentryRate * state.sentryHours; 
        const dailyPrecon = state.preconditioning ? 1.5 : 0;
        const totalAppDrain = state.appChecks * 0.15;
        const dailyAppDrain = totalAppDrain / state.days;

        const drainHigh = dailyBaseRate + dailySentryAdded + dailyPrecon + dailyAppDrain;
        const drainLow = dailyBaseRate + dailyPrecon + dailyAppDrain;

        const startEnergy = state.battery * (state.startPct / 100);
        const disableEnergy = state.battery * (state.sentryDisablePct / 100);
        const energyForHigh = Math.max(0, startEnergy - disableEnergy);
        
        let daysInHigh = 0;
        let daysInLow = 0;

        if (!state.sentryMode) { daysInLow = state.days; } else {
            const daysUntilDisable = drainHigh > 0 ? energyForHigh / drainHigh : 0;
            if (daysUntilDisable >= state.days) { daysInHigh = state.days; } else { daysInHigh = daysUntilDisable; daysInLow = state.days - daysUntilDisable; }
        }
        const totalDrain = (daysInHigh * drainHigh) + (daysInLow * drainLow);
        const endEnergy = Math.max(0, startEnergy - totalDrain);
        const endPct = (endEnergy / state.battery) * 100;
        let daysUntilDead = 0;
        if (state.sentryMode && startEnergy > disableEnergy) {
             const timeToDisable = energyForHigh / drainHigh;
             const timeFromDisableToZero = disableEnergy / drainLow;
             daysUntilDead = timeToDisable + timeFromDisableToZero;
        } else { daysUntilDead = drainLow > 0 ? startEnergy / drainLow : 999; }
        const isCritical = endPct <= 5; const isWarning = endPct <= 20;

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6"><div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6"><h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.Shield /> Variables de Consumo</h2><div className="space-y-6"><div className="grid grid-cols-2 gap-4"><button onClick={() => handleChange('isGarage', true)} className={`p-4 rounded-lg border text-center transition-all ${state.isGarage ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><div className="flex justify-center mb-1"><Icons.Home className="w-6 h-6"/></div><span className="text-sm font-bold">Garaje</span></button><button onClick={() => handleChange('isGarage', false)} className={`p-4 rounded-lg border text-center transition-all ${!state.isGarage ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><div className="flex justify-center mb-1"><Icons.Moon className="w-6 h-6"/></div><span className="text-sm font-bold">Calle</span></button></div><div className="animate-fade-in"><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Temperatura Media</label><span className="text-sm font-bold text-white">{state.temperature}°C</span></div><input type="range" min="-10" max="45" value={state.temperature} onChange={e => handleChange('temperature', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500" /></div><div className="border-t border-slate-800 pt-6"><div className="flex items-center justify-between mb-4"><label className="text-base font-bold text-slate-300 flex items-center gap-2"><Icons.Eye /> Modo Centinela</label><button onClick={() => handleChange('sentryMode', !state.sentryMode)} className={`w-14 h-8 rounded-full p-1 transition-colors ${state.sentryMode ? 'bg-red-500' : 'bg-slate-700'}`}><div className={`w-6 h-6 rounded-full bg-white transition-transform ${state.sentryMode ? 'translate-x-6' : 'translate-x-0'}`}></div></button></div>{state.sentryMode && (<div className="space-y-6 animate-fade-in"><div className="grid grid-cols-3 gap-3">{['low', 'med', 'high'].map(lvl => (<button key={lvl} onClick={() => handleChange('sentryTraffic', lvl)} className={`py-2 px-3 rounded border text-xs uppercase font-bold ${state.sentryTraffic === lvl ? 'bg-red-900/50 border-red-500 text-red-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>{lvl === 'low' ? 'Tranquilo' : lvl === 'med' ? 'Normal' : 'Intenso'}</button>))}</div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Horas activo / día</label><span className="text-sm font-bold text-white">{state.sentryHours}h</span></div><input type="range" min="1" max="24" value={state.sentryHours} onChange={e => handleChange('sentryHours', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /><p className="text-xs font-bold text-slate-400 mt-2 italic">Útil si lo tiene automatizado para que se active a ciertos horarios.</p></div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Desactivar si baja de:</label><span className="text-sm font-bold text-red-400">{state.sentryDisablePct}%</span></div><input type="range" min="5" max="50" value={state.sentryDisablePct} onChange={e => handleChange('sentryDisablePct', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /></div></div>)}</div><div className="border-t border-slate-800 pt-6 space-y-6"><div className="flex items-center justify-between"><label className="text-base font-bold text-slate-400 flex items-center gap-2"><Icons.Thermometer /> Pre-acondicionamiento (1/día)</label><button onClick={() => handleChange('preconditioning', !state.preconditioning)} className={`w-14 h-8 rounded-full p-1 transition-colors ${state.preconditioning ? 'bg- v></div>

      // --- NYLAND CALCULATOR (LETRAS MÁS GRANDES) ---
      const NylandCalculator = () => {
        const [state, setState] = usePersistentState('nylandState', { distance: 500, speedA: 110, speedB: 140, refConsumption: 15.0, startPct: 100, arrivalPct: 10, battery: 60, costPerKwh: 0.45, chargingStrategy: 'optimal' });
        const getConsumption = (speed, ref) => ref * Math.pow(speed / 110, 1.5);
        const consA = getConsumption(state.speedA, state.refConsumption);
        const consB = getConsumption(state.speedB, state.refConsumption);
        const totalEnergyA = (consA * state.distance) / 100;
        const totalEnergyB = (consB * state.distance) / 100;
        const strategy = state.chargingStrategy === 'optimal' ? { label: "Cortas (10-60%)", avgPower: 130, addedPct: 50 } : { label: "Largas (10-90%)", avgPower: 75, addedPct: 80 };
        const bufferEnergy = state.battery * (state.arrivalPct / 100);
        const initialEnergy = state.battery * (state.startPct / 100);
        const netChargeNeededA = Math.max(0, totalEnergyA + bufferEnergy - initialEnergy);
        const netChargeNeededB = Math.max(0, totalEnergyB + bufferEnergy - initialEnergy);
        const energyPerStop = state.battery * (strategy.addedPct / 100);
        const stopsA = netChargeNeededA > 0 ? Math.ceil(netChargeNeededA / energyPerStop) : 0;
        const stopsB = netChargeNeededB > 0 ? Math.ceil(netChargeNeededB / energyPerStop) : 0;
        const timeDriveA = (state.distance / state.speedA) * 60;
        const timeDriveB = (state.distance / state.speedB) * 60;
        const timeChargeA = (netChargeNeededA / strategy.avgPower) * 60;
        const timeChargeB = (netChargeNeededB / strategy.avgPower) * 60;
        const totalTimeA = timeDriveA + timeChargeA;
        const totalTimeB = timeDriveB + timeChargeB;
        const timeDiff = totalTimeA - totalTimeB; 
        const costA = netChargeNeededA * state.costPerKwh; 
        const costB = netChargeNeededB * state.costPerKwh;
    const costDiff = costB - costA;
        const handleChange = (k, v) => setState(prev => ({...prev, [k]: parseFloat(v) || 0}));
        const handleStrategy = (val) => setState(prev => ({...prev, chargingStrategy: val}));
        
        const formatTimeLocal = (min) => {
            if(!min || !isFinite(min)) return "00:00";
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;

nChange={e => handleChange('speedB', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /></div><div className="pt-4 border-t border-slate-800"><label className="text-sm font-bold text-slate-400 block mb-2">Estrategia de Carga</label><div className="grid grid-cols-2 gap-2"><button onClick={()=>handleStrategy('optimal')} className={`py-3 px-2 text-xs rounded border font-bold ${state.chargingStrategy==='optimal' ? 'bg-yellow-600/50 border-yellow-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>Paradas Cortas (10-60%)</button><button onClick={()=>handleStrategy('deep')} className={`py-3 px-2 text-xs rounded border font-bold ${state.chargingStrategy==='deep' ? 'bg-purple-600/50 border-purple-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>Paradas Largas (10-90%)</button></div><div className="mt-2 text-xs font-bold text-slate-400 text-center">Potencia media estimada: {strategy.avgPower} kW</div><div className="mt-4"><label className="text-xs font-bold text-slate-400 block mb-1">Coste Carga (€/kWh)</label><FormattedInput decimals={2} value={state.costPerKwh} onChange={v => handleChange('costPerKwh', v)} /></div></div></div></div>
                </div>
                <div className="lg:col-span-7 space-y-6">
                    <div className={`border rounded-xl p-8 flex flex-col gap-6 shadow-lg relative overflow-hidden ${timeDiff > 0 ? 'bg-red-900/20 border-red-500/30' : 'bg-blue-900/20 border-blue-500/30'}`}><div className="flex justify-between items-start z-10"><div><div className="text-sm uppercase tracking-widest text-slate-300 font-bold mb-2">Ganador en Tiempo</div><div className="text-4xl font-display font-bold text-white">{Math.abs(timeDiff) < 2 ? "Empate Técnico" : timeDiff > 0 ? `Ir Rápido (${state.speedB} km/h)` : `Ir Tranquilo (${state.speedA} km/h)`}</div><div className="text-lg font-bold text-slate-200 mt-2">{Math.abs(timeDiff) < 2 ? "Mismo tiempo total" : `Ahorras ${Math.round(Math.abs(timeDiff))} minutos`}</div></div><div className="text-5xl"><Icons.Award /></div></div><div className="pt-6 border-t border-white/10 z-10"><div className="text-sm uppercase tracking-widest text-slate-300 font-bold mb-2">Impacto Económico</div><div className="flex justify-between items-end"><div className="text-lg font-bold text-slate-200">Ir rápido cuesta <span className="text-red-400 text-2xl font-bold">+{formatDecimal(costDiff)}€</span> extra</div><div className="text-xs font-bold text-slate-400">({formatDecimal(costA)}€ vs {formatDecimal(costB)}€)</div></div></div></div>
                    <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6"><h4 className="text-base font-bold text-slate-300 mb-6">Comparativa Detallada</h4><div className="mb-6"><div className="flex justify-between text-sm mb-2"><span className="text-blue-400 font-bold">Opción A ({state.speedA} km/h)</span><span className="text-white font-bold">{formatTimeShort(totalTimeA)} total</span></div><div className="h-10 flex rounded-full overflow-hidden bg-slate-800 mb-2"><div style={{width: `${(timeDriveA/totalTimeA)*100}%`}} className="bg-blue-600 flex items-center justify-center text-xs text-white/90 font-bold">Conducir {formatTimeShort(timeDriveA)}</div>{timeChargeA > 0 && (<div style={{width: `${(timeChargeA/totalTimeA)*100}%`}} className="bg-orange-500 flex items-center justify-center text-xs text-black/80 font-bold">Carga {formatTimeShort(timeChargeA)}</div>)}</div><div className="flex justify-between text-xs font-bold text-slate-400"><span>{stopsA} Paradas</span><span>Consumo: {consA.toFixed(1)} kWh/100</span></div></div><div><div className="flex justify-between text-sm mb-2"><span className="text-red-400 font-bold">Opción B ({state.speedB} km/h)</span><span className="text-white font-bold">{formatTimeShort(totalTimeB)} total</span></div><div className="h-10 flex rounded-full overflow-hidden bg-slate-800 mb-2"><div style={{width: `${(timeDriveB/totalTimeB)*100}%`}} className="bg-red-600 flex items-center justify-center text-xs text-white/90 font-bold">Conducir {formatTimeShort(timeDriveB)}</div>{timeChargeB > 0 && (<div style={{width: `${(timeChargeB/totalTimeB)*100}%`}} className="bg-orange-500 flex items-center justify-center text-xs text-black/80 font-bold">Carga {formatTimeShort(timeChargeB)}</div>)}</div><div className="flex justify-between text-xs font-bold text-slate-400"><span>{stopsB} Paradas</span><span>Consumo: {consB.toFixed(1)} kWh/100</span></div></div></div>
                    <div className="bg-slate-800/30 rounded-xl border border-slate-700 overflow-hidden"><div className="bg-slate-800 px-4 py-3 text-sm font-bold text-slate-300 uppercase">Balance Energético</div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700 bg-slate-900/50"><div className="p-3 text-xs text-slate-400 font-bold">CONCEPTO</div><div className="p-3 text-xs text-blue-400 font-bold">OPCIÓN A</div><div className="p-3 text-xs text-red-400 font-bold">OPCIÓN B</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700"><div className="p-3 text-xs font-bold text-slate-400">Consumo Total</div><div className="p-3 text-base text-white">{totalEnergyA.toFixed(1)} kWh</div><div className="p-3 text-base text-white">{totalEnergyB.toFixed(1)} kWh</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700"><div className="p-3 text-xs font-bold text-slate-400">Energía Recargada</div><div className="p-3 text-base text-white font-bold">{netChargeNeededA.toFixed(1)} kWh</div><div className="p-3 text-base text-white font-bold">{netChargeNeededB.toFixed(1)} kWh</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700"><div className="p-3 text-xs font-bold text-slate-400">Coste Recarga</div><div className="p-3 text-base text-green-400">{formatDecimal(costA)}€</div><div className="p-3 text-base text-green-400">{formatDecimal(costB)}€</div></div></div>

      // --- NUEVO COMPONENTE: ESTRATEGIA DE CARGA (COMPACTO, FUENTES GRANDES, BARRA MÁS GRUESA) ---
      const ChargingStrategy = () => {
        const [state, setState] = usePersistentState('strategyState_v2', {
            battery: 60,
            consumption: 15.0,
            power: 7.4,
            energyPrice: 0.09,
            deepDischargeLimit: 5, 
            vampireRate: 1, 
            chargingEfficiency: 97,
            chargeEndTime: '08:00', 
            currentKm: 0,
            lastCalibrationDate: '',
            purchaseDate: '', 
            dailyKm: { Mon: 75, Tue: 75, Wed: 75, Thu: 75, Fri: 75, Sat: 40, Sun: 40 },
            targets: { Mon: 0, Tue: 0, Wed: 0, Thu: 70, Fri: 0, Sat: 0, Sun: 100 }
        });

        const dayLabels = { Mon: 'Lunes', Tue: 'Martes', Wed: 'Miércoles', Thu: 'Jueves', Fri: 'Viernes', Sat: 'Sábado', Sun: 'Domingo' };
        const dayOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

        const handleChange = (key, value) => setState(prev => ({ ...prev, [key]: value })); 
        const handleNumChange = (key, value) => setState(prev => ({ ...prev, [key]: parseFloat(value) || 0 }));

        const handleDayChange = (type, day, value) => {
            const val = parseFloat(value) || 0;
            setState(prev => ({
                ...prev,
                [type]: { ...prev[type], [day]: val }
            }));
        };

        // Helper para calcular hora de inicio
        const calculateStartTime = (endTime, durationMinutes) => {
            if(!endTime) return "--:--";
            const [h, m] = endTime.split(':').map(Number);
            const endTotal = h * 60 + m;
            let startTotal = endTotal - durationMinutes;
            if (startTotal < 0) startTotal += 1440; // Handle previous day
            const startH = Math.floor(startTotal / 60);
            const startM = Math.round(startTotal % 60);
            return `${String(startH).padStart(2, '0')}:${String(startM).padStart(2, '0')}`;
        };

        // Helper para antigüedad
        const getCarAge = () => {
            if (!state.purchaseDate) return null;
            const start = new Date(state.purchaseDate);
            const now = new Date();
            const diffTime = Math.abs(now - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            
            let years = now.getFullYear() - start.getFullYear();
            let months = now.getMonth() - start.getMonth();
            if (months < 0 || (months === 0 && now.getDate() < start.getDate())) {
                years--;
                months += 12;
            }
            return { text: `${years} años y ${months} meses`, days: diffDays };
        };

        const carAge = getCarAge();

        // --- CÁLCULOS DE LA NUEVA SECCIÓN INFORMATIVA ---
        const calcAmps = () => {
            if (state.power >= 11) {
                const amps = (state.power * 1000) / (400 * Math.sqrt(3));
                return { val: amps, phase: 'Trifásica (400V)'};
            } else {
                const amps = (state.power * 1000) / 230;
                return { val: amps, phase: 'Monofásica (230V)'};
            }
        };

        const chargeSpeedKmH = state.consumption > 0 ? (state.power / state.consumption) * 100 : 0;
        const chargeSpeedPctH = state.battery > 0 ? (state.power / state.battery) * 100 : 0;
        
        const getChargeWindowStats = () => {
            if(!state.chargeEndTime) return { hours: 0, kwh: 0, km: 0, pct: 0 };
            const [h, m] = state.chargeEndTime.split(':').map(Number);
            const totalHours = h + (m/60);
            const totalKwh = totalHours * state.power;
            const totalKm = state.consumption > 0 ? (totalKwh / state.consumption) * 100 : 0;
            const totalPct = state.battery > 0 ? (totalKwh / state.battery) * 100 : 0;
            return { hours: totalHours, kwh: totalKwh, km: totalKm, pct: totalPct };
        };

        const ampData = calcAmps();
        const windowStats = getChargeWindowStats();

        // --- CÁLCULO SEMANAL ---
        const calculateWeek = () => {
            const results = [];
            let totalTime = 0;
            let totalKmCharged = 0;
            let totalKmDriven = 0;
            let totalKwhCharged = 0;
            let lowestPoint = { pct: 100, day: 'Mon', km: 0 };
            let calibrationOpportunity = null;
            let lastChargeEvent = null;

            let simPct = 80; 
            dayOrder.forEach(day => {
                const driven = state.dailyKm[day];
                const kwhUsed = ((driven / 100) * state.consumption) + state.vampireRate;
                const consumedPct = (kwhUsed / state.battery) * 100;
                let endDayPct = simPct - consumedPct; 
                const target = state.targets[day];
                simPct = (target > 0 && target > endDayPct) ? target : endDayPct;
                if(simPct > 100) simPct = 100;
            });
            
            let currentPct = simPct; 
            dayOrder.forEach(day => {
                const driven = state.dailyKm[day];
                const drivingKwh = (driven / 100) * state.consumption;
                const kwhUsed = drivingKwh + state.vampireRate; 
                const consumedPct = (kwhUsed / state.battery) * 100;
                const endDayPct = currentPct - consumedPct;
                const endDayKm = (endDayPct / 100) * (state.battery / state.consumption) * 100;
                
                if (endDayPct < lowestPoint.pct) {
                    lowestPoint = { pct: endDayPct, day: day, km: endDayKm };
                }

                const target = state.targets[day];
                let chargeNeededPct = 0;
                let chargeTime = 0;
                let kwhAdded = 0;
                let kmAdded = 0;
                let isCharging = false;

                if (target > 0 && target > endDayPct) {
                    chargeNeededPct = target - endDayPct;
                    kwhAdded = (chargeNeededPct / 100) * state.battery;
                    kmAdded = (kwhAdded / state.consumption) * 100;
                    chargeTime = state.power > 0 ? (kwhAdded / state.power) * 60 : 0;
                    isCharging = true;
                }

                if (target === 100 && !calibrationOpportunity) {
                    const surplus = endDayPct - state.deepDischargeLimit;
                    let advice = null;
                    if (surplus > 0.9 && lastChargeEvent) { 
                        const idealPrevTarget = lastChargeEvent.target - surplus;
                        advice = { prevDay: lastChargeEvent.day, oldTarget: lastChargeEvent.target, newTarget: Math.round(idealPrevTarget) };
                    }
                    calibrationOpportunity = { day: day, arrivalPct: endDayPct, targetDeep: state.deepDischargeLimit, isOptimal: surplus <= 0.9, advice: advice };
                }

                if (isCharging && target < 100) { lastChargeEvent = { day: day, target: target }; }

                const nextMorningPct = (target > 0 && target > endDayPct) ? target : endDayPct;
                const nextMorningKm = (nextMorningPct / 100) * (state.battery / state.consumption) * 100;

                results.push({ day, startPct: currentPct, driven, endPct: endDayPct, target, chargeTime, kwhAdded, kmAdded, nextMorningPct, nextMorningKm });

                totalTime += chargeTime;
                totalKmCharged += kmAdded;
                totalKmDriven += driven;
                totalKwhCharged += kwhAdded;
                currentPct = nextMorningPct;
            });

            return { results, totalTime, totalKmCharged, totalKmDriven, totalKwhCharged, lowestPoint, calibrationOpportunity };
        };

        const { results, totalTime, totalKmCharged, totalKmDriven, totalKwhCharged, lowestPoint, calibrationOpportunity } = calculateWeek();
        const reserveKm = totalKmCharged - totalKmDriven; 
        
        // Costes Semanales
        const weeklyNetKwh = totalKwhCharged;
        const weeklyGrossKwh = weeklyNetKwh / (state.chargingEfficiency / 100 || 1);
        const totalCost = weeklyGrossKwh * state.energyPrice;
        const monthlyCost = (totalCost / 7) * 30.41;
        const annualCost = (totalCost / 7) * 365;

        // Histórico
        const totalDrivingKwh = (state.currentKm / 100) * state.consumption;
        const daysOwned = carAge ? carAge.days : 0;
        const totalVampireKwh = daysOwned * state.vampireRate;
        const totalNetKwh = totalDrivingKwh + totalVampireKwh;
        const efficiencyFactor = state.chargingEfficiency / 100 || 1;
        const totalGrossKwh = totalNetKwh / efficiencyFactor;
        const totalLossKwh = totalGrossKwh - totalNetKwh;
        
        const avgSessionDepth = 0.40; 
        const estimatedSessions = state.battery > 0 ? totalNetKwh / (state.battery * avgSessionDepth) : 0;
        const kmLossEquivalent = (totalLossKwh / state.consumption) * 100;

        const costDrivingHistory = totalDrivingKwh * state.energyPrice;
        const costVampireHistory = totalVampireKwh * state.energyPrice;
        const costLossHistory = totalLossKwh * state.energyPrice;
        const costTotalHistory = totalGrossKwh * state.energyPrice; 

        const vampireKmEquivalent = (totalVampireKwh / state.consumption) * 100;
        const avgDailyKmHistorical = daysOwned > 0 ? state.currentKm / daysOwned : 0;

        const cyclesUsed = state.battery > 0 ? totalNetKwh / state.battery : 0;
        const cyclesGuaranteed = 3000; 
        const cyclesLeft = Math.max(0, cyclesGuaranteed - cyclesUsed);
        
        let projectionDateStr = "---";
        let yearsLeftVal = 0;
        let projectionDate1500 = "---";
        let yearsLeft1500 = 0;
        const passed1500 = cyclesUsed >= 1500;

        if (daysOwned > 0 && cyclesUsed > 0) {
            const cyclesPerDay = cyclesUsed / daysOwned;
            if(cyclesPerDay > 0) {
                const daysLeft = cyclesLeft / cyclesPerDay;
                yearsLeftVal = daysLeft / 365;
                const futureDate = new Date();
                futureDate.setDate(futureDate.getDate() + daysLeft);
                projectionDateStr = futureDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });

                if (!passed1500) {
                    const cyclesRemaining1500 = 1500 - cyclesUsed;
                    const daysLeft1500 = cyclesRemaining1500 / cyclesPerDay;
                    yearsLeft1500 = daysLeft1500 / 365;
                    const futureDate1500 = new Date();
                    futureDate1500.setDate(futureDate1500.getDate() + daysLeft1500);
                    projectionDate1500 = futureDate1500.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
                } else { projectionDate1500 = "Superado"; }
            }
        }
        
        const avgDailyKmWeekly = totalKmDriven / 7;
        const dailyEnergyTotal = ((avgDailyKmWeekly / 100) * state.consumption) + state.vampireRate;
        const realConsumptionPer100 = avgDailyKmWeekly > 0 ? (dailyEnergyTotal / avgDailyKmWeekly) * 100 : 0;
        const kmLeftInCycles = realConsumptionPer100 > 0 ? (cyclesLeft * state.battery) / (realConsumptionPer100 / 100) : 0;

        const cycleTableData = [
            { r: "0 al 100%", c: 500 }, { r: "10 al 100%", c: 500 }, { r: "20 al 100%", c: 1000 },
            { r: "0 al 90%", c: 1500 }, { r: "10 al 90%", c: 1500 }, { r: "20 al 90%", c: 2000 },
            { r: "0 al 80%", c: 3000 }, { r: "10 al 80%", c: 3000 }, { r: "20 al 80%", c: 3500 },
            { r: "0 al 70%", c: 5000 }, { r: "10 al 70%", c: 5500 }, { r: "20 al 70%", c: 6000 },
        ];

        return (
            <div className="grid grid-cols-1 gap-8 animate-fade-in">

                            <div><label className="text-sm font-bold text-slate-400 block mb-2">Potencia Carga (kW)</label><FormattedInput decimals={1} value={state.power} onChange={v => handleNumChange('power', v)} /></div>
                            <div><label className="text-sm font-bold text-slate-400 block mb-2">Precio Energía (€/kWh)</label><FormattedInput decimals={3} value={state.energyPrice} onChange={v => handleNumChange('energyPrice', v)} /></div>
                        </div>

                        {/* Fila 2: 4 Columnas */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <div><label className="text-sm font-bold text-purple-400 block mb-2">Vampiro (kWh/día)</label><FormattedInput decimals={1} value={state.vampireRate} onChange={v => handleNumChange('vampireRate', v)} /></div>
                            <div><label className="text-sm font-bold text-red-400 block mb-2">Eficiencia Carga (%)</label><FormattedInput decimals={1} value={state.chargingEfficiency} onChange={v => handleNumChange('chargingEfficiency', v)} /></div>
                            <div><label className="text-sm font-bold text-yellow-500 block mb-2">Carga Profunda (%)</label><FormattedInput decimals={0} value={state.deepDischargeLimit} onChange={v => handleNumChange('deepDischargeLimit', v)} /></div>
                            <div>
                                <label className="text-sm font-bold text-green-400 block mb-2">Hora Fin Carga (Mañana)</label>
                                <input 
                                    type="time" 
                                    value={state.chargeEndTime} 
                                    onChange={(e) => handleChange('chargeEndTime', e.target.value)} 
                                    className="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-3 text-yellow-300 font-mono font-bold focus:outline-none focus:border-yellow-500 text-lg shadow-inner text-center h-[54px]"
                                />
                            </div>
                        </div>

                        {/* NUEVA SECCIÓN INFORMATIVA DE CARGA */}
                        <div className="w-full bg-blue-900/20 border border-blue-500/30 rounded-xl p-4 mt-2">

                                <div>
                                    <div className="text-xs font-bold text-slate-400 uppercase mb-1">Velocidad Carga</div>
                                    <div className="text-xl font-bold text-white font-mono">{formatDecimal(chargeSpeedKmH, 0)} km/h</div>
                                    <div className="text-xs font-bold text-slate-500">+{formatDecimal(chargeSpeedPctH, 1)}% por hora</div>
                                </div>
                                <div>
