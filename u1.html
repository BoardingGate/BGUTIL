      const Battery3DScene = ({ startPct, endPct, currentPower, maxPower }) => {
        const mountRef = useRef(null);

        useEffect(() => {
            if (!mountRef.current || !window.THREE) return;

            const width = mountRef.current.offsetWidth;
            const height = 300;
            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);
            camera.position.set(0, 6, 32); 
            camera.lookAt(0, 0, 0);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            while (mountRef.current.firstChild) {
                mountRef.current.removeChild(mountRef.current.firstChild);
            }
            mountRef.current.appendChild(renderer.domElement);

            const group = new THREE.Group();
            group.position.x = -6.5; 
            scene.add(group);

            const capGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.5, 32);
            const capMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.3, metalness: 0.8 });
            const topCap = new THREE.Mesh(capGeo, capMat);
            topCap.position.y = 6.25;
            const botCap = new THREE.Mesh(capGeo, capMat);
            botCap.position.y = -6.25;
            group.add(topCap);
            group.add(botCap);
            
            const nodeGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.5, 32);
            const node = new THREE.Mesh(nodeGeo, capMat);
            node.position.y = 6.6;
            group.add(node);

            const cageGeo = new THREE.CylinderGeometry(4, 4, 12, 16, 1, true);
            const cageMat = new THREE.MeshBasicMaterial({ color: 0x475569, wireframe: true, transparent: true, opacity: 0.2 });
            const cage = new THREE.Mesh(cageGeo, cageMat);
            group.add(cage);

            const coreGeo = new THREE.CylinderGeometry(3.6, 3.6, 12, 32);
            coreGeo.translate(0, 6, 0); 
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.9 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = -6; 
            core.scale.y = 0.01; 
            group.add(core);

            const ringCount = 80;
            const ringGeo = new THREE.BufferGeometry();
            const ringPos = new Float32Array(ringCount * 3);
            const ringAng = new Float32Array(ringCount);
            const ringRad = new Float32Array(ringCount);
            const ringSpd = new Float32Array(ringCount);

            for(let i=0; i<ringCount; i++) {
                ringAng[i] = Math.random() * Math.PI * 2;
                ringRad[i] = 4.8 + Math.random() * 2.0; 
                ringSpd[i] = 0.02 + Math.random() * 0.05;
                const y = (Math.random() - 0.5) * 14;
                ringPos[i*3] = Math.cos(ringAng[i]) * ringRad[i];
                ringPos[i*3+1] = y;
                ringPos[i*3+2] = Math.sin(ringAng[i]) * ringRad[i];
            }
            ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
            const ringMat = new THREE.PointsMaterial({ color: 0x60a5fa, size: 0.15, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
            const particles = new THREE.Points(ringGeo, ringMat);
            group.add(particles);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 10, 20);
            scene.add(dirLight);
            const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambLight);

            let frameId;
            let time = 0;

            const animate = () => {
                frameId = requestAnimationFrame(animate);
                time += 0.01;

                const data = mountRef.current.userData || { endPct: 0, powerRatio: 0 };

                const targetScale = Math.max(0.01, data.endPct / 100);
                core.scale.y += (targetScale - core.scale.y) * 0.05;

                const pct = core.scale.y;
                let col = new THREE.Color();
                if (pct < 0.2) col.setHex(0xef4444); 
                else if (pct < 0.6) col.setHex(0xeab308); 
                else if (pct < 0.95) col.setHex(0x22c55e); 
                else col.setHex(0x3b82f6); 
                core.material.color.lerp(col, 0.1);

                const globalSpeed = 0.2 + (data.powerRatio * 2.5); 
                const positions = particles.geometry.attributes.position.array;
                for(let i=0; i<ringCount; i++) {
                    ringAng[i] += ringSpd[i] * globalSpeed;
                    positions[i*3] = Math.cos(ringAng[i]) * ringRad[i];
                    positions[i*3+2] = Math.sin(ringAng[i]) * ringRad[i];
                    positions[i*3+1] += Math.sin(time + i) * 0.01; 
                }
                particles.geometry.attributes.position.needsUpdate = true;

                group.rotation.y = Math.sin(time * 0.2) * 0.1;
                group.rotation.x = 0.05;

                renderer.render(scene, camera);
            };
            animate();

            const handleResize = () => {
                if (!mountRef.current) return;
                const w = mountRef.current.offsetWidth;
                camera.aspect = w / height;
                camera.updateProjectionMatrix();
                renderer.setSize(w, height);
            };
            window.addEventListener('resize', handleResize);

            return () => {
                window.removeEventListener('resize', handleResize);
                cancelAnimationFrame(frameId);
                if (mountRef.current && renderer) mountRef.current.removeChild(renderer.domElement);
            };
        }, []);

        useEffect(() => {
            if (mountRef.current) {
                const powerRatio = maxPower > 0 ? currentPower / maxPower : 0;
                mountRef.current.userData = { endPct, powerRatio };
            }
        }, [endPct, currentPower, maxPower]);

        return <div ref={mountRef} className="w-full h-[300px] cursor-pointer" title="Visualización Núcleo Energía" />;
      };



      // --- COMPONENTE: CURVA DE CARGA (MODIFICADO: INPUTS DE PRECISIÓN Y KWH EDITABLE) ---
      const ChargeCurveCalculator = () => {
        const [state, setState] = usePersistentState('curveState', { 
            batType: 'LFP', 
            capacity: 60, 
            startPct: 10, 
            endPct: 80, 
            costPerKwh: 0.45, 
            chargerPower: 150, 
            optimizationTime: 20,
            consumption: 15.0, 
            targetRange: 300
        });

        // CURVAS REALISTAS 2024
        const curvePoints = {
            LFP: [{p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}],
            NCA: [{p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}]
        };

        const powerPresets = [3.3, 7.4, 11, 22, 50, 60, 100, 150, 170, 200, 250, 300, 400, 800];

        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const safeType = curvePoints[type] ? type : 'LFP';
            const points = curvePoints[safeType];
            const baseRef = safeType === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);
            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;
            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            return (p1.v + (ratio * (p2.v - p1.v))) * scaleFactor;
        };

        const calculateMetrics = (start, end) => {
            let minutes = 0;
            const kwhPerPercent = state.capacity / 100;
            const safeStart = Math.min(start, end - 1);
            const safeEnd = Math.max(end, start + 1);
            for (let i = safeStart; i < safeEnd; i++) {
                const limit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
                const realPower = Math.min(state.chargerPower, limit);
                if (realPower > 0) minutes += (kwhPerPercent / realPower) * 60;
            }
            const totalEnergy = (safeEnd - safeStart) * kwhPerPercent;
            const rangeAdded = state.consumption > 0 ? (totalEnergy / state.consumption) * 100 : 0;
            const totalRange = state.consumption > 0 ? ((state.capacity * (safeEnd/100)) / state.consumption) * 100 : 0;
            return { minutes, rangeAdded, totalRange, totalEnergy };
        };

        const handleChartChange = (key, value) => {
            const val = parseInt(value);
            const newStart = key === 'startPct' ? Math.min(val, state.endPct - 1) : state.startPct;
            const newEnd = key === 'endPct' ? Math.max(val, state.startPct + 1) : state.endPct;
            const metrics = calculateMetrics(newStart, newEnd);
            setState(prev => ({ ...prev, startPct: newStart, endPct: newEnd, optimizationTime: Math.round(metrics.minutes), targetRange: Math.round(metrics.totalRange) }));
        };

        // NUEVO: Editar energía directamente y ajustar endPct
        const handleEnergyEdit = (kWh) => {
            if (state.capacity <= 0) return;
            const pctToAdd = (kWh / state.capacity) * 100;
            const newEnd = Math.min(100, Math.max(state.startPct + 1, state.startPct + pctToAdd));
            const metrics = calculateMetrics(state.startPct, newEnd);
            setState(prev => ({ ...prev, endPct: newEnd, optimizationTime: Math.round(metrics.minutes), targetRange: Math.round(metrics.totalRange) }));
        };

        const handleTimeOptimization = (minutes) => {
            const idealStart = state.startPct; 
            let accumMinutes = 0;
            let foundEnd = idealStart;
            const kwhPerPercent = state.capacity / 100;
            for(let i = idealStart; i < 100; i++) {
                const limit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
                const realPower = Math.min(state.chargerPower, limit);
                if(realPower > 0) {
                    const minPerPct = (kwhPerPercent / realPower) * 60;
                    if (accumMinutes + minPerPct > minutes) break;
                    accumMinutes += minPerPct;
                    foundEnd = i + 1;
                }
            }
            const finalEnd = Math.min(100, foundEnd);
            const metrics = calculateMetrics(idealStart, finalEnd);
            setState(prev => ({ ...prev, endPct: finalEnd, optimizationTime: minutes, targetRange: Math.round(metrics.totalRange) }));
        };

        const handleRangeOptimization = (km) => {
            let targetPct = (km * state.consumption) / state.capacity;
            targetPct = Math.ceil(targetPct);
            const safeEnd = Math.max(state.startPct + 1, Math.min(100, targetPct));

            const scaleFactor = Math.max(1, techScaler);
            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;
            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            return (p1.v + (ratio * (p2.v - p1.v))) * scaleFactor;
        };

     // --- TARIFF COMPARATOR (FINAL: 3 COMPAÑÍAS, % RESTAURADO, OCTOPUS RELAX) ---

        const Tariff3DChart = ({ billA, billB, billC, nameA, nameB, nameC }) => {

            const maxTotal = Math.max(billA.total, billB.total, billC.total);

            const VIEW_HEIGHT = 100; const BASE_Y = -40; const MAX_BAR_HEIGHT = 80; const scaleY = MAX_BAR_HEIGHT / axisMax;

                const barWidth = 12; const spacing = 20; 
                const createStack = (data, xPos) => {

                    data.forEach((val, idx) => {
                        if (val <= 0.01) return;
                        const h = val * scaleY; const geo = new THREE.BoxGeometry(barWidth, h, barWidth);

                        const mesh = new THREE.Mesh(geo, mat); mesh.position.y = currentY + (h / 2); mesh.position.x = xPos;
                        const edges = new THREE.EdgesGeometry(geo); const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.15 }));
                        line.position.copy(mesh.position); group.add(mesh); group.add(line); currentY += h;
                    });
                    return group;
                };
                scene.add(createStack(dataA, -spacing - 5)); scene.add(createStack(dataB, 0)); scene.add(createStack(dataC, spacing + 5));
                const gridGroup = new THREE.Group();
                ticks.forEach((tickVal, i) => {
                    const y = BASE_Y + (tickVal * scaleY); const points = [];
                    points.push(new THREE.Vector3(-70, y, -5)); points.push(new THREE.Vector3(70, y, -5));  
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(points); const lineMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.3 });
                    const line = new THREE.Line(lineGeo, lineMat); gridGroup.add(line);
                });
                scene.add(gridGroup);
                renderer.render(scene, camera);
                let s = 0; const animate = () => { if (s < 1) { s += 0.04; renderer.render(scene, camera); requestAnimationFrame(animate); } }; animate();
                const handleResize = () => {
                    if (!mountRef.current) return; const w = mountRef.current.offsetWidth; const aspect = w / height;
                    camera.left = -VIEW_HEIGHT * aspect / 2; camera.right = VIEW_HEIGHT * aspect / 2; camera.updateProjectionMatrix();
                    renderer.setSize(w, height); renderer.render(scene, camera);
                };
                window.addEventListener('resize', handleResize);
                return () => { window.removeEventListener('resize', handleResize); if (mountRef.current && renderer) mountRef.current.removeChild(renderer.domElement); };
            }, [billA, billB, billC]); 

            return (
                <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 relative">
                    <div className="flex justify-between items-center mb-0 border-b border-slate-700/50 pb-2">
                        <h4 className="text-sm font-bold text-slate-300 uppercase flex items-center gap-2"><Icons.TrendingUp className="w-4 h-4"/> Comparativa Visual</h4>
                        <div className="flex flex-wrap justify-end gap-3 text-[10px] font-bold uppercase">
                            <div className="flex items-center gap-1"><div className="w-2 h-2 rounded bg-green-400"></div>Potencia</div>
                            <div className="flex items-center gap-1"><div className="w-2 h-2 rounded bg-blue-400"></div>Energía</div>
                            <div className="flex items-center gap-1"><div className="w-2 h-2 rounded bg-slate-400"></div>Fijos</div>
                            <div className="flex items-center gap-1"><div className="w-2 h-2 rounded bg-purple-400"></div>Impuestos</div>
                        </div>
                    </div>
                    <div className="relative h-[320px] w-full border-b border-slate-700/30">
                        <div className="absolute top-0 bottom-0 left-0 w-10 z-20 pointer-events-none">{ticks.map((t) => (<div key={t} className="absolute right-0 flex items-center justify-end w-full" style={{ bottom: `${10 + ((t / axisMax) * 80)}%`, transform: 'translateY(50%)' }}><span className="text-[10px] font-bold text-slate-400">{t.toFixed(0)}€</span></div>))}</div>
                        <div ref={mountRef} className="absolute inset-0 w-full h-full pl-10" /> 
                    </div>
                    {/* AQUÍ SE MUESTRAN LOS NOMBRES Y TOTALES AL PIE DE LA GRÁFICA */}
                    <div className="flex justify-center mt-3 pl-8 gap-4 text-center">
                        <div className="w-24">
                            <div className="text-xl font-display font-bold text-white leading-none mb-1">{formatDecimal(billA.total)}€</div>
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider truncate">{nameA}</div>
                        </div>
                        <div className="w-24">
                            <div className="text-xl font-display font-bold text-white leading-none mb-1">{formatDecimal(billB.total)}€</div>
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider truncate">{nameB}</div>
                        </div>
                        <div className="w-24">
                            <div className="text-xl font-display font-bold text-white leading-none mb-1">{formatDecimal(billC.total)}€</div>
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider truncate">{nameC}</div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- HANDLERS Y CÁLCULOS ---
        const handleSaveSnapshot = () => { try { localStorage.setItem('tariffCompSnapshot', JSON.stringify(tState)); setSavedDate(new Date().toLocaleString('es-ES')); } catch (e) {} };
        const handleRestoreSnapshot = () => { try { const data = localStorage.getItem('tariffCompSnapshot'); if (data) setTState(JSON.parse(data)); } catch (e) {} };
        const handleConsChange = (key, val) => {
            if (key === 'consTotal') {
                 const currentTotal = tState.p1Kwh + tState.p2Kwh + tState.p3Kwh + tState.p3VeKwh + tState.p4Kwh || 1;
                 const ratios = { p1: tState.p1Kwh/currentTotal, p2: tState.p2Kwh/currentTotal, p3: tState.p3Kwh/currentTotal, p3ve: tState.p3VeKwh/currentTotal, p4: tState.p4Kwh/currentTotal };
                 setTState(prev => ({ ...prev, consTotal: val, p1Kwh: val*ratios.p1, p2Kwh: val*ratios.p2, p3Kwh: val*ratios.p3, p3VeKwh: val*ratios.p3ve, p4Kwh: val*ratios.p4 }));
            } else { setTState(prev => { const newState = { ...prev, [key]: val }; newState.consTotal = newState.p1Kwh + newState.p2Kwh + newState.p3Kwh + newState.p3VeKwh + newState.p4Kwh; return newState; }); }
        };
        const handlePropChange = (propKey, field, val) => { setTState(prev => ({ ...prev, [propKey]: { ...prev[propKey], [field]: val } })); };

        // --- HANDLERS ESTIMADOR (RESTAURADOS) ---
        const handleDeviceChange = (id, field, value) => {
            setEstState(prev => ({ ...prev, devices: prev.devices.map(d => d.id === id ? { ...d, [field]: value } : d) }));
        };
        const handleDeviceSchedule = (deviceId, day, index, field, value) => {
            setEstState(prev => ({ ...prev, devices: prev.devices.map(d => { if (d.id !== deviceId) return d; const newDayArr = [...(d.days[day] || [])]; if (!newDayArr[index]) newDayArr[index] = { start: '', end: '' }; newDayArr[index][field] = value; return { ...d, days: { ...d.days, [day]: newDayArr } }; }) }));
        };
        const addInterval = (deviceId, day) => { setEstState(prev => ({ ...prev, devices: prev.devices.map(d => { if(d.id !== deviceId) return d; if((d.days[day]?.length || 0) >= 5) return d; return { ...d, days: { ...d.days, [day]: [...(d.days[day]||[]), { start: '', end: '' }] } }; }) })); };
        const removeInterval = (deviceId, day, index) => { setEstState(prev => ({ ...prev, devices: prev.devices.map(d => { if(d.id !== deviceId) return d; const newArr = d.days[day].filter((_, i) => i !== index); return { ...d, days: { ...d.days, [day]: newArr } }; }) })); };
        const copyScheduleToWeek = (deviceId, sourceDay) => { setEstState(prev => ({ ...prev, devices: prev.devices.map(d => { if (d.id !== deviceId) return d; const source = d.days[sourceDay]; const newDays = { ...d.days }; ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(day => { newDays[day] = JSON.parse(JSON.stringify(source)); }); return { ...d, days: newDays }; }) })); };
        const addDevice = () => { if (estState.devices.length >= 5) return; const newId = Math.max(...estState.devices.map(d => d.id), 0) + 1; setEstState(prev => ({ ...prev, devices: [...prev.devices, { id: newId, name: "Nuevo Dispositivo", power: 1.0, count: 1, dutyCycle: 100, days: { Mon: [], Tue: [], Wed: [], Thu: [], Fri: [], Sat: [], Sun: [] } }] })); };
        const deleteDevice = (id) => { setEstState(prev => ({ ...prev, devices: prev.devices.filter(d => d.id !== id) })); };
        const handleScheduleConfig = (period, index, value) => { setEstState(prev => { const newArr = [...prev.scheduleConfig[period]]; newArr[index] = value; return { ...prev, scheduleConfig: { ...prev.scheduleConfig, [period]: newArr } }; }); };

        // --- CÁLCULOS FACTURAS ---
        const calculateBill = (proposal) => {
            const termPotDisc = ((tState.potP1 * proposal.pricePotP1 * tState.days) + (tState.potP2 * proposal.pricePotP2 * tState.days)) * (1 - proposal.discPot / 100);
            const termEnRaw = (tState.p1Kwh * proposal.priceEnP1) + (tState.p2Kwh * proposal.priceEnP2) + (tState.p3Kwh * proposal.priceEnP3) + (tState.p3VeKwh * proposal.priceEnP3Ve) + (tState.p4Kwh * proposal.priceEnP4);
            const termEnNet = Math.max(0, (termEnRaw * (1 - proposal.discEn / 100)) - (tState.solarExp * proposal.solarPrice * (proposal.virtualBat ? 1 : 1))); 
            const fixedCosts = (tState.alquiler * tState.days) + (tState.bonoSocial * tState.days) + proposal.comision;
            const baseImp = termPotDisc + termEnNet;
            const total = (baseImp * (1 + tState.impuestoElec / 100) + fixedCosts) * (1 + tState.iva / 100);
            const taxes = total - (termPotDisc + termEnNet + fixedCosts);
            const pricePerKwh = tState.consTotal > 0 ? total / tState.consTotal : 0;
            const solarReturn = tState.solarExp * proposal.solarPrice;
            return { total, termPotDisc, termEnNet, fixedCosts, taxes, pricePerKwh, solarReturn };
        };

        const calculateEVCost = (proposal) => {
            const totalP3 = (tState.p3Kwh || 0) + (tState.p3VeKwh || 0);
            const evRatio = totalP3 > 0 ? ((tState.p3VeKwh || 0) / totalP3) : 0;
            const evTermPotP2 = ((tState.potP2 * proposal.pricePotP2 * tState.days) * (1 - proposal.discPot / 100)) * evRatio;
            const termEnP3Ve = (tState.p3VeKwh * proposal.priceEnP3Ve) * (1 - proposal.discEn / 100);
            const total = ((evTermPotP2 + termEnP3Ve) * (1 + tState.impuestoElec / 100)) * (1 + tState.iva / 100);
            return { total, pricePerKwh: tState.p3VeKwh > 0 ? total / tState.p3VeKwh : 0 };
        };

        // --- LÓGICA DE RANKING ---
        const billA = { ...calculateBill(tState.propA), name: tState.propA.name, ev: calculateEVCost(tState.propA) };
        const billB = { ...calculateBill(tState.propB), name: tState.propB.name, ev: calculateEVCost(tState.propB) };
        const billC = { ...calculateBill(tState.propC), name: tState.propC.name, ev: calculateEVCost(tState.propC) };

        const rankedBills = [billA, billB, billC].sort((a,b) => a.total - b.total);
        const best = rankedBills[0];
        
        // Rankings para sub-apartados
        const rankedEnergy = [billA, billB, billC].sort((a,b) => a.termEnNet - b.termEnNet);
        const rankedPower = [billA, billB, billC].sort((a,b) => a.termPotDisc - b.termPotDisc);

        const getConsPct = (val) => tState.consTotal > 0 ? (val / tState.consTotal) * 100 : 0; // Helper restaurado
        const consumptionData = { p1Kwh: tState.p1Kwh, p2Kwh: tState.p2Kwh, p3Kwh: tState.p3Kwh, p3VeKwh: tState.p3VeKwh, p4Kwh: tState.p4Kwh, totalKwh: tState.consTotal };
        const getMinClass = (valA, valB, valC, currentVal) => { const min = Math.min(valA, valB, valC); return Math.abs(currentVal - min) < 0.001 ? 'text-green-400' : 'text-slate-300'; };

        // --- CÁLCULO ESTIMADOR ---
        const calculateEstimation = () => {
            const start = new Date(estState.startDate);
            const end = new Date(estState.endDate);
            const daysDiff = Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)));
            const weeks = daysDiff / 7;

            let prop;
            if (estState.selectedProp === 'A') prop = tState.propA;
            else if (estState.selectedProp === 'B') prop = tState.propB;
            else prop = tState.propC;

            const taxMultiplier = estState.withTaxes ? (1 + tState.impuestoElec/100) * (1 + tState.iva/100) : 1;
            const p1Price = prop.priceEnP1 * (1 - prop.discEn/100) * taxMultiplier;
            const p2Price = prop.priceEnP2 * (1 - prop.discEn/100) * taxMultiplier;
            const p3Price = prop.priceEnP3 * (1 - prop.discEn/100) * taxMultiplier;

            const parseHourArray = (textArray) => {
                const hours = new Set();
                textArray.forEach(range => {
                    if(!range || !range.includes('-')) return;
                    const [s, e] = range.split('-').map(Number);
                    if(isNaN(s) || isNaN(e)) return;
                    let current = s; while(current < e) { hours.add(current); current++; }
                });
                return Array.from(hours);
            };
            const p1Hours = parseHourArray(estState.scheduleConfig.p1);
            const p2Hours = parseHourArray(estState.scheduleConfig.p2);

            let totalCost = 0; let totalKwh = 0;
            const deviceResults = [];

            estState.devices.forEach(dev => {
                let devKwhWeekly = 0; let devCostWeekly = 0;
                ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach((dayStr) => {
                    const isWeekend = dayStr === 'Sat' || dayStr === 'Sun';
                    const intervals = dev.days[dayStr] || [];
                    intervals.forEach(int => {
                        if(!int.start || !int.end) return;
                        const parseTime = (str) => { if(!str) return 0; const parts = str.includes(':') ? str.split(':') : [str, '0']; return parseInt(parts[0]) + (parseInt(parts[1]||0)/60); };
                        const startH = parseTime(int.start); let endH = parseTime(int.end); if(endH < startH) endH += 24; 
                        const duration = endH - startH; if(duration <= 0) return;
                        const effectivePower = dev.power * dev.count * (dev.dutyCycle / 100);
                        for(let h = Math.floor(startH); h < Math.ceil(endH); h++) {
                            const hourReal = h % 24;
                            const overlapStart = Math.max(h, startH); const overlapEnd = Math.min(h + 1, endH);
                            const fraction = Math.max(0, overlapEnd - overlapStart);
                            const kwh = effectivePower * fraction;
                            let price = p3Price; 
                            if (!(estState.scheduleConfig.weekendsAreP3 && isWeekend)) { if (p1Hours.includes(hourReal)) price = p1Price; else if (p2Hours.includes(hourReal)) price = p2Price; }
                            devKwhWeekly += kwh; devCostWeekly += (kwh * price);
                        }
                    });
                });
                const devTotalKwh = devKwhWeekly * weeks; const devTotalCost = devCostWeekly * weeks;
                deviceResults.push({ ...dev, totalKwh: devTotalKwh, totalCost: devTotalCost });
                totalKwh += devTotalKwh; totalCost += devTotalCost;
            });
            const weeklyKwh = totalKwh / weeks; const weeklyCost = totalCost / weeks;
            const monthlyKwh = totalKwh / (daysDiff / 30.44); const monthlyCost = totalCost / (daysDiff / 30.44);
            let currentBillTotal;
            if (estState.selectedProp === 'A') currentBillTotal = billA.total; else if (estState.selectedProp === 'B') currentBillTotal = billB.total; else currentBillTotal = billC.total;
            const billMonthly = currentBillTotal * (30 / tState.days); 
            const impactPct = billMonthly > 0 ? (monthlyCost / billMonthly) * 100 : 0;
            return { totalCost, totalKwh, weeklyCost, weeklyKwh, deviceResults, daysDiff, monthlyKwh, monthlyCost, impactPct };
        };
        const estResult = calculateEstimation();

        // --- RENDER ---
        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
                
                {/* 1. SECCIÓN SUPERIOR: DATOS Y GRÁFICAS DE CONSUMO (RESTAURADOS %) */}
                <div className="lg:col-span-12 space-y-4">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-5">
                        <div className="flex items-center gap-2 mb-4 border-b border-slate-700 pb-2"><Icons.Euro className="w-5 h-5 text-slate-400" /><h3 className="text-sm text-slate-300 font-bold uppercase">DATOS COMUNES</h3></div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4">
                            <div><label className="text-[10px] font-bold text-slate-400 block mb-1">Días Factura</label><FormattedInput value={tState.days} onChange={v => setTState({...tState, days: v})} decimals={0}/></div>
                            <div><label className="text-[10px] font-bold text-slate-400 block mb-1">Pot P1 (kW)</label><FormattedInput value={tState.potP1} onChange={v => setTState({...tState, potP1: v})} decimals={1}/></div>
                            <div><label className="text-[10px] font-bold text-slate-400 block mb-1">Pot P2 (kW)</label><FormattedInput value={tState.potP2} onChange={v => setTState({...tState, potP2: v})} decimals={1}/></div>
                            <div><label className="text-[10px] font-bold text-slate-400 block mb-1">IVA (%)</label><FormattedInput value={tState.iva} onChange={v => setTState({...tState, iva: v})} decimals={0}/></div>
                            <div><label className="text-[10px] font-bold text-slate-400 block mb-1">Imp. Elec (%)</label><FormattedInput value={tState.impuestoElec} onChange={v => setTState({...tState, impuestoElec: v})} decimals={2}/></div>
                            <div><label className="text-[10px] font-bold text-slate-400 block mb-1">Alquiler/día</label><FormattedInput value={tState.alquiler} onChange={v => setTState({...tState, alquiler: v})} decimals={4}/></div>
                            <div className="col-span-2 sm:col-span-1"><label className="text-[10px] font-bold text-slate-400 block mb-1">Bono Soc/día</label><FormattedInput value={tState.bonoSocial} onChange={v => setTState({...tState, bonoSocial: v})} decimals={4}/></div>
                        </div>
                    </div>
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                        <div className="flex justify-between items-center mb-4"><h3 className="text-sm text-slate-300 font-bold uppercase flex gap-2"><Icons.Activity className="w-4 h-4"/> Patrón de Consumo (kWh)</h3><div className="flex items-center gap-4"><div className="flex items-center gap-2"><span className="text-xs font-bold text-yellow-500">Excedentes:</span><div className="w-24"><FormattedInput value={tState.solarExp} onChange={v => setTState({...tState, solarExp: v})} decimals={0}/></div></div><div className="flex items-center gap-2"><span className="text-xs font-bold text-slate-300">Total:</span><span className="text-base font-bold text-white bg-slate-800 px-3 py-2 rounded border border-slate-700">{formatDecimal(tState.consTotal, 0)}</span></div></div></div>
                        <div className="grid grid-cols-5 gap-4">
                            <div className="bg-red-900/20 p-3 rounded border border-red-900/30 text-center"><label className="text-[10px] font-bold text-red-300 block mb-1">P1 (Punta)</label><FormattedInput value={tState.p1Kwh} onChange={v => handleConsChange('p1Kwh', v)} decimals={0}/><div className="text-[10px] font-bold text-red-300 block mt-1">{formatDecimal(getConsPct(tState.p1Kwh), 0)}%</div></div>
                            <div className="bg-orange-900/20 p-3 rounded border border-orange-900/30 text-center"><label className="text-[10px] font-bold text-orange-300 block mb-1">P2 (Llano)</label><FormattedInput value={tState.p2Kwh} onChange={v => handleConsChange('p2Kwh', v)} decimals={0}/><div className="text-[10px] font-bold text-orange-300 block mt-1">{formatDecimal(getConsPct(tState.p2Kwh), 0)}%</div></div>
                            <div className="bg-green-900/20 p-3 rounded border border-green-900/30 text-center"><label className="text-[10px] font-bold text-green-300 block mb-1">P3 (Valle)</label><FormattedInput value={tState.p3Kwh} onChange={v => handleConsChange('p3Kwh', v)} decimals={0}/><div className="text-[10px] font-bold text-green-300 block mt-1">{formatDecimal(getConsPct(tState.p3Kwh), 0)}%</div></div>
                            <div className="bg-blue-900/20 p-3 rounded border border-blue-900/30 text-center relative overflow-hidden"><label className="text-[10px] font-bold text-blue-300 block mb-1">P3 (VE)</label><FormattedInput value={tState.p3VeKwh} onChange={v => handleConsChange('p3VeKwh', v)} decimals={0}/><div className="text-[10px] font-bold text-blue-300 block mt-1">{formatDecimal(getConsPct(tState.p3VeKwh), 0)}%</div></div>
                            <div className="bg-purple-900/20 p-3 rounded border border-purple-900/30 text-center"><label className="text-[10px] font-bold text-purple-300 block mb-1">P4 (Extra)</label><FormattedInput value={tState.p4Kwh} onChange={v => handleConsChange('p4Kwh', v)} decimals={0}/><div className="text-[10px] font-bold text-purple-300 block mt-1">{formatDecimal(getConsPct(tState.p4Kwh), 0)}%</div></div>
                        </div>
                    </div>
                </div>

                {/* 2. COLUMNAS DE PROPUESTAS */}
                <div className="lg:col-span-4"><ProposalColumn propKey="propA" title="Propuesta A" data={tState.propA} powerData={{p1: tState.potP1, p2: tState.potP2}} consData={consumptionData} onChange={handlePropChange} /></div>
                <div className="lg:col-span-4"><ProposalColumn propKey="propB" title="Propuesta B" data={tState.propB} powerData={{p1: tState.potP1, p2: tState.potP2}} consData={consumptionData} onChange={handlePropChange} /></div>
                <div className="lg:col-span-4"><ProposalColumn propKey="propC" title="Propuesta C" data={tState.propC} powerData={{p1: tState.potP1, p2: tState.potP2}} consData={consumptionData} onChange={handlePropChange} /></div>

                {/* 3. SECCIÓN RESULTADOS: RANKING INTELIGENTE (ACTUALIZADO % Y €) */}
                <div className="lg:col-span-12 space-y-6">
                    <div className="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-xl p-6">
                        <div className="flex items-center justify-center gap-3 mb-6">
                            <Icons.Award className="w-8 h-8 text-yellow-400" />
                            <h3 className="text-2xl font-display font-bold text-white uppercase tracking-widest">Ranking Final</h3>
                        </div>

                        {/* RANKING PRINCIPAL */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            {rankedBills.map((item, index) => {
                                const isWinner = index === 0;
                                const diffPrev = index > 0 ? item.total - rankedBills[index - 1].total : 0;
                                const diffPrevPct = index > 0 ? (diffPrev / rankedBills[index - 1].total) * 100 : 0;
                                const borderClass = isWinner ? 'border-yellow-500 shadow-[0_0_20px_rgba(234,179,8,0.2)] bg-yellow-900/10' : index === 1 ? 'border-slate-600 bg-slate-800/30' : 'border-red-900/50 bg-red-900/10';
                                
                                return (
                                    <div key={index} className={`relative rounded-2xl border-2 p-5 flex flex-col items-center text-center transition-transform hover:scale-105 ${borderClass}`}>
                                        <div className={`absolute -top-4 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider shadow-md ${isWinner ? 'bg-yellow-500 text-black' : 'bg-slate-700 text-slate-300'}`}>
                                            {index + 1}º Puesto
                                        </div>
                                        
                                        <div className="mt-2 text-lg font-bold text-white uppercase mb-1">{item.name}</div>
                                        <div className="text-4xl font-display font-bold text-white mb-2">{formatDecimal(item.total)}€</div>
                                        
                                        {isWinner ? (
                                            <div className="text-green-400 font-bold text-sm bg-green-900/30 px-3 py-1 rounded-full border border-green-500/30 mb-4">¡Mejor Opción!</div>
                                        ) : (
                                            <div className="text-red-400 font-bold text-xs bg-red-900/20 px-3 py-1 rounded-full border border-red-500/30 mb-4">
                                                +{formatDecimal(diffPrev)}€ (+{formatDecimal(diffPrevPct, 1)}%) vs anterior
                                            </div>
                                        )}

                                        <div className="w-full h-px bg-white/10 mb-4"></div>

                                        <div className="w-full space-y-2 text-sm">
                                            <div className="flex justify-between">
                                                <span className="text-slate-400 font-bold">Precio Medio:</span>
                                                <span className="text-blue-300 font-mono font-bold">{formatDecimal(item.pricePerKwh, 4)} €/kWh</span>

      // --- DECODIFICADOR VIN AVANZADO V2 (CORREGIDO) ---
      const VinDecoder = () => {
        const [vinState, setVinState] = usePersistentState('userVin', { code: '' });
        const vin = vinState.code || ''; // Extraemos el valor limpio para usarlo
        
        const [result, setResult] = useState(null);

        const getSpecs = (model, trim, yearCode) => {
            let specs = { range: "?", accel: "?", top: "?", drive: "?", power: "?" };
            const year = yearCode === 'R' || yearCode === 'S' ? '2024+' : 'pre-2024';

            if (model === '3') {
                if (trim === 'RWD') {
                    specs = { range: year === '2024+' ? "513 km" : "491 km", accel: "6.1 s", top: "201 km/h", drive: "Trasera (RWD)", power: "~283 CV" };
                } else if (trim === 'LR') {
                    specs = { range: year === '2024+' ? "629 km" : "602 km", accel: "4.4 s", top: year === '2024+' ? "201 km/h" : "233 km/h", drive: "Total (AWD)", power: "~498 CV" };
                } else if (trim === 'PERF') {
                    specs = { range: "547 km", accel: "3.3 s", top: "261 km/h", drive: "Total (AWD)", power: "~534 CV" };
                }
            } else if (model === 'Y') {
                if (trim === 'RWD') {
                    specs = { range: "455 km", accel: "6.9 s", top: "217 km/h", drive: "Trasera (RWD)", power: "~299 CV" };
                } else if (trim === 'LR') {
                    specs = { range: "533 km", accel: "5.0 s", top: "217 km/h", drive: "Total (AWD)", power: "~514 CV" };
                } else if (trim === 'PERF') {
                    specs = { range: "514 km", accel: "3.7 s", top: "250 km/h", drive: "Total (AWD)", power: "~534 CV" };
                }
            }
            return specs;
        };

        const decodeVin = (inputVin) => {
            if (!inputVin || inputVin.length !== 17) {
                setResult({ error: "El VIN debe tener 17 caracteres." });
                return;
            }
            const v = inputVin.toUpperCase();
            
            const digit4 = v[3];
            let modelName = "Desconocido", modelCode = "";
            if(digit4 === '3') { modelName = "Model 3"; modelCode = '3'; }
            else if(digit4 === 'Y') { modelName = "Model Y"; modelCode = 'Y'; }
            else if(digit4 === 'S') { modelName = "Model S"; modelCode = 'S'; }
            else if(digit4 === 'X') { modelName = "Model X"; modelCode = 'X'; }

            const digit7 = v[6]; 
            let trimName = "Standard / RWD", trimCode = "RWD", batteryType = "Desconocida";

            if (digit7 === 'F' || digit7 === 'J' || digit7 === 'R') { // R añadido para Berlin BYD
                trimName = "RWD (Tracción Trasera)"; trimCode = "RWD";
                batteryType = "LFP (Litio Ferrofosfato) - Carga al 100%";
            } else if (digit7 === 'E' || digit7 === 'K') {
                const digit8 = v[7];
                if (digit8 === 'L' || digit8 === 'P') { trimName = "Performance"; trimCode = "PERF"; } 
                else { trimName = "Long Range"; trimCode = "LR"; }
                batteryType = "NMC/NCA (Níquel) - Carga al 80%";
            }

            const yearCode = v[9];
            const years = { 'L': 2020, 'M': 2021, 'N': 2022, 'P': 2023, 'R': 2024, 'S': 2025 };
            const modelYear = years[yearCode] || "Anterior a 2020";

            const factoryCode = v[10];
            let factory = "Desconocida";
            if(factoryCode === 'C' || v.startsWith('LRW')) factory = "Giga Shanghai (China) ⭐";
            else if(factoryCode === 'B' || v.startsWith('XP7')) factory = "Giga Berlin (Alemania) 🇪🇺";
            else if(factoryCode === 'F' || v.startsWith('5YJ')) factory = "Fremont (USA) 🇺🇸";

            const specs = getSpecs(modelCode, trimCode, yearCode);
            let hw = { cpu: "Intel Atom", uss: "Sensores ✅" };
            if (modelYear >= 2022) hw.cpu = "AMD Ryzen 🚀";
            if (modelYear >= 2023) hw.uss = "Tesla Vision (Cámaras) 📷";

            setResult({ model: modelName, trim: trimName, year: modelYear, factory, battery: batteryType, specs, hw });
        };

        const handleInput = (e) => {
            const val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 17);
            setVinState({ code: val });
        };

        return (
            <div className="space-y-8 animate-fade-in">
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                    <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                        <Icons.Search className="w-6 h-6 text-blue-400" /> Decodificador de VIN Pro
                    </h2>
                    
                    <div className="flex flex-col gap-4 mb-8">
                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                value={vin}
                                onChange={handleInput}
                                onFocus={(e) => scrollToSafeZone(e.target)}
                                placeholder="Ej: LRW3E7FS9NC..." 
                                className="flex-grow bg-zinc-800 border-2 border-slate-600 rounded-xl px-4 py-4 text-white font-mono font-bold text-xl tracking-widest focus:border-blue-500 outline-none uppercase"
                            />
                            <button onClick={() => decodeVin(vin)} className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 rounded-xl shadow-lg transition-all"><Icons.Settings className="w-6 h-6" /></button>
                        </div>
                        <div className="bg-blue-900/10 border border-blue-500/20 rounded-lg p-3 flex items-start gap-3">
                            <div className="bg-blue-500/20 p-2 rounded-full text-blue-400"><Icons.Smartphone className="w-5 h-5" /></div>
                            <div className="text-sm text-slate-400 font-bold leading-relaxed">Encuéntralo en la App de Tesla haciendo scroll hasta el final de la pantalla principal.</div>
                        </div>
                    </div>

                    {result && result.error && (
                        <div className="p-4 bg-red-900/20 border border-red-500/50 rounded-xl text-red-200 font-bold flex items-center gap-2 mb-6"><Icons.AlertTriangle className="w-5 h-5" /> {result.error}</div>
                    )}

                    {result && !result.error && (
                        <div className="animate-fade-in space-y-6">
                            <div className="bg-gradient-to-r from-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center text-center md:text-left gap-4">
                                <div>
                                    <div className="text-sm text-blue-400 font-bold uppercase tracking-widest mb-1">{result.year} | {result.factory}</div>
                                    <h3 className="text-4xl font-display font-bold text-white">{result.model} <span className="text-slate-400">{result.trim}</span></h3>
                                    <div className="text-sm text-slate-400 font-bold mt-2 flex items-center gap-2 justify-center md:justify-start">
                                        <span className="bg-slate-700 px-2 py-1 rounded text-white">{result.hw.cpu}</span>
                                        <span className="bg-slate-700 px-2 py-1 rounded text-white">{result.hw.uss}</span>
                                    </div>
                                </div>
                                <div className="text-5xl opacity-80">🚗</div>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-center">
                                    <div className="text-xs text-slate-500 font-bold uppercase mb-2">0-100 km/h</div>

                            <div className="bg-slate-900/50 border border-slate-700 rounded-xl p-6">
                                <h4 className="text-sm font-bold text-slate-300 uppercase mb-4 border-b border-slate-700 pb-2">Detalles Técnicos</h4>

                            <div className="bg-blue-900/20 border border-blue-500/30 rounded-xl p-4 mt-4">

      // --- SUB-COMPONENTE: ESCENA 3D DEL NEUMÁTICO (FIXED: CENTRADO Y RESIZE) ---
      const Tire3DScene = ({ currentBar, targetBar }) => {
        const mountRef = useRef(null);

        useEffect(() => {
            let frameId;
            let renderer;
            let scene, camera, group, tire, leftShoulder, rightShoulder, centerStrip;

            const initScene = () => {
                if (!mountRef.current) return;

                const width = mountRef.current.offsetWidth;
                const height = 400; 
                
                scene = new THREE.Scene();
                scene.background = null; // Transparente para fundirse con el fondo del div

                camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
                camera.position.set(0, 0, 35); // Acercamos un poco la cámara
                camera.lookAt(0, 0, 0); // FORZAMOS A MIRAR AL CENTRO

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                
                while (mountRef.current.firstChild) {
                    mountRef.current.removeChild(mountRef.current.firstChild);
                }
                mountRef.current.appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                dirLight.position.set(10, 20, 20);
                scene.add(dirLight);
                
                const rimLight = new THREE.PointLight(0x3b82f6, 3, 50); // Luz azul trasera
                rimLight.position.set(-15, 10, -10);
                scene.add(rimLight);

                group = new THREE.Group();

                const tireGeo = new THREE.TorusGeometry(10, 3.5, 40, 80); // Más polígonos para suavidad
                const tireMat = new THREE.MeshStandardMaterial({ 
                    color: 0x1f2937, 
                    roughness: 0.6, 
                    metalness: 0.2 
                });
                tire = new THREE.Mesh(tireGeo, tireMat);
                group.add(tire);

                const treadMat = new THREE.MeshBasicMaterial({ color: 0x22c55e }); 
                
                leftShoulder = new THREE.Mesh(new THREE.TorusGeometry(10, 0.25, 16, 80), treadMat.clone());
                leftShoulder.position.z = 2.8; // Ajustado al borde
                group.add(leftShoulder);

                rightShoulder = new THREE.Mesh(new THREE.TorusGeometry(10, 0.25, 16, 80), treadMat.clone());
                rightShoulder.position.z = -2.8;
                group.add(rightShoulder);

                centerStrip = new THREE.Mesh(new THREE.TorusGeometry(13.3, 0.15, 16, 80), treadMat.clone());
                group.add(centerStrip);

                const rimGeo = new THREE.CylinderGeometry(7.2, 7.2, 4, 64);
                const rimMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.4, metalness: 0.7 });
                const rim = new THREE.Mesh(rimGeo, rimMat);
                rim.rotation.x = Math.PI / 2;
                
                const capGeo = new THREE.CylinderGeometry(2, 2, 4.2, 32);
                const cap = new THREE.Mesh(capGeo, new THREE.MeshStandardMaterial({ color: 0x111827 }));
                cap.rotation.x = Math.PI / 2;
                group.add(cap);

                const spokeGeo = new THREE.BoxGeometry(13, 2, 0.5);
                const spoke1 = new THREE.Mesh(spokeGeo, rimMat);
                const spoke2 = new THREE.Mesh(spokeGeo, rimMat);
                spoke2.rotation.z = Math.PI / 2;
                rim.add(spoke1); rim.add(spoke2);

                group.add(rim);
                scene.add(group);

                mountRef.current.group3d = group;
                mountRef.current.mats = { l: leftShoulder.material, r: rightShoulder.material, c: centerStrip.material, centerObj: centerStrip };

                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    
                    if(group) {
                        group.rotation.y -= 0.03; // Girar hacia adelante
                        group.rotation.x = 0.3;   // Inclinar para ver banda de rodadura

                        const data = mountRef.current.userData || { current: 2.9, target: 2.9 };
                        const ratio = data.current / data.target;

                        const deform = Math.max(0.75, Math.min(1.08, ratio));
                        if (ratio < 0.96) { 
                            tire.scale.y = deform;
                            tire.scale.x = 1 + (1 - deform) * 0.15; 
                        } else {
                            tire.scale.set(1, 1, 1);
                        }

                        const cSafe = new THREE.Color(0x22c55e); 
                        const cWarn = new THREE.Color(0xeab308); 
                        const cDanger = new THREE.Color(0xef4444); 
                        const { l, r, c, centerObj } = mountRef.current.mats;

                        if (ratio < 0.85) { // Muy baja
                            l.color.lerp(cDanger, 0.1); r.color.lerp(cDanger, 0.1); c.color.lerp(cSafe, 0.1); centerObj.visible = false;
                        } else if (ratio < 0.96) { // Baja
                            l.color.lerp(cWarn, 0.1); r.color.lerp(cWarn, 0.1); c.color.lerp(cSafe, 0.1); centerObj.visible = true;
                        } else if (ratio > 1.15) { // Muy alta
                            l.color.lerp(cSafe, 0.1); r.color.lerp(cSafe, 0.1); c.color.lerp(cDanger, 0.1); centerObj.visible = true;
                            centerObj.scale.set(1.05, 1.05, 1.05);
                        } else { // OK
                            l.color.lerp(cSafe, 0.1); r.color.lerp(cSafe, 0.1); c.color.lerp(cSafe, 0.1); centerObj.visible = false;
                            centerObj.scale.set(1, 1, 1);
                        }
                    }
                    renderer.render(scene, camera);
                };
                animate();
            };

            if (window.THREE) { initScene(); } 
            else { /* Fallback si no carga global, aunque ya lo tienes */ }

            const handleResize = () => {
                if (!mountRef.current || !camera || !renderer) return;
                const newWidth = mountRef.current.offsetWidth;
                const newHeight = 400; // Mantener altura fija
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            };
            window.addEventListener('resize', handleResize);

            return () => {
                window.removeEventListener('resize', handleResize);
                cancelAnimationFrame(frameId);
                if(mountRef.current && renderer) mountRef.current.removeChild(renderer.domElement);
            };
        }, []); 

        useEffect(() => {
            if (mountRef.current) mountRef.current.userData = { current: currentBar, target: targetBar };
        }, [currentBar, targetBar]);

        return <div ref={mountRef} className="w-full h-[400px] cursor-grab active:cursor-grabbing touch-none" />;
      };

      const Manometer2D = ({ currentBar, targetBar }) => {
          const minScale = 1.8;
          const maxScale = 3.8;
          const getPct = (v) => ((v - minScale) / (maxScale - minScale)) * 100;
          const ticks = [];
          for (let i = minScale; i <= maxScale + 0.01; i += 0.2) ticks.push(i.toFixed(1));

          const p = targetBar;
          const zoneGradient = `linear-gradient(to top, 
            #ef4444 0%, #ef4444 ${getPct(p * 0.85)}%, 
            #3b82f6 ${getPct(p * 0.85)}%, #3b82f6 ${getPct(p * 0.95)}%, 
            #22c55e ${getPct(p * 0.95)}%, #22c55e ${getPct(p * 1.05)}%, 
            #3b82f6 ${getPct(p * 1.05)}%, #3b82f6 ${getPct(p * 1.15)}%, 
            #ef4444 ${getPct(p * 1.15)}%, #ef4444 100%)`;

          let barColor = "bg-green-500";
          if (currentBar < p * 0.85 || currentBar > p * 1.15) barColor = "bg-red-600";
          else if (currentBar < p * 0.96 || currentBar > p * 1.05) barColor = "bg-blue-500";

          return (
            <div className="h-[400px] w-full flex items-center justify-center p-4">
                <div className="h-full w-24 relative flex">
                    <div className="w-10 h-full relative border-r border-slate-600 mr-1">
                        {ticks.map(tick => {
                            const val = parseFloat(tick);
                            const isTarget = Math.abs(val - targetBar) < 0.09;
                            return (
                                <div key={tick} className="absolute right-0 w-full flex items-center justify-end pr-1" style={{bottom: `${getPct(val)}%`, transform: 'translateY(50%)'}}>
                                    <span className={`font-mono text-[10px] mr-1 ${isTarget ? 'text-yellow-400 font-bold' : 'text-slate-500'}`}>{tick}</span>
                                    <div className={`h-px ${isTarget ? 'bg-yellow-400 w-3' : 'bg-slate-600 w-1.5'}`}></div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex-1 h-full bg-slate-800 rounded-t-lg rounded-b-lg relative overflow-hidden border border-slate-700 shadow-inner">
                        <div className="absolute inset-0 opacity-20" style={{ background: zoneGradient }}></div>
                        <div className="absolute w-full border-t-2 border-dashed border-yellow-400 z-10 opacity-80" style={{bottom: `${getPct(targetBar)}%`}}></div>
                        <div className={`absolute bottom-0 w-full transition-all duration-700 ease-out shadow-[0_0_15px_rgba(0,0,0,0.5)] border-t border-white/30 ${barColor}`} style={{height: `${Math.min(100, Math.max(0, getPct(currentBar)))}%`}}>
                            <div className="absolute top-0 left-0 w-full h-4 bg-gradient-to-b from-white/40 to-transparent"></div>
                        </div>
                    </div>
                </div>
            </div>
          );
      };


      // --- LABORATORIO DE NEUMÁTICOS V10 (MEJORADO) ---
      const TirePressureLab = () => {
        const [state, setState] = usePersistentState('tireLabV10', {
            recPressure: 2.9, startPressure: 2.9, refTemp: 20, targetTemp: 5, highwayMode: false, gasType: 'air'
        });

        const BAR_TO_PSI = 14.5038;
        const HIGHWAY_TEMP_ADD = 25; 
        const REF_CONSUMPTION = 14.5; 

        const toPsi = (bar) => (bar * BAR_TO_PSI).toFixed(0);

        const adjust = (key, delta, min, max) => {
            setState(prev => {
                const newVal = parseFloat((prev[key] + delta).toFixed(1));
                if (newVal >= min && newVal <= max) return { ...prev, [key]: newVal };
                return prev;
            });
        };

        const handleChange = (k, v) => setState(prev => ({...prev, [k]: parseFloat(v)}));

        const t1Kelvin = state.refTemp + 273.15;
        const effectiveTargetTemp = state.targetTemp + (state.highwayMode ? HIGHWAY_TEMP_ADD : 0);
        const t2Kelvin = effectiveTargetTemp + 273.15;
        let resultPressureBar = state.startPressure * (t2Kelvin / t1Kelvin);

        if (state.gasType === 'air' && effectiveTargetTemp > state.refTemp) {
            resultPressureBar += (effectiveTargetTemp - state.refTemp) * 0.002; 
        }
        
        const p = state.recPressure;
        const val = resultPressureBar;
        let statusColor = "text-green-400";
        let wearText = "DESGASTE UNIFORME";
        let WearIcon = Icons.CheckCircle;

        if (val < p * 0.85) { statusColor = "text-red-500"; wearText = "CRÍTICO (HOMBROS)"; WearIcon = Icons.AlertTriangle; } 
        else if (val < p * 0.96) { statusColor = "text-blue-400"; wearText = "BAJA (BORDES)"; WearIcon = Icons.TrendingUp; } 
        else if (val > p * 1.05 && val < p * 1.15) { statusColor = "text-blue-400"; wearText = "ALTA (CENTRO)"; WearIcon = Icons.Activity; } 
        else if (val >= p * 1.15) { statusColor = "text-red-500"; wearText = "SOBREPRESIÓN"; WearIcon = Icons.AlertTriangle; }

        const pressureDiffPct = (resultPressureBar - state.recPressure) / state.recPressure;
        const extraConsumptionKwh = REF_CONSUMPTION * (pressureDiffPct * 100 * -0.3 / 100);
        const kmDiff = ((REF_CONSUMPTION / (REF_CONSUMPTION + extraConsumptionKwh)) * 100) - 100;

        const PrecisionSlider = ({ label, value, min, max, step, onChangeKey, unit, colorClass = "text-white", showPsi = false }) => (
            <div>
                <div className="flex justify-between mb-1 text-xs font-bold text-slate-300">
                    <span>{label}</span>

                        {value} {unit} {showPsi && <span className="text-slate-500 font-normal">({toPsi(value)} PSI)</span>}
