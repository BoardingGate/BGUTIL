      // --- CURVA DE CARGA (MODIFICADO LAYOUT & FUENTES) ---
      const ChargeCurveCalculator = () => {
        const [state, setState] = usePersistentState('curveState', { 
            batType: 'LFP', 
            capacity: 60, 
            startPct: 10, 
            endPct: 80, 
            costPerKwh: 0.45, 
            chargerPower: 150, 
            optimizationTime: 20,
            consumption: 15.0, 
            targetRange: 300
        });

        // CURVAS REALISTAS 2024
        const curvePoints = {
            // LFP (Model 3 RWD 60kWh):
            LFP: [
                {p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, 
                {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}
            ],
            // NCA (Model 3 LR/Perf 75-80kWh):
            NCA: [
                {p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, 
                {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}
            ]
        };

        // Presets de potencia solicitados
        const powerPresets = [3.3, 7.4, 11, 22, 50, 60, 100, 150, 170, 200, 250, 300, 400, 800];

        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const safeType = curvePoints[type] ? type : 'LFP';
            const points = curvePoints[safeType];

            const baseRef = safeType === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);

            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;

            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            const factor = p1.v + (ratio * (p2.v - p1.v));

            return factor * scaleFactor;
        };

        const calculateMetrics = (start, end) => {
            let minutes = 0;
            const kwhPerPercent = state.capacity / 100;
            const safeStart = Math.min(start, end - 1);
            const safeEnd = Math.max(end, start + 1);

            for (let i = safeStart; i < safeEnd; i++) {
                const batteryLimit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
                const realPower = Math.min(state.chargerPower, batteryLimit);
                if (realPower > 0) {
                    minutes += (kwhPerPercent / realPower) * 60;
                }
            }
            
            const totalEnergy = (safeEnd - safeStart) * kwhPerPercent;
            const rangeAdded = state.consumption > 0 ? (totalEnergy / state.consumption) * 100 : 0;
            const totalRange = state.consumption > 0 ? ((state.capacity * (safeEnd/100)) / state.consumption) * 100 : 0;

            return { minutes, rangeAdded, totalRange };
        };

        const handleChartChange = (key, value) => {
            const val = parseInt(value);
            const newStart = key === 'startPct' ? Math.min(val, state.endPct - 1) : state.startPct;
            const newEnd = key === 'endPct' ? Math.max(val, state.startPct + 1) : state.endPct;
            const metrics = calculateMetrics(newStart, newEnd);
            setState(prev => ({ ...prev, startPct: newStart, endPct: newEnd, optimizationTime: Math.round(metrics.minutes), targetRange: Math.round(metrics.totalRange) }));
        };

        const handleTimeOptimization = (minutes) => {
            const idealStart = 10; 
            let accumMinutes = 0;
            let foundEnd = idealStart;
            const kwhPerPercent = state.capacity / 100;
            for(let i = idealStart; i < 100; i++) {
                const limit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
                const realPower = Math.min(state.chargerPower, limit);
                if(realPower > 0) {
                    const minPerPct = (kwhPerPercent / realPower) * 60;
                    if (accumMinutes + minPerPct > minutes) break;
                    accumMinutes += minPerPct;
                    foundEnd = i + 1;
                }
            }
            const finalEnd = Math.min(100, foundEnd);
            const metrics = calculateMetrics(idealStart, finalEnd);
            setState(prev => ({ ...prev, startPct: idealStart, endPct: finalEnd, optimizationTime: minutes, targetRange: Math.round(metrics.totalRange) }));
        };

        const handleRangeOptimization = (km) => {
            let targetPct = (km * state.consumption) / state.capacity;
            targetPct = Math.ceil(targetPct);
            const safeEnd = Math.max(state.startPct + 1, Math.min(100, targetPct));
            const metrics = calculateMetrics(state.startPct, safeEnd);
            setState(prev => ({ ...prev, endPct: safeEnd, targetRange: km, optimizationTime: Math.round(metrics.minutes) }));
        };

        const sliderStyle = `
            .range-slider-input { pointer-events: none; -webkit-appearance: none; z-index: 10; }
            .range-slider-input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: white; border: 2px solid #3b82f6; cursor: pointer; position: relative; z-index: 20; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
            .range-slider-input::-moz-range-thumb { pointer-events: auto; width: 28px; height: 28px; border-radius: 50%; background: white; border: 2px solid #3b82f6; cursor: pointer; position: relative; z-index: 20; }
            #slider-start::-webkit-slider-thumb { border-color: #eab308; } 
            #slider-end::-webkit-slider-thumb { border-color: #22c55e; }
        `;

        const metrics = calculateMetrics(state.startPct, state.endPct);
        const totalCost = ((state.endPct - state.startPct) / 100 * state.capacity) * state.costPerKwh;
        const maxPossibleRange = state.consumption > 0 ? (state.capacity / state.consumption) * 100 : 0;
        const peakGraphHeight = Math.max(state.chargerPower, 250); 
        const gridLines = [];
        for(let p = 20; p < peakGraphHeight; p += 20) { gridLines.push(p); }
        const chartBars = [];
        for (let i = 0; i <= 100; i++) {
            const batteryLimit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
            const realPower = Math.min(state.chargerPower, batteryLimit);
            const active = i >= state.startPct && i < state.endPct;
            chartBars.push({ pct: i, power: realPower, active });
        }

        const handleChange = (k, v) => setState(prev => ({...prev, [k]: v}));
        const setLFP = () => setState(prev => ({...prev, batType: 'LFP', capacity: 60}));
        const setNCA = () => setState(prev => ({...prev, batType: 'NCA', capacity: 75}));

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <style>{sliderStyle}</style>
                <div className="lg:col-span-4 space-y-6">
                     <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6 shadow-xl">
                        <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.Activity /> Parámetros de Carga</h2>
                        <div className="space-y-6">
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={setLFP} className={`p-4 rounded-lg border font-bold transition-all text-sm ${state.batType === 'LFP' ? 'bg-green-600 border-green-500 text-white shadow-[0_0_15px_rgba(22,163,74,0.4)]' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>LFP </button>
                                <button onClick={setNCA} className={`p-4 rounded-lg border font-bold transition-all text-sm ${state.batType === 'NCA' ? 'bg-red-600 border-red-500 text-white shadow-[0_0_15px_rgba(220,38,38,0.4)]' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>NCA/NMC </button>
                            </div>
                            
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Capacidad Batería (kWh)</label><FormattedInput value={state.capacity} onChange={v => handleChange('capacity', v)} /></div>
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Consumo Medio (kWh/100km)</label><FormattedInput value={state.consumption} decimals={1} onChange={v => handleChange('consumption', v)} /></div>
                            
                            {/* PRECIO MOVIDO AQUÍ PARA RELLENAR HUECO */}
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Coste (€/kWh)</label><FormattedInput decimals={2} value={state.costPerKwh} onChange={v => handleChange('costPerKwh', v)} /></div>
                        </div>
                    </div>
                </div>

                <div className="lg:col-span-8 space-y-6">
                    {/* Tarjeta Gráfica AHORA AUTO HEIGHT */}
                    <div className="h-auto bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col relative shadow-2xl overflow-hidden">
                         
                         {/* CAJA DE ESTADÍSTICAS */}
                         <div className="flex justify-center gap-8 mb-4 bg-slate-800/40 rounded-xl p-4 border border-slate-700/50 backdrop-blur-sm z-20 relative">
                             <div className="text-center">
                                 <div className="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">+KM</div>
                                 <div className="text-3xl font-bold text-green-400">+{Math.round(metrics.rangeAdded)}</div>
                             </div>
                             <div className="w-px bg-slate-600 h-10 self-center"></div>
                             <div className="text-center">
                                 <div className="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">TOTAL</div>
                                 <div className="text-3xl font-bold text-white">{Math.round(metrics.totalRange)} <span className="text-sm text-slate-500 font-normal">km</span></div>
                             </div>
                             <div className="w-px bg-slate-600 h-10 self-center"></div>
                             <div className="text-center">
                                 <div className="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">TIEMPO</div>
                                 <div className="text-3xl font-bold text-white">{formatTime(metrics.minutes)}</div>
                             </div>
                             <div className="w-px bg-slate-600 h-10 self-center"></div>
                             <div className="text-center">
                                 <div className="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">COSTE</div>
                                 <div className="text-3xl font-bold text-blue-400">{formatDecimal(totalCost)}€</div>
                             </div>
                         </div>

                         {/* LÍNEA DE ETIQUETAS */}
                         <div className="flex items-center justify-center gap-4 mb-2 z-20 relative">
                             <div className="text-yellow-500 font-display font-bold text-xl px-2">INICIO {state.startPct}%</div>
                             <div className="text-slate-500 text-lg">➜</div>
                             <div className="text-white font-bold text-lg bg-white/10 px-3 py-1 rounded border border-white/20">+{state.endPct - state.startPct}%</div>
                             <div className="text-slate-500 text-lg">➜</div>
                             <div className="text-green-500 font-display font-bold text-xl px-2">FIN {state.endPct}%</div>
                         </div>
                         
                         {/* GRÁFICA (Altura fija para mantener proporción) */}
                         <div className="h-[300px] flex gap-2 relative pt-2 pb-2 border-b border-slate-700">
                             <div className="w-8 flex flex-col justify-end relative h-full">
                                {gridLines.map(p => (
                                    <div key={p} className="absolute w-full text-right" style={{bottom: `${(p / peakGraphHeight) * 100}%`, transform: 'translateY(50%)'}}>
                                        <span className="text-[10px] font-bold text-slate-400">{p}</span>
                                    </div>
                                ))}
                             </div>

                             <div className="flex-1 flex items-end gap-[1px] relative h-full">
                                <div className="absolute inset-0 flex flex-col justify-end pointer-events-none z-0">
                                    {gridLines.map(p => (
                                        <div key={p} className="absolute w-full border-t border-slate-700/50" style={{bottom: `${(p / peakGraphHeight) * 100}%`}}></div>
                                    ))}
                                </div>

                                {chartBars.map((bar) => (
                                    <div key={bar.pct} className="flex-1 flex flex-col justify-end group relative h-full z-10">
                                        <div

                                        ></div>

                                <div className="absolute top-0 bottom-0 w-0.5 border-l-2 border-dashed border-yellow-500 transition-all duration-75 pointer-events-none z-20" style={{left: `${state.startPct}%`}}></div>
                                <div className="absolute top-0 bottom-0 w-0.5 border-l-2 border-dashed border-green-500 transition-all duration-75 pointer-events-none z-20" style={{left: `${state.endPct}%`}}></div>
                            </div>
                         </div>

                         {/* SLIDER RANGO */}
                         <div className="relative h-14 mt-6 select-none ml-10">
                             <div className="absolute top-1/2 -translate-y-1/2 left-0 right-0 h-4 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                 <div className="absolute top-0 bottom-0 bg-gradient-to-r from-yellow-500 via-blue-500 to-green-500 opacity-80" style={{left: `${state.startPct}%`, right: `${100-state.endPct}%`}}></div>
                             </div>
                             
                             <input 
                                id="slider-start"
                                type="range" min="0" max="99" 
                                value={state.startPct} 
                                onChange={e => handleChartChange('startPct', e.target.value)} 
                                className="range-slider-input absolute inset-0 w-full opacity-0 sm:opacity-100 bg-transparent" 
                             />
                             <input 
                                id="slider-end"
                                type="range" min="1" max="100" 
                                value={state.endPct} 
                                onChange={e => handleChartChange('endPct', e.target.value)} 
                                className="range-slider-input absolute inset-0 w-full bg-transparent" 
                             />
                             
                             <div className="flex justify-between text-xs text-slate-400 font-bold mt-10 font-mono px-1">
                                <span>0%</span>
                                <span>20%</span>
                                <span>40%</span>
                                <span>60%</span>
                                <span>80%</span>
                                <span>100%</span>
                             </div>
                         </div>

                         {/* NUEVA SECCIÓN DE POTENCIA DEL CARGADOR */}
                         <div className="mt-8 pt-6 border-t border-slate-700/50">
                            <div className="flex justify-between mb-2">
                                <label className="text-sm font-bold text-slate-300 uppercase tracking-wider">Potencia Cargador</label>
                                <span className="text-lg font-bold text-blue-400 font-mono">{state.chargerPower} kW</span>
                            </div>
                            <input 
                                type="range" 
                                min="1" max="800" step="0.1" 
                                value={state.chargerPower} 
                                onChange={e => handleChange('chargerPower', parseFloat(e.target.value))} 
                                className="w-full h-4 bg-slate-700 rounded-lg cursor-pointer accent-blue-500" 
                            />
                            
                            {/* BOTONERA RÁPIDA DE POTENCIA */}
                            <div className="flex flex-wrap gap-2 mt-4 justify-between">
                                {powerPresets.map(p => (
                                    <button 
                                        key={p} 
                                        onClick={() => handleChange('chargerPower', p)}
                                        className={`px-3 py-1.5 text-xs font-bold rounded border transition-colors ${state.chargerPower === p ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                    >
                                        {p}
                                    </button>
                                ))}
                            </div>
                         </div>

                    </div>

                    {/* OPTIMIZADORES */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Slider Tiempo */}
                        <div className="bg-purple-900/20 p-6 rounded-xl border border-purple-500/30 shadow-lg">
                            <div className="flex justify-between mb-4">
                                <label className="text-base text-purple-300 font-bold flex items-center gap-2"><Icons.Clock className="w-5 h-5"/> Optimizar Tiempo</label>
                                <span className="text-base font-bold text-white bg-purple-500/20 px-3 py-1 rounded">{state.optimizationTime} min</span>
                            </div>
                            <input type="range" min="1" max="120" step="1" 
                                value={state.optimizationTime} 
                                onChange={e => handleTimeOptimization(parseInt(e.target.value))} 
                                className="w-full h-4 bg-slate-700 rounded-lg cursor-pointer accent-purple-500" />
                            <div className="text-sm font-bold text-slate-400 mt-2 italic">Desliza para ver la mejor carga posible en este tiempo.</div>
                        </div>

                        {/* Slider Autonomía */}
                        <div className="bg-cyan-900/20 p-6 rounded-xl border border-cyan-500/30 shadow-lg">
                            <div className="flex justify-between mb-4">
                                <label className="text-base text-cyan-300 font-bold flex items-center gap-2"><Icons.TrendingUp className="w-5 h-5"/> Autonomía Deseada</label>
                                <span className="text-base font-bold text-white bg-cyan-500/20 px-3 py-1 rounded">{Math.round(state.targetRange)} km</span>
                            </div>
                            <input type="range" min="50" max={maxPossibleRange} step="5" 
                                value={Math.min(Math.max(50, state.targetRange), maxPossibleRange)} 
                                onChange={e => handleRangeOptimization(parseInt(e.target.value))} 
                                className="w-full h-4 bg-slate-700 rounded-lg cursor-pointer accent-cyan-500" />

                        </div>
                    </div>

                </div>
            </div>
        );
      };
            
     
      // --- EQUIVALENCE CALCULATOR (LETRAS MÁS GRANDES) ---
      const EquivalenceCalculator = () => {
        const [staticParams, setStaticParams] = usePersistentState('equivStatic', {
            capacity: 60, 
            consumption: 14.5, 
            price: 0.45,
            batType: 'LFP'
        });

        const [power, setPower] = usePersistentState('equivPower', 7.4);

        const powerPresets = [3.3, 4, 4.5, 6, 7.4, 11, 22, 40, 50, 60, 80, 100, 120, 140, 150, 170, 200, 250, 300, 400, 500, 800];
        const curvePoints = {
            LFP: [{p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}],
            NCA: [{p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}]
        };

        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const safeType = curvePoints[type] ? type : 'LFP';
            const points = curvePoints[safeType];
            const baseRef = safeType === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);
            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;
            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            return (p1.v + (ratio * (p2.v - p1.v))) * scaleFactor;
        };

        const voltage = power < 11 ? 230 : 400;
        const amps = (power * 1000) / voltage;
        
        const kwPerMinLin = power / 60;
        const kmPerMinLin = kwPerMinLin / (staticParams.consumption / 100);
        const timeToFullMinLin = power > 0 ? (staticParams.capacity / power) * 60 : 0;
        
        let totalMinutesCurve = 0;
        const kwhPerPercent = staticParams.capacity / 100;
        for(let i=0; i<100; i++) {
            const limit = getBatteryLimitAtSoC(i, staticParams.batType, power);
            const realPower = Math.min(power, limit);
            if(realPower > 0) {
                totalMinutesCurve += (kwhPerPercent / realPower) * 60;
            }
        }
        
        const avgPowerCurve = totalMinutesCurve > 0 ? staticParams.capacity / (totalMinutesCurve/60) : 0;
        const kwPerMinCurve = avgPowerCurve / 60;
        const kmPerMinCurve = kwPerMinCurve / (staticParams.consumption / 100);
        const costPerMin = kwPerMinCurve * staticParams.price; 

        return (
            <div className="space-y-8 animate-fade-in">
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                    <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                        <Icons.Link /> Calculadora de Equivalencias
                    </h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 pb-8 border-b border-slate-800 items-end">
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                            <label className="text-sm font-bold text-slate-400 block mb-2 uppercase">Tipo Batería</label>
                            <div className="flex gap-2">
                                <button onClick={() => setStaticParams({...staticParams, batType:'LFP'})} className={`flex-1 py-3 text-sm font-bold rounded ${staticParams.batType==='LFP' ? 'bg-green-600 text-white' : 'bg-slate-700 text-slate-400'}`}>LFP</button>
                                <button onClick={() => setStaticParams({...staticParams, batType:'NCA'})} className={`flex-1 py-3 text-sm font-bold rounded ${staticParams.batType==='NCA' ? 'bg-red-600 text-white' : 'bg-slate-700 text-slate-400'}`}>NCA/NMC</button>
                            </div>
                        </div>
                        <EquivSlider label="Capacidad Batería" value={staticParams.capacity} min="30" max="300" step="1" unit="kWh" onChange={v => setStaticParams({...staticParams, capacity: v})} digits={0} isMaster={true} showButtons={true} />
                        <EquivSlider label="Consumo Medio" value={staticParams.consumption} min="1" max="60" step="0.1" unit="kWh/100" onChange={v => setStaticParams({...staticParams, consumption: v})} digits={1} isMaster={true} showButtons={true} />
                        <EquivSlider label="Precio Energía" value={staticParams.price} min="0" max="2" step="0.01" unit="€/kWh" onChange={v => setStaticParams({...staticParams, price: v})} digits={2} isMaster={true} showButtons={true} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="md:col-span-2 space-y-4">
                            <EquivSlider label="POTENCIA CARGA (A CALCULAR)" value={power} min="1" max="800" step="0.01" unit="kW" onChange={v => setPower(Math.max(0, parseFloat(v)))} highlight digits={2} isMaster={true} showButtons={true} />
                            <div className="flex flex-wrap gap-2 justify-center bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                {powerPresets.map(p => (
                                    <button key={p} onClick={() => setPower(p)} className={`btn-preset ${Math.abs(power - p) < 0.1 ? 'bg-blue-600 text-white border-blue-500 shadow-[0_0_10px_rgba(37,99,235,0.5)]' : ''}`}> {p} </button>
                                ))}
                            </div>
                        </div>

                        <EquivSlider 
                            label={`Amperaje (${voltage}V)`} value={amps} min="0" max="2000" step="1" unit="A" highlight digits={0} readOnly={true} />
                        
                        <EquivSlider 
                            label="" 
                            value={timeToFullMinLin} min="0" max={1440} step="1" 
                            readOnly={true} 
                            dualData={<DualDisplay label="Tiempo 0-100%" linearVal={timeToFullMinLin} curveVal={totalMinutesCurve} isTime={true} />}
                        />
                        
                        <EquivSlider 
                            label="" 
                            value={kmPerMinLin} min="0" max="50" step="0.1" 
                            readOnly={true}
                            dualData={<DualDisplay label="Velocidad (Km)" linearVal={kmPerMinLin} curveVal={kmPerMinCurve} unit="km/min" digits={1} />}
                        />

                        <EquivSlider 
                            label="" 
                            value={kwPerMinLin} min="0" max="50" step="0.1" 
                            readOnly={true}
                            dualData={<DualDisplay label="Velocidad (Energía)" linearVal={kwPerMinLin} curveVal={kwPerMinCurve} unit="kW/min" digits={1} />}
                        />
                        
                        <div className="md:col-span-2">
                             <EquivSlider label="Importe Medio Carga" value={costPerMin} min="0" max="30" step="0.01" unit="€/min" digits={2} readOnly={true} highlight />
                        </div>
                    </div>

                    <div className="mt-8 p-6 bg-blue-900/20 border border-blue-500/30 rounded-xl flex items-start gap-3">
                        <div className="mt-1 text-blue-400"><Icons.Activity /></div>
                        <div>
                            <h4 className="text-base font-bold text-blue-300 mb-2">Modo Interactivo</h4>
                            <p className="text-sm font-bold text-slate-400 leading-relaxed">
                                <strong>Teórico (Lineal):</strong> Valores ideales si la carga fuera constante al 100% de potencia.<br/>
                                <strong>Real (Curva):</strong> Valores promedio simulando una sesión completa 0-100% aplicando la curva física de la batería seleccionada.<br/>
                                Solo el control de Potencia es deslizable para garantizar la precisión.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        );
      };

      // --- EXTERNALIZED COMPONENTS FOR STABILITY ---
      const DualDisplay = ({ label, linearVal, curveVal, unit, digits=2, isTime=false }) => (
            <div className="flex justify-between items-center text-sm font-bold">
                <span className="text-slate-300 uppercase">{label}</span>
                <div className="text-right">
                    <div className="text-white font-mono text-lg">
                        {isTime ? formatTime(linearVal) : formatDecimal(linearVal, digits)} 
                        {!isTime && <span className="text-xs text-slate-400">{unit} (Teórico)</span>}
                        {isTime && <span className="text-xs text-slate-400"> (Teórico)</span>}
                    </div>
                    <div className="text-orange-400 font-mono text-lg">
                        {isTime ? formatTime(curveVal) : formatDecimal(curveVal, digits)} 
                        {!isTime && <span className="text-xs text-orange-500/70">{unit} (Real)</span>}
                        {isTime && <span className="text-xs text-orange-500/70"> (Real)</span>}
                    </div>
                </div>
            </div>
        );

        const EquivSlider = ({ label, value, min, max, step, onChange, unit, highlight, digits=2, isMaster=false, showButtons=false, readOnly=false, dualData }) => {
            const handleStep = (direction) => {
                const newVal = parseFloat(value) + (step * direction);
                onChange(Math.min(max, Math.max(min, newVal)));
            };
            
            return (
                <div className={`bg-slate-900/50 border ${highlight ? 'border-blue-500/50 bg-blue-900/10' : 'border-slate-800'} rounded-xl p-4 transition-colors`}>
                    <div className="flex justify-between mb-3">
                        <label className={`text-sm font-bold uppercase tracking-wider ${highlight ? 'text-blue-300' : 'text-slate-300'}`}>{label}</label>
                        {!dualData && <span className={`font-mono font-bold text-lg ${highlight ? 'text-white' : 'text-slate-200'}`}>{formatDecimal(value, digits)} <span className="text-sm text-slate-400">{unit}</span></span>}
                    </div>
                    
                    {dualData && <div className="mb-4 space-y-2">{dualData}</div>}

                    <div className="flex items-center gap-4">
                        {showButtons && <button onClick={() => handleStep(-1)} className="btn-step">-</button>}
                        <input 
                            type="range" 
                            min={min} max={max} step={step} 
                            value={value || 0} 
                            onChange={(e) => !readOnly && onChange && onChange(e.target.value)}
                            className={`flex-grow h-4 rounded-lg appearance-none ${readOnly ? 'slider-readonly pointer-events-none bg-slate-800' : 'cursor-pointer slider-thumb'} ${!readOnly && highlight ? 'bg-blue-900' : 'bg-slate-700'} ${readOnly ? 'h-2' : ''}`}
                            disabled={readOnly}
                        />
                        {readOnly && <div className="flex-grow h-2 bg-slate-800 rounded-full overflow-hidden relative"><div className="absolute top-0 left-0 h-full bg-blue-500/50 transition-all duration-300" style={{width: `${Math.min(100, (value/max)*100)}%`}}></div></div>}
                        {showButtons && <button onClick={() => handleStep(1)} className="btn-step">+</button>}
                    </div>
                </div>
            );
        };


      // --- PROPOSAL COLUMN (CORREGIDO: kWh bajo etiquetas y texto % ajustado) ---
      const ProposalColumn = ({ propKey, title, data, powerData, consData, onChange }) => {
            // Protección contra undefined
            const p1Pot = powerData?.p1 || 0;
            const p2Pot = powerData?.p2 || 0;

            // Datos de Consumo
            const { p1Kwh, p2Kwh, p3Kwh, p3VeKwh, p4Kwh, totalKwh } = consData;

            // -- CÁLCULOS POTENCIA --
            const calcP1Annual = data.pricePotP1 * 365 * p1Pot;
            const calcP1KwYear = data.pricePotP1 * 365;
            
            const calcP2Annual = data.pricePotP2 * 365 * p2Pot;
            const calcP2KwYear = data.pricePotP2 * 365;
            
            const savingsPct = data.pricePotP1 > 0 ? ((data.pricePotP1 - data.pricePotP2) / data.pricePotP1) * 100 : 0;

            // -- CÁLCULOS ENERGÍA (Importes por tramo) --
            const costP1 = p1Kwh * data.priceEnP1;
            const costP2 = p2Kwh * data.priceEnP2;
            const costP3 = p3Kwh * data.priceEnP3;
            const costP3Ve = p3VeKwh * data.priceEnP3Ve;
            const costP4 = p4Kwh * data.priceEnP4;

            // Helper para porcentajes visuales
            const getPct = (val) => totalKwh > 0 ? (val / totalKwh) * 100 : 0;

            return (
                <div className="bg-slate-900/40 p-5 rounded-xl border border-slate-700/50 h-full">
                    <input type="text" value={data.name} onChange={(e) => onChange(propKey, 'name', e.target.value)} 
                        className="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-3 text-yellow-300 font-bold text-center mb-4 focus:outline-none focus:border-yellow-500 text-lg placeholder-zinc-500 transition-colors" />
                    
                    {/* SECCIÓN POTENCIA */}
                    <h4 className="text-xs uppercase font-bold text-slate-300 mb-2 border-b border-slate-700/50 pb-1">Potencia (€/kW/día)</h4>
                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <div>
                            <label className="text-[10px] font-bold text-slate-400 block">P1</label>
                            <FormattedInput value={data.pricePotP1} onChange={v => onChange(propKey, 'pricePotP1', v)} decimals={6}/>
                            <div className="mt-1 text-[10px] font-mono leading-tight">
                                <div className="text-yellow-400 font-bold">{formatDecimal(calcP1Annual, 0)} €/año</div>
                                <div className="text-slate-500">({formatDecimal(calcP1KwYear, 2)} €/kW)</div>
                            </div>
                        </div>

                        <div>
                            <label className="text-[10px] font-bold text-slate-400 block">P2</label>
                            <FormattedInput value={data.pricePotP2} onChange={v => onChange(propKey, 'pricePotP2', v)} decimals={6}/>
                            <div className="mt-1 text-[10px] font-mono leading-tight">
                                <div className="text-yellow-400 font-bold">{formatDecimal(calcP2Annual, 0)} €/año</div>
                                <div className="text-slate-500">({formatDecimal(calcP2KwYear, 2)} €/kW)</div>
                                {savingsPct > 0 && (
                                    <div className="text-green-400 font-bold mt-0.5">-{formatDecimal(savingsPct, 0)}% vs P1</div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* SECCIÓN ENERGÍA */}
                    <h4 className="text-xs uppercase font-bold text-slate-300 mb-2 border-b border-slate-700/50 pb-1">Energía (€/kWh)</h4>
                    <div className="space-y-3 mb-6">
                        {/* P1 */}
                        <div className="grid grid-cols-12 gap-2 items-center">
                            <div className="col-span-2 flex flex-col leading-tight">
                                <span className="text-xs text-red-400 font-bold">P1</span>
                                <span className="text-[9px] text-slate-500 font-mono">{formatDecimal(p1Kwh, 0)}</span>
                            </div>
                            <div className="col-span-6"><FormattedInput value={data.priceEnP1} onChange={v => onChange(propKey, 'priceEnP1', v)} decimals={6}/></div>
                            <div className="col-span-4 text-right flex flex-col justify-center">
                                <span className="text-xs font-bold text-slate-200">{formatDecimal(costP1, 1)}€</span>
                                <span className="text-[9px] font-bold text-slate-500">{formatDecimal(getPct(p1Kwh), 0)}% kWh</span>
                            </div>
                        </div>
                        {/* P2 */}
                        <div className="grid grid-cols-12 gap-2 items-center">
                            <div className="col-span-2 flex flex-col leading-tight">
                                <span className="text-xs text-orange-400 font-bold">P2</span>
                                <span className="text-[9px] text-slate-500 font-mono">{formatDecimal(p2Kwh, 0)}</span>
                            </div>
                            <div className="col-span-6"><FormattedInput value={data.priceEnP2} onChange={v => onChange(propKey, 'priceEnP2', v)} decimals={6}/></div>
                            <div className="col-span-4 text-right flex flex-col justify-center">
                                <span className="text-xs font-bold text-slate-200">{formatDecimal(costP2, 1)}€</span>
                                <span className="text-[9px] font-bold text-slate-500">{formatDecimal(getPct(p2Kwh), 0)}% kWh</span>
                            </div>
                        </div>
                        {/* P3 */}
                        <div className="grid grid-cols-12 gap-2 items-center">
                            <div className="col-span-2 flex flex-col leading-tight">
                                <span className="text-xs text-green-400 font-bold">P3</span>
                                <span className="text-[9px] text-slate-500 font-mono">{formatDecimal(p3Kwh, 0)}</span>
                            </div>
                            <div className="col-span-6"><FormattedInput value={data.priceEnP3} onChange={v => onChange(propKey, 'priceEnP3', v)} decimals={6}/></div>
                            <div className="col-span-4 text-right flex flex-col justify-center">
                                <span className="text-xs font-bold text-slate-200">{formatDecimal(costP3, 1)}€</span>
                                <span className="text-[9px] font-bold text-slate-500">{formatDecimal(getPct(p3Kwh), 0)}% kWh</span>
                            </div>
                        </div>
                        {/* P3 VE */}
                        <div className="grid grid-cols-12 gap-2 items-center">
                            <div className="col-span-2 flex flex-col leading-tight">
                                <span className="text-xs text-blue-400 font-bold">VE</span>
                                <span className="text-[9px] text-slate-500 font-mono">{formatDecimal(p3VeKwh, 0)}</span>
                            </div>
                            <div className="col-span-6"><FormattedInput value={data.priceEnP3Ve} onChange={v => onChange(propKey, 'priceEnP3Ve', v)} decimals={6}/></div>
                            <div className="col-span-4 text-right flex flex-col justify-center">
                                <span className="text-xs font-bold text-slate-200">{formatDecimal(costP3Ve, 1)}€</span>
                                <span className="text-[9px] font-bold text-slate-500">{formatDecimal(getPct(p3VeKwh), 0)}% kWh</span>
                            </div>
                        </div>
                        {/* P4 */}
                        <div className="grid grid-cols-12 gap-2 items-center">
                            <div className="col-span-2 flex flex-col leading-tight">
                                <span className="text-xs text-purple-400 font-bold">P4</span>
                                <span className="text-[9px] text-slate-500 font-mono">{formatDecimal(p4Kwh, 0)}</span>
                            </div>
                            <div className="col-span-6"><FormattedInput value={data.priceEnP4} onChange={v => onChange(propKey, 'priceEnP4', v)} decimals={6}/></div>
                            <div className="col-span-4 text-right flex flex-col justify-center">
                                <span className="text-xs font-bold text-slate-200">{formatDecimal(costP4, 1)}€</span>
                                <span className="text-[9px] font-bold text-slate-500">{formatDecimal(getPct(p4Kwh), 0)}% kWh</span>
                            </div>
                        </div>
                    </div>

                    <h4 className="text-xs uppercase font-bold text-slate-300 mb-2 border-b border-slate-700/50 pb-1">Descuentos y Extras</h4>
                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <div><label className="text-[10px] font-bold text-slate-400 block">% Dto Pot</label><FormattedInput value={data.discPot} onChange={v => onChange(propKey, 'discPot', v)} decimals={1}/></div>
                        <div><label className="text-[10px] font-bold text-slate-400 block">% Dto Ener</label><FormattedInput value={data.discEn} onChange={v => onChange(propKey, 'discEn', v)} decimals={1}/></div>
                        <div className="col-span-2"><label className="text-[10px] font-bold text-slate-400 block">Comisión Mensual (€)</label><FormattedInput value={data.comision} onChange={v => onChange(propKey, 'comision', v)} decimals={2}/></div>
                    </div>

                    <h4 className="text-xs uppercase font-bold text-yellow-600 mb-2 border-b border-yellow-600/30 pb-1">Solar / Excedentes</h4>
                    <div className="grid grid-cols-2 gap-3 items-end">
                        <div><label className="text-[10px] font-bold text-slate-400 block">Precio (€/kWh)</label><FormattedInput value={data.solarPrice} onChange={v => onChange(propKey, 'solarPrice', v)} decimals={3}/></div>
                        <button 
                            onClick={() => onChange(propKey, 'virtualBat', !data.virtualBat)} 
                            className={`text-xs font-bold py-3 px-1 border rounded transition-colors h-[54px] ${data.virtualBat ? 'bg-blue-900 border-blue-500 text-blue-100' : 'bg-slate-800 border-slate-600 text-slate-400'}`}
                        >
                            {data.virtualBat ? 'Bat. Virtual ON' : 'Bat. Virtual OFF'}
                        </button>
                    </div>
                </div>
            );
      };

      // --- TARIFF COMPARATOR ---
      const TariffComparator = () => {
        const [tState, setTState] = usePersistentState('tariffCompV5', {
            // Shared Data
            days: 30,
            potP1: 4.6, potP2: 7.4,
            impuestoElec: 5.11, iva: 21,
            alquiler: 0.027, bonoSocial: 0.006,
            
            // Shared Consumption
            consTotal: 635,
            p1Kwh: 80, p2Kwh: 60, p3Kwh: 170, p3VeKwh: 325, p4Kwh: 0,
            solarExp: 0, // Shared volume

            // Proposal A
            propA: {
                name: "Compañía A",
                pricePotP1: 0.108, pricePotP2: 0.024,
                priceEnP1: 0.206, priceEnP2: 0.206, priceEnP3: 0.065, priceEnP3Ve: 0.065, priceEnP4: 0.065,
                discPot: 0, discEn: 0, comision: 0,
                solarPrice: 0.08, virtualBat: false
            },

            // Proposal B
            propB: {
                name: "Compañía B",
                pricePotP1: 0.11, pricePotP2: 0.03,
                priceEnP1: 0.15, priceEnP2: 0.15, priceEnP3: 0.15, priceEnP3Ve: 0.15, priceEnP4: 0.15,
                discPot: 0, discEn: 0, comision: 0,
                solarPrice: 0.05, virtualBat: false
            }
        });

        // Estado para la fecha de guardado de la copia manual
        const [savedDate, setSavedDate] = useState(null);

        // Cargar fecha de guardado al montar el componente
        useEffect(() => {
            try {
                const date = localStorage.getItem('tariffCompSnapshotTime');
                if(date) setSavedDate(date);
            } catch (e) { console.error(e); }
        }, []);

        // --- LÓGICA DE SNAPSHOT ---
        const handleSaveSnapshot = () => {
            try {
                const now = new Date().toLocaleString('es-ES');
                localStorage.setItem('tariffCompSnapshot', JSON.stringify(tState));
                localStorage.setItem('tariffCompSnapshotTime', now);
                setSavedDate(now);
                // Feedback visual simple (opcional, por ahora solo actualiza la fecha)
            } catch (error) {
                console.error("Error guardando snapshot", error);
                alert("No se pudo guardar la copia (espacio insuficiente o error local).");
            }
        };

        const handleRestoreSnapshot = () => {
            try {
                const data = localStorage.getItem('tariffCompSnapshot');
                if (data) {
                    const parsed = JSON.parse(data);
                        setTState(parsed);
                } else {
                    alert("No hay ninguna copia guardada previamente.");
                }
            } catch (error) {
                console.error("Error restaurando snapshot", error);
                alert("Error al intentar restaurar los datos.");
            }
        };

        // Handler for shared consumption updates
        const handleConsChange = (key, val) => {
            if (key === 'consTotal') {
                 // Redistribute based on current ratios
                 const currentTotal = tState.p1Kwh + tState.p2Kwh + tState.p3Kwh + tState.p3VeKwh + tState.p4Kwh || 1;
                 const ratio1 = tState.p1Kwh / currentTotal;
                 const ratio2 = tState.p2Kwh / currentTotal;
                 const ratio3 = tState.p3Kwh / currentTotal;
                 const ratio3ve = tState.p3VeKwh / currentTotal;
                 const ratio4 = tState.p4Kwh / currentTotal;

                 setTState(prev => ({
                     ...prev,
                     consTotal: val,
                     p1Kwh: val * ratio1,
                     p2Kwh: val * ratio2,
                     p3Kwh: val * ratio3,
                     p3VeKwh: val * ratio3ve,
                     p4Kwh: val * ratio4
                 }));
            } else {
                // Update specific bucket and sum total
                setTState(prev => {
                    const newState = { ...prev, [key]: val };
                    newState.consTotal = newState.p1Kwh + newState.p2Kwh + newState.p3Kwh + newState.p3VeKwh + newState.p4Kwh;
                    return newState;
                });
            }
        };

        const handlePropChange = (propKey, field, val) => {
            setTState(prev => ({
                ...prev,
                [propKey]: { ...prev[propKey], [field]: val }
            }));
        };

        const calculateBill = (proposal) => {
            const termPotRaw = (tState.potP1 * proposal.pricePotP1 * tState.days) + (tState.potP2 * proposal.pricePotP2 * tState.days);
            const termPotDisc = termPotRaw * (1 - proposal.discPot / 100);

            const termEnRaw = (tState.p1Kwh * proposal.priceEnP1) + 
                              (tState.p2Kwh * proposal.priceEnP2) + 
                              (tState.p3Kwh * proposal.priceEnP3) + 
                              (tState.p3VeKwh * proposal.priceEnP3Ve) + 
                              (tState.p4Kwh * proposal.priceEnP4);
            
            const termEnDisc = termEnRaw * (1 - proposal.discEn / 100);
            const solarReturn = tState.solarExp * proposal.solarPrice;
            
            let termEnNet = termEnDisc - solarReturn;
            if(!proposal.virtualBat) termEnNet = Math.max(0, termEnNet);

            const fixedCosts = (tState.alquiler * tState.days) + (tState.bonoSocial * tState.days) + proposal.comision;
            
            const baseImp = termPotDisc + termEnNet;
            const withIEE = baseImp * (1 + tState.impuestoElec / 100);
            const beforeIVA = withIEE + fixedCosts;
            const total = beforeIVA * (1 + tState.iva / 100);
            
            const pricePerKwh = tState.consTotal > 0 ? total / tState.consTotal : 0;

            return { total, termPotDisc, termEnNet, fixedCosts, taxes: total - (termPotDisc + termEnNet + fixedCosts), pricePerKwh, solarReturn };
        };

        const calculateEVCost = (proposal) => {
            const totalP3Volume = (tState.p3Kwh || 0) + (tState.p3VeKwh || 0);
            const evRatio = totalP3Volume > 0 ? ((tState.p3VeKwh || 0) / totalP3Volume) : 0;
            const fullTermPotP2 = (tState.potP2 * proposal.pricePotP2 * tState.days) * (1 - proposal.discPot / 100);
            const evTermPotP2 = fullTermPotP2 * evRatio;
            const termEnP3Ve = (tState.p3VeKwh * proposal.priceEnP3Ve) * (1 - proposal.discEn / 100);
            const base = evTermPotP2 + termEnP3Ve;
            const withIEE = base * (1 + tState.impuestoElec / 100);
            const total = withIEE * (1 + tState.iva / 100);
            const pricePerKwh = tState.p3VeKwh > 0 ? total / tState.p3VeKwh : 0;
            return { total, pricePerKwh };
        };

        const billA = calculateBill(tState.propA);
        const billB = calculateBill(tState.propB);
        const evCostA = calculateEVCost(tState.propA);
        const evCostB = calculateEVCost(tState.propB);

        const diff = billB.total - billA.total;
        const diffPercent = Math.min(billA.total, billB.total) > 0 ? (Math.abs(diff) / Math.max(billA.total, billB.total)) * 100 : 0;
        
        const diffPot = billB.termPotDisc - billA.termPotDisc;
        const diffPotPct = Math.min(billA.termPotDisc, billB.termPotDisc) > 0 ? (Math.abs(diffPot) / Math.max(billA.termPotDisc, billB.termPotDisc)) * 100 : 0;
        
        const diffEn = billB.termEnNet - billA.termEnNet;
        const diffEnPct = Math.min(billA.termEnNet, billB.termEnNet) > 0 ? (Math.abs(diffEn) / Math.max(billA.termEnNet, billB.termEnNet)) * 100 : 0;
        const winnerEVCost = diff > 0 ? evCostA : evCostB;

        // Helper para mostrar % en inputs
        const getConsPct = (val) => tState.consTotal > 0 ? (val / tState.consTotal) * 100 : 0;

        // Objeto con datos de consumo para pasar a las columnas
        const consumptionData = {
            p1Kwh: tState.p1Kwh,
            p2Kwh: tState.p2Kwh,
            p3Kwh: tState.p3Kwh,
            p3VeKwh: tState.p3VeKwh,
            p4Kwh: tState.p4Kwh,
            totalKwh: tState.consTotal
        };

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
                
                {/* CONFIGURACIÓN SUPERIOR (DATOS COMUNES) */}
                <div className="lg:col-span-12 space-y-4">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-5">
                        <div className="flex items-center gap-2 mb-4 border-b border-slate-700 pb-2">
                             <Icons.Euro className="w-5 h-5 text-slate-400" />
                             <h3 className="text-sm text-slate-300 font-bold uppercase">DATOS COMUNES</h3>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4">
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 block mb-1">Días Factura</label>
                                <FormattedInput value={tState.days} onChange={v => setTState({...tState, days: v})} decimals={0}/>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 block mb-1">Pot P1 (kW)</label>
                                <FormattedInput value={tState.potP1} onChange={v => setTState({...tState, potP1: v})} decimals={1}/>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 block mb-1">Pot P2 (kW)</label>
                                <FormattedInput value={tState.potP2} onChange={v => setTState({...tState, potP2: v})} decimals={1}/>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 block mb-1">IVA (%)</label>
                                <FormattedInput value={tState.iva} onChange={v => setTState({...tState, iva: v})} decimals={0}/>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 block mb-1">Imp. Elec (%)</label>
                                <FormattedInput value={tState.impuestoElec} onChange={v => setTState({...tState, impuestoElec: v})} decimals={2}/>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 block mb-1">Alquiler/día</label>
                                <FormattedInput value={tState.alquiler} onChange={v => setTState({...tState, alquiler: v})} decimals={4}/>
                            </div>
                            <div className="col-span-2 sm:col-span-1">
                                <label className="text-[10px] font-bold text-slate-400 block mb-1">Bono Soc/día</label>
                                <FormattedInput value={tState.bonoSocial} onChange={v => setTState({...tState, bonoSocial: v})} decimals={4}/>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                        <div className="flex justify-between items-center mb-4">
                             <h3 className="text-sm text-slate-300 font-bold uppercase flex gap-2"><Icons.Activity className="w-4 h-4"/> Patrón de Consumo (kWh)</h3>
                             <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2"><span className="text-xs font-bold text-yellow-500">Excedentes:</span><div className="w-24"><FormattedInput value={tState.solarExp} onChange={v => setTState({...tState, solarExp: v})} decimals={0}/></div></div>
                                <div className="flex items-center gap-2"><span className="text-xs font-bold text-slate-300">Total:</span><span className="text-base font-bold text-white bg-slate-800 px-3 py-2 rounded border border-slate-700">{formatDecimal(tState.consTotal, 0)}</span></div>
                             </div>
                        </div>
                        <div className="grid grid-cols-5 gap-4">
                            <div className="bg-red-900/20 p-3 rounded border border-red-900/30 text-center">
                                <label className="text-[10px] font-bold text-red-300 block mb-1">P1 (Punta)</label>
                                <FormattedInput value={tState.p1Kwh} onChange={v => handleConsChange('p1Kwh', v)} decimals={0}/>
                                <div className="text-[10px] font-bold text-red-300 block mb-1">{formatDecimal(getConsPct(tState.p1Kwh), 0)}%</div>
                            </div>
                            <div className="bg-orange-900/20 p-3 rounded border border-orange-900/30 text-center">
                                <label className="text-[10px] font-bold text-orange-300 block mb-1">P2 (Llano)</label>
                                <FormattedInput value={tState.p2Kwh} onChange={v => handleConsChange('p2Kwh', v)} decimals={0}/>
                                <div className="text-[10px] font-bold text-red-300 block mb-1">{formatDecimal(getConsPct(tState.p2Kwh), 0)}%</div>
                            </div>
                            <div className="bg-green-900/20 p-3 rounded border border-green-900/30 text-center">
                                <label className="text-[10px] font-bold text-green-300 block mb-1">P3 (Valle)</label>
                                <FormattedInput value={tState.p3Kwh} onChange={v => handleConsChange('p3Kwh', v)} decimals={0}/>
                                <div className="text-[10px] font-bold text-red-300 block mb-1">{formatDecimal(getConsPct(tState.p3Kwh), 0)}%</div>
                            </div>
                            <div className="bg-blue-900/20 p-3 rounded border border-blue-900/30 text-center relative overflow-hidden">
                                <label className="text-[10px] font-bold text-blue-300 block mb-1">P3 (VE)</label>
                                <FormattedInput value={tState.p3VeKwh} onChange={v => handleConsChange('p3VeKwh', v)} decimals={0}/>
                                <div className="text-[10px] font-bold text-red-300 block mb-1">{formatDecimal(getConsPct(tState.p3VeKwh), 0)}%</div>
                            </div>
                            <div className="bg-purple-900/20 p-3 rounded border border-purple-900/30 text-center">
                                <label className="text-[10px] font-bold text-purple-300 block mb-1">P4 (Extra)</label>
                                <FormattedInput value={tState.p4Kwh} onChange={v => handleConsChange('p4Kwh', v)} decimals={0}/>
                                <div className="text-[10px] font-bold text-red-300 block mb-1">{formatDecimal(getConsPct(tState.p4Kwh), 0)}%</div>
                            </div>
                        </div>
                    </div>
                </div>

                {/* COLUMNAS PROPUESTAS (CON TODOS LOS CÁLCULOS) */}
                <div className="lg:col-span-3">
                    <ProposalColumn propKey="propA" title="Propuesta A" data={tState.propA} powerData={{p1: tState.potP1, p2: tState.potP2}} consData={consumptionData} onChange={handlePropChange} />
                </div>
                
                <div className="lg:col-span-3">
                    <ProposalColumn propKey="propB" title="Propuesta B" data={tState.propB} powerData={{p1: tState.potP1, p2: tState.potP2}} consData={consumptionData} onChange={handlePropChange} />
                </div>

                {/* RESULTADOS */}
                <div className="lg:col-span-6 space-y-4">
                    <div className="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-xl p-6 h-full flex flex-col">
                        <h3 className="text-center text-sm uppercase tracking-widest text-slate-300 font-bold mb-4">Resultado Comparativa</h3>
                        
                        {/* WINNER CARD */}
                        <div className={`text-center p-6 rounded-xl border mb-6 ${diff !== 0 ? 'bg-green-900/20 border-green-500/30' : 'bg-slate-800 border-slate-700'}`}>
                             {diff === 0 ? (
                                <div className="text-slate-400 font-bold text-lg">Coste idéntico</div>
                             ) : (
                                <>
                                    <div className="text-sm text-green-400 uppercase font-bold mb-2">Opción Ganadora: {diff > 0 ? tState.propA.name : tState.propB.name}</div>
                                    <div className="text-4xl font-bold text-white mb-2">Ahorras {formatDecimal(Math.abs(diff))} € <span className="text-base font-normal text-slate-400">/ factura</span></div>
                                    
                                    <div className="text-sm font-bold text-slate-300 mb-4">Proyección anual: ~{formatDecimal(Math.abs(diff) * (365/tState.days))} €</div>

                                    <div className="text-base font-bold text-blue-200 bg-blue-900/30 inline-block px-4 py-2 rounded-full">
                                        {formatDecimal(diff > 0 ? billA.pricePerKwh : billB.pricePerKwh, 4)} €/kWh <span className="text-xs font-normal opacity-70">(Impuestos Inc)</span>
                                    </div>
                                    
                                    {/* BLOQUE COSTE EXCLUSIVO COCHE */}
                                    <div className="mt-4 pt-4 border-t border-slate-700/50">
                                        <div className="text-xs uppercase font-bold text-slate-400 mb-1">Coste Estimado Recarga VE (P2 + Energía P3 VE)</div>
                                        <div className="flex justify-center items-baseline gap-2">
                                            <span className="text-2xl font-bold text-blue-300">{formatDecimal(winnerEVCost.total)} €</span>
                                            <span className="text-sm font-bold text-slate-400">➜ {formatDecimal(winnerEVCost.pricePerKwh, 4)} €/kWh (Impuestos inc)</span>
                                        </div>
                                    </div>
                                </>
                             )}
                        </div>

                        {/* ORIGEN DEL AHORRO */}
                        {diff !== 0 && (
                            <div className="mb-6 bg-slate-800/50 p-4 rounded-lg text-sm font-bold">
                                <div className="text-slate-400 uppercase mb-3 text-xs">Desglose del Ahorro</div>
                                <div className="flex justify-between mb-2">
                                    <span>En Potencia:</span>
                                    <span className={diffPot > 0 ? "text-green-400" : "text-red-400"}>{diffPot > 0 ? 'Ahorras' : 'Pierdes'} {formatDecimal(Math.abs(diffPot))} €</span>
                                </div>
                                <div className="flex justify-between">
                                    <span>En Energía:</span>
                                    <span className={diffEn > 0 ? "text-green-400" : "text-red-400"}>{diffEn > 0 ? 'Ahorras' : 'Pierdes'} {formatDecimal(Math.abs(diffEn))} €</span>
                                </div>
                            </div>
                        )}

                        {/* COMPARATIVA CARA A CARA */}
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm border-collapse">
                                <thead className="border-b border-slate-700">
                                    <tr>
                                        <th className="text-left py-2 text-slate-400 font-bold">Concepto</th>
                                        <th className="text-right py-2 text-blue-300 font-bold">{tState.propA.name}</th>
                                        <th className="text-right py-2 text-blue-300 font-bold">{tState.propB.name}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    <tr>
                                        <td className="py-2 text-slate-300">Potencia</td>
                                        <td className={`py-2 text-right font-mono font-bold ${billA.termPotDisc < billB.termPotDisc ? 'text-green-400' : 'text-slate-300'}`}>{formatDecimal(billA.termPotDisc)} €</td>
                                        <td className={`py-2 text-right font-mono font-bold ${billB.termPotDisc < billA.termPotDisc ? 'text-green-400' : 'text-slate-300'}`}>{formatDecimal(billB.termPotDisc)} €</td>
                                    </tr>
                                    <tr>
                                        <td className="py-2 text-slate-300">Energía (Neto Solar)</td>
                                        <td className={`py-2 text-right font-mono font-bold ${billA.termEnNet < billB.termEnNet ? 'text-green-400' : 'text-slate-300'}`}>{formatDecimal(billA.termEnNet)} €</td>
                                        <td className={`py-2 text-right font-mono font-bold ${billB.termEnNet < billA.termEnNet ? 'text-green-400' : 'text-slate-300'}`}>{formatDecimal(billB.termEnNet)} €</td>
                                    </tr>
                                    {tState.solarExp > 0 && (
                                        <tr>
                                            <td className="py-1 text-yellow-600 text-xs font-bold pl-2">↳ Comp. Excedentes</td>
                                            <td className="py-1 text-right font-mono font-bold text-yellow-600 text-xs">-{formatDecimal(billA.solarReturn)} €</td>
                                            <td className="py-1 text-right font-mono font-bold text-yellow-600 text-xs">-{formatDecimal(billB.solarReturn)} €</td>
                                        </tr>
                                    )}
                                    <tr>
                                        <td className="py-2 text-slate-300">Fijos (Alq+Bono+Com)</td>
                                        <td className="py-2 text-right font-mono font-bold text-slate-300">{formatDecimal(billA.fixedCosts)} €</td>
                                        <td className="py-2 text-right font-mono font-bold text-slate-300">{formatDecimal(billB.fixedCosts)} €</td>
                                    </tr>
                                    <tr>
                                        <td className="py-2 text-slate-300">Impuestos (IEE+IVA)</td>
                                        <td className="py-2 text-right font-mono font-bold text-slate-300">{formatDecimal(billA.taxes)} €</td>
                                        <td className="py-2 text-right font-mono font-bold text-slate-300">{formatDecimal(billB.taxes)} €</td>
                                    </tr>
                                </tbody>
                                <tfoot className="border-t border-slate-600 bg-slate-800/30">
                                    {diff !== 0 && (
                                        <>
                                            <tr className="text-xs font-bold text-slate-400 bg-slate-800/50">
                                                <td className="py-2 pl-2 font-bold uppercase tracking-wide">Diferencial</td>
                                                <td colSpan="2" className="py-0"></td>
                                            </tr>
                                            <tr className="text-xs">
                                                <td className="py-1 pl-4 text-slate-400 font-bold">En Potencia</td>
                                                <td className="text-right py-1 pr-2 font-mono font-bold">
                                                     <span className={diffPot > 0 ? "text-green-400" : "text-red-400"}>
                                                        {diffPot > 0 ? '-' : '+'}{formatDecimal(Math.abs(diffPot))} €
                                                     </span>
                                                </td>
                                                <td className="text-left py-1 pl-2 font-mono text-xs text-slate-500 font-bold">
                                                     ({formatDecimal(diffPotPct)}%)
                                                </td>
                                            </tr>

      // --- DECODIFICADOR VIN AVANZADO V2 (CORREGIDO) ---
      const VinDecoder = () => {
        // CORRECCIÓN: Usamos un objeto { code: '' } en lugar de un string suelto para que el guardado funcione bien
        const [vinState, setVinState] = usePersistentState('userVin', { code: '' });
        const vin = vinState.code || ''; // Extraemos el valor limpio para usarlo
        
        const [result, setResult] = useState(null);

        // BASE DE DATOS INTERNA DE ESPECIFICACIONES
        const getSpecs = (model, trim, yearCode) => {
            let specs = { range: "?", accel: "?", top: "?", drive: "?", power: "?" };
            const year = yearCode === 'R' || yearCode === 'S' ? '2024+' : 'pre-2024';

            if (model === '3') {
                if (trim === 'RWD') {
                    specs = { range: year === '2024+' ? "513 km" : "491 km", accel: "6.1 s", top: "201 km/h", drive: "Trasera (RWD)", power: "~283 CV" };
                } else if (trim === 'LR') {
                    specs = { range: year === '2024+' ? "629 km" : "602 km", accel: "4.4 s", top: year === '2024+' ? "201 km/h" : "233 km/h", drive: "Total (AWD)", power: "~498 CV" };
                } else if (trim === 'PERF') {
                    specs = { range: "547 km", accel: "3.3 s", top: "261 km/h", drive: "Total (AWD)", power: "~534 CV" };
                }
            } else if (model === 'Y') {
                if (trim === 'RWD') {
                    specs = { range: "455 km", accel: "6.9 s", top: "217 km/h", drive: "Trasera (RWD)", power: "~299 CV" };
                } else if (trim === 'LR') {
                    specs = { range: "533 km", accel: "5.0 s", top: "217 km/h", drive: "Total (AWD)", power: "~514 CV" };
                } else if (trim === 'PERF') {
                    specs = { range: "514 km", accel: "3.7 s", top: "250 km/h", drive: "Total (AWD)", power: "~534 CV" };
                }
            }
            return specs;
        };

        const decodeVin = (inputVin) => {
            if (!inputVin || inputVin.length !== 17) {
                setResult({ error: "El VIN debe tener 17 caracteres." });
                return;
            }
            const v = inputVin.toUpperCase();
            
            // LÓGICA DE DECODIFICACIÓN
            const digit4 = v[3];
            let modelName = "Desconocido", modelCode = "";
            if(digit4 === '3') { modelName = "Model 3"; modelCode = '3'; }
            else if(digit4 === 'Y') { modelName = "Model Y"; modelCode = 'Y'; }
            else if(digit4 === 'S') { modelName = "Model S"; modelCode = 'S'; }
            else if(digit4 === 'X') { modelName = "Model X"; modelCode = 'X'; }

            const digit7 = v[6]; 
            let trimName = "Standard / RWD", trimCode = "RWD", batteryType = "Desconocida";

            if (digit7 === 'F' || digit7 === 'J' || digit7 === 'R') { // R añadido para Berlin BYD
                trimName = "RWD (Tracción Trasera)"; trimCode = "RWD";
                batteryType = "LFP (Litio Ferrofosfato) - Carga al 100%";
            } else if (digit7 === 'E' || digit7 === 'K') {
                const digit8 = v[7];
                if (digit8 === 'L' || digit8 === 'P') { trimName = "Performance"; trimCode = "PERF"; } 
                else { trimName = "Long Range"; trimCode = "LR"; }
                batteryType = "NMC/NCA (Níquel) - Carga al 80%";
            }

            const yearCode = v[9];
            const years = { 'L': 2020, 'M': 2021, 'N': 2022, 'P': 2023, 'R': 2024, 'S': 2025 };
            const modelYear = years[yearCode] || "Anterior a 2020";

            const factoryCode = v[10];
            let factory = "Desconocida";
            if(factoryCode === 'C' || v.startsWith('LRW')) factory = "Giga Shanghai (China) ⭐";
            else if(factoryCode === 'B' || v.startsWith('XP7')) factory = "Giga Berlin (Alemania) 🇪🇺";
            else if(factoryCode === 'F' || v.startsWith('5YJ')) factory = "Fremont (USA) 🇺🇸";

            const specs = getSpecs(modelCode, trimCode, yearCode);
            let hw = { cpu: "Intel Atom", uss: "Sensores ✅" };
            if (modelYear >= 2022) hw.cpu = "AMD Ryzen 🚀";
            if (modelYear >= 2023) hw.uss = "Tesla Vision (Cámaras) 📷";

            setResult({ model: modelName, trim: trimName, year: modelYear, factory, battery: batteryType, specs, hw });
        };

        const handleInput = (e) => {

        return (

                            <div className="bg-blue-500/20 p-2 rounded-full text-blue-400"><Icons.Smartphone className="w-5 h-5" /></div>
                            <div className="text-sm text-slate-400 font-bold leading-relaxed">Encuéntralo en la App de Tesla haciendo scroll hasta el final de la pantalla principal.</div>

                                <div>

                                    <h3 className="text-4xl font-display font-bold text-white">{result.model} <span className="text-slate-400">{result.trim}</span></h3>
                                    <div className="text-sm text-slate-400 font-bold mt-2 flex items-center gap-2 justify-center md:justify-start">
                                        <span className="bg-slate-700 px-2 py-1 rounded text-white">{result.hw.cpu}</span>

                                </div>
                                <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-center">
                                    <div className="text-xs text-slate-500 font-bold uppercase mb-2">Autonomía (Est)</div>

                                </div>
                                <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-center">
                                    <div className="text-xs text-slate-500 font-bold uppercase mb-2">Velocidad Máx</div>
                                    <div className="text-2xl font-bold text-white font-display">{result.specs.top}</div>
                                </div>
                                <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-center">
                                    <div className="text-xs text-slate-500 font-bold uppercase mb-2">Tracción</div>
                                    <div className="text-xl font-bold text-blue-300 font-display">{result.specs.drive}</div>
                                </div>
                            </div>

                            {/* FICHA TÉCNICA DETALLADA */}
                            <div className="bg-slate-900/50 border border-slate-700 rounded-xl p-6">
                                <h4 className="text-sm font-bold text-slate-300 uppercase mb-4 border-b border-slate-700 pb-2">Detalles Técnicos</h4>
                                <ul className="space-y-3 text-sm">
                                    <li className="flex justify-between">
                                        <span className="text-slate-400 font-bold">Tipo de Batería:</span>

                                    </li>
                                    <li className="flex justify-between">
                                        <span className="text-slate-400 font-bold">Potencia Estimada:</span>
                                        <span className="text-white font-bold">{result.specs.power}</span>
                                    </li>
                                    <li className="flex justify-between">
                                        <span className="text-slate-400 font-bold">Fábrica de Origen:</span>
                                        <span className="text-white font-bold">{result.factory}</span>
                                    </li>
                                </ul>
                                <div className="mt-4 pt-4 border-t border-slate-700 text-[10px] text-slate-500 text-center leading-tight">
                                    * Datos estimados según la lógica de producción de Tesla. Las especificaciones pueden variar según la versión de software y tamaño de llantas.
                                </div>
                            </div>

                            {/* ENLACES EXTERNOS */}
                            <div className="bg-blue-900/20 border border-blue-500/30 rounded-xl p-4 mt-4">

                                </h4>
                                <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                                    El código VIN <strong>no contiene información sobre el color, interior o llantas</strong> (esos datos no se codifican en el bastidor). Para averiguarlo, puedes buscar si este coche aparece en bases de datos externas:
                                </p>

                                        <Icons.Search className="w-4 h-4 text-blue-400" /> Googlear este VIN
                                    </a>
