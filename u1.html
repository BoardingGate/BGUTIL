      window.onerror = function(message, source, lineno, colno, error) {
        if (message && message.indexOf('Script error') > -1) return;
        console.error(error);
        const root = document.getElementById('root');
        if(root && root.innerHTML === "") {
           document.body.innerHTML = '<div style="color:#ff9999; padding:20px; background:#330000; font-family:monospace;"><h2>⚠️ Error de inicialización:</h2><p>' + message + '</p><p>Intenta recargar la página.</p></div>';
        }
      };

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;
      const { createRoot } = ReactDOM;
      
      const usePersistentState = (key, initialValue) => {
        const [state, setState] = useState(() => {
            try {
                const item = window.localStorage.getItem(key);
                return item ? { ...initialValue, ...JSON.parse(item) } : initialValue;
            } catch (error) {
                console.warn(`Error reading localStorage key "${key}":`, error);
                return initialValue;
            }
        });

        useEffect(() => {
            try {
                window.localStorage.setItem(key, JSON.stringify(state));
            } catch (error) {
                console.warn(`Error setting localStorage key "${key}":`, error);
            }
        }, [key, state]);

        return [state, setState];
      };

      const formatMoney = (val) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: 0, maximumFractionDigits: 0, useGrouping: true}).format(val);
      const formatDecimal = (val, digits = 2) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: digits, maximumFractionDigits: digits }).format(val);
      
      const formatTime = (min) => {
          if(!min || !isFinite(min)) return "00:00:00";
          const h = Math.floor(min / 60);
          const m = Math.floor(min % 60);
          const s = Math.round((min * 60) % 60);
          return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      };

      const formatTimeShort = (min) => {
          if(!min || !isFinite(min)) return "00:00";
          const h = Math.floor(min / 60);
          const m = Math.round(min % 60);
          return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
      };


      const scrollToSafeZone = (element) => {
          setTimeout(() => {
              if (!element) return;
              const y = element.getBoundingClientRect().top + window.scrollY;
              window.scrollTo({ top: y - 150, behavior: 'smooth' });
          }, 300); // Pequeño retardo para dar tiempo a que salga el teclado
      };

      const FormattedInput = ({ value, onChange, decimals = 0, grouped = false }) => {
        const getDisplayString = (val) => {
            if (val === null || val === undefined || val === '') return '';
            return new Intl.NumberFormat('es-ES', { 
                minimumFractionDigits: 0, 
                maximumFractionDigits: Math.max(decimals, 6), 
                useGrouping: grouped 
            }).format(val);
        };

        const [localValue, setLocalValue] = useState(() => getDisplayString(value));
        const [isFocused, setIsFocused] = useState(false);

        useEffect(() => {
            if (!isFocused) {
                setLocalValue(getDisplayString(value));
            }
        }, [value, isFocused, decimals, grouped]);

        const handleChange = (e) => {
            const inputVal = e.target.value;
            setLocalValue(inputVal); 

            if (inputVal === '' || inputVal === '-') return;
            if (!/^[\d.,-]+$/.test(inputVal)) return;

            let normalized = inputVal;
            if (grouped) {
                normalized = inputVal.replace(/\./g, '').replace(/,/g, '.');
            } else {
                normalized = inputVal.replace(/,/g, '.');
            }

            if (normalized.endsWith('.')) return;

            const num = parseFloat(normalized);
            if (!isNaN(num)) {
                onChange(num);
            }
        };

        const handleFocus = (e) => {
            setIsFocused(true);
            scrollToSafeZone(e.target);
            
            if (value !== null && value !== undefined) {
                if (grouped) {
                    setLocalValue(getDisplayString(value));
                } else {
                    setLocalValue(value.toString().replace('.', ','));
                }
            }
        };

        const handleBlur = () => {
            setIsFocused(false);
        };
        
        const handleKeyDown = (e) => {
            if(e.key === 'Enter') {
                e.target.blur();
            }
        }

        return (
            <input
                type="text"
                inputMode="decimal"
                value={localValue}
                onChange={handleChange}
                onFocus={handleFocus}
                onBlur={handleBlur}
                onKeyDown={handleKeyDown}
                className="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-3 text-yellow-300 font-mono font-bold focus:outline-none focus:border-yellow-500 text-lg placeholder-zinc-500 transition-colors text-right shadow-inner"
            />
        );
      }

        const speedMs = params.speed / 3.6; 
        const gradientRad = Math.atan(params.gradient / 100);
        const fRoll = mass * g * cr * Math.cos(gradientRad);
        const relativeSpeed = speedMs - (params.windSpeed / 3.6);
        const fAero = 0.5 * rho * cd * area * Math.sign(relativeSpeed) * (relativeSpeed ** 2);
        const fGrade = mass * g * Math.sin(gradientRad);
        const totalForce = fRoll + fAero + fGrade;
        let powerWatts = totalForce * speedMs;
        let finalPowerKw = powerWatts > 0 ? (powerWatts / 1000) / drivetrainEfficiency : (powerWatts / 1000) * 0.7; 
        const tempDiff = Math.abs(20 - params.temperature);
        const climatePowerKw = 0.5 + (tempDiff * 0.15);
        const totalPowerKw = finalPowerKw + climatePowerKw;
        let consumption = 0;
        if (params.speed > 0) consumption = (totalPowerKw / params.speed) * 100;
        const BASE_PHYSICS_REF = 14.0; 
        const scalar = params.electricConsumptionRef / BASE_PHYSICS_REF;
        consumption = consumption * scalar;
        return Math.max(consumption < -10 ? -10 : consumption, -10);

      // --- NUEVO: SIMULADOR DE REGENERACIÓN (S3XY / MODO VELA) ---
      const RegenSimulator = ({ params, costs }) => {
        const [regenParams, setRegenParams] = usePersistentState('regenSimParams_v2', {
            standardRegenPower: 85, // kW (Aprox Model 3 Highland/Y)
            customRegenPct: 100 // % sobre el estándar
        });

        const handleChange = (k, v) => setRegenParams(prev => ({...prev, [k]: parseFloat(v)}));

        // FÍSICA DEL VEHÍCULO (Copia de la lógica central para consistencia)
        const mass = 1850; const g = 9.81;
        const cr = 0.006; const rho = 1.225; const cd = 0.219; const area = 2.22;
        const speedMs = params.speed / 3.6;
        
        // 1. CÁLCULO DE FUERZAS
        const gradientRad = Math.atan(params.gradient / 100);
        const fGrade = mass * g * Math.sin(gradientRad); // Positivo subiendo, Negativo bajando (ayuda)
        const fRoll = mass * g * cr * Math.cos(gradientRad); // Siempre en contra
        const relativeSpeed = speedMs - (params.windSpeed / 3.6);
        const fAero = 0.5 * rho * cd * area * Math.sign(relativeSpeed) * (relativeSpeed ** 2); // Siempre en contra
        
        const totalResistiveForce = fRoll + fAero; // Fuerzas que frenan el coche naturalmente
        const netForce = totalResistiveForce + fGrade; // Balance total
        
        // 2. POTENCIAS DE REGENERACIÓN
        const maxRegenKw_Std = regenParams.standardRegenPower;
        const maxRegenKw_Custom = regenParams.standardRegenPower * (regenParams.customRegenPct / 100);

        // 3. ESCENARIO A: CONSUMO REAL (Impacto en Bajadas)
        // Si netForce < 0, el coche "cae" y genera energía.
        // Si netForce > 0, el motor empuja (consumo).
        
        // Consumo Teórico (Motor empujando o reteniendo todo lo posible)
        let powerWatts_Std = netForce * speedMs;
        let powerWatts_Custom = netForce * speedMs;

        // Aplicamos límites de regeneración (Solo si la potencia es negativa/generación)
        if (powerWatts_Std < 0) {
            // Si genera más de lo que la batería admite, el resto se pierde en frenos mecánicos
            powerWatts_Std = Math.max(powerWatts_Std, -maxRegenKw_Std * 1000); 
        }
        if (powerWatts_Custom < 0) {
            // Aquí aplicamos el "recorte" de los S3XY Buttons
            powerWatts_Custom = Math.max(powerWatts_Custom, -maxRegenKw_Custom * 1000);
        }

        // Convertimos a kWh/100km
        const efficiency = 0.90; // Eficiencia motor/inversor
        // Si power > 0 (Consumo): Se divide por eficiencia (gastamos más de lo que llega a rueda)
        // Si power < 0 (Regen): Se multiplica por eficiencia (recuperamos menos de lo que hay en rueda)
        
        const getConsumption = (watts) => {
            if (params.speed === 0) return 0;
            let wallWatts = watts > 0 ? watts / efficiency : watts * efficiency;
            return (wallWatts / 1000 / params.speed) * 100;
        };

        const consStd = getConsumption(powerWatts_Std);
        const consCustom = getConsumption(powerWatts_Custom);
        
        // Diferencial (Lo que pierdes por anular la regen en bajadas)
        const diffKwh = consCustom - consStd; // Si custom consume más (o regenera menos), es positivo (pérdida)
        const diffEuro = diffKwh * costs.electricityPrice;
        const diffPct = Math.abs(consStd) > 0 ? (diffKwh / Math.abs(consStd)) * 100 : 0;


        // 4. ESCENARIO B: MODO VELA (COASTING) EN LLANO
        // Cálculo: ¿Cuánta distancia recorro por inercia desde la velocidad actual hasta 0?
        // Trabajo (W) = Fuerza * Distancia  =>  Energía Cinética = Fuerza_Promedio * Distancia
        // Distancia = E_cinética / Fuerza_Frenado_Promedio
        
        const kineticJoules = 0.5 * mass * (speedMs ** 2);
        
        // Fuerza de frenado promedio (aproximada, ya que aero depende de v^2, tomamos v media)
        const vAvg = speedMs / 1.5; // Aproximación para integral de desaceleración
        const fAeroAvg = 0.5 * rho * cd * area * (vAvg ** 2);
        const fResistAvg = fRoll + fAeroAvg; // Resistencia natural (Vela pura)
        
        // Fuerza Regen (F = P / v). Asumimos un torque de frenado regenerativo promedio
        // Regen 100%: Fuerte retención. Regen 0%: Solo resistencia natural.
        
        // Simulación simplificada de distancia hasta detenerse
        const getCoastingDistance = (regenKwLimit) => {
            // Si regen es 0, solo frena fResistAvg.
            // Si regen es alta, frena fResistAvg + fRegenAvg.
            // fRegenAvg estimada: Potencia media / Velocidad media
            const regenPowerAvg = Math.min(regenKwLimit * 1000, 40000); // Limitamos a 40kW promedio de frenada suave
            const fRegenAvg = vAvg > 1 ? regenPowerAvg / vAvg : 0; 
            const totalBrakingForce = fResistAvg + fRegenAvg;
            return kineticJoules / totalBrakingForce;
        };

        const distCoasting_Std = getCoastingDistance(maxRegenKw_Std);
        const distCoasting_Custom = getCoastingDistance(maxRegenKw_Custom);
        
        const gainedDistanceMeters = distCoasting_Custom - distCoasting_Std;
        
        // Valoración Económica del Modo Vela:
        // Si recorres X metros "gratis" a vela, te ahorras la energía de recorrer esos X metros manteniendo velocidad.
        // Energía ahorrada = (Consumo a velocidad constante / 100) * (Distancia ganada / 1000)

      const ChargingCalculator = () => {
        const [state, setState] = usePersistentState('chargeState', { 
            capacity: 60, 
            startPct: 20, 
            targetPct: 80, 
            power: 7.4, 
            consumption: 14.5, 
            energyPrice: 0.07, 
            monthlyKm: 1500, 
            dailyKm: 0, 
            batType: 'LFP',
            costPremium: 9.99,
            costFSD: 0,
            costOther: 0,
            isFsdOneTime: false,
            fsdOneTimeCost: 7500,
            fsdAmortYears: 10
        });

        const [compState, setCompState] = usePersistentState('compoundCalc', {
            principal: 3000,
            annualAddition: 2400,
            years: 30,
            rate: 10,
            compoundsPerYear: 1,
            addAtStart: true
        });
        const [showCompTable, setShowCompTable] = useState(false);

        const curvePoints = {
            LFP: [{p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}],
            NCA: [{p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}]
        };

        const powerPresets = [3.3, 7.4, 11, 22, 50, 60, 100, 150, 170, 200, 250, 300, 400, 800];

        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const points = curvePoints[type];
            const baseRef = type === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);
            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;
            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            return (p1.v + (ratio * (p2.v - p1.v))) * scaleFactor;
        };

        const validTarget = Math.max(state.startPct, state.targetPct);
        const percentAdded = validTarget - state.startPct;
        const energyAdded = state.capacity * (percentAdded / 100);
        const timeHoursLin = state.power > 0 ? energyAdded / state.power : 0;
        const minutesLin = timeHoursLin * 60;
        let minutesCurve = 0;
        const kwhPerPercent = state.capacity / 100;
        for (let i = state.startPct; i < validTarget; i++) {
            const limit = getBatteryLimitAtSoC(i, state.batType, state.power);
            const realPower = Math.min(state.power, limit);
            if (realPower > 0) minutesCurve += (kwhPerPercent / realPower) * 60;
        }
        const rangeAdded = state.consumption > 0 ? (energyAdded / state.consumption) * 100 : 0;
        const totalCostCharge = energyAdded * state.energyPrice;
        const totalRangeAtTarget = state.consumption > 0 ? (state.capacity * (validTarget/100) / state.consumption) * 100 : 0;
        
        const monthlyKm = state.monthlyKm || 0;
        const costEnergyMonthly = (monthlyKm / 100) * state.consumption * state.energyPrice;
        const costEnergyDaily = costEnergyMonthly / 30.41; 
        const costEnergyAnnual = costEnergyMonthly * 12;
        const fixedMonthly = (state.costPremium || 0) + (state.costFSD || 0) + (state.costOther || 0);
        const fixedDaily = fixedMonthly / 30.41;
        const fixedAnnual = fixedMonthly * 12;
        const totalMonthly = costEnergyMonthly + fixedMonthly;
        const totalDaily = costEnergyDaily + fixedDaily;
        const totalAnnual = costEnergyAnnual + fixedAnnual;
        const perKmEnergy = monthlyKm > 0 ? costEnergyMonthly / monthlyKm : 0;
        const perKmServices = monthlyKm > 0 ? fixedMonthly / monthlyKm : 0;
        const perKmTotal = monthlyKm > 0 ? totalMonthly / monthlyKm : 0;

        const handleChange = (k, v) => {
            const val = parseFloat(v) || 0;
            setState(prev => {
                let updates = { [k]: val };
                if (k === 'power') updates.energyPrice = val < 11 ? 0.07 : 0.45;
                return { ...prev, ...updates };
            });
        };

        const handleDualSliderChange = (key, value) => {
            const val = parseInt(value);
            setState(prev => {
                let newStart = prev.startPct;
                let newTarget = prev.targetPct;
                if (key === 'startPct') newStart = Math.min(val, prev.targetPct - 1);
                else if (key === 'targetPct') newTarget = Math.max(val, prev.startPct + 1);
                return { ...prev, startPct: newStart, targetPct: newTarget };
            });
        };
        
        const handleFsdOneTimeCalc = (costTotal, years) => {
             const c = parseFloat(costTotal) || 0;
             const y = parseFloat(years) || 0;
             const months = y * 12;
             const monthlyCost = months > 0 ? c / months : 0;
             setState(prev => ({ ...prev, fsdOneTimeCost: c, fsdAmortYears: y, costFSD: monthlyCost }));
        };

        const toggleFsdOneTime = (e) => {
            const isChecked = e.target.checked;
            setState(prev => {
                let newMonthly = prev.costFSD;
                if(isChecked) {
                    const cost = prev.fsdOneTimeCost || 7500;
                    const years = prev.fsdAmortYears || 10;
                    const months = years * 12;
                    newMonthly = months > 0 ? cost / months : 0;
                }
                return { ...prev, isFsdOneTime: isChecked, costFSD: newMonthly, fsdOneTimeCost: prev.fsdOneTimeCost || 7500, fsdAmortYears: prev.fsdAmortYears || 10 };
            });
        };

        const calculateCompound = () => {
            let balance = compState.principal;
            let totalPrincipal = compState.principal;
            const history = [];
            
            const r = compState.rate / 100;
            const n = compState.compoundsPerYear;
            const effectiveAnnualRate = Math.pow(1 + (r/n), n) - 1;

            for(let i = 1; i <= compState.years; i++) {
                let contribution = compState.annualAddition;
                
                if(compState.addAtStart) {
                    balance += contribution;
                    totalPrincipal += contribution;
                }
                
                const interestEarned = balance * effectiveAnnualRate;
                balance += interestEarned;
                
                if(!compState.addAtStart) {
                    balance += contribution;
                    totalPrincipal += contribution;
                }

                history.push({
                    year: i,
                    principal: totalPrincipal,
                    interest: balance - totalPrincipal,
                    balance: balance
                });
            }
            return { finalBalance: balance, totalPrincipal, history };
        };

        const compResult = calculateCompound();

        return (

                        <div className="flex gap-2 mb-4 bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                             <button onClick={() => setState(p => ({...p, batType: 'LFP'}))} className={`flex-1 py-3 text-sm font-bold rounded-md transition-colors ${state.batType === 'LFP' ? 'bg-green-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>LFP (RWD)</button>
                             <button onClick={() => setState(p => ({...p, batType: 'NCA'}))} className={`flex-1 py-3 text-sm font-bold rounded-md transition-colors ${state.batType === 'NCA' ? 'bg-red-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>NCA/NMC (LR,PF)</button>
                        </div>
                        <div className="space-y-6">
                            <div><label className="text-sm font-bold text-slate-400 block mb-1">Capacidad Batería (kWh)</label><FormattedInput value={state.capacity} onChange={v => handleChange('capacity', v)} decimals={1}/></div>
                            <div className="pt-4 border-t border-slate-800">
                                <label className="text-sm font-bold text-slate-400 block mb-2">Potencia de Carga (kW)</label>
                                <FormattedInput value={state.power} onChange={v => handleChange('power', v)} decimals={1}/>
                                <div className="flex flex-wrap gap-2 mt-4 justify-between">
                                    {powerPresets.map(p => (
                                        <button key={p} onClick={() => handleChange('power', p)} className={`px-3 py-1.5 text-xs font-bold rounded border transition-colors ${state.power === p ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{p}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="pt-4 grid grid-cols-2 gap-6"><div><label className="text-sm font-bold text-slate-400 block mb-1">Consumo (kWh/100)</label><FormattedInput value={state.consumption} onChange={v => handleChange('consumption', v)} decimals={1}/></div><div><label className="text-sm font-bold text-slate-400 block mb-1">Precio Energía (€/kWh)</label><FormattedInput value={state.energyPrice} onChange={v => handleChange('energyPrice', v)} decimals={3}/></div></div>
                        </div>
                    </div>
                </div>

                <div className="lg:col-span-7 space-y-6">
                     <div className="bg-black/40 border border-slate-800 rounded-xl p-8 flex items-center justify-center relative overflow-hidden h-48">

                            <div className="h-full bg-green-500 animate-charge" style={{width: `${Math.max(0, percentAdded)}%`}}><div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTAgMTBMMTAgMFYxMEgwWiIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjEpIi8+PC9zdmc+')] opacity-30"></div></div>
                            <div className="flex-grow"></div>
                             <div className="absolute inset-0 flex items-center justify-center text-4xl font-display font-bold text-white drop-shadow-md z-10">{state.startPct}% <span className="text-slate-400 mx-4">▶</span> <span className="text-green-400">{state.targetPct}%</span></div>

      // --- DRENAJE (MODIFICADO: VISIBILIDAD DE ZONA CONSUMIDA Y SENTIDO DE CARGA) ---
      const DrainCalculator = () => {
        const [state, setState] = usePersistentState('drainState', {
            battery: 60, days: 15, startPct: 80, isGarage: true, temperature: 16, sentryMode: false, sentryTraffic: 'low', sentryHours: 24, sentryDisablePct: 20, preconditioning: false, appChecks: 7,
        });
        const handleChange = (k, v) => setState(prev => ({...prev, [k]: v}));

        let dailyBaseRate = state.isGarage ? 0.2 : 0.4;
        const tempDiff = Math.abs(state.temperature - 20);
        dailyBaseRate += (tempDiff * 0.015);

        let dailySentryPotential = 5.5; 
        if (state.sentryTraffic === 'med') dailySentryPotential += 0.3;
        if (state.sentryTraffic === 'high') dailySentryPotential += 0.8;
        
        const hourlySentryRate = dailySentryPotential / 24;
        const dailySentryAdded = hourlySentryRate * state.sentryHours; 
        const dailyPrecon = state.preconditioning ? 1.5 : 0;
        const totalAppDrain = state.appChecks * 0.15;
        const dailyAppDrain = totalAppDrain / state.days;

        const drainHigh = dailyBaseRate + dailySentryAdded + dailyPrecon + dailyAppDrain;
        const drainLow = dailyBaseRate + dailyPrecon + dailyAppDrain;

        const startEnergy = state.battery * (state.startPct / 100);
        const disableEnergy = state.battery * (state.sentryDisablePct / 100);
        const energyForHigh = Math.max(0, startEnergy - disableEnergy);
        
        let daysInHigh = 0;
        let daysInLow = 0;

        if (!state.sentryMode) { daysInLow = state.days; } else {
            const daysUntilDisable = drainHigh > 0 ? energyForHigh / drainHigh : 0;
            if (daysUntilDisable >= state.days) { daysInHigh = state.days; } else { daysInHigh = daysUntilDisable; daysInLow = state.days - daysUntilDisable; }
        }
        const totalDrain = (daysInHigh * drainHigh) + (daysInLow * drainLow);
        const endEnergy = Math.max(0, startEnergy - totalDrain);
        const endPct = (endEnergy / state.battery) * 100;
        let daysUntilDead = 0;
        if (state.sentryMode && startEnergy > disableEnergy) {
             const timeToDisable = energyForHigh / drainHigh;
             const timeFromDisableToZero = disableEnergy / drainLow;
             daysUntilDead = timeToDisable + timeFromDisableToZero;
        } else { daysUntilDead = drainLow > 0 ? startEnergy / drainLow : 999; }
        const isCritical = endPct <= 5; const isWarning = endPct <= 20;

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6"><div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6"><h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.Shield /> Variables de Consumo</h2><div className="space-y-6"><div className="grid grid-cols-2 gap-4"><button onClick={() => handleChange('isGarage', true)} className={`p-4 rounded-lg border text-center transition-all ${state.isGarage ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><div className="flex justify-center mb-1"><Icons.Home className="w-6 h-6"/></div><span className="text-sm font-bold">Garaje</span></button><button onClick={() => handleChange('isGarage', false)} className={`p-4 rounded-lg border text-center transition-all ${!state.isGarage ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><div className="flex justify-center mb-1"><Icons.Moon className="w-6 h-6"/></div><span className="text-sm font-bold">Calle</span></button></div><div className="animate-fade-in"><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Temperatura Media</label><span className="text-sm font-bold text-white">{state.temperature}°C</span></div><input type="range" min="-10" max="45" value={state.temperature} onChange={e => handleChange('temperature', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500" /></div><div className="border-t border-slate-800 pt-6"><div className="flex items-center justify-between mb-4"><label className="text-base font-bold text-slate-300 flex items-center gap-2"><Icons.Eye /> Modo Centinela</label><button onClick={() => handleChange('sentryMode', !state.sentryMode)} className={`w-14 h-8 rounded-full p-1 transition-colors ${state.sentryMode ? 'bg-red-500' : 'bg-slate-700'}`}><div className={`w-6 h-6 rounded-full bg-white transition-transform ${state.sentryMode ? 'translate-x-6' : 'translate-x-0'}`}></div></button></div>{state.sentryMode && (<div className="space-y-6 animate-fade-in"><div className="grid grid-cols-3 gap-3">{['low', 'med', 'high'].map(lvl => (<button key={lvl} onClick={() => handleChange('sentryTraffic', lvl)} className={`py-2 px-3 rounded border text-xs uppercase font-bold ${state.sentryTraffic === lvl ? 'bg-red-900/50 border-red-500 text-red-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>{lvl === 'low' ? 'Tranquilo' : lvl === 'med' ? 'Normal' : 'Intenso'}</button>))}</div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Horas activo / día</label><span className="text-sm font-bold text-white">{state.sentryHours}h</span></div><input type="range" min="1" max="24" value={state.sentryHours} onChange={e => handleChange('sentryHours', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /><p className="text-xs font-bold text-slate-400 mt-2 italic">Útil si lo tiene automatizado para que se active a ciertos horarios.</p></div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Desactivar si baja de:</label><span className="text-sm font-bold text-red-400">{state.sentryDisablePct}%</span></div><input type="range" min="5" max="50" value={state.sentryDisablePct} onChange={e => handleChange('sentryDisablePct', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /></div></div>)}</div><div className="border-t border-slate-800 pt-6 space-y-6"><div className="flex items-center justify-between"><label className="text-base font-bold text-slate-400 flex items-center gap-2"><Icons.Thermometer /> Pre-acondicionamiento (1/día)</label><button onClick={() => handleChange('preconditioning', !state.preconditioning)} className={`w-14 h-8 rounded-full p-1 transition-colors ${state.preconditioning ? 'bg-orange-500' : 'bg-slate-700'}`}><div className={`w-6 h-6 rounded-full bg-white transition-transform ${state.preconditioning ? 'translate-x-6' : 'translate-x-0'}`}></div></button></div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400 flex items-center gap-2"><Icons.Smartphone /> Consultas App (Total)</label><span className="text-sm font-bold text-white">{state.appChecks} veces</span></div><input type="range" min="0" max="100" value={state.appChecks} onChange={e => handleChange('appChecks', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" /></div></div><div className="border-t border-slate-800 pt-6 space-y-6"><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Capacidad Batería</label><span className="text-sm font-bold text-white">{state.battery} kWh</span></div><input type="range" min="40" max="100" value={state.battery} onChange={e => handleChange('battery', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" /></div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Días Aparcado</label><span className="text-sm font-bold text-white">{state.days} días</span></div><input type="range" min="1" max="90" value={state.days} onChange={e => handleChange('days', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" /></div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">% Inicial</label><span className="text-sm font-bold text-yellow-400">{state.startPct}%</span></div><input type="range" min="0" max="100" value={state.startPct} onChange={e => handleChange('startPct', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-yellow-500" /></div></div></div></div></div>
                <div className="lg:col-span-7 space-y-6">
                    <div className="bg-black/40 border border-slate-800 rounded-xl p-8 flex items-center justify-center relative overflow-hidden h-48">
                        <div className="relative w-full max-w-md h-28 border-4 border-slate-600 rounded-2xl p-1 flex items-center">
                            <div className="absolute -right-4 top-1/2 -translate-y-1/2 w-4 h-10 bg-slate-600 rounded-r-md"></div>
                            {/* Zona consumida (Fantasma) más visible */}
                            <div className="h-full bg-slate-600/40 rounded-l-lg absolute left-1" style={{width: `${state.startPct}%`}}></div>
                            {/* Carga restante */}
                            <div className={`h-full rounded-l-lg relative z-10 transition-all duration-500 ${isCritical ? 'bg-red-600' : isWarning ? 'bg-yellow-600' : 'bg-green-600'}`} style={{width: `${endPct}%`}}></div>
                            <div className="absolute inset-0 flex items-center justify-center text-3xl font-display font-bold text-white drop-shadow-md z-20">
                                <span className={isCritical ? 'text-red-500' : isWarning ? 'text-yellow-400' : 'text-green-400'}>{endPct.toFixed(1)}%</span> 
                                <span className="text-slate-400 mx-3">◀</span> 
                                {state.startPct}%
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4"><div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-300 font-bold text-sm uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.Zap className="w-5 h-5"/> Drenaje Total</div><div className="text-4xl font-display font-bold text-red-400">-{formatDecimal(totalDrain)} <span className="text-xl text-slate-400">kWh</span></div><div className="text-xs font-bold text-slate-400 mt-2">en {state.days} días</div></div><div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-300 font-bold text-sm uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.AlertTriangle className="w-5 h-5"/> Días hasta 0%</div><div className="text-4xl font-display font-bold text-white">{daysUntilDead > 365 ? '>1 año' : Math.floor(daysUntilDead)} <span className="text-xl text-slate-400">días</span></div><div className="text-xs font-bold text-slate-400 mt-2">si mantienes este ritmo</div></div></div>
                    <div className="bg-slate-800/30 rounded-xl p-6 border border-slate-700"><h4 className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Desglose Estimado</h4><div className="space-y-3"><div className="flex justify-between text-sm font-bold"><span className="text-slate-400">Consumo Base (Sleep)</span><span className="text-white">{(dailyBaseRate * state.days).toFixed(1)} kWh</span></div>{state.sentryMode && (<div className="flex justify-between text-sm font-bold text-red-300"><span className="flex items-center gap-1"><Icons.Eye /> Modo Centinela ({state.sentryHours}h/día)</span><span className="font-bold">{(dailySentryAdded * daysInHigh).toFixed(1)} kWh</span></div>)}{state.sentryMode && daysInHigh < state.days && (<div className="text-xs font-bold text-orange-400 italic text-right">* Se desactivó tras {daysInHigh.toFixed(1)} días por batería baja ({state.sentryDisablePct}%)</div>)}{state.preconditioning && (<div className="flex justify-between text-sm font-bold text-orange-300"><span className="flex items-center gap-1"><Icons.Thermometer /> Climatización</span><span>{(dailyPrecon * state.days).toFixed(1)} kWh</span></div>)}<div className="flex justify-between text-sm font-bold text-purple-300"><span className="flex items-center gap-1"><Icons.Smartphone /> Consultas App</span><span>{totalAppDrain.toFixed(1)} kWh</span></div></div></div>
                    <div className="bg-blue-900/20 border border-blue-900/50 rounded-xl p-6"><div className="flex gap-3 items-center mb-3"><div className="text-blue-400"><Icons.Shield className="w-6 h-6"/></div><h4 className="text-base font-bold text-blue-300">Cómo reducir el consumo (Vampire Drain)</h4></div><div className="text-sm font-bold text-slate-400 space-y-3"><p><strong>1. El "Sueño Profundo" es la clave:</strong> Si el coche duerme, solo consume ~0.2-0.4 kWh/día. Si se mantiene despierto (Centinela ON), consume 250Wh + el consumo extra derivado del nº de eventos.</p><p><strong>2. Cómo desactivar correctamente:</strong></p><ul className="list-disc pl-4 space-y-2"><li><span className="text-white">Centinela:</span> App > Seguridad > Modo Centinela (OFF) o automatizarlo por hora.</li><li><span className="text-white">Clima:</span> App > Climatización > Desactivar "Mantener", "Mascota" o "Campamento". Revisar "Programación" para que no se encienda solo.</li><li><span className="text-white">Apps de terceros:</span> Si usas apps como Tessie, TeslaMate, Stats, etc., pueden despertar al coche.</li></ul></div></div>
                </div>
            </div>
        );
      };

     

      // --- NYLAND CALCULATOR (LETRAS MÁS GRANDES) ---
      const NylandCalculator = () => {
        const [state, setState] = usePersistentState('nylandState', { distance: 500, speedA: 110, speedB: 140, refConsumption: 15.0, startPct: 100, arrivalPct: 10, battery: 60, costPerKwh: 0.45, chargingStrategy: 'optimal' });
        const getConsumption = (speed, ref) => ref * Math.pow(speed / 110, 1.5);
        const consA = getConsumption(state.speedA, state.refConsumption);
        const consB = getConsumption(state.speedB, state.refConsumption);
        const totalEnergyA = (consA * state.distance) / 100;
        const totalEnergyB = (consB * state.distance) / 100;
        const strategy = state.chargingStrategy === 'optimal' ? { label: "Cortas (10-60%)", avgPower: 130, addedPct: 50 } : { label: "Largas (10-90%)", avgPower: 75, addedPct: 80 };
        const bufferEnergy = state.battery * (state.arrivalPct / 100);
        const initialEnergy = state.battery * (state.startPct / 100);
        const netChargeNeededA = Math.max(0, totalEnergyA + bufferEnergy - initialEnergy);
        const netChargeNeededB = Math.max(0, totalEnergyB + bufferEnergy - initialEnergy);
        const energyPerStop = state.battery * (strategy.addedPct / 100);
        const stopsA = netChargeNeededA > 0 ? Math.ceil(netChargeNeededA / energyPerStop) : 0;
        const stopsB = netChargeNeededB > 0 ? Math.ceil(netChargeNeededB / energyPerStop) : 0;
        const timeDriveA = (state.distance / state.speedA) * 60;
        const timeDriveB = (state.distance / state.speedB) * 60;
        const timeChargeA = (netChargeNeededA / strategy.avgPower) * 60;
        const timeChargeB = (netChargeNeededB / strategy.avgPower) * 60;
        const totalTimeA = timeDriveA + timeChargeA;
        const totalTimeB = timeDriveB + timeChargeB;
        const timeDiff = totalTimeA - totalTimeB; 
        const costA = netChargeNeededA * state.costPerKwh; 
        const costB = netChargeNeededB * state.costPerKwh;
        const costDiff = costB - costA;
        const handleChange = (k, v) => setState(prev => ({...prev, [k]: parseFloat(v) || 0}));
       const handleStrategy = (val) => setState(prev => ({...prev, chargingStrategy: val}));
        
        const formatTimeLocal = (min) => {
            if(!min || !isFinite(min)) return "00:00";
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        };

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6"><h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.Gauge /> Parámetros del Viaje</h2><div className="space-y-6"><div><label className="text-sm font-bold text-slate-400 block mb-1">Distancia del Viaje (km)</label><FormattedInput value={state.distance} onChange={v => handleChange('distance', v)} /></div><div><label className="text-sm font-bold text-slate-400 block mb-1">Consumo Ref. a 110km/h (kWh/100)</label><FormattedInput decimals={1} value={state.refConsumption} onChange={v => handleChange('refConsumption', v)} /></div><div><label className="text-sm font-bold text-slate-400 block mb-1">Capacidad Batería (kWh)</label><FormattedInput value={state.battery} onChange={v => handleChange('battery', v)} /></div><div className="grid grid-cols-2 gap-4 pt-2"><div><label className="text-xs font-bold text-slate-400 block mb-1">% Salida</label><FormattedInput value={state.startPct} onChange={v => handleChange('startPct', v)} /></div><div><label className="text-xs font-bold text-slate-400 block mb-1">% Llegada</label><FormattedInput value={state.arrivalPct} onChange={v => handleChange('arrivalPct', v)} /></div></div><div className="pt-4 border-t border-slate-800"><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Velocidad Lenta (A)</label><span className="text-base font-bold text-blue-400">{state.speedA} km/h</span></div><input type="range" min="80" max="130" value={state.speedA} onChange={e => handleChange('speedA', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" /></div><div><div className="flex justify-between mb-2"><label className="text-sm font-bold text-slate-400">Velocidad Rápida (B)</label><span className="text-base font-bold text-red-400">{state.speedB} km/h</span></div><input type="range" min="110" max="200" value={state.speedB} onChange={e => handleChange('speedB', e.target.value)} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /></div><div className="pt-4 border-t border-slate-800"><label className="text-sm font-bold text-slate-400 block mb-2">Estrategia de Carga</label><div className="grid grid-cols-2 gap-2"><button onClick={()=>handleStrategy('optimal')} className={`py-3 px-2 text-xs rounded border font-bold ${state.chargingStrategy==='optimal' ? 'bg-yellow-600/50 border-yellow-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>Paradas Cortas (10-60%)</button><button onClick={()=>handleStrategy('deep')} className={`py-3 px-2 text-xs rounded border font-bold ${state.chargingStrategy==='deep' ? 'bg-purple-600/50 border-purple-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>Paradas Largas (10-90%)</button></div><div className="mt-2 text-xs font-bold text-slate-400 text-center">Potencia media estimada: {strategy.avgPower} kW</div><div className="mt-4"><label className="text-xs font-bold text-slate-400 block mb-1">Coste Carga (€/kWh)</label><FormattedInput decimals={2} value={state.costPerKwh} onChange={v => handleChange('costPerKwh', v)} /></div></div></div></div>
                </div>
                <div className="lg:col-span-7 space-y-6">
                    <div className={`border rounded-xl p-8 flex flex-col gap-6 shadow-lg relative overflow-hidden ${timeDiff > 0 ? 'bg-red-900/20 border-red-500/30' : 'bg-blue-900/20 border-blue-500/30'}`}><div className="flex justify-between items-start z-10"><div><div className="text-sm uppercase tracking-widest text-slate-300 font-bold mb-2">Ganador en Tiempo</div><div className="text-4xl font-display font-bold text-white">{Math.abs(timeDiff) < 2 ? "Empate Técnico" : timeDiff > 0 ? `Ir Rápido (${state.speedB} km/h)` : `Ir Tranquilo (${state.speedA} km/h)`}</div><div className="text-lg font-bold text-slate-200 mt-2">{Math.abs(timeDiff) < 2 ? "Mismo tiempo total" : `Ahorras ${Math.round(Math.abs(timeDiff))} minutos`}</div></div><div className="text-5xl"><Icons.Award /></div></div><div className="pt-6 border-t border-white/10 z-10"><div className="text-sm uppercase tracking-widest text-slate-300 font-bold mb-2">Impacto Económico</div><div className="flex justify-between items-end"><div className="text-lg font-bold text-slate-200">Ir rápido cuesta <span className="text-red-400 text-2xl font-bold">+{formatDecimal(costDiff)}€</span> extra</div><div className="text-xs font-bold text-slate-400">({formatDecimal(costA)}€ vs {formatDecimal(costB)}€)</div></div></div></div>
                    <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6"><h4 className="text-base font-bold text-slate-300 mb-6">Comparativa Detallada</h4><div className="mb-6"><div className="flex justify-between text-sm mb-2"><span className="text-blue-400 font-bold">Opción A ({state.speedA} km/h)</span><span className="text-white font-bold">{formatTimeShort(totalTimeA)} total</span></div><div className="h-10 flex rounded-full overflow-hidden bg-slate-800 mb-2"><div style={{width: `${(timeDriveA/totalTimeA)*100}%`}} className="bg-blue-600 flex items-center justify-center text-xs text-white/90 font-bold">Conducir {formatTimeShort(timeDriveA)}</div>{timeChargeA > 0 && (<div style={{width: `${(timeChargeA/totalTimeA)*100}%`}} className="bg-orange-500 flex items-center justify-center text-xs text-black/80 font-bold">Carga {formatTimeShort(timeChargeA)}</div>)}</div><div className="flex justify-between text-xs font-bold text-slate-400"><span>{stopsA} Paradas</span><span>Consumo: {consA.toFixed(1)} kWh/100</span></div></div><div><div className="flex justify-between text-sm mb-2"><span className="text-red-400 font-bold">Opción B ({state.speedB} km/h)</span><span className="text-white font-bold">{formatTimeShort(totalTimeB)} total</span></div><div className="h-10 flex rounded-full overflow-hidden bg-slate-800 mb-2"><div style={{width: `${(timeDriveB/totalTimeB)*100}%`}} className="bg-red-600 flex items-center justify-center text-xs text-white/90 font-bold">Conducir {formatTimeShort(timeDriveB)}</div>{timeChargeB > 0 && (<div style={{width: `${(timeChargeB/totalTimeB)*100}%`}} className="bg-orange-500 flex items-center justify-center text-xs text-black/80 font-bold">Carga {formatTimeShort(timeChargeB)}</div>)}</div><div className="flex justify-between text-xs font-bold text-slate-400"><span>{stopsB} Paradas</span><span>Consumo: {consB.toFixed(1)} kWh/100</span></div></div></div>
                    <div className="bg-slate-800/30 rounded-xl border border-slate-700 overflow-hidden"><div className="bg-slate-800 px-4 py-3 text-sm font-bold text-slate-300 uppercase">Balance Energético</div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700 bg-slate-900/50"><div className="p-3 text-xs text-slate-400 font-bold">CONCEPTO</div><div className="p-3 text-xs text-blue-400 font-bold">OPCIÓN A</div><div className="p-3 text-xs text-red-400 font-bold">OPCIÓN B</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700"><div className="p-3 text-xs font-bold text-slate-400">Consumo Total</div><div className="p-3 text-base text-white">{totalEnergyA.toFixed(1)} kWh</div><div className="p-3 text-base text-white">{totalEnergyB.toFixed(1)} kWh</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700"><div className="p-3 text-xs font-bold text-slate-400">Energía Recargada</div><div className="p-3 text-base text-white font-bold">{netChargeNeededA.toFixed(1)} kWh</div><div className="p-3 text-base text-white font-bold">{netChargeNeededB.toFixed(1)} kWh</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700"><div className="p-3 text-xs font-bold text-slate-400">Coste Recarga</div><div className="p-3 text-base text-green-400">{formatDecimal(costA)}€</div><div className="p-3 text-base text-green-400">{formatDecimal(costB)}€</div></div></div>
                </div>
            </div>
        );
      };


 
      // --- COMPONENTE: ESTRATEGIA DE CARGA (MODIFICADO: INPUTS DE PRECISIÓN Y KWH EDITABLE) ---
      const ChargingStrategy = () => {
        const [state, setState] = usePersistentState('strategyState_v2', {
            battery: 60,
            consumption: 15.0,
            power: 7.4,
            energyPrice: 0.09,
            deepDischargeLimit: 5, 
            vampireRate: 1, 
            chargingEfficiency: 97,
            regenPct: 18.0, // NUEVO: Dato de regeneración media
            chargeEndTime: '08:00', 
            currentKm: 0,
            lastCalibrationDate: '',
            purchaseDate: '', 
            dailyKm: { Mon: 75, Tue: 75, Wed: 75, Thu: 75, Fri: 75, Sat: 40, Sun: 40 },
            targets: { Mon: 0, Tue: 0, Wed: 0, Thu: 70, Fri: 0, Sat: 0, Sun: 100 }
        });

        const WeeklyCharge3D = ({ data }) => {
            const mountRef = useRef(null);

            useEffect(() => {
                if (!mountRef.current || !window.THREE) return;

                const width = mountRef.current.offsetWidth;
                const height = 300; 
                const scene = new THREE.Scene();
                scene.background = null; 

                const maxBarHeight = 50; 
                const centerY = maxBarHeight / 2;

                const camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 1000);
                const camDist = 160; 
                camera.position.set(0, centerY, camDist); 
                camera.lookAt(0, centerY, 0); 

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                
                while (mountRef.current.firstChild) {
                    mountRef.current.removeChild(mountRef.current.firstChild);
                }
                mountRef.current.appendChild(renderer.domElement);

                const vFOV = THREE.MathUtils.degToRad(camera.fov); 
                const visibleHeight = 2 * Math.tan(vFOV / 2) * camDist;
                const visibleWidth = visibleHeight * camera.aspect;
                
                const workingWidth = visibleWidth * 0.82; 
                const spacing = workingWidth / 7;
                const startX = - (spacing * 3); 

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(20, 50, 50);
                scene.add(dirLight);
                const bottomLight = new THREE.PointLight(0x3b82f6, 0.5);
                bottomLight.position.set(0, -10, 20);
                scene.add(bottomLight);

                const mainGroup = new THREE.Group();
                scene.add(mainGroup);

                const radius = spacing * 0.28;

                const gridGroup = new THREE.Group();
                const gridMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
                
                for(let i=0; i<=5; i++) {
                    const pct = i * 20;
                    const y = (pct / 100) * maxBarHeight;
                    
                    const points = [];
                    points.push(new THREE.Vector3(-visibleWidth/2 + 5, y, -5));
                    points.push(new THREE.Vector3(visibleWidth/2 - 5, y, -5));
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geometry, gridMaterial);
                    gridGroup.add(line);
                }
                scene.add(gridGroup);

                data.forEach((dayData, index) => {
                    const dayGroup = new THREE.Group();
                    const xPos = startX + (index * spacing);
                    dayGroup.position.set(xPos, 0, 0);

                    const baseGeo = new THREE.CylinderGeometry(radius + 0.5, radius + 0.5, 0.5, 32);
                    const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });
                    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                    baseMesh.position.y = -0.25; 
                    dayGroup.add(baseMesh);

                    const endPct = Math.max(0, dayData.endPct);
                    const solidHeight = (endPct / 100) * maxBarHeight;
                    
                    let colorHex = 0x22c55e; 
                    if (endPct < 20) colorHex = 0xeab308; 
                    if (endPct < 10) colorHex = 0xef4444; 

                    if (solidHeight > 0.1) {
                        const solidGeo = new THREE.CylinderGeometry(radius, radius, solidHeight, 32);
                        const solidMat = new THREE.MeshStandardMaterial({ 
                            color: colorHex, 
                            emissive: colorHex,
                            emissiveIntensity: 0.4,
                            roughness: 0.3 
                        });
                        const solidMesh = new THREE.Mesh(solidGeo, solidMat);
                        solidMesh.position.y = solidHeight / 2;
                        dayGroup.add(solidMesh);
                    }

                    const startPct = Math.max(0, dayData.startPct);
                    if (startPct > endPct) {
                        const glassHeight = ((startPct - endPct) / 100) * maxBarHeight;
                        const glassGeo = new THREE.CylinderGeometry(radius, radius, glassHeight, 32);
                        const glassMat = new THREE.MeshPhysicalMaterial({ 
                            color: 0x94a3b8, // Gris azulado
                            transparent: true, 
                            opacity: 0.4, // Opacidad sólida
                            roughness: 0.2,
                            metalness: 0.2,
                            transmission: 0.1 
                        });
                        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
                        glassMesh.position.y = solidHeight + (glassHeight / 2);
                        dayGroup.add(glassMesh);
                    }

                    const targetPct = dayData.target;
                    if (targetPct > 0) {
                        const targetHeight = (targetPct / 100) * maxBarHeight;
                        const ringGeo = new THREE.TorusGeometry(radius + 0.8, 0.3, 16, 32);
                        const ringMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa });
                        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                        ringMesh.rotation.x = Math.PI / 2;
                        ringMesh.position.y = targetHeight;
                        dayGroup.add(ringMesh);

                        const guideGeo = new THREE.CylinderGeometry(0.05, 0.05, targetHeight, 8);
                        const guideMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.3 });
                        const guideMesh = new THREE.Mesh(guideGeo, guideMat);
                        guideMesh.position.y = targetHeight / 2;
                        dayGroup.add(guideMesh);
                    }

                    mainGroup.add(dayGroup);
                });

                let frameId;
                let time = 0;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    time += 0.005;
                    mainGroup.rotation.y = Math.sin(time) * 0.03; 
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (!mountRef.current) return;
                    const w = mountRef.current.offsetWidth;
                    camera.aspect = w / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, height);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(frameId);
                    if (mountRef.current && renderer) mountRef.current.removeChild(renderer.domElement);
                };
            }, [data]);

            return <div ref={mountRef} className="w-full h-[300px] cursor-grab active:cursor-grabbing" title="Matriz de Energía 3D" />;
        };

        const [savedDate, setSavedDate] = useState(null);

        const dayLabels = { Mon: 'Lunes', Tue: 'Martes', Wed: 'Miércoles', Thu: 'Jueves', Fri: 'Viernes', Sat: 'Sábado', Sun: 'Domingo' };
        const dayInitials = { Mon: 'LU', Tue: 'MA', Wed: 'MI', Thu: 'JU', Fri: 'VI', Sat: 'SA', Sun: 'DO' };
        const dayOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

        const calculateStartTime = (endTime, durationMinutes) => {
            if(!endTime) return "--:--";
            const [h, m] = endTime.split(':').map(Number);
            const endTotal = h * 60 + m;
            let startTotal = endTotal - durationMinutes;
            if (startTotal < 0) startTotal += 1440;
            const startH = Math.floor(startTotal / 60);
            const startM = Math.round(startTotal % 60);
            return `${String(startH).padStart(2, '0')}:${String(startM).padStart(2, '0')}`;
        };

        const parseSmartDate = (dateStr) => {
            if (!dateStr) return null;
            const parts = dateStr.split(/[-/]/);
            if (parts.length === 3) {
                const p0 = parseInt(parts[0], 10);
                const p1 = parseInt(parts[1], 10);
                const p2 = parseInt(parts[2], 10);
                if (!isNaN(p0) && !isNaN(p1) && !isNaN(p2)) {
                    if (p2 > 1000) {
                        const date = new Date(p2, p1 - 1, p0);
                        if (date.getFullYear() === p2 && date.getMonth() === p1 - 1 && date.getDate() === p0) {
                            return date;
                        }
                    }
                }
            }
            const isoDate = new Date(dateStr);
            if (!isNaN(isoDate.getTime())) return isoDate;
            return null;
        };

        const getCarAge = () => {
            if (!state.purchaseDate) return null;
            const start = parseSmartDate(state.purchaseDate);
            if (!start) return null;
            const now = new Date();
            const diffTime = Math.abs(now - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            const safeDays = Math.max(1, diffDays);
            let years = now.getFullYear() - start.getFullYear();
            let months = now.getMonth() - start.getMonth();
            if (months < 0 || (months === 0 && now.getDate() < start.getDate())) {
                years--;
                months += 12;
            }
            return { text: `${years} años y ${months} meses`, days: safeDays };
        };

        const carAge = getCarAge(); 

        const calcAmps = () => state.power >= 11 ? { val: (state.power * 1000) / (400 * Math.sqrt(3)), phase: 'Trifásica (400V)'} : { val: (state.power * 1000) / 230, phase: 'Monofásica (230V)'};
        const chargeSpeedKmH = state.consumption > 0 ? (state.power / state.consumption) * 100 : 0;
        const chargeSpeedPctH = state.battery > 0 ? (state.power / state.battery) * 100 : 0;
        
        const getChargeWindowStats = () => {
            if(!state.chargeEndTime) return { hours: 0, kwh: 0, km: 0, pct: 0 };
            const [h, m] = state.chargeEndTime.split(':').map(Number);
            const totalHours = h + (m/60);
            return { hours: totalHours, kwh: totalHours * state.power, km: state.consumption > 0 ? (totalHours * state.power / state.consumption) * 100 : 0, pct: state.battery > 0 ? (totalHours * state.power / state.battery) * 100 : 0 };
        };

        const ampData = calcAmps();
        const windowStats = getChargeWindowStats();
        const minStartPctToFull = Math.max(0, 100 - windowStats.pct);
        const minStartKmToFull = (minStartPctToFull / 100) * (state.battery / state.consumption) * 100;

        const calculateWeek = () => {
            const results = [];
            let totalTime = 0, totalKmCharged = 0, totalKmDriven = 0, totalKwhCharged = 0;
            let lowestPoint = { pct: 100, day: 'Mon', km: 0 };
            let calibrationOpportunity = null;
            let lastChargeEvent = null;
            let simPct = 80; 

            dayOrder.forEach(day => {
                const kwhUsed = ((state.dailyKm[day] / 100) * state.consumption) + state.vampireRate;
                let endDayPct = simPct - (kwhUsed / state.battery) * 100; 
                simPct = (state.targets[day] > 0 && state.targets[day] > endDayPct) ? state.targets[day] : endDayPct;
                if(simPct > 100) simPct = 100;
            });
            
            let currentPct = simPct; 
            dayOrder.forEach(day => {
                const driven = state.dailyKm[day];
                const kwhUsed = ((driven / 100) * state.consumption) + state.vampireRate;
                const endDayPct = currentPct - (kwhUsed / state.battery) * 100;
                const endDayKm = (endDayPct / 100) * (state.battery / state.consumption) * 100;
                
                if (endDayPct < lowestPoint.pct) lowestPoint = { pct: endDayPct, day: day, km: endDayKm };

                const target = state.targets[day];
                let chargeTime = 0, kwhAdded = 0, kmAdded = 0;

                if (target > 0 && target > endDayPct) {
                    const chargeNeededPct = target - endDayPct;
                    kwhAdded = (chargeNeededPct / 100) * state.battery;
                    kmAdded = (kwhAdded / state.consumption) * 100;
                    chargeTime = state.power > 0 ? (kwhAdded / state.power) * 60 : 0;
                }

                if (target === 100 && !calibrationOpportunity) {
                    const surplus = endDayPct - state.deepDischargeLimit;
                    let advice = null;
                    if (surplus > 0.9 && lastChargeEvent) { 
                        const idealPrevTarget = lastChargeEvent.target - surplus;
                        advice = { prevDay: lastChargeEvent.day, oldTarget: lastChargeEvent.target, newTarget: Math.round(idealPrevTarget) };
                    }
                    calibrationOpportunity = { day: day, arrivalPct: endDayPct, targetDeep: state.deepDischargeLimit, isOptimal: surplus <= 0.9, advice: advice };
                }
                if (chargeTime > 0 && target < 100) lastChargeEvent = { day: day, target: target };

                const nextMorningPct = (target > 0 && target > endDayPct) ? target : endDayPct;
                results.push({ day, startPct: currentPct, driven, endPct: endDayPct, target, chargeTime, kwhAdded, kmAdded });
                
                totalTime += chargeTime;
                totalKmCharged += kmAdded;
                totalKmDriven += driven;
                totalKwhCharged += kwhAdded;
                currentPct = nextMorningPct;
            });
            return { results, totalTime, totalKmCharged, totalKmDriven, totalKwhCharged, lowestPoint, calibrationOpportunity };
        };

        const { results, totalTime, totalKmCharged, totalKmDriven, totalKwhCharged, lowestPoint, calibrationOpportunity } = calculateWeek();
        const reserveKm = totalKmCharged - totalKmDriven; 
        const totalCost = (totalKwhCharged / (state.chargingEfficiency / 100 || 1)) * state.energyPrice;
        const monthlyCost = (totalCost / 7) * 30.41;
        const annualCost = (totalCost / 7) * 365;

        // Cálculos de Ciclos y Longevidad
        const totalDrivingKwh = (state.currentKm / 100) * state.consumption;
        const daysOwned = carAge ? carAge.days : 0; 
        const totalVampireKwh = daysOwned * state.vampireRate;
        const totalNetKwh = totalDrivingKwh + totalVampireKwh;
        const efficiencyFactor = state.chargingEfficiency / 100 || 1;
        const totalGrossKwh = totalNetKwh / efficiencyFactor;
        const totalLossKwh = totalGrossKwh - totalNetKwh;
        
        // --- CÁLCULO DE REGENERACIÓN (NUEVO) ---
        // Formula: Si el consumo medio (state.consumption) es NETO (lo habitual en la pantalla del coche), 
        // la energía física total requerida para mover el coche es mayor.
        // TotalFísica = Neto / (1 - %Regen).
        // Regenerado = TotalFísica - Neto.
        const regenFactor = state.regenPct / 100;
        const totalPhysicalKwh = regenFactor < 1 ? totalDrivingKwh / (1 - regenFactor) : totalDrivingKwh;
        const totalRegenKwh = totalPhysicalKwh - totalDrivingKwh;
        const regenKmEquivalent = state.consumption > 0 ? (totalRegenKwh / state.consumption) * 100 : 0;
        const regenSavings = totalRegenKwh * state.energyPrice;

        const avgSessionDepth = 0.40; 
        const estimatedSessions = state.battery > 0 ? totalNetKwh / (state.battery * avgSessionDepth) : 0;
        const kmLossEquivalent = (totalLossKwh / state.consumption) * 100;
        const costDrivingHistory = totalDrivingKwh * state.energyPrice;
        const costVampireHistory = totalVampireKwh * state.energyPrice;
        const costLossHistory = totalLossKwh * state.energyPrice;
        const costTotalHistory = totalGrossKwh * state.energyPrice; 
        const vampireKmEquivalent = (totalVampireKwh / state.consumption) * 100;
        const avgDailyKmHistorical = daysOwned > 0 ? state.currentKm / daysOwned : 0;
        const cyclesUsed = state.battery > 0 ? totalNetKwh / state.battery : 0;
        const cyclesGuaranteed = 3000; 
        const cyclesLeft = Math.max(0, cyclesGuaranteed - cyclesUsed);
        
        let projectionDateStr = "---";
        let yearsLeftVal = 0;
        let projectionDate1500 = "---";
        let yearsLeft1500 = 0;
        const passed1500 = cyclesUsed >= 1500;

        if (daysOwned > 0 && cyclesUsed > 0) {
            const cyclesPerDay = cyclesUsed / daysOwned;
            if(cyclesPerDay > 0) {
                const daysLeft = cyclesLeft / cyclesPerDay;
                yearsLeftVal = daysLeft / 365;
                const futureDate = new Date();
                futureDate.setDate(futureDate.getDate() + daysLeft);
                projectionDateStr = futureDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });

                if (!passed1500) {
                    const cyclesRemaining1500 = 1500 - cyclesUsed;
                    const daysLeft1500 = cyclesRemaining1500 / cyclesPerDay;
                    yearsLeft1500 = daysLeft1500 / 365;
                    const futureDate1500 = new Date();
                    futureDate1500.setDate(futureDate1500.getDate() + daysLeft1500);
                    projectionDate1500 = futureDate1500.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
                } else { projectionDate1500 = "Superado"; }
            }
        }
        const avgDailyKmWeekly = totalKmDriven / 7;
        const dailyEnergyTotal = ((avgDailyKmWeekly / 100) * state.consumption) + state.vampireRate;
        const realConsumptionPer100 = avgDailyKmWeekly > 0 ? (dailyEnergyTotal / avgDailyKmWeekly) * 100 : 0;
        const kmLeftInCycles = realConsumptionPer100 > 0 ? (cyclesLeft * state.battery) / (realConsumptionPer100 / 100) : 0;
        const cycleTableData = [ { r: "0 al 100%", c: 500 }, { r: "10 al 100%", c: 500 }, { r: "20 al 100%", c: 1000 }, { r: "0 al 90%", c: 1500 }, { r: "10 al 90%", c: 1500 }, { r: "20 al 90%", c: 2000 }, { r: "0 al 80%", c: 3000 }, { r: "10 al 80%", c: 3000 }, { r: "20 al 80%", c: 3500 }, { r: "0 al 70%", c: 5000 }, { r: "10 al 70%", c: 5500 }, { r: "20 al 70%", c: 6000 } ];

        const sliderStyle = `
            .range-slider-input { pointer-events: none; -webkit-appearance: none; z-index: 10; }
            .range-slider-input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: white; border: 2px solid #3b82f6; cursor: pointer; position: relative; z-index: 20; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
            .range-slider-input::-moz-range-thumb { pointer-events: auto; width: 24px; height: 24px; border-radius: 50%; background: white; border: 2px solid #3b82f6; cursor: pointer; position: relative; z-index: 20; }
            #slider-dual-start::-webkit-slider-thumb { border-color: #eab308; } 
            #slider-dual-target::-webkit-slider-thumb { border-color: #22c55e; }
        `;

        return (
            <div className="grid grid-cols-1 gap-8 animate-fade-in">
                <style>{sliderStyle}</style>
                {/* 1. Global Settings */}
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">

                            <div><label className="text-sm font-bold text-slate-400 block mb-2">Potencia Carga (kW)</label><FormattedInput decimals={1} value={state.power} onChange={v => handleNumChange('power', v)} /></div>

                            <div><label className="text-sm font-bold text-red-400 block mb-2">Eficiencia Carga (%)</label><FormattedInput decimals={1} value={state.chargingEfficiency} onChange={v => handleNumChange('chargingEfficiency', v)} /></div>
                            
                            {/* NUEVO INPUT: REGENERACIÓN */}
                            <div><label className="text-sm font-bold text-cyan-400 block mb-2">Regeneración Media (%)</label><FormattedInput decimals={1} value={state.regenPct} onChange={v => handleNumChange('regenPct', v)} /></div>
                            
                            <div>

                                <input

                                    value={state.chargeEndTime} 
                                    onFocus={(e) => scrollToSafeZone(e.target)}
                                    onChange={(e) => handleChange('chargeEndTime', e.target.value)} 
                                    className="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-3 text-yellow-300 font-mono font-bold focus:outline-none focus:border-yellow-500 text-lg shadow-inner text-center h-[54px]"
                                />
                            </div>
                        </div>
                        
                        {/* El campo de carga profunda se mueve aquí si no cabe arriba o se mantiene si cabe, pero la estructura previa tenia 2 filas. El deep discharge estaba antes. Lo reinserto en el flujo si es necesario o lo dejo. En el código original estaba en la fila 2. Como he añadido Regen, ahora hay 5 items para 4 columnas en la fila 2. Reorganizo ligeramente para que quede bien. */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                             <div><label className="text-sm font-bold text-yellow-500 block mb-2">Carga Profunda (%)</label><FormattedInput decimals={0} value={state.deepDischargeLimit} onChange={v => handleNumChange('deepDischargeLimit', v)} /></div>
                        </div>

                        <div className="w-full bg-blue-900/20 border border-blue-500/30 rounded-xl p-4 mt-2">
                            <h3 className="text-sm font-bold text-blue-300 uppercase tracking-widest mb-3 border-b border-blue-500/20 pb-2 flex items-center gap-2">
                                <Icons.Zap className="w-4 h-4"/> Rendimiento y Capacidad de Carga (00:00 - {state.chargeEndTime})

                                <div><div className="text-xs font-bold text-slate-400 uppercase mb-1">Velocidad Carga</div><div className="text-xl font-bold text-white font-mono">{formatDecimal(chargeSpeedKmH, 0)} km/h</div><div className="text-xs font-bold text-slate-500">+{formatDecimal(chargeSpeedPctH, 1)} % por hora</div></div>
                                <div><div className="text-xs font-bold text-slate-400 uppercase mb-1">Tiempo Disponible</div><div className="text-xl font-bold text-green-400 font-mono">{formatDecimal(windowStats.hours, 1)} h</div><div className="text-xs font-bold text-slate-500">desde las 00:00h</div></div>
                                <div><div className="text-xs font-bold text-slate-400 uppercase mb-1">Máx. Carga Posible</div><div className="text-xl font-bold text-white font-mono">+{formatDecimal(windowStats.pct, 0)} %  [+{formatDecimal(windowStats.km, 0)} km]</div><div className="text-xs font-bold text-slate-500"><span className="text-xs font-bold text-slate-500">Mínimo para 100%: {formatDecimal(minStartPctToFull, 0)} % [{formatDecimal(minStartKmToFull, 0)} km]</span></div></div>
                            </div>
                            <div className="mt-4 pt-3 border-t border-blue-500/20 text-[11px] font-bold text-blue-200 leading-tight">
                                (*) Se sugiere la hora de inicio de carga de tal forma que termine momentos antes de su utilización. No es recomendable cargar al 100% si no va a utilizar el coche. Un truco si no va a usarlo es activar el Centinela para descargar un poco la batería.
                            </div>
                        </div>
                    </div>
                </div>

                {/* 2. Weekly Grid */}
                <div className="bg-slate-900/50 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div className="overflow-x-auto">
                        <table className="w-full text-base">
                            <thead className="bg-slate-800 text-slate-300 border-b border-slate-700">
                                <tr>
                                    <th className="px-4 py-2 text-left font-bold uppercase text-sm">Día</th>
                                    <th className="px-2 py-2 text-center font-bold uppercase text-sm w-36">Km Diarios</th>
                                    <th className="px-2 py-2 text-center font-bold uppercase text-sm text-orange-300">Estado Batería</th>
                                    <th className="px-2 py-2 text-center font-bold uppercase text-sm w-32 text-blue-300">Objetivo %</th>
                                    <th className="px-2 py-2 text-center font-bold uppercase text-sm text-green-400">Plan de Carga</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/50">
                                {results.map((row) => {
                                    const totalDailyKwh = ((state.dailyKm[row.day] / 100) * state.consumption) + state.vampireRate;
                                    const totalDailyPct = (totalDailyKwh / state.battery) * 100;
                                    const isCharging = row.chargeTime > 0;
                                    const startTimeStr = isCharging ? calculateStartTime(state.chargeEndTime, row.chargeTime) : "";

                                    return (
                                        <tr key={row.day} className={`transition-colors border-b border-slate-800/30 ${isCharging ? "bg-blue-900/10 hover:bg-blue-900/20" : "hover:bg-slate-800/30"}`}>
                                            <td className={`px-4 py-1 font-bold text-base ${['Sat','Sun'].includes(row.day) ? 'text-orange-400' : 'text-white'}`}>{dayLabels[row.day]}</td>
                                            <td className="px-2 py-1">
                                                <input type="number"
