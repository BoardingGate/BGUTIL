
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardingGate - Simulador Tesla Model 3</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Carga React Global (Robustez garantizada) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para procesar el código en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; }
      .font-display { font-family: 'Orbitron', sans-serif; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1a1a1a; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      
      /* Animación carretera infinita (Background Position) */
      @keyframes road-move { 
        0% { background-position: 0 0; } 
        100% { background-position: -60px 0; } /* Coincide con background-size */
      }
      .animate-road-move { animation-name: road-move; animation-timing-function: linear; animation-iteration-count: infinite; }
      
      /* Viento en CONTRA (Derecha a Izquierda) */
      @keyframes wind-flow-head { 
        0% { transform: translateX(100%); opacity: 0; } 
        50% { opacity: 0.6; } 
        100% { transform: translateX(-200%); opacity: 0; } 
      }
      
      /* Viento a FAVOR (Izquierda a Derecha) */
      @keyframes wind-flow-tail { 
        0% { transform: translateX(-100%); opacity: 0; } 
        50% { opacity: 0.6; } 
        100% { transform: translateX(200%); opacity: 0; } 
      }

      .wind-particle-head { animation: wind-flow-head 1s linear infinite; }
      .wind-particle-tail { animation: wind-flow-tail 1s linear infinite; }

      /* Ruedas girando */
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .animate-spin-fast { animation: spin 0.3s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Manejador de errores global visual -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error(error);
        const root = document.getElementById('root');
        if(root && root.innerHTML === "") {
           document.body.innerHTML = '<div style="color:#ff9999; padding:20px; background:#330000; font-family:monospace;"><h2>⚠️ Error de inicialización:</h2><p>' + message + '</p><p>Intenta recargar la página.</p></div>';
        }
      };
    </script>

    <script type="text/babel">
      // Acceso global a React
      const { useState, useEffect, useRef } = React;
      const { createRoot } = ReactDOM;
      
      // --- ICONOS SVG (Inline para carga instantánea) ---
      const Icons = {
        Wind: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
        Thermometer: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>,
        TrendingUp: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
        Gauge: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>,
        Zap: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
        Fuel: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>,
        Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      };

      // --- FÍSICA ---
      const calculateConsumption = (params) => {
        const mass = 1800; 
        const cr = 0.006; 
        const g = 9.81;
        const rho = 1.225; 
        const cd = 0.219; 
        const area = 2.22; 
        const drivetrainEfficiency = 0.90;

        const speedMs = params.speed / 3.6; 
        const gradientRad = Math.atan(params.gradient / 100);

        const fRoll = mass * g * cr * Math.cos(gradientRad);

        // Viento negativo (Contra) suma a la velocidad relativa
        // Viento positivo (Favor) resta a la velocidad relativa
        const relativeSpeed = speedMs - (params.windSpeed / 3.6);
        const fAero = 0.5 * rho * cd * area * Math.sign(relativeSpeed) * (relativeSpeed ** 2);
        const fGrade = mass * g * Math.sin(gradientRad);

        const totalForce = fRoll + fAero + fGrade;
        let powerWatts = totalForce * speedMs;

        let finalPowerKw;
        if (powerWatts > 0) {
            finalPowerKw = (powerWatts / 1000) / drivetrainEfficiency;
        } else {
            finalPowerKw = (powerWatts / 1000) * 0.7; 
        }

        const tempDiff = Math.abs(20 - params.temperature);
        const climatePowerKw = 0.5 + (tempDiff * 0.15);

        const totalPowerKw = finalPowerKw + climatePowerKw;

        let consumption = 0;
        if (params.speed > 0) {
            consumption = (totalPowerKw / params.speed) * 100;
        }

        // Escalar según referencia WLTP del usuario
        const BASE_PHYSICS_REF = 13.0; 
        const scalar = params.electricConsumptionRef / BASE_PHYSICS_REF;
        consumption = consumption * scalar;

        if (consumption < -10) consumption = -10; 
        
        return Math.max(consumption, -10); 
      };

      // --- COMPONENTES ---

      const ControlPanel = ({ params, setParams, costs, setCosts }) => {
        const handleChange = (key, value) => {
            setParams(prev => ({ ...prev, [key]: parseFloat(value) }));
        };

        const handleCostChange = (key, value) => {
            setCosts(prev => ({ ...prev, [key]: parseFloat(value) }));
        };

        return (
            <div className="bg-slate-900/50 backdrop-blur-lg border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                    <Icons.Settings /> Parámetros de Simulación
                </h2>
                
                <div className="space-y-6">
                    {/* Velocidad */}
                    <div>
                        <div className="flex justify-between mb-2 text-sm">
                            <span className="text-slate-400 flex items-center gap-1"><Icons.Gauge /> Velocidad</span>
                            <span className="text-blue-400 font-mono font-bold">{params.speed} km/h</span>
                        </div>
                        <input type="range" min="0" max="200" value={params.speed} 
                            onChange={(e) => handleChange('speed', e.target.value)}
                            className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>

                    {/* Temperatura */}
                    <div>
                        <div className="flex justify-between mb-2 text-sm">
                            <span className="text-slate-400 flex items-center gap-1"><Icons.Thermometer /> Temperatura</span>
                            <span className="text-blue-400 font-mono font-bold">{params.temperature}°C</span>
                        </div>
                        <input type="range" min="-20" max="50" value={params.temperature} 
                             onChange={(e) => handleChange('temperature', e.target.value)}
                            className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>

                    {/* Desnivel */}
                    <div>
                        <div className="flex justify-between mb-2 text-sm">
                            <span className="text-slate-400 flex items-center gap-1"><Icons.TrendingUp /> Desnivel</span>
                            <span className="text-blue-400 font-mono font-bold">{params.gradient}%</span>
                        </div>
                        <input type="range" min="-20" max="20" value={params.gradient} 
                             onChange={(e) => handleChange('gradient', e.target.value)}
                            className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>

                    {/* Viento */}
                    <div>
                        <div className="flex justify-between mb-2 text-sm">
                            <span className="text-slate-400 flex items-center gap-1"><Icons.Wind /> Viento</span>
                            <span className="text-blue-400 font-mono font-bold">
                                {Math.abs(params.windSpeed)} km/h {params.windSpeed < 0 ? 'Contra' : params.windSpeed > 0 ? 'Favor' : ''}
                            </span>
                        </div>
                        <input type="range" min="-50" max="50" value={params.windSpeed} 
                             onChange={(e) => handleChange('windSpeed', e.target.value)}
                            className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>

                    <div className="pt-6 border-t border-slate-800">
                        <h3 className="text-sm font-bold text-slate-300 mb-4">Configuración de Costes y Vehículo</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="text-xs text-slate-500 block mb-1">Electricidad (€/kWh)</label>
                                <input type="number" step="0.01" value={costs.electricityPrice}
                                    onChange={(e) => handleCostChange('electricityPrice', e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
                            </div>
                            <div>
                                <label className="text-xs text-slate-500 block mb-1">Gasolina (€/L)</label>
                                <input type="number" step="0.01" value={costs.gasPrice}
                                    onChange={(e) => handleCostChange('gasPrice', e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
                            </div>
                            <div>
                                <label className="text-xs text-slate-500 block mb-1">Consumo Ref. Gasolina (L/100)</label>
                                <input type="number" step="0.1" value={costs.gasConsumptionRef}
                                    onChange={(e) => handleCostChange('gasConsumptionRef', e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
                            </div>
                            <div>
                                <label className="text-xs text-slate-500 block mb-1">Consumo Ref. EV (kWh/100)</label>
                                <input type="number" step="0.1" value={params.electricConsumptionRef}
                                    onChange={(e) => handleChange('electricConsumptionRef', e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
                            </div>
                            <div>
                                <label className="text-xs text-slate-500 block mb-1">Capacidad Batería (kWh)</label>
                                <input type="number" step="1" value={params.batteryCapacity}
                                    onChange={(e) => handleChange('batteryCapacity', e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
      };

      const ResultsDisplay = ({ consumption, params, costs }) => {
        const costPer100Elec = (consumption * costs.electricityPrice).toFixed(2);
        const costPer100Gas = (costs.gasConsumptionRef * costs.gasPrice).toFixed(2);
        const savings = (parseFloat(costPer100Gas) - parseFloat(costPer100Elec)).toFixed(2);
        const savingsPercent = ((parseFloat(savings) / parseFloat(costPer100Gas)) * 100).toFixed(0);
        
        // Calcular autonomía: (Capacidad Batería / Consumo) * 100
        const range = consumption > 0.1 ? ((params.batteryCapacity / consumption) * 100).toFixed(0) : '---';

        return (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg relative overflow-hidden group">
                     <div className="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <div className="text-slate-400 text-sm mb-1 flex items-center gap-2"><Icons.Zap className="w-4 h-4"/> Consumo</div>
                    <div className="text-4xl font-display font-bold text-white tabular-nums">
                        {consumption.toFixed(1)}
                        <span className="text-lg text-slate-500 ml-2 font-sans font-normal">kWh/100</span>
                    </div>
                    <div className="text-sm text-blue-400 mt-2 font-bold">
                        Autonomía: {range} km
                    </div>
                </div>

                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg relative overflow-hidden group">
                    <div className="absolute inset-0 bg-green-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <div className="text-slate-400 text-sm mb-1">Coste Eléctrico</div>
                    <div className="text-4xl font-display font-bold text-green-400 tabular-nums">
                        {costPer100Elec}€
                        <span className="text-lg text-slate-500 ml-2 font-sans font-normal">/100km</span>
                    </div>
                    <div className="text-xs text-slate-500 mt-2 text-center">
                        Precio kWh: {costs.electricityPrice}€
                    </div>
                </div>

                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg relative overflow-hidden group">
                    <div className="absolute inset-0 bg-orange-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <div className="text-slate-400 text-sm mb-1 flex items-center gap-2"><Icons.Fuel className="w-4 h-4"/> Consumo en Térmico</div>
                    <div className="text-4xl font-display font-bold text-orange-400 tabular-nums">
                        {costPer100Gas}€
                        <span className="text-lg text-slate-500 ml-2 font-sans font-normal">/100km</span>
                    </div>
                    <div className="text-sm text-green-400 mt-2 font-bold flex flex-col items-center">
                        <span>Ahorro: {savings}€ ({savingsPercent}%)</span>
                        <span className="text-slate-600 text-xs font-normal">vs eléctrico</span>
                    </div>
                </div>
            </div>
        );
      };

      const Visualizer = ({ params }) => {
        const isMoving = params.speed > 0;
        const isHeadwind = params.windSpeed < 0;
        
        // 50 particles for wind
        const windParticles = Array.from({ length: Math.abs(params.windSpeed) * 1.5 }).map((_, i) => ({
            id: i,
            top: Math.random() * 100 + '%',
            delay: Math.random() * 2 + 's',
            duration: (Math.random() * 0.5 + 0.5) + 's'
        }));

        return (
            <div className="relative h-80 w-full bg-gradient-to-b from-[#2a0808] to-slate-950 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl mb-8">
                {/* HUD Overlay */}
                <div className="absolute top-4 left-4 right-4 flex justify-between z-20">
                    <div className="space-y-2">
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-blue-400 flex items-center gap-2">
                            <Icons.Gauge className="w-3 h-3" /> {params.speed} km/h
                        </div>
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-green-400 flex items-center gap-2">
                            <Icons.TrendingUp className="w-3 h-3" /> {params.gradient}% Desnivel
                        </div>
                    </div>
                    <div className="space-y-2 text-right">
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-orange-400 flex items-center gap-2 ml-auto">
                            <Icons.Thermometer className="w-3 h-3" /> {params.temperature}°C
                        </div>
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-cyan-400 flex items-center gap-2 ml-auto">
                            <Icons.Wind className="w-3 h-3" /> {Math.abs(params.windSpeed)} km/h {isHeadwind ? 'Contra' : 'Favor'}
                        </div>
                    </div>
                </div>

                {/* Environment */}
                <div className="absolute inset-0 bg-red-900/10"></div>

                {/* Wind Particles - INVERTED LOGIC as requested */}
                {params.windSpeed !== 0 && (
                    <div className="absolute inset-0 pointer-events-none z-10">
                        {windParticles.map(p => (
                            <div key={p.id} 
                                className={`absolute h-0.5 bg-white/20 rounded-full ${!isHeadwind ? 'wind-particle-head' : 'wind-particle-tail'}`}
                                style={{
                                    top: p.top,
                                    left: !isHeadwind ? '100%' : '-10%', 
                                    width: Math.random() * 50 + 50 + 'px',
                                    animationDuration: '0.8s',
                                    animationDelay: p.delay
                                }}
                            />
                        ))}
                    </div>
                )}

                {/* Car Container */}
                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-[400px] h-[200px] z-20 transition-transform duration-300"
                     style={{ transform: `translateX(-50%) rotate(${-params.gradient}deg)` }}>
                    
                    {/* Car Image */}
                    <img 
                        src="tesla_model_3.png" 
                        alt="Tesla Model 3"
                        className="w-full h-full object-contain relative z-10 filter drop-shadow-2xl contrast-125 brightness-90"
                        onError={(e) => {
                            e.target.onerror = null;
                            e.target.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/2019_Tesla_Model_3_Performance_AWD_Front.jpg/1920px-2019_Tesla_Model_3_Performance_AWD_Front.jpg';
                        }}
                    />

                    {/* Wheels Spinners */}
                    {/* Left Wheel: 12.8% */}
                    {/* Right Wheel: Adjusted 40px left (6% + 10% = 16%) */}
                    <div className={`absolute bottom-[20.5%] left-[12.8%] w-[12.1%] aspect-square rounded-full border-2 border-slate-400/30 border-t-white/80 z-20 ${isMoving ? 'animate-spin-fast' : ''}`}></div>
                    <div className={`absolute bottom-[20.5%] right-[16%] w-[12.1%] aspect-square rounded-full border-2 border-slate-400/30 border-t-white/80 z-20 ${isMoving ? 'animate-spin-fast' : ''}`}></div>
                </div>

                {/* Road */}
                <div className="absolute bottom-0 w-full h-24 bg-slate-800 overflow-hidden transform perspective-xl rotate-x-60">
                     <div 
                        className={`absolute top-10 left-0 right-0 h-1 w-full ${isMoving ? 'animate-road-move' : ''}`} 
                        style={{ 
                            backgroundImage: 'linear-gradient(90deg, rgba(100,116,139,1) 50%, transparent 50%)', 
                            backgroundSize: '60px 100%',
                            animationDuration: isMoving && params.speed > 0 ? `${200 / params.speed}s` : '0s' 
                        }}
                     ></div>
                </div>
            </div>
        );
      };

      const App = () => {
        const [params, setParams] = useState({
            speed: 120,
            temperature: 20,
            gradient: 0,
            windSpeed: 0,
            electricConsumptionRef: 13.2,
            batteryCapacity: 60
        });

        const [costs, setCosts] = useState({
            electricityPrice: 0.08,
            gasPrice: 1.45,
            gasConsumptionRef: 6.5
        });

        const [consumption, setConsumption] = useState(0);

        useEffect(() => {
            setConsumption(calculateConsumption(params));
        }, [params]);

        return (
            <div className="min-h-screen bg-[#0a0a0a] text-white p-4 md:p-8">
                <div className="max-w-5xl mx-auto">
                    <header className="mb-8 flex justify-between items-end border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-4xl md:text-5xl font-display font-bold">
                                <span className="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Boarding</span>
                                <span className="text-red-600">Gate</span>
                            </h1>
                            <p className="text-slate-500 font-light tracking-widest text-sm mt-1">REAL-TIME EFFICIENCY SIMULATOR</p>
                        </div>
                        <div className="text-xs text-slate-600 text-right hidden md:block">
                            <div>MODEL 3 HIGHLAND</div>
                            <div>PHYSICS ENGINE V2.1</div>
                        </div>
                    </header>

                    <main>
                        <Visualizer params={params} />
                        
                        <ResultsDisplay consumption={consumption} params={params} costs={costs} />

                        <div className="mt-8 grid grid-cols-1 lg:grid-cols-1 gap-8">
                             <ControlPanel params={params} setParams={setParams} costs={costs} setCosts={setCosts} />
                        </div>
                    </main>
                </div>
            </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
