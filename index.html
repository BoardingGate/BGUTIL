<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardingGate - Ecosistema Tesla</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Carga React Global -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; }
      .font-display { font-family: 'Orbitron', sans-serif; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1a1a1a; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      
      @keyframes road-move { 0% { background-position: 0 0; } 100% { background-position: -60px 0; } }
      .animate-road-move { animation-name: road-move; animation-timing-function: linear; animation-iteration-count: infinite; }
      
      @keyframes wind-flow-head { 0% { transform: translateX(0%); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateX(-200%); opacity: 0; } }
      .wind-particle-head { animation: wind-flow-head 1s linear infinite; }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .animate-spin-fast { animation: spin 0.3s linear infinite; }

      @keyframes charge-pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
      .animate-charge { animation: charge-pulse 2s infinite ease-in-out; }
      
      .animate-fade-in { animation: fadeIn 0.5s ease-in; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
      .tab-inactive { border-bottom: 2px solid transparent; color: #94a3b8; }
      .tab-inactive:hover { color: #e2e8f0; background: rgba(255, 255, 255, 0.05); }
      
      .custom-table th { padding: 0.75rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #334155; }
      .custom-table td { padding: 0.75rem; font-size: 0.875rem; color: #cbd5e1; border-bottom: 1px solid #1e293b; font-family: monospace; text-align: right; }
      .custom-table tr:last-child td { border-bottom: none; }
      .custom-table tr:hover td { background-color: rgba(30, 41, 59, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error(error);
        const root = document.getElementById('root');
        if(root && root.innerHTML === "") {
           document.body.innerHTML = '<div style="color:#ff9999; padding:20px; background:#330000; font-family:monospace;"><h2>⚠️ Error de inicialización:</h2><p>' + message + '</p><p>Intenta recargar la página.</p></div>';
        }
      };
    </script>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { createRoot } = ReactDOM;
      
      // --- FORMATTERS ---
      const formatMoney = (val) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val);
      const formatDecimal = (val) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: 1, maximumFractionDigits: 2 }).format(val);

      // --- COMPONENTE INPUT FORMATEADO ---
      const FormattedInput = ({ value, onChange, decimals = 0 }) => {
        const format = (val) => {
            if (val === '' || val === null || isNaN(val)) return '';
            return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: decimals }).format(val);
        };
        const [displayValue, setDisplayValue] = useState(format(value));
        useEffect(() => { setDisplayValue(format(value)); }, [value]);
        const handleChange = (e) => {
            const inputValue = e.target.value;
            if (!/^[\d.,-]*$/.test(inputValue)) return;
            setDisplayValue(inputValue);
            const cleanValue = inputValue.replace(/\./g, '').replace(',', '.');
            const numValue = parseFloat(cleanValue);
            if (!isNaN(numValue)) onChange(numValue); else if (cleanValue === '' || cleanValue === '-') onChange(0);
        };
        const handleBlur = () => { setDisplayValue(format(value)); };
        return (
            <input type="text" value={displayValue} onChange={handleChange} onBlur={handleBlur}
                className="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-2 text-yellow-300 font-mono font-bold focus:outline-none focus:border-yellow-500 text-sm placeholder-zinc-500 transition-colors text-right" />
        );
      };

      // --- ICONOS ---
      const Icons = {
        Wind: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
        Thermometer: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>,
        TrendingUp: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
        Gauge: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>,
        Zap: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
        Fuel: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>,
        Euro: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>,
        LogOut: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
        Piggy: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 5c-1.5 0-2.8.6-3.5 1.5A9 9 0 0 0 3 12c0 5 4 9 9 9s9-4 9-9a9 9 0 0 0-4-7.5c.7-.9 2-1.5 3.5-1.5.8 0 1.5.2 2 .6V4c-.5-.4-1.2-.6-2-.6z"/><path d="M16 14c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/><path d="M10 14c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/></svg>,
        Construction: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="8" rx="1"/><path d="M17 14v7"/><path d="M7 14v7"/><path d="M17 3v3"/><path d="M7 3v3"/><path d="M10 14 2.3 6.3"/><path d="m14 6 7.7 7.7"/><path d="m8 6 8 8"/></svg>,
        Table: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3h18v18H3z"/><path d="M21 9H3"/><path d="M21 15H3"/><path d="M12 3v18"/></svg>,
        Wrench: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
        Clock: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        BatteryCharging: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 18H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.19M15 6h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3.19"/><line x1="23" y1="13" x2="23" y2="11"/><polyline points="11 6 7 12 13 12 9 18"/></svg>,
        Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
        Eye: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
        Smartphone: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>,
        Sun: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
        Home: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
        AlertTriangle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
        Moon: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,
        Shield: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>,
        Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
        Award: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
        Activity: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      };

      // --- PLACEHOLDER TAB ---
      const PlaceholderTab = () => (
        <div className="flex flex-col items-center justify-center h-96 bg-slate-900/30 rounded-3xl border border-slate-800 border-dashed p-8 text-center">
            <div className="bg-slate-800 p-4 rounded-full mb-4 text-slate-400"><Icons.Construction /></div>
            <h3 className="text-xl font-display font-bold text-white mb-2">En Construcción</h3>
            <p className="text-slate-400 text-sm max-w-md mb-8">Esta funcionalidad estará disponible próximamente. Mientras tanto, puedes utilizar la versión completa en Excel.</p>
            <a href="https://docs.google.com/spreadsheets/d/1bLZmgVGTBqg2bS2E45JpORjs9eK2nb05AWXYLLDY-RI/edit?usp=drivesdk" 
               target="_blank"
               className="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-lg font-medium transition-all shadow-lg hover:shadow-green-900/20 flex items-center gap-2">
                <Icons.Piggy />
                VERSIÓN EN EXCEL de Google Drive
            </a>
            <p className="text-xs text-slate-600 mt-2">(haga un duplicado para su uso particular)</p>
         </div>
      );

      // --- FÍSICA (Simulador) ---
      const calculateConsumption = (params) => {
        const mass = 1800; const cr = 0.006; const g = 9.81;
        const rho = 1.225; const cd = 0.219; const area = 2.22; 
        const drivetrainEfficiency = 0.90;
        const speedMs = params.speed / 3.6; 
        const gradientRad = Math.atan(params.gradient / 100);
        const fRoll = mass * g * cr * Math.cos(gradientRad);
        const relativeSpeed = speedMs - (params.windSpeed / 3.6);
        const fAero = 0.5 * rho * cd * area * Math.sign(relativeSpeed) * (relativeSpeed ** 2);
        const fGrade = mass * g * Math.sin(gradientRad);
        const totalForce = fRoll + fAero + fGrade;
        let powerWatts = totalForce * speedMs;
        let finalPowerKw = powerWatts > 0 ? (powerWatts / 1000) / drivetrainEfficiency : (powerWatts / 1000) * 0.7; 
        const tempDiff = Math.abs(20 - params.temperature);
        const climatePowerKw = 0.5 + (tempDiff * 0.15);
        const totalPowerKw = finalPowerKw + climatePowerKw;
        let consumption = 0;
        if (params.speed > 0) consumption = (totalPowerKw / params.speed) * 100;
        const BASE_PHYSICS_REF = 14.0; 
        const scalar = params.electricConsumptionRef / BASE_PHYSICS_REF;
        consumption = consumption * scalar;
        return Math.max(consumption < -10 ? -10 : consumption, -10); 
      };

      // --- COMPONENTES DEL SIMULADOR ---
      const ControlPanel = ({ params, setParams, costs, setCosts }) => {
        const handleChange = (key, value) => setParams(prev => ({ ...prev, [key]: parseFloat(value) }));
        const handleCostChange = (key, value) => setCosts(prev => ({ ...prev, [key]: parseFloat(value) }));

        return (
            <div className="bg-slate-900/50 backdrop-blur-lg border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                    <Icons.Settings /> Parámetros de Simulación
                </h2>
                <div className="space-y-6">
                    {[
                        { icon: Icons.Gauge, label: "Velocidad", key: "speed", min: 0, max: 200, unit: "km/h" },
                        { icon: Icons.Thermometer, label: "Temperatura", key: "temperature", min: -20, max: 50, unit: "°C" },
                        { icon: Icons.TrendingUp, label: "Desnivel", key: "gradient", min: -20, max: 20, unit: "%" },
                        { icon: Icons.Wind, label: "Viento", key: "windSpeed", min: -50, max: 50, unit: "km/h", customLabel: val => `${Math.abs(val)} km/h ${val < 0 ? 'Contra' : val > 0 ? 'Favor' : ''}` }
                    ].map((item) => (
                        <div key={item.key}>
                            <div className="flex justify-between mb-2 text-sm">
                                <span className="text-slate-400 flex items-center gap-1"><item.icon /> {item.label}</span>
                                <span className="text-blue-400 font-mono font-bold">
                                    {item.customLabel ? item.customLabel(params[item.key]) : `${params[item.key]} ${item.unit}`}
                                </span>
                            </div>
                            <input type="range" min={item.min} max={item.max} value={params[item.key]} 
                                onChange={(e) => handleChange(item.key, e.target.value)}
                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                        </div>
                    ))}

                    <div className="pt-6 border-t border-slate-800">
                        <h3 className="text-sm font-bold text-slate-300 mb-4">Configuración Avanzada</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs text-slate-500 block mb-1">Electricidad (€/kWh)</label><FormattedInput decimals={3} value={costs.electricityPrice} onChange={(val) => handleCostChange('electricityPrice', val)} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Gasolina (€/L)</label><FormattedInput decimals={3} value={costs.gasPrice} onChange={(val) => handleCostChange('gasPrice', val)} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Consumo Gasolina (L/100)</label><FormattedInput decimals={1} value={costs.gasConsumptionRef} onChange={(val) => handleCostChange('gasConsumptionRef', val)} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Consumo EV (kWh/100)</label><FormattedInput decimals={1} value={params.electricConsumptionRef} onChange={(val) => handleChange('electricConsumptionRef', val)} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Batería (kWh)</label><FormattedInput value={params.batteryCapacity} onChange={(val) => handleChange('batteryCapacity', val)} /></div>
                        </div>
                    </div>
                </div>
            </div>
        );
      };

      const ResultsDisplay = ({ consumption, params, costs }) => {
        const costPer100ElecRaw = consumption * costs.electricityPrice;
        const costPer100GasRaw = costs.gasConsumptionRef * costs.gasPrice;
        const costPerKmElec = (costPer100ElecRaw / 100);
        const costPerKmGas = (costPer100GasRaw / 100);
        const savingsRaw = costPer100GasRaw - costPer100ElecRaw;
        const extraKm = Math.max(0, (costPerKmElec > 0.0001 ? (savingsRaw / parseFloat(costPerKmElec)) : 0));
        const range = consumption > 0.1 ? ((params.batteryCapacity / consumption) * 100) : 0;

        return (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="text-slate-400 text-sm mb-1 flex items-center gap-2"><Icons.Zap className="w-4 h-4"/> Consumo</div>
                    <div className="text-4xl font-display font-bold text-white tabular-nums">{formatDecimal(consumption)}<span className="text-lg text-slate-500 ml-2 font-sans font-normal">kWh/100</span></div>
                    <div className="text-sm text-blue-400 mt-2 font-bold">Autonomía: {formatMoney(range)} km</div>
                </div>

                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-start shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-green-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="flex flex-col items-center w-full mb-4">
                        <div className="text-slate-400 text-sm mb-1 flex items-center gap-2"><Icons.Euro className="w-4 h-4"/> Coste Eléctrico</div>
                        <div className="text-4xl font-display font-bold text-green-400 tabular-nums">{formatDecimal(costPer100ElecRaw)}€<span className="text-lg text-slate-500 ml-2 font-sans font-normal">/100km</span></div>
                        <div className="text-sm text-green-300/70 mt-1 font-mono font-bold">{formatDecimal(costPerKmElec)} €/km</div>
                        <div className="text-xs text-slate-500 mt-1">Ref: {costs.electricityPrice} €/kWh</div>
                    </div>
                    <div className="w-full h-px bg-slate-700 mb-3"></div>
                    <div className="w-full flex flex-col items-center">
                        <div className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-1">Ahorro vs Térmico</div>

      // --- CALCULADORA DE AMORTIZACIÓN ---
      const AmortizationCalculator = () => {
        const [data, setData] = useState({

            kmPerYear: 20000, consumptionEV: 16.0, consumptionICE: 6.0,

        const netPriceEV = data.priceEV - data.moves;
        const netPriceICE = data.priceICE - data.aidICE;
        const initialDifference = netPriceEV - netPriceICE;
        const totalBreakdownEV = data.priceEV * (data.breakdownRateEV / 100);
        const totalBreakdownICE = data.priceICE * (data.breakdownRateICE / 100);
        const annualBreakdownEV = totalBreakdownEV / data.yearsToProject;
        const annualBreakdownICE = totalBreakdownICE / data.yearsToProject;
        const annualFuelCost = (data.kmPerYear / 100) * data.consumptionICE * data.priceFuel;
        const annualElecCost = (data.kmPerYear / 100) * data.consumptionEV * data.priceElec;
        const totalAnnualCostEV = annualElecCost + data.maintenanceEV + annualBreakdownEV - data.taxSavingsEV;
        const totalAnnualCostICE = annualFuelCost + data.maintenanceICE + annualBreakdownICE - data.taxSavingsICE;
        const totalAnnualSavings = totalAnnualCostICE - totalAnnualCostEV;
        const breakEvenYears = initialDifference > 0 ? (initialDifference / totalAnnualSavings) : 0;
        const breakEvenKm = initialDifference > 0 ? (breakEvenYears * data.kmPerYear) : 0;
        const totalSavingsProjected = (totalAnnualSavings * data.yearsToProject) - initialDifference;
        const operatingSavingsTotal = totalAnnualSavings * data.yearsToProject;
        const effectiveCost = netPriceEV - operatingSavingsTotal;

        const tableRows = [];
        for (let i = 0; i <= data.yearsToProject; i++) {
            const cumCostEV = netPriceEV + (totalAnnualCostEV * i);
            const cumCostICE = netPriceICE + (totalAnnualCostICE * i);
            const currentKm = data.kmPerYear * i;
            tableRows.push({ year: i, km: currentKm, ev: cumCostEV, ice: cumCostICE, diff: cumCostICE - cumCostEV });
        }

        return (

                                <div className={`text-4xl font-bold font-display ${totalSavingsProjected >= 0 ? 'text-green-400' : 'text-red-400'}`}>{totalSavingsProjected > 0 ? '+' : ''}{formatMoney(totalSavingsProjected)}€</div>

                                <div><div className={`text-2xl font-bold font-display ${initialDifference <= 0 ? 'text-green-400' : 'text-white'}`}>{initialDifference <= 0 ? "0" : breakEvenYears.toFixed(1)} <span className="text-sm font-sans font-normal text-slate-400">años</span></div></div>

      // --- CALCULADORA DE CARGA ---

                        </div>

      // --- CURVA DE CARGA (CORREGIDA Y MEJORADA) ---
      const ChargeCurveCalculator = () => {
        const [state, setState] = useState({ batType: 'LFP', capacity: 60, startPct: 10, endPct: 80, costPerKwh: 0.45, chargerPower: 250 });

        const getPowerAtSoC = (soc, type) => {
            let maxP = 0;
            if (type === 'LFP') {
                if (soc < 10) maxP = 170; else if (soc < 30) maxP = 165; else if (soc < 50) maxP = 130; else if (soc < 70) maxP = 85; else if (soc < 90) maxP = 50; else maxP = 25;
            } else {
                if (soc < 5) maxP = 150; else if (soc < 25) maxP = 250; else if (soc < 40) maxP = 190; else if (soc < 60) maxP = 130; else if (soc < 80) maxP = 70; else maxP = 35;
            }
            return Math.min(maxP, state.chargerPower);
        };

        let totalMinutes = 0;
        const kwhPerPercent = state.capacity / 100;
        const safeStart = Math.min(state.startPct, state.endPct - 1);
        const safeEnd = Math.max(state.endPct, state.startPct + 1);

        for (let i = safeStart; i < safeEnd; i++) {
            const power = getPowerAtSoC(i, state.batType);
            totalMinutes += power > 0 ? (kwhPerPercent / power) * 60 : 0;
        }
        
        const totalEnergy = (safeEnd - safeStart) * kwhPerPercent;
        const totalCost = totalEnergy * state.costPerKwh;

        const chartBars = [];
        for (let i = 0; i <= 100; i+=2) {
            const power = getPowerAtSoC(i, state.batType);
            chartBars.push({ pct: i, power: power, active: i >= safeStart && i < safeEnd });
        }
        
        const handleChange = (k, v) => setState(prev => ({...prev, [k]: v}));

        return (

                                <button onClick={() => handleChange('batType', 'NCA')} className={`p-3 rounded border font-bold ${state.batType === 'NCA' ? 'bg-red-600 border-red-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>NCA (LR)</button>

                            <div><label className="text-xs text-slate-500 block mb-2">Potencia Cargador</label><div className="flex gap-2">{[50, 150, 250].map(p => <button key={p} onClick={() => handleChange('chargerPower', p)} className={`flex-1 py-2 rounded border text-xs font-bold ${state.chargerPower === p ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-500'}`}>{p} kW</button>)}</div></div>
                            <div className="pt-4 border-t border-slate-800">
                                <div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Rango: {safeStart}% - {safeEnd}%</label></div>
                                <div className="space-y-4">
                                     <input type="range" min="0" max="99" value={safeStart} onChange={e => handleChange('startPct', parseInt(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg accent-yellow-500" />
                                     <input type="range" min="1" max="100" value={safeEnd} onChange={e => handleChange('endPct', parseInt(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg accent-green-500" />
                                </div>
                            </div>
                            <div><label className="text-xs text-slate-500 block mb-1">Coste (€/kWh)</label><FormattedInput decimals={2} value={state.costPerKwh} onChange={v => handleChange('costPerKwh', v)} /></div>
                        </div>
                    </div>
                </div>
                <div className="lg:col-span-7 space-y-6">
                    <div className="h-64 bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex flex-col relative">
                         <div className="absolute top-2 left-4 text-xs text-slate-500 font-bold uppercase tracking-widest">Perfil de Potencia (kW)</div>
                         <div className="flex-1 flex items-end gap-0.5 pt-6">
                            {chartBars.map((bar) => (
                                <div key={bar.pct} className="flex-1 flex flex-col justify-end group relative h-full">
                                    <div className={`w-full rounded-t transition-all duration-300 ${bar.active ? 'bg-blue-500 opacity-100' : 'bg-slate-700 opacity-30'}`} style={{height: `${(bar.power / 250) * 100}%`}}></div>
                                </div>
                            ))}
                         </div>
                         <div className="flex justify-between text-[10px] text-slate-600 mt-1 font-mono"><span>0%</span><span>50%</span><span>100%</span></div>
                         <div className="absolute bottom-6 left-4 right-4 h-full pointer-events-none">
                             <div className="absolute bottom-0 top-0 border-l-2 border-dashed border-yellow-500 transition-all duration-200" style={{left: `${safeStart}%`}}></div>

                        <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-center"><div className="text-xs text-slate-500 uppercase mb-1">Coste</div><div className="text-2xl font-bold text-blue-400">{formatDecimal(totalCost)}€</div></div>
                    </div>
                </div>
            </div>
        );
      };

      // --- APP PRINCIPAL ---
