      };

      // --- EQUIVALENCE CALCULATOR (FINAL OPTIMIZED) ---
      const EquivalenceCalculator = () => {
        const [staticParams, setStaticParams] = usePersistentState('equivStatic', {
            capacity: 60, 
            consumption: 14.5, 
            price: 0.45,
            batType: 'LFP'
        });

        // Master values
        const [power, setPower] = usePersistentState('equivPower', 7.4);

        const powerPresets = [3.3, 4, 4.5, 6, 7.4, 11, 22, 40, 50, 60, 80, 100, 120, 140, 150, 180, 200, 250, 300, 400, 500, 800];
        const curvePoints = {
            LFP: [{p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}],
            NCA: [{p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}]
        };

        // Helper Functions
        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const points = curvePoints[type];
            const baseRef = type === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);
            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;
            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            return (p1.v + (ratio * (p2.v - p1.v))) * scaleFactor;
        };

        // Helper format time string
        const formatTime = (min) => {
            if(!min || !isFinite(min)) return "00:00:00";
            const h = Math.floor(min / 60);
            const m = Math.floor(min % 60);
            const s = Math.round((min * 60) % 60);
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        };

        // Linear vs Curve Calculations
        const voltage = power < 11 ? 230 : 400;
        const amps = (power * 1000) / voltage;
        
        // Linear Values
        const kwPerMinLin = power / 60;
        const kmPerMinLin = kwPerMinLin / (staticParams.consumption / 100);
        const timeToFullMinLin = power > 0 ? (staticParams.capacity / power) * 60 : 0;
        
        // Curve Values (Simulation 0-100%)
        let totalMinutesCurve = 0;
        const kwhPerPercent = staticParams.capacity / 100;
        for(let i=0; i<100; i++) {
            const limit = getBatteryLimitAtSoC(i, staticParams.batType, power);
            const realPower = Math.min(power, limit);
            if(realPower > 0) {
                totalMinutesCurve += (kwhPerPercent / realPower) * 60;
            }
        }
        
        // Averages based on Curve
        const avgPowerCurve = totalMinutesCurve > 0 ? staticParams.capacity / (totalMinutesCurve/60) : 0;
        const kwPerMinCurve = avgPowerCurve / 60;
        const kmPerMinCurve = kwPerMinCurve / (staticParams.consumption / 100);
        const costPerMin = kwPerMinCurve * staticParams.price; // Cost depends on delivered energy

        // Dual Data Display Component
        const DualDisplay = ({ label, linearVal, curveVal, unit, digits=2, isTime=false }) => (
            <div className="flex justify-between items-center text-xs">
                <span className="text-slate-400 uppercase font-bold">{label}</span>
                <div className="text-right">
                    <div className="text-white font-mono">
                        {isTime ? formatTime(linearVal) : formatDecimal(linearVal, digits)} 
                        {!isTime && <span className="text-[9px] text-slate-500">{unit} (Teórico)</span>}
                        {isTime && <span className="text-[9px] text-slate-500"> (Teórico)</span>}
                    </div>
                    <div className="text-orange-400 font-mono">
                        {isTime ? formatTime(curveVal) : formatDecimal(curveVal, digits)} 
                        {!isTime && <span className="text-[9px] text-orange-500/70">{unit} (Real)</span>}
                        {isTime && <span className="text-[9px] text-orange-500/70"> (Real)</span>}
                    </div>
                </div>
            </div>
        );

        // Slider Component
        const EquivSlider = ({ label, value, min, max, step, onChange, unit, highlight, digits=2, isMaster=false, showButtons=false, readOnly=false, dualData }) => {
            const handleStep = (direction) => {
                const newVal = parseFloat(value) + (step * direction);
                onChange(Math.min(max, Math.max(min, newVal)));
            };
            
            return (
                <div className={`bg-slate-900/50 border ${highlight ? 'border-blue-500/50 bg-blue-900/10' : 'border-slate-800'} rounded-xl p-4 transition-colors`}>
                    <div className="flex justify-between mb-2">
                        <label className={`text-xs font-bold uppercase tracking-wider ${highlight ? 'text-blue-300' : 'text-slate-400'}`}>{label}</label>
                        {!dualData && <span className={`font-mono font-bold ${highlight ? 'text-white' : 'text-slate-300'}`}>{formatDecimal(value, digits)} <span className="text-xs text-slate-500">{unit}</span></span>}
                    </div>
                    
                    {dualData && <div className="mb-3 space-y-1">{dualData}</div>}

                    <div className="flex items-center gap-3">
                        {showButtons && <button onClick={() => handleStep(-1)} className="btn-step">-</button>}
                        <input 
                            type="range" 
                            min={min} max={max} step={step} 
                            value={value || 0} 
                            onChange={(e) => !readOnly && onChange && onChange(e.target.value)}
                            className={`flex-grow h-2 rounded-lg appearance-none ${readOnly ? 'slider-readonly pointer-events-none bg-slate-800' : 'cursor-pointer slider-thumb'} ${!readOnly && highlight ? 'bg-blue-900' : 'bg-slate-700'} ${readOnly ? 'h-1' : ''}`}
                            disabled={readOnly}
                        />
                        {readOnly && <div className="flex-grow h-2 bg-slate-800 rounded-full overflow-hidden relative"><div className="absolute top-0 left-0 h-full bg-blue-500/50 transition-all duration-300" style={{width: `${Math.min(100, (value/max)*100)}%`}}></div></div>}
                        {showButtons && <button onClick={() => handleStep(1)} className="btn-step">+</button>}
                    </div>
                </div>
            );
        };

        return (
            <div className="space-y-8 animate-fade-in">
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                    <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                        <Icons.Link /> Calculadora de Equivalencias
                    </h2>
                    
                    {/* Static Inputs */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 pb-8 border-b border-slate-800 items-end">
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-3">
                            <label className="text-xs text-slate-500 font-bold block mb-2 uppercase">Tipo Batería</label>
                            <div className="flex gap-2">
                                <button onClick={() => setStaticParams({...staticParams, batType:'LFP'})} className={`flex-1 py-1 text-xs font-bold rounded ${staticParams.batType==='LFP' ? 'bg-green-600 text-white' : 'bg-slate-700 text-slate-400'}`}>LFP</button>
                                <button onClick={() => setStaticParams({...staticParams, batType:'NCA'})} className={`flex-1 py-1 text-xs font-bold rounded ${staticParams.batType==='NCA' ? 'bg-red-600 text-white' : 'bg-slate-700 text-slate-400'}`}>NCA</button>
                            </div>
                        </div>
                        <EquivSlider label="Capacidad Batería" value={staticParams.capacity} min="30" max="300" step="1" unit="kWh" onChange={v => setStaticParams({...staticParams, capacity: v})} digits={0} isMaster={true} showButtons={true} />
                        <EquivSlider label="Consumo Medio" value={staticParams.consumption} min="1" max="60" step="0.1" unit="kWh/100" onChange={v => setStaticParams({...staticParams, consumption: v})} digits={1} isMaster={true} showButtons={true} />
                        <EquivSlider label="Precio Energía" value={staticParams.price} min="0" max="2" step="0.01" unit="€/kWh" onChange={v => setStaticParams({...staticParams, price: v})} digits={2} isMaster={true} showButtons={true} />
                    </div>

                    {/* Dynamic Sliders Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        
                        {/* Potencia con Presets */}
                        <div className="md:col-span-2 space-y-4">
                            <EquivSlider label="POTENCIA CARGA (A CALCULAR)" value={power} min="1" max="800" step="0.01" unit="kW" onChange={v => setPower(Math.max(0, parseFloat(v)))} highlight digits={2} isMaster={true} showButtons={true} />
                            <div className="flex flex-wrap gap-2 justify-center bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                                {powerPresets.map(p => (
                                    <button key={p} onClick={() => setPower(p)} className={`btn-preset ${Math.abs(power - p) < 0.1 ? 'bg-blue-600 text-white border-blue-500 shadow-[0_0_10px_rgba(37,99,235,0.5)]' : ''}`}>{p} kW</button>
                                ))}
                            </div>
                        </div>

                        <EquivSlider label={`Amperaje (${voltage}V)`} value={amps} min="0" max="2000" step="1" unit="A" highlight digits={0} readOnly={true} />
                        
                        <EquivSlider 
                            label="" 
                            value={timeToFullMinLin} min="0" max={1440} step="1" 
                            readOnly={true} 
                            dualData={<DualDisplay label="Tiempo 0-100%" linearVal={timeToFullMinLin} curveVal={totalMinutesCurve} isTime={true} />}
                        />
                        
                        <EquivSlider 
                            label="" 
                            value={kmPerMinLin} min="0" max="50" step="0.1" 
                            readOnly={true}
                            dualData={<DualDisplay label="Velocidad (Km)" linearVal={kmPerMinLin} curveVal={kmPerMinCurve} unit="km/min" digits={1} />}
                        />

                        <EquivSlider 
                            label="" 
                            value={kwPerMinLin} min="0" max="50" step="0.1" 
                            readOnly={true}
                            dualData={<DualDisplay label="Velocidad (Energía)" linearVal={kwPerMinLin} curveVal={kwPerMinCurve} unit="kW/min" digits={1} />}
                        />
                        
                        <div className="md:col-span-2">
                             <EquivSlider label="Importe Medio Carga" value={costPerMin} min="0" max="30" step="0.01" unit="€/min" digits={2} readOnly={true} highlight />
                        </div>
                    </div>

                    <div className="mt-6 p-4 bg-blue-900/20 border border-blue-500/30 rounded-xl flex items-start gap-3">
                        <div className="mt-1 text-blue-400"><Icons.Activity /></div>
                        <div>
                            <h4 className="text-sm font-bold text-blue-300 mb-1">Modo Interactivo</h4>
                            <p className="text-xs text-slate-400 leading-relaxed">
                                <strong>Teórico (Lineal):</strong> Valores ideales si la carga fuera constante al 100% de potencia.<br/>
                                <strong>Real (Curva):</strong> Valores promedio simulando una sesión completa 0-100% aplicando la curva física de la batería seleccionada.<br/>
                                Solo el control de Potencia es deslizable para garantizar la precisión.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        );
      };

      // --- TARIFF COMPARATOR (ENHANCED A vs B) ---
      const TariffComparator = () => {
        const [tState, setTState] = usePersistentState('tariffCompV2', {
            // Shared Data
            days: 30,
            potP1: 4.6, potP2: 7.4,
            impuestoElec: 2.5, iva: 21,
            alquiler: 0.027, bonoSocial: 0.006,
            
            // Shared Consumption
            consTotal: 635,
            p1Kwh: 80, p2Kwh: 60, p3Kwh: 170, p3VeKwh: 325, p4Kwh: 0,

            // Proposal A (Default: Low cost night)
            propA: {
                name: "Compañía A",
                pricePotP1: 0.108, pricePotP2: 0.024,
                priceEnP1: 0.206, priceEnP2: 0.206, priceEnP3: 0.065, priceEnP3Ve: 0.065, priceEnP4: 0.065,
                discPot: 0, discEn: 0, comision: 0
            },

            // Proposal B (Default: Higher fixed, flat energy - Example)
            propB: {
                name: "Compañía B",
                pricePotP1: 0.11, pricePotP2: 0.03,
                priceEnP1: 0.15, priceEnP2: 0.15, priceEnP3: 0.15, priceEnP3Ve: 0.15, priceEnP4: 0.15,
                discPot: 0, discEn: 0, comision: 0
            },

            // Solar
            solarExp: 0, solarPrice: 0.08, virtualBat: false
        });

        // Handler for shared consumption updates
        const handleConsChange = (key, val) => {
            if (key === 'consTotal') {
                 // Redistribute based on current ratios
                 const currentTotal = tState.p1Kwh + tState.p2Kwh + tState.p3Kwh + tState.p3VeKwh + tState.p4Kwh || 1;
                 const ratio1 = tState.p1Kwh / currentTotal;
                 const ratio2 = tState.p2Kwh / currentTotal;
                 const ratio3 = tState.p3Kwh / currentTotal;
                 const ratio3ve = tState.p3VeKwh / currentTotal;
                 const ratio4 = tState.p4Kwh / currentTotal;

                 setTState(prev => ({
                     ...prev,
                     consTotal: val,
                     p1Kwh: val * ratio1,
                     p2Kwh: val * ratio2,
                     p3Kwh: val * ratio3,
                     p3VeKwh: val * ratio3ve,
                     p4Kwh: val * ratio4
                 }));
            } else {
                // Update specific bucket and sum total
                setTState(prev => {
                    const newState = { ...prev, [key]: val };
                    newState.consTotal = newState.p1Kwh + newState.p2Kwh + newState.p3Kwh + newState.p3VeKwh + newState.p4Kwh;
                    return newState;
                });
            }
        };

        const handlePropChange = (propKey, field, val) => {
            setTState(prev => ({
                ...prev,
                [propKey]: { ...prev[propKey], [field]: val }
            }));
        };

        const calculateBill = (proposal) => {
            const termPotRaw = (tState.potP1 * proposal.pricePotP1 * tState.days) + (tState.potP2 * proposal.pricePotP2 * tState.days);
            const termPotDisc = termPotRaw * (1 - proposal.discPot / 100);

            const termEnRaw = (tState.p1Kwh * proposal.priceEnP1) + 
                              (tState.p2Kwh * proposal.priceEnP2) + 
                              (tState.p3Kwh * proposal.priceEnP3) + 
                              (tState.p3VeKwh * proposal.priceEnP3Ve) + 
                              (tState.p4Kwh * proposal.priceEnP4);
            
            const termEnDisc = termEnRaw * (1 - proposal.discEn / 100);
            const solarReturn = tState.solarExp * tState.solarPrice;
            
            let termEnNet = termEnDisc - solarReturn;
            if(!tState.virtualBat) termEnNet = Math.max(0, termEnNet);

            const fixedCosts = (tState.alquiler * tState.days) + (tState.bonoSocial * tState.days) + proposal.comision;
            
            const baseImp = termPotDisc + termEnNet;
            const withIEE = baseImp * (1 + tState.impuestoElec / 100);
            const beforeIVA = withIEE + fixedCosts;
            const total = beforeIVA * (1 + tState.iva / 100);

            return { total, termPotDisc, termEnNet, fixedCosts };
        };

        const billA = calculateBill(tState.propA);
        const billB = calculateBill(tState.propB);
        const diff = billB.total - billA.total;

        // Sub-component for a Proposal Column
        const ProposalColumn = ({ propKey, title, data, onChange }) => (
            <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-700/50">
                <input type="text" value={data.name} onChange={(e) => onChange(propKey, 'name', e.target.value)} 
                    className="bg-transparent text-sm font-bold text-center w-full mb-4 border-b border-transparent hover:border-slate-600 focus:border-blue-500 outline-none text-blue-300" />
                
                <h4 className="text-[10px] uppercase font-bold text-slate-500 mb-2">Potencia (€/kW/día)</h4>
                <div className="grid grid-cols-2 gap-2 mb-4">
                    <div><label className="text-[9px] text-slate-600 block">P1</label><FormattedInput value={data.pricePotP1} onChange={v => onChange(propKey, 'pricePotP1', v)} decimals={4}/></div>
                    <div><label className="text-[9px] text-slate-600 block">P2</label><FormattedInput value={data.pricePotP2} onChange={v => onChange(propKey, 'pricePotP2', v)} decimals={4}/></div>
                </div>

                <h4 className="text-[10px] uppercase font-bold text-slate-500 mb-2">Energía (€/kWh)</h4>
                <div className="space-y-2 mb-4">
                    <div className="grid grid-cols-5 gap-1 items-center">
                         <span className="text-[9px] text-red-400 font-bold">P1</span>
                         <span className="col-span-4"><FormattedInput value={data.priceEnP1} onChange={v => onChange(propKey, 'priceEnP1', v)} decimals={4}/></span>
                    </div>
                    <div className="grid grid-cols-5 gap-1 items-center">
                         <span className="text-[9px] text-orange-400 font-bold">P2</span>
                         <span className="col-span-4"><FormattedInput value={data.priceEnP2} onChange={v => onChange(propKey, 'priceEnP2', v)} decimals={4}/></span>
                    </div>
                    <div className="grid grid-cols-5 gap-1 items-center">
                         <span className="text-[9px] text-green-400 font-bold">P3</span>
                         <span className="col-span-4"><FormattedInput value={data.priceEnP3} onChange={v => onChange(propKey, 'priceEnP3', v)} decimals={4}/></span>
                    </div>
                    <div className="grid grid-cols-5 gap-1 items-center">
                         <span className="text-[9px] text-blue-400 font-bold whitespace-nowrap">P3 VE</span>
                         <span className="col-span-4"><FormattedInput value={data.priceEnP3Ve} onChange={v => onChange(propKey, 'priceEnP3Ve', v)} decimals={4}/></span>
                    </div>
                    <div className="grid grid-cols-5 gap-1 items-center">
                         <span className="text-[9px] text-purple-400 font-bold">P4</span>
                         <span className="col-span-4"><FormattedInput value={data.priceEnP4} onChange={v => onChange(propKey, 'priceEnP4', v)} decimals={4}/></span>
                    </div>
                </div>

                <h4 className="text-[10px] uppercase font-bold text-slate-500 mb-2">Descuentos y Extras</h4>
                <div className="grid grid-cols-2 gap-2">
                    <div><label className="text-[9px] text-slate-600 block">% Dto Pot</label><FormattedInput value={data.discPot} onChange={v => onChange(propKey, 'discPot', v)} decimals={1}/></div>
                    <div><label className="text-[9px] text-slate-600 block">% Dto Ener</label><FormattedInput value={data.discEn} onChange={v => onChange(propKey, 'discEn', v)} decimals={1}/></div>
                    <div className="col-span-2"><label className="text-[9px] text-slate-600 block">Comisión Mensual (€)</label><FormattedInput value={data.comision} onChange={v => onChange(propKey, 'comision', v)} decimals={2}/></div>
                </div>
            </div>
        );

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
                {/* CONFIGURACIÓN SUPERIOR (Full Width) */}
                <div className="lg:col-span-12 space-y-4">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-wrap gap-6 items-center">
                        <h2 className="text-lg font-display font-bold text-white flex items-center gap-2"><Icons.Euro /> Comparador</h2>
                        <div className="w-px h-8 bg-slate-700"></div>
                        
                        <div className="flex gap-4">
                             <div><label className="text-[9px] text-slate-500 block">Días Factura</label><div className="w-16"><FormattedInput value={tState.days} onChange={v => setTState({...tState, days: v})} decimals={0}/></div></div>
                             <div><label className="text-[9px] text-slate-500 block">Pot P1 (kW)</label><div className="w-16"><FormattedInput value={tState.potP1} onChange={v => setTState({...tState, potP1: v})} decimals={1}/></div></div>
                             <div><label className="text-[9px] text-slate-500 block">Pot P2 (kW)</label><div className="w-16"><FormattedInput value={tState.potP2} onChange={v => setTState({...tState, potP2: v})} decimals={1}/></div></div>
                        </div>
                        <div className="w-px h-8 bg-slate-700"></div>
                        <div className="flex gap-4">
                             <div><label className="text-[9px] text-slate-500 block">IVA (%)</label><div className="w-16"><FormattedInput value={tState.iva} onChange={v => setTState({...tState, iva: v})} decimals={0}/></div></div>
                             <div><label className="text-[9px] text-slate-500 block">Imp. Elec (%)</label><div className="w-16"><FormattedInput value={tState.impuestoElec} onChange={v => setTState({...tState, impuestoElec: v})} decimals={2}/></div></div>
                        </div>
                        <div className="w-px h-8 bg-slate-700"></div>
                        <div className="flex gap-4">
                             <div><label className="text-[9px] text-slate-500 block">Alquiler/día</label><div className="w-16"><FormattedInput value={tState.alquiler} onChange={v => setTState({...tState, alquiler: v})} decimals={3}/></div></div>
                             <div><label className="text-[9px] text-slate-500 block">Bono Soc/día</label><div className="w-16"><FormattedInput value={tState.bonoSocial} onChange={v => setTState({...tState, bonoSocial: v})} decimals={3}/></div></div>
                        </div>
                    </div>

                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                        <div className="flex justify-between items-center mb-2">
                             <h3 className="text-xs text-slate-400 font-bold uppercase flex gap-2"><Icons.Activity className="w-3 h-3"/> Escenario de Consumo (kWh)</h3>
                             <div className="flex items-center gap-2"><span className="text-xs text-slate-500">Total:</span><span className="text-sm font-bold text-white bg-slate-800 px-2 py-1 rounded border border-slate-700">{formatDecimal(tState.consTotal, 0)}</span></div>
                        </div>
                        <div className="grid grid-cols-5 gap-2">
                            <div className="bg-red-900/20 p-2 rounded border border-red-900/30 text-center">
                                <label className="text-[9px] text-red-300 block mb-1">P1 (Punta)</label>
                                <FormattedInput value={tState.p1Kwh} onChange={v => handleConsChange('p1Kwh', v)} decimals={0}/>
                            </div>
                            <div className="bg-orange-900/20 p-2 rounded border border-orange-900/30 text-center">
                                <label className="text-[9px] text-orange-300 block mb-1">P2 (Llano)</label>
                                <FormattedInput value={tState.p2Kwh} onChange={v => handleConsChange('p2Kwh', v)} decimals={0}/>
                            </div>
                            <div className="bg-green-900/20 p-2 rounded border border-green-900/30 text-center">
                                <label className="text-[9px] text-green-300 block mb-1">P3 (Valle)</label>
                                <FormattedInput value={tState.p3Kwh} onChange={v => handleConsChange('p3Kwh', v)} decimals={0}/>
                            </div>
                            <div className="bg-blue-900/20 p-2 rounded border border-blue-900/30 text-center relative overflow-hidden">
                                <label className="text-[9px] text-blue-300 block mb-1 font-bold">P3 (VE)</label>
                                <FormattedInput value={tState.p3VeKwh} onChange={v => handleConsChange('p3VeKwh', v)} decimals={0}/>
                            </div>
                            <div className="bg-purple-900/20 p-2 rounded border border-purple-900/30 text-center">
                                <label className="text-[9px] text-purple-300 block mb-1">P4 (Extra)</label>
                                <FormattedInput value={tState.p4Kwh} onChange={v => handleConsChange('p4Kwh', v)} decimals={0}/>
                            </div>
                        </div>
                    </div>
                </div>

                {/* COLUMNAS PROPUESTAS */}
                <div className="lg:col-span-3">
                    <ProposalColumn propKey="propA" title="Propuesta A" data={tState.propA} onChange={handlePropChange} />
                </div>
                
                <div className="lg:col-span-3">
                    <ProposalColumn propKey="propB" title="Propuesta B" data={tState.propB} onChange={handlePropChange} />
                </div>

                {/* RESULTADOS */}
                <div className="lg:col-span-6 space-y-4">
                    <div className="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-xl p-6 h-full flex flex-col justify-center">
                        <h3 className="text-center text-sm uppercase tracking-widest text-slate-400 mb-6 font-bold">Resultado Comparativa</h3>
                        
                        <div className="flex justify-between items-center mb-8 px-4">
                            <div className={`text-center transition-all ${diff > 0 ? 'scale-110 opacity-100' : 'opacity-60 grayscale'}`}>
                                <div className="text-xs text-slate-500 mb-1">{tState.propA.name}</div>
                                <div className={`text-3xl font-display font-bold ${diff > 0 ? 'text-green-400' : 'text-slate-200'}`}>{formatDecimal(billA.total)}€</div>
                            </div>
                            
                            <div className="text-xs text-slate-600 font-bold">VS</div>

                            <div className={`text-center transition-all ${diff < 0 ? 'scale-110 opacity-100' : 'opacity-60 grayscale'}`}>
                                <div className="text-xs text-slate-500 mb-1">{tState.propB.name}</div>
                                <div className={`text-3xl font-display font-bold ${diff < 0 ? 'text-green-400' : 'text-slate-200'}`}>{formatDecimal(billB.total)}€</div>
                            </div>
                        </div>

                        <div className={`text-center p-4 rounded-xl border ${diff !== 0 ? 'bg-green-900/20 border-green-500/30' : 'bg-slate-800 border-slate-700'}`}>
                             {diff === 0 ? (
                                <div className="text-slate-400">Coste idéntico</div>
                             ) : (
                                <>
                                    <div className="text-xs text-green-400 uppercase font-bold mb-1">Opción Ganadora: {diff > 0 ? tState.propA.name : tState.propB.name}</div>
                                    <div className="text-2xl font-bold text-white">Ahorras {formatDecimal(Math.abs(diff))} € <span className="text-sm font-normal text-slate-400">/ factura</span></div>
                                    <div className="text-xs text-slate-500 mt-1">Proyección anual: ~{formatDecimal(Math.abs(diff) * (365/tState.days))} €</div>
                                </>
                             )}
                        </div>
                    </div>
                </div>
            </div>
        );
      };

      // --- APP PRINCIPAL ---
      const App = () => {
        const [activeTab, setActiveTab] = usePersistentState('activeTab', 'tariff'); 
        const [simParams, setSimParams] = usePersistentState('simParams', { speed: 120, temperature: 20, gradient: 0, windSpeed: 0, electricConsumptionRef: 14, batteryCapacity: 60 });
        const [simCosts, setSimCosts] = usePersistentState('simCosts', { electricityPrice: 0.08, gasPrice: 1.45, gasConsumptionRef: 6.5 });
        const [consumption, setConsumption] = useState(0);

        useEffect(() => { setConsumption(calculateConsumption(simParams)); }, [simParams]);

        const handleBack = () => { if (window.history.length > 1) window.history.back(); else window.close(); };

        const renderContent = () => {
            switch(activeTab) {
                case 'simulator': return <><Visualizer params={simParams} /><ResultsDisplay consumption={consumption} params={simParams} costs={simCosts} /><ControlPanel params={simParams} setParams={setSimParams} costs={simCosts} setCosts={setSimCosts} /></>;
                case 'amortization': return <AmortizationCalculator />;
                case 'calculator': return <ChargingCalculator />;
                case 'drain': return <DrainCalculator />;
                case 'nyland': return <NylandCalculator />;
                case 'curve': return <ChargeCurveCalculator />;
                case 'equiv': return <EquivalenceCalculator />;
                case 'tariff': return <TariffComparator />;
                default: return <PlaceholderTab />;
            }
        };

        const TabButton = ({ id, label }) => (
            <button onClick={() => setActiveTab(id)} className={`px-4 py-3 text-sm font-medium transition-all uppercase tracking-wider whitespace-nowrap ${activeTab === id ? 'tab-active' : 'tab-inactive'}`}>{label}</button>
        );

        return (
            <div className="min-h-screen bg-[#0a0a0a] text-white p-4 md:p-8">
                <div className="max-w-5xl mx-auto">
                    <header className="mb-6">
                        <div className="flex justify-between items-end border-b border-slate-800 pb-4">
                            <div>
                                <h1 className="text-4xl md:text-5xl font-display font-bold"><span className="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Boarding</span><span className="text-red-600">Gate</span></h1>
                                <p className="text-slate-500 font-light tracking-widest text-sm mt-1">TESLA EFFICIENCY TOOLS</p>
                            </div>
                            <button onClick={handleBack} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"><Icons.LogOut /> Volver</button>
                        </div>
                        <div className="flex overflow-x-auto gap-2 border-b border-slate-800/50 mt-4 pb-1">
                            <TabButton id="simulator" label="Simulador" />
                            <TabButton id="amortization" label="Amortización" />
                            <TabButton id="calculator" label="Calculadora" />
                            <TabButton id="drain" label="Drenaje" />
                            <TabButton id="nyland" label="Bjørn Nyland" />
                            <TabButton id="curve" label="Curva Carga" />
                            <TabButton id="equiv" label="Equivalencia" />
                            <TabButton id="tariff" label="Tarifa Real" />
                            <TabButton id="charge" label="Carga" />
                        </div>
                    </header>
                    <main className="animate-fade-in">{renderContent()}</main>
                </div>
            </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
