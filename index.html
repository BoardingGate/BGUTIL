<body>
    <div id="root"></div>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error(error);
        const root = document.getElementById('root');
        if(root && root.innerHTML === "") {
           document.body.innerHTML = '<div style="color:#ff9999; padding:20px; background:#330000; font-family:monospace;"><h2>⚠️ Error de inicialización:</h2><p>' + message + '</p><p>Intenta recargar la página.</p></div>';
        }
      };
    </script>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { createRoot } = ReactDOM;
      
      // --- CUSTOM HOOK: PERSISTENT STATE ---
      // Guarda y recupera automáticamente los datos del localStorage
      const usePersistentState = (key, initialValue) => {
        const [state, setState] = useState(() => {
            try {
                const item = window.localStorage.getItem(key);
                // Si existe, mezclamos con initialValue para asegurar que nuevos campos no rompan la app
                return item ? { ...initialValue, ...JSON.parse(item) } : initialValue;
            } catch (error) {
                console.warn(`Error reading localStorage key "${key}":`, error);
                return initialValue;
            }
        });

        useEffect(() => {
            try {
                window.localStorage.setItem(key, JSON.stringify(state));
            } catch (error) {
                console.warn(`Error setting localStorage key "${key}":`, error);
            }
        }, [key, state]);

        return [state, setState];
      };

      // --- FORMATTERS & COMPONENTS ---
      const formatMoney = (val) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val);
      const formatDecimal = (val, digits = 2) => new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: digits, maximumFractionDigits: digits }).format(val);

      const FormattedInput = ({ value, onChange, decimals = 0 }) => {
        const format = (val) => {
            if (val === '' || val === null || isNaN(val)) return '';
            return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: decimals }).format(val);
        };
        const [displayValue, setDisplayValue] = useState(format(value));
        useEffect(() => { setDisplayValue(format(value)); }, [value]);
        const handleChange = (e) => {
            const inputValue = e.target.value;
            if (!/^[\d.,-]*$/.test(inputValue)) return;
            setDisplayValue(inputValue);
            const cleanValue = inputValue.replace(/\./g, '').replace(',', '.');
            const numValue = parseFloat(cleanValue);
            if (!isNaN(numValue)) onChange(numValue); else if (cleanValue === '' || cleanValue === '-') onChange(0);
        };
        const handleBlur = () => { setDisplayValue(format(value)); };
        return (
            <input type="text" value={displayValue} onChange={handleChange} onBlur={handleBlur}
                className="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-2 text-yellow-300 font-mono font-bold focus:outline-none focus:border-yellow-500 text-sm placeholder-zinc-500 transition-colors text-right" />
        );
      };

      // --- ICONS ---
      const Icons = {

        Clock: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        BatteryCharging: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 18H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.19M15 6h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3.19"/><line x1="23" y1="13" x2="23" y2="11"/><polyline points="11 6 7 12 13 12 9 18"/></svg>,

        Eye: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
        Smartphone: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>,
        Sun: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
        Home: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
        AlertTriangle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
        Moon: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,

        Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,

        Activity: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,

      // --- COMPONENTE PLACEHOLDER ---
      const PlaceholderTab = () => (
        <div className="flex flex-col items-center justify-center h-96 bg-slate-900/30 rounded-3xl border border-slate-800 border-dashed p-8 text-center">
            <div className="bg-slate-800 p-4 rounded-full mb-4 text-slate-400"><Icons.Construction /></div>
            <h3 className="text-xl font-display font-bold text-white mb-2">En Construcción</h3>
            <p className="text-slate-400 text-sm max-w-md mb-8">Esta funcionalidad estará disponible próximamente. Mientras tanto, puedes utilizar la versión completa en Excel.</p>
            <a href="https://docs.google.com/spreadsheets/d/1bLZmgVGTBqg2bS2E45JpORjs9eK2nb05AWXYLLDY-RI/edit?usp=drivesdk" 
               target="_blank"
               className="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-lg font-medium transition-all shadow-lg hover:shadow-green-900/20 flex items-center gap-2">
                <Icons.Piggy />
                VERSIÓN EN EXCEL de Google Drive
            </a>
            <p className="text-xs text-slate-600 mt-2">(haga un duplicado para su uso particular)</p>
         </div>
      );

      // --- FÍSICA (Simulador) ---
      const calculateConsumption = (params) => {
        const mass = 1800; const cr = 0.006; const g = 9.81;
        const rho = 1.225; const cd = 0.219; const area = 2.22; 
        const drivetrainEfficiency = 0.90;
        const speedMs = params.speed / 3.6; 
        const gradientRad = Math.atan(params.gradient / 100);
        const fRoll = mass * g * cr * Math.cos(gradientRad);
        const relativeSpeed = speedMs - (params.windSpeed / 3.6);
        const fAero = 0.5 * rho * cd * area * Math.sign(relativeSpeed) * (relativeSpeed ** 2);
        const fGrade = mass * g * Math.sin(gradientRad);
        const totalForce = fRoll + fAero + fGrade;
        let powerWatts = totalForce * speedMs;
        let finalPowerKw = powerWatts > 0 ? (powerWatts / 1000) / drivetrainEfficiency : (powerWatts / 1000) * 0.7; 
        const tempDiff = Math.abs(20 - params.temperature);
        const climatePowerKw = 0.5 + (tempDiff * 0.15);
        const totalPowerKw = finalPowerKw + climatePowerKw;
        let consumption = 0;
        if (params.speed > 0) consumption = (totalPowerKw / params.speed) * 100;
        const BASE_PHYSICS_REF = 14.0; 
        const scalar = params.electricConsumptionRef / BASE_PHYSICS_REF;
        consumption = consumption * scalar;
        return Math.max(consumption < -10 ? -10 : consumption, -10); 
      };

      // --- COMPONENTES DEL SIMULADOR ---
      const ControlPanel = ({ params, setParams, costs, setCosts }) => {
        const handleChange = (key, value) => setParams(prev => ({ ...prev, [key]: parseFloat(value) }));
        const handleCostChange = (key, value) => setCosts(prev => ({ ...prev, [key]: parseFloat(value) }));

        return (
            <div className="bg-slate-900/50 backdrop-blur-lg border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                    <Icons.Settings /> Parámetros de Simulación
                </h2>
                <div className="space-y-6">
                    {[
                        { icon: Icons.Gauge, label: "Velocidad", key: "speed", min: 0, max: 200, unit: "km/h" },
                        { icon: Icons.Thermometer, label: "Temperatura", key: "temperature", min: -20, max: 50, unit: "°C" },
                        { icon: Icons.TrendingUp, label: "Desnivel", key: "gradient", min: -20, max: 20, unit: "%" },
                        { icon: Icons.Wind, label: "Viento", key: "windSpeed", min: -50, max: 50, unit: "km/h", customLabel: val => `${Math.abs(val)} km/h ${val < 0 ? 'Contra' : val > 0 ? 'Favor' : ''}` }
                    ].map((item) => (
                        <div key={item.key}>
                            <div className="flex justify-between mb-2 text-sm">
                                <span className="text-slate-400 flex items-center gap-1"><item.icon /> {item.label}</span>
                                <span className="text-blue-400 font-mono font-bold">
                                    {item.customLabel ? item.customLabel(params[item.key]) : `${params[item.key]} ${item.unit}`}
                                </span>
                            </div>
                            <input type="range" min={item.min} max={item.max} value={params[item.key]} 
                                onChange={(e) => handleChange(item.key, e.target.value)}
                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                        </div>
                    ))}

                    <div className="pt-6 border-t border-slate-800">
                        <h3 className="text-sm font-bold text-slate-300 mb-4">Configuración Avanzada</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs text-slate-500 block mb-1">Electricidad (€/kWh)</label><FormattedInput decimals={3} value={costs.electricityPrice} onChange={(val) => handleCostChange('electricityPrice', val)} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Gasolina (€/L)</label><FormattedInput decimals={3} value={costs.gasPrice} onChange={(val) => handleCostChange('gasPrice', val)} /></div>

      // --- CALCULADORA DE CARGA (RESTORED) ---
      const ChargingCalculator = () => {
        const [state, setState] = usePersistentState('chargeState', { 
            capacity: 60, 
            startPct: 20, 
            targetPct: 80, 
            power: 7.4, 
            consumption: 14.5, 
            energyPrice: 0.07, 
            dailyKm: 50,
            batType: 'LFP' // Default
        });

        // CURVE DATA (DUPLICATED FOR SAFETY)
        const curvePoints = {
            LFP: [{p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}],
            NCA: [{p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}]
        };

        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const points = curvePoints[type];
            const baseRef = type === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);
            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;
            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            return (p1.v + (ratio * (p2.v - p1.v))) * scaleFactor;
        };

        // Helper Time Format
        const formatTime = (min) => {
            if(!min || !isFinite(min)) return "00:00";
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        };

        const validTarget = Math.max(state.startPct, state.targetPct);
        const percentAdded = validTarget - state.startPct;
        const energyAdded = state.capacity * (percentAdded / 100);
        
        // LINEAR CALC
        const timeHoursLin = state.power > 0 ? energyAdded / state.power : 0;
        const minutesLin = timeHoursLin * 60;
        
        // CURVE CALC
        let minutesCurve = 0;
        const kwhPerPercent = state.capacity / 100;
        for (let i = state.startPct; i < validTarget; i++) {
            const limit = getBatteryLimitAtSoC(i, state.batType, state.power);
            const realPower = Math.min(state.power, limit);
            if (realPower > 0) minutesCurve += (kwhPerPercent / realPower) * 60;
        }

        const rangeAdded = state.consumption > 0 ? (energyAdded / state.consumption) * 100 : 0;
        const totalCost = energyAdded * state.energyPrice;
        const totalRangeAtTarget = state.consumption > 0 ? (state.capacity * (validTarget/100) / state.consumption) * 100 : 0;
        const dailyCost = (state.dailyKm / 100) * state.consumption * state.energyPrice;
        const monthlyCost = dailyCost * 30.41; 
        const annualCost = dailyCost * 365;

        const handleChange = (k, v) => {
            const val = parseFloat(v) || 0;
            setState(prev => {
                let updates = { [k]: val };
                if (k === 'power') updates.energyPrice = val < 11 ? 0.07 : 0.45;
                return { ...prev, ...updates };
            });
        };
        
        const powerPresets = [ { l: "Schuko", v: 2.3 }, { l: "GreenUp", v: 3.7 }, { l: "Wallbox 1F", v: 7.4 }, { l: "Wallbox 3F", v: 11 }, { l: "AC Público", v: 22 }, { l: "DC 50", v: 50 }, { l: "Supercharger", v: 150 } ];

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                        <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.BatteryCharging /> Parámetros de Carga</h2>
                        
                        {/* Battery Type Selector */}
                        <div className="flex gap-2 mb-4 bg-slate-800/50 p-1 rounded-lg border border-slate-700">
                             <button onClick={() => setState(p => ({...p, batType: 'LFP'}))} className={`flex-1 py-2 text-xs font-bold rounded-md transition-colors ${state.batType === 'LFP' ? 'bg-green-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>LFP (RWD)</button>
                             <button onClick={() => setState(p => ({...p, batType: 'NCA'}))} className={`flex-1 py-2 text-xs font-bold rounded-md transition-colors ${state.batType === 'NCA' ? 'bg-red-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>NCA (LR)</button>
                        </div>

                        <div className="space-y-6">

                            <div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Porcentaje de Inicio</label><span className="text-xs font-bold text-white">{state.startPct}%</span></div><input type="range" min="0" max="100" value={state.startPct} onChange={e => { const val = parseInt(e.target.value); setState(prev => ({...prev, startPct: val, targetPct: Math.max(val, prev.targetPct)})); }} className="w-full h-2 bg-slate-700 rounded-lg accent-yellow-500" /></div>
                            <div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Objetivo de Carga</label><span className="text-xs font-bold text-green-400">{state.targetPct}%</span></div><input type="range" min="0" max="100" value={state.targetPct} onChange={e => handleChange('targetPct', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg accent-green-500" /></div>
                            <div className="pt-4 border-t border-slate-800"><label className="text-xs text-slate-500 block mb-2">Potencia de Carga (kW)</label><FormattedInput value={state.power} onChange={v => handleChange('power', v)} decimals={1}/><div className="flex flex-wrap gap-2 mt-3">{powerPresets.map(p => (<button key={p.v} onClick={() => handleChange('power', p.v)} className={`px-2 py-1 text-[10px] rounded border transition-colors ${state.power === p.v ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{p.l}</button>))}</div></div>
                            <div className="pt-2 grid grid-cols-2 gap-4"><div><label className="text-xs text-slate-500 block mb-1">Consumo (kWh/100)</label><FormattedInput value={state.consumption} onChange={v => handleChange('consumption', v)} decimals={1}/></div><div><label className="text-xs text-slate-500 block mb-1">Precio Energía (€/kWh)</label><FormattedInput value={state.energyPrice} onChange={v => handleChange('energyPrice', v)} decimals={3}/></div></div>
                        </div>
                    </div>
                </div>
                <div className="lg:col-span-7 space-y-6">
                     <div className="bg-black/40 border border-slate-800 rounded-xl p-8 flex items-center justify-center relative overflow-hidden h-48">
                        <div className="relative w-full max-w-md h-24 border-4 border-slate-600 rounded-2xl p-1 flex items-center">
                            <div className="absolute -right-4 top-1/2 -translate-y-1/2 w-4 h-10 bg-slate-600 rounded-r-md"></div>
                            <div className="h-full bg-slate-800 rounded-l-lg" style={{width: `${state.startPct}%`}}></div>
                            <div className="h-full bg-green-500 animate-charge" style={{width: `${Math.max(0, percentAdded)}%`}}><div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTAgMTBMMTAgMFYxMEgwWiIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjEpIi8+PC9zdmc+')] opacity-30"></div></div>
                            <div className="flex-grow"></div>
                             <div className="absolute inset-0 flex items-center justify-center text-2xl font-display font-bold text-white drop-shadow-md z-10">{state.startPct}% <span className="text-slate-400 mx-2">➔</span> <span className="text-green-400">{state.targetPct}%</span></div>
                        </div>
                     </div>
                     <div className="grid grid-cols-2 gap-4">
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center">

                        </div>
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-400 text-xs uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.Euro className="w-4 h-4"/> Coste Recarga</div><div className="text-3xl font-display font-bold text-white">{formatDecimal(totalCost)}<span className="text-lg text-slate-500">€</span></div><div className="text-[10px] text-slate-500 mt-1">a {state.energyPrice} €/kWh</div></div>
                        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-400 text-xs uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.Zap className="w-4 h-4"/> Energía Añadida</div><div className="text-3xl font-display font-bold text-green-400">+{formatDecimal(energyAdded)} <span className="text-lg text-green-400/50">kWh</span></div><div className="text-[10px] text-slate-500 mt-1">del {state.startPct}% al {state.targetPct}%</div></div>

                     </div>
                     <div className="mt-8 pt-6 border-t border-slate-800 animate-fade-in"><h3 className="text-lg font-display font-bold text-slate-300 mb-4 flex items-center gap-2"><Icons.Calendar /> Proyección de Costes</h3><div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-center bg-slate-900/80 p-4 rounded-xl border border-slate-700"><div className="col-span-1"><label className="text-xs text-slate-500 block mb-2">Kilómetros Diarios</label><FormattedInput value={state.dailyKm} onChange={v => handleChange('dailyKm', v)} /></div><div className="col-span-3 grid grid-cols-3 gap-2"><div className="bg-slate-800/50 rounded p-3 text-center"><div className="text-[10px] text-slate-500 uppercase">Diario</div><div className="text-xl font-bold text-white">{formatDecimal(dailyCost)}€</div></div><div className="bg-slate-800/50 rounded p-3 text-center"><div className="text-[10px] text-slate-500 uppercase">Mensual</div><div className="text-xl font-bold text-white">{formatDecimal(monthlyCost)}€</div></div><div className="bg-slate-800/50 rounded p-3 text-center"><div className="text-[10px] text-slate-500 uppercase">Anual</div><div className="text-xl font-bold text-blue-400">{formatMoney(annualCost)}€</div></div></div></div></div>
                </div>

        );
      };
      
      // --- DRENAJE (RESTORED FULL LOGIC) ---
      const DrainCalculator = () => {
        const [state, setState] = usePersistentState('drainState', {
            battery: 60, days: 15, startPct: 80, isGarage: true, temperature: 16, sentryMode: false, sentryTraffic: 'low', sentryHours: 24, sentryDisablePct: 20, preconditioning: false, appChecks: 7,
        });
        const handleChange = (k, v) => setState(prev => ({...prev, [k]: v}));

        let dailyBaseRate = state.isGarage ? 0.2 : 0.4;
        const tempDiff = Math.abs(state.temperature - 20);
        dailyBaseRate += (tempDiff * 0.015);

        let dailySentryPotential = 5.5; 
        if (state.sentryTraffic === 'med') dailySentryPotential += 0.3;
        if (state.sentryTraffic === 'high') dailySentryPotential += 0.8;
        
        const hourlySentryRate = dailySentryPotential / 24;
        const dailySentryAdded = hourlySentryRate * state.sentryHours; 
        const dailyPrecon = state.preconditioning ? 1.5 : 0;
        const totalAppDrain = state.appChecks * 0.15;
        const dailyAppDrain = totalAppDrain / state.days;

        const drainHigh = dailyBaseRate + dailySentryAdded + dailyPrecon + dailyAppDrain;
        const drainLow = dailyBaseRate + dailyPrecon + dailyAppDrain;

        const startEnergy = state.battery * (state.startPct / 100);
        const disableEnergy = state.battery * (state.sentryDisablePct / 100);
        const energyForHigh = Math.max(0, startEnergy - disableEnergy);
        
        let daysInHigh = 0;
        let daysInLow = 0;

        if (!state.sentryMode) { daysInLow = state.days; } else {
            const daysUntilDisable = drainHigh > 0 ? energyForHigh / drainHigh : 0;
            if (daysUntilDisable >= state.days) { daysInHigh = state.days; } else { daysInHigh = daysUntilDisable; daysInLow = state.days - daysUntilDisable; }
        }
        const totalDrain = (daysInHigh * drainHigh) + (daysInLow * drainLow);
        const endEnergy = Math.max(0, startEnergy - totalDrain);
        const endPct = (endEnergy / state.battery) * 100;
        let daysUntilDead = 0;
        if (state.sentryMode && startEnergy > disableEnergy) {
             const timeToDisable = energyForHigh / drainHigh;
             const timeFromDisableToZero = disableEnergy / drainLow;
             daysUntilDead = timeToDisable + timeFromDisableToZero;
        } else { daysUntilDead = drainLow > 0 ? startEnergy / drainLow : 999; }
        const isCritical = endPct <= 5; const isWarning = endPct <= 20;

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6"><div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6"><h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.Shield /> Variables de Consumo</h2><div className="space-y-6"><div className="grid grid-cols-2 gap-4"><button onClick={() => handleChange('isGarage', true)} className={`p-3 rounded-lg border text-center transition-all ${state.isGarage ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><div className="flex justify-center mb-1"><Icons.Home /></div><span className="text-xs font-bold">Garaje</span></button><button onClick={() => handleChange('isGarage', false)} className={`p-3 rounded-lg border text-center transition-all ${!state.isGarage ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><div className="flex justify-center mb-1"><Icons.Moon /></div><span className="text-xs font-bold">Calle</span></button></div><div className="animate-fade-in"><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Temperatura Media</label><span className="text-xs font-bold text-white">{state.temperature}°C</span></div><input type="range" min="-10" max="45" value={state.temperature} onChange={e => handleChange('temperature', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500" /></div><div className="border-t border-slate-800 pt-4"><div className="flex items-center justify-between mb-3"><label className="text-sm font-bold text-slate-300 flex items-center gap-2"><Icons.Eye /> Modo Centinela</label><button onClick={() => handleChange('sentryMode', !state.sentryMode)} className={`w-12 h-6 rounded-full p-1 transition-colors ${state.sentryMode ? 'bg-red-500' : 'bg-slate-700'}`}><div className={`w-4 h-4 rounded-full bg-white transition-transform ${state.sentryMode ? 'translate-x-6' : 'translate-x-0'}`}></div></button></div>{state.sentryMode && (<div className="space-y-4 animate-fade-in"><div className="grid grid-cols-3 gap-2">{['low', 'med', 'high'].map(lvl => (<button key={lvl} onClick={() => handleChange('sentryTraffic', lvl)} className={`py-1 px-2 rounded border text-[10px] uppercase font-bold ${state.sentryTraffic === lvl ? 'bg-red-900/50 border-red-500 text-red-400' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>{lvl === 'low' ? 'Tranquilo' : lvl === 'med' ? 'Normal' : 'Intenso'}</button>))}</div><div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Horas activo / día</label><span className="text-xs font-bold text-white">{state.sentryHours}h</span></div><input type="range" min="1" max="24" value={state.sentryHours} onChange={e => handleChange('sentryHours', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /><p className="text-[10px] text-slate-500 mt-1 italic">Útil si lo tiene automatizado para que se active a ciertos horarios.</p></div><div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Desactivar si baja de:</label><span className="text-xs font-bold text-red-400">{state.sentryDisablePct}%</span></div><input type="range" min="5" max="50" value={state.sentryDisablePct} onChange={e => handleChange('sentryDisablePct', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /></div></div>)}</div><div className="border-t border-slate-800 pt-4 space-y-4"><div className="flex items-center justify-between"><label className="text-xs text-slate-400 flex items-center gap-2"><Icons.Thermometer /> Pre-acondicionamiento (1/día)</label><button onClick={() => handleChange('preconditioning', !state.preconditioning)} className={`w-10 h-5 rounded-full p-0.5 transition-colors ${state.preconditioning ? 'bg-orange-500' : 'bg-slate-700'}`}><div className={`w-4 h-4 rounded-full bg-white transition-transform ${state.preconditioning ? 'translate-x-5' : 'translate-x-0'}`}></div></button></div><div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500 flex items-center gap-2"><Icons.Smartphone /> Consultas App (Total)</label><span className="text-xs font-bold text-white">{state.appChecks} veces</span></div><input type="range" min="0" max="100" value={state.appChecks} onChange={e => handleChange('appChecks', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" /></div></div><div className="border-t border-slate-800 pt-4 space-y-4"><div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Capacidad Batería</label><span className="text-xs font-bold text-white">{state.battery} kWh</span></div><input type="range" min="40" max="100" value={state.battery} onChange={e => handleChange('battery', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" /></div><div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Días Aparcado</label><span className="text-xs font-bold text-white">{state.days} días</span></div><input type="range" min="1" max="90" value={state.days} onChange={e => handleChange('days', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" /></div><div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">% Inicial</label><span className="text-xs font-bold text-yellow-400">{state.startPct}%</span></div><input type="range" min="0" max="100" value={state.startPct} onChange={e => handleChange('startPct', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-yellow-500" /></div></div></div></div></div>
                <div className="lg:col-span-7 space-y-6">
                    <div className="bg-black/40 border border-slate-800 rounded-xl p-8 flex items-center justify-center relative overflow-hidden h-48"><div className="relative w-full max-w-md h-24 border-4 border-slate-600 rounded-2xl p-1 flex items-center"><div className="absolute -right-4 top-1/2 -translate-y-1/2 w-4 h-10 bg-slate-600 rounded-r-md"></div><div className="h-full bg-slate-800/50 rounded-l-lg absolute left-1" style={{width: `${state.startPct}%`}}></div><div className={`h-full rounded-l-lg relative z-10 transition-all duration-500 ${isCritical ? 'bg-red-600' : isWarning ? 'bg-yellow-600' : 'bg-green-600'}`} style={{width: `${endPct}%`}}></div><div className="absolute inset-0 flex items-center justify-center text-2xl font-display font-bold text-white drop-shadow-md z-20">{state.startPct}% <span className="text-slate-400 mx-2">➔</span> <span className={isCritical ? 'text-red-500' : isWarning ? 'text-yellow-400' : 'text-green-400'}>{endPct.toFixed(1)}%</span></div></div></div>
                    <div className="grid grid-cols-2 gap-4"><div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-400 text-xs uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.Zap className="w-4 h-4"/> Drenaje Total</div><div className="text-3xl font-display font-bold text-red-400">-{formatDecimal(totalDrain)} <span className="text-lg text-slate-500">kWh</span></div><div className="text-[10px] text-slate-500 mt-1">en {state.days} días</div></div><div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col items-center text-center"><div className="text-slate-400 text-xs uppercase tracking-widest mb-2 flex gap-2 items-center"><Icons.AlertTriangle className="w-4 h-4"/> Días hasta 0%</div><div className="text-3xl font-display font-bold text-white">{daysUntilDead > 365 ? '>1 año' : Math.floor(daysUntilDead)} <span className="text-lg text-slate-500">días</span></div><div className="text-[10px] text-slate-500 mt-1">si mantienes este ritmo</div></div></div>
                    <div className="bg-slate-800/30 rounded-xl p-4 border border-slate-700"><h4 className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Desglose Estimado</h4><div className="space-y-2"><div className="flex justify-between text-xs"><span className="text-slate-400">Consumo Base (Sleep)</span><span className="text-white">{(dailyBaseRate * state.days).toFixed(1)} kWh</span></div>{state.sentryMode && (<div className="flex justify-between text-xs text-red-300"><span className="flex items-center gap-1"><Icons.Eye /> Modo Centinela ({state.sentryHours}h/día)</span><span className="font-bold">{(dailySentryAdded * daysInHigh).toFixed(1)} kWh</span></div>)}{state.sentryMode && daysInHigh < state.days && (<div className="text-[10px] text-orange-400 italic text-right">* Se desactivó tras {daysInHigh.toFixed(1)} días por batería baja ({state.sentryDisablePct}%)</div>)}{state.preconditioning && (<div className="flex justify-between text-xs text-orange-300"><span className="flex items-center gap-1"><Icons.Thermometer /> Climatización</span><span>{(dailyPrecon * state.days).toFixed(1)} kWh</span></div>)}<div className="flex justify-between text-xs text-purple-300"><span className="flex items-center gap-1"><Icons.Smartphone /> Consultas App</span><span>{totalAppDrain.toFixed(1)} kWh</span></div></div></div>
                    <div className="bg-blue-900/20 border border-blue-900/50 rounded-xl p-4"><div className="flex gap-2 items-center mb-2"><div className="text-blue-400"><Icons.Shield /></div><h4 className="text-sm font-bold text-blue-300">Cómo reducir el consumo (Vampire Drain)</h4></div><div className="text-xs text-slate-400 space-y-2"><p><strong>1. El "Sueño Profundo" es la clave:</strong> Si el coche duerme, solo consume ~0.2-0.4 kWh/día. Si se mantiene despierto (Centinela ON), consume 250Wh + el consumo extra derivado del nº de eventos.</p><p><strong>2. Cómo desactivar correctamente:</strong></p><ul className="list-disc pl-4 space-y-1"><li><span className="text-white">Centinela:</span> App > Seguridad > Modo Centinela (OFF) o automatizarlo por hora.</li><li><span className="text-white">Clima:</span> App > Climatización > Desactivar "Mantener", "Mascota" o "Campamento". Revisar "Programación" para que no se encienda solo.</li><li><span className="text-white">Apps de terceros:</span> Si usas apps como Tessie, TeslaMate, Stats, etc., pueden despertar al coche.</li></ul></div></div>
                </div>
            </div>
        );
      };

      // --- NYLAND CALCULATOR (RESTORED) ---
      const NylandCalculator = () => {
        const [state, setState] = usePersistentState('nylandState', { distance: 500, speedA: 110, speedB: 140, refConsumption: 15.0, startPct: 100, arrivalPct: 10, battery: 60, costPerKwh: 0.45, chargingStrategy: 'optimal' });
        const getConsumption = (speed, ref) => ref * Math.pow(speed / 110, 1.5);
        const consA = getConsumption(state.speedA, state.refConsumption);
        const consB = getConsumption(state.speedB, state.refConsumption);
        const totalEnergyA = (consA * state.distance) / 100;
        const totalEnergyB = (consB * state.distance) / 100;
        const strategy = state.chargingStrategy === 'optimal' ? { label: "Cortas (10-60%)", avgPower: 130, addedPct: 50 } : { label: "Largas (10-90%)", avgPower: 75, addedPct: 80 };
        const bufferEnergy = state.battery * (state.arrivalPct / 100);
        const initialEnergy = state.battery * (state.startPct / 100);
        const netChargeNeededA = Math.max(0, totalEnergyA + bufferEnergy - initialEnergy);
        const netChargeNeededB = Math.max(0, totalEnergyB + bufferEnergy - initialEnergy);
        const energyPerStop = state.battery * (strategy.addedPct / 100);
        const stopsA = netChargeNeededA > 0 ? Math.ceil(netChargeNeededA / energyPerStop) : 0;
        const stopsB = netChargeNeededB > 0 ? Math.ceil(netChargeNeededB / energyPerStop) : 0;
        const timeDriveA = (state.distance / state.speedA) * 60;
        const timeDriveB = (state.distance / state.speedB) * 60;
        const timeChargeA = (netChargeNeededA / strategy.avgPower) * 60;
        const timeChargeB = (netChargeNeededB / strategy.avgPower) * 60;
        const totalTimeA = timeDriveA + timeChargeA;
        const totalTimeB = timeDriveB + timeChargeB;
        const timeDiff = totalTimeA - totalTimeB; 
        const costA = netChargeNeededA * state.costPerKwh; 
        const costB = netChargeNeededB * state.costPerKwh;
        const costDiff = costB - costA;
        const handleChange = (k, v) => setState(prev => ({...prev, [k]: parseFloat(v) || 0}));
        const handleStrategy = (val) => setState(prev => ({...prev, chargingStrategy: val}));
        
        const formatTime = (min) => {
            if(!min || !isFinite(min)) return "00:00";
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        };

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 space-y-6">
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6"><h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.Gauge /> Parámetros del Viaje</h2><div className="space-y-5"><div><label className="text-xs text-slate-500 block mb-1">Distancia del Viaje (km)</label><FormattedInput value={state.distance} onChange={v => handleChange('distance', v)} /></div><div><label className="text-xs text-slate-500 block mb-1">Consumo Ref. a 110km/h (kWh/100)</label><FormattedInput decimals={1} value={state.refConsumption} onChange={v => handleChange('refConsumption', v)} /></div><div><label className="text-xs text-slate-500 block mb-1">Capacidad Batería (kWh)</label><FormattedInput value={state.battery} onChange={v => handleChange('battery', v)} /></div><div className="grid grid-cols-2 gap-4 pt-2"><div><label className="text-[10px] text-slate-500 block mb-1">% Salida</label><FormattedInput value={state.startPct} onChange={v => handleChange('startPct', v)} /></div><div><label className="text-[10px] text-slate-500 block mb-1">% Llegada</label><FormattedInput value={state.arrivalPct} onChange={v => handleChange('arrivalPct', v)} /></div></div><div className="pt-4 border-t border-slate-800"><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Velocidad Lenta (A)</label><span className="text-xs font-bold text-blue-400">{state.speedA} km/h</span></div><input type="range" min="80" max="130" value={state.speedA} onChange={e => handleChange('speedA', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" /></div><div><div className="flex justify-between mb-1"><label className="text-xs text-slate-500">Velocidad Rápida (B)</label><span className="text-xs font-bold text-red-400">{state.speedB} km/h</span></div><input type="range" min="110" max="200" value={state.speedB} onChange={e => handleChange('speedB', e.target.value)} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" /></div><div className="pt-4 border-t border-slate-800"><label className="text-xs text-slate-500 block mb-2">Estrategia de Carga</label><div className="grid grid-cols-2 gap-2"><button onClick={()=>handleStrategy('optimal')} className={`py-2 px-2 text-[10px] rounded border font-bold ${state.chargingStrategy==='optimal' ? 'bg-yellow-600/50 border-yellow-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>Paradas Cortas (10-60%)</button><button onClick={()=>handleStrategy('deep')} className={`py-2 px-2 text-[10px] rounded border font-bold ${state.chargingStrategy==='deep' ? 'bg-purple-600/50 border-purple-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>Paradas Largas (10-90%)</button></div><div className="mt-2 text-[10px] text-slate-500 text-center">Potencia media estimada: {strategy.avgPower} kW</div><div className="mt-2"><label className="text-[10px] text-slate-500 block mb-1">Coste Carga (€/kWh)</label><FormattedInput decimals={2} value={state.costPerKwh} onChange={v => handleChange('costPerKwh', v)} /></div></div></div></div>
                </div>
                <div className="lg:col-span-7 space-y-6">
                    <div className={`border rounded-xl p-6 flex flex-col gap-4 shadow-lg relative overflow-hidden ${timeDiff > 0 ? 'bg-red-900/20 border-red-500/30' : 'bg-blue-900/20 border-blue-500/30'}`}><div className="flex justify-between items-start z-10"><div><div className="text-xs uppercase tracking-widest text-slate-400 mb-1">Ganador en Tiempo</div><div className="text-2xl font-display font-bold text-white">{Math.abs(timeDiff) < 2 ? "Empate Técnico" : timeDiff > 0 ? `Ir Rápido (${state.speedB} km/h)` : `Ir Tranquilo (${state.speedA} km/h)`}</div><div className="text-sm text-slate-300 mt-1">{Math.abs(timeDiff) < 2 ? "Mismo tiempo total" : `Ahorras ${Math.round(Math.abs(timeDiff))} minutos`}</div></div><div className="text-4xl"><Icons.Award /></div></div><div className="pt-4 border-t border-white/10 z-10"><div className="text-xs uppercase tracking-widest text-slate-400 mb-1">Impacto Económico</div><div className="flex justify-between items-end"><div className="text-sm">Ir rápido cuesta <span className="text-red-400 font-bold">+{formatDecimal(costDiff)}€</span> extra</div><div className="text-[10px] text-slate-500">({formatDecimal(costA)}€ vs {formatDecimal(costB)}€)</div></div></div></div>
                    <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6"><h4 className="text-sm font-bold text-slate-300 mb-6">Comparativa Detallada</h4><div className="mb-6"><div className="flex justify-between text-xs mb-2"><span className="text-blue-400 font-bold">Opción A ({state.speedA} km/h)</span><span className="text-white">{formatTime(totalTimeA)} total</span></div><div className="h-8 flex rounded-full overflow-hidden bg-slate-800 mb-1"><div style={{width: `${(timeDriveA/totalTimeA)*100}%`}} className="bg-blue-600 flex items-center justify-center text-[10px] text-white/80 font-bold">Conducir {formatTime(timeDriveA)}</div>{timeChargeA > 0 && (<div style={{width: `${(timeChargeA/totalTimeA)*100}%`}} className="bg-orange-500 flex items-center justify-center text-[10px] text-black/60 font-bold">Carga {formatTime(timeChargeA)}</div>)}</div><div className="flex justify-between text-[10px] text-slate-500"><span>{stopsA} Paradas</span><span>Consumo: {consA.toFixed(1)} kWh/100</span></div></div><div><div className="flex justify-between text-xs mb-2"><span className="text-red-400 font-bold">Opción B ({state.speedB} km/h)</span><span className="text-white">{formatTime(totalTimeB)} total</span></div><div className="h-8 flex rounded-full overflow-hidden bg-slate-800 mb-1"><div style={{width: `${(timeDriveB/totalTimeB)*100}%`}} className="bg-red-600 flex items-center justify-center text-[10px] text-white/80 font-bold">Conducir {formatTime(timeDriveB)}</div>{timeChargeB > 0 && (<div style={{width: `${(timeChargeB/totalTimeB)*100}%`}} className="bg-orange-500 flex items-center justify-center text-[10px] text-black/60 font-bold">Carga {formatTime(timeChargeB)}</div>)}</div><div className="flex justify-between text-[10px] text-slate-500"><span>{stopsB} Paradas</span><span>Consumo: {consB.toFixed(1)} kWh/100</span></div></div></div>
                    <div className="bg-slate-800/30 rounded-xl border border-slate-700 overflow-hidden"><div className="bg-slate-800 px-4 py-2 text-xs font-bold text-slate-400 uppercase">Balance Energético</div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700 bg-slate-900/50"><div className="p-2 text-[10px] text-slate-500 font-bold">CONCEPTO</div><div className="p-2 text-[10px] text-blue-400 font-bold">OPCIÓN A</div><div className="p-2 text-[10px] text-red-400 font-bold">OPCIÓN B</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700"><div className="p-2 text-xs text-slate-400">Consumo Total</div><div className="p-2 text-sm text-white">{totalEnergyA.toFixed(1)} kWh</div><div className="p-2 text-sm text-white">{totalEnergyB.toFixed(1)} kWh</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700 border-b border-slate-700"><div className="p-2 text-xs text-slate-400">Energía Recargada</div><div className="p-2 text-sm text-white font-bold">{netChargeNeededA.toFixed(1)} kWh</div><div className="p-2 text-sm text-white font-bold">{netChargeNeededB.toFixed(1)} kWh</div></div><div className="grid grid-cols-3 text-center divide-x divide-slate-700"><div className="p-2 text-xs text-slate-400">Coste Recarga</div><div className="p-2 text-sm text-green-400">{formatDecimal(costA)}€</div><div className="p-2 text-sm text-green-400">{formatDecimal(costB)}€</div></div></div>
                </div>
            </div>
        );
      };

      // --- CURVA DE CARGA (REDISEÑADA & EXTRAPOLADA) ---
      const ChargeCurveCalculator = () => {
        const [state, setState] = usePersistentState('curveState', { 
            batType: 'LFP', 
            capacity: 60, 
            startPct: 10, 
            endPct: 80, 
            costPerKwh: 0.45, 
            chargerPower: 150, 
            optimizationTime: 20,
            consumption: 15.0, 
            targetRange: 300
        });

        // CURVAS REALISTAS 2024
        const curvePoints = {
            // LFP (Model 3 RWD 60kWh):
            LFP: [
                {p:0, v:170}, {p:10, v:168}, {p:20, v:155}, {p:30, v:135}, 
                {p:45, v:110}, {p:55, v:85}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}
            ],
            // NCA (Model 3 LR/Perf 75-80kWh):
            NCA: [
                {p:0, v:200}, {p:5, v:250}, {p:15, v:250}, {p:25, v:210}, 
                {p:40, v:150}, {p:60, v:100}, {p:80, v:55}, {p:90, v:35}, {p:100, v:10}
            ]
        };

        const getBatteryLimitAtSoC = (soc, type, chargerPowerInput) => {
            const points = curvePoints[type];
            const baseRef = type === 'NCA' ? 250 : 170; 
            const techScaler = Math.max(baseRef, chargerPowerInput) / baseRef; 
            const scaleFactor = Math.max(1, techScaler);

            const p2Index = points.findIndex(pt => pt.p >= soc);
            if (p2Index === -1) return points[points.length-1].v * scaleFactor; 
            if (p2Index === 0) return points[0].v * scaleFactor;

            const p1 = points[p2Index - 1];
            const p2 = points[p2Index];
            const range = p2.p - p1.p;
            const dist = soc - p1.p;
            const ratio = dist / range;
            const factor = p1.v + (ratio * (p2.v - p1.v));

            return factor * scaleFactor;
        };

        // Helper format time string
        const formatTime = (min) => {
            if(!min || !isFinite(min)) return "00:00:00";
            const h = Math.floor(min / 60);
            const m = Math.floor(min % 60);
            const s = Math.round((min * 60) % 60);
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        };

        // HELPER: Calculate Time & Range for a given window
        const calculateMetrics = (start, end) => {
            let minutes = 0;
            const kwhPerPercent = state.capacity / 100;
            const safeStart = Math.min(start, end - 1);
            const safeEnd = Math.max(end, start + 1);

            for (let i = safeStart; i < safeEnd; i++) {
                const batteryLimit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
                const realPower = Math.min(state.chargerPower, batteryLimit);
                if (realPower > 0) {
                    minutes += (kwhPerPercent / realPower) * 60;
                }
            }
            
            const totalEnergy = (safeEnd - safeStart) * kwhPerPercent;
            // Range Added = Energy * (100 / Consumption)
            const rangeAdded = state.consumption > 0 ? (totalEnergy / state.consumption) * 100 : 0;
            // Total Range = (Capacity * End% / 100) / Consumption * 100
            const totalRange = state.consumption > 0 ? ((state.capacity * (safeEnd/100)) / state.consumption) * 100 : 0;

            return { minutes, rangeAdded, totalRange };
        };

        // HANDLER: Chart Sliders Changed -> Sync Bottom Sliders
        const handleChartChange = (key, value) => {
            const val = parseInt(value);
            const newStart = key === 'startPct' ? Math.min(val, state.endPct - 1) : state.startPct;
            const newEnd = key === 'endPct' ? Math.max(val, state.startPct + 1) : state.endPct;
            
            const metrics = calculateMetrics(newStart, newEnd);
            
            setState(prev => ({
                ...prev, 
                startPct: newStart, 
                endPct: newEnd,
                optimizationTime: Math.round(metrics.minutes),
                targetRange: Math.round(metrics.totalRange)
            }));
        };

        // HANDLER: Time Slider Changed -> Sync Chart & Range Slider
        const handleTimeOptimization = (minutes) => {
            const idealStart = 10; 
            let accumMinutes = 0;
            let foundEnd = idealStart;
            const kwhPerPercent = state.capacity / 100;

            for(let i = idealStart; i < 100; i++) {
                const limit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
                const realPower = Math.min(state.chargerPower, limit);
                if(realPower > 0) {
                    const minPerPct = (kwhPerPercent / realPower) * 60;
                    if (accumMinutes + minPerPct > minutes) break;
                    accumMinutes += minPerPct;
                    foundEnd = i + 1;
                }
            }
            const finalEnd = Math.min(100, foundEnd);
            const metrics = calculateMetrics(idealStart, finalEnd);

            setState(prev => ({ 
                ...prev, 
                startPct: idealStart, 
                endPct: finalEnd, 
                optimizationTime: minutes, 
                targetRange: Math.round(metrics.totalRange) 
            }));
        };

        // HANDLER: Range Slider Changed -> Sync Chart & Time Slider
        const handleRangeOptimization = (km) => {
            // Target % = (TargetKm / 100 * Consumption) * 100 / Capacity
            // Simplifies to: (TargetKm * Consumption) / Capacity
            let targetPct = (km * state.consumption) / state.capacity;
            targetPct = Math.ceil(targetPct);
            
            // Enforce bounds relative to Start %
            const safeEnd = Math.max(state.startPct + 1, Math.min(100, targetPct));
            
            const metrics = calculateMetrics(state.startPct, safeEnd);

            setState(prev => ({
                ...prev, 
                endPct: safeEnd, 
                targetRange: km,
                optimizationTime: Math.round(metrics.minutes)
            }));
        };

        const sliderStyle = `
            .range-slider-input { pointer-events: none; -webkit-appearance: none; z-index: 10; }
            .range-slider-input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: white; border: 2px solid #3b82f6; cursor: pointer; position: relative; z-index: 20; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
            .range-slider-input::-moz-range-thumb { pointer-events: auto; width: 24px; height: 24px; border-radius: 50%; background: white; border: 2px solid #3b82f6; cursor: pointer; position: relative; z-index: 20; }
            #slider-start::-webkit-slider-thumb { border-color: #eab308; } 
            #slider-end::-webkit-slider-thumb { border-color: #22c55e; }
        `;

        // Prepare Display Data
        const metrics = calculateMetrics(state.startPct, state.endPct);
        const totalCost = ((state.endPct - state.startPct) / 100 * state.capacity) * state.costPerKwh;
        const maxPossibleRange = state.consumption > 0 ? (state.capacity / state.consumption) * 100 : 0;
        const peakGraphHeight = Math.max(state.chargerPower, 250); 

        // Intervalo de 20kW
        const gridLines = [];
        for(let p = 20; p < peakGraphHeight; p += 20) {
            gridLines.push(p);
        }

        // Chart Bars
        const chartBars = [];
        for (let i = 0; i <= 100; i++) {
            const batteryLimit = getBatteryLimitAtSoC(i, state.batType, state.chargerPower);
            const realPower = Math.min(state.chargerPower, batteryLimit);
            const active = i >= state.startPct && i < state.endPct;
            chartBars.push({ pct: i, power: realPower, active });
        }

        const handleChange = (k, v) => setState(prev => ({...prev, [k]: v}));
        const setLFP = () => setState(prev => ({...prev, batType: 'LFP', capacity: 60}));
        const setNCA = () => setState(prev => ({...prev, batType: 'NCA', capacity: 75}));

        return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <style>{sliderStyle}</style>
                <div className="lg:col-span-4 space-y-6">
                     <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6 shadow-xl">
                        <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2"><Icons.Activity /> Parámetros de Carga</h2>
                        <div className="space-y-6">
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={setLFP} className={`p-3 rounded-lg border font-bold transition-all text-xs md:text-sm ${state.batType === 'LFP' ? 'bg-green-600 border-green-500 text-white shadow-[0_0_15px_rgba(22,163,74,0.4)]' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>LFP (Model 3 RWD)</button>
                                <button onClick={setNCA} className={`p-3 rounded-lg border font-bold transition-all text-xs md:text-sm ${state.batType === 'NCA' ? 'bg-red-600 border-red-500 text-white shadow-[0_0_15px_rgba(220,38,38,0.4)]' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>NCA (Gran Autonomía)</button>
                            </div>
                            
                            <div><label className="text-xs text-slate-500 block mb-1">Capacidad Batería (kWh)</label><FormattedInput value={state.capacity} onChange={v => handleChange('capacity', v)} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Consumo Medio (kWh/100km)</label><FormattedInput value={state.consumption} decimals={1} onChange={v => handleChange('consumption', v)} /></div>
                            
                            <div className="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                                <div className="flex justify-between mb-2">
                                    <label className="text-xs text-slate-400">Potencia Cargador</label>
                                    <span className="text-xs font-bold text-blue-400 font-mono">{state.chargerPower} kW</span>
                                </div>
                                <input type="range" min="3" max="800" step="1" value={state.chargerPower} onChange={e => handleChange('chargerPower', parseInt(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg cursor-pointer accent-blue-500" />
                                
                                <div className="relative w-full h-4 mt-1">
                                    <span className="absolute left-0 text-[9px] text-slate-500">Home (3)</span>
                                    <span className="absolute text-[9px] text-slate-500 -translate-x-1/2" style={{left: '18.4%'}}>V2 (150)</span>
                                    <span className="absolute text-[9px] text-slate-500 -translate-x-1/2" style={{left: '31%'}}>V3 (250)</span>
                                    <span className="absolute right-0 text-[9px] text-slate-500">800kW</span>
                                </div>
                            </div>

                            <div><label className="text-xs text-slate-500 block mb-1">Coste (€/kWh)</label><FormattedInput decimals={2} value={state.costPerKwh} onChange={v => handleChange('costPerKwh', v)} /></div>
                        </div>
                    </div>
                </div>

                <div className="lg:col-span-8 space-y-6">
                    <div className="h-[550px] bg-slate-900/50 border border-slate-800 rounded-xl p-6 flex flex-col relative shadow-2xl overflow-hidden">
                         
                         {/* CABECERA INTEGRADA */}
                         <div className="flex flex-col md:flex-row justify-between items-center mb-6 z-20 relative bg-slate-800/40 rounded-xl p-4 border border-slate-700/50 backdrop-blur-sm">
                             <div className="flex items-center gap-4 mb-2 md:mb-0">
                                 <div className="text-yellow-500 font-display font-bold text-sm bg-yellow-900/20 px-3 py-1 rounded border border-yellow-500/30">INICIO {state.startPct}%</div>
                                 <div className="text-slate-500 text-xs">➜</div>
                                 <div className="text-white font-bold text-xs bg-white/10 px-2 py-1 rounded border border-white/20">+{state.endPct - state.startPct}%</div>
                                 <div className="text-slate-500 text-xs">➜</div>
                                 <div className="text-green-500 font-display font-bold text-sm bg-green-900/20 px-3 py-1 rounded border border-green-500/30">FIN {state.endPct}%</div>
                             </div>
                             
                             <div className="flex gap-4 md:gap-6 text-center overflow-x-auto">
                                 <div>
                                     <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">+Km</div>
                                     <div className="text-xl font-bold text-green-400">+{Math.round(metrics.rangeAdded)}</div>
                                 </div>
                                 <div className="w-px bg-slate-600 h-8 self-center"></div>
                                 <div>
                                     <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Total</div>
                                     <div className="text-xl font-bold text-white">{Math.round(metrics.totalRange)} <span className="text-xs text-slate-500">km</span></div>
                                 </div>
                                 <div className="w-px bg-slate-600 h-8 self-center"></div>
                                 <div>
                                     <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Tiempo</div>
                                     <div className="text-xl font-bold text-white">{formatTime(metrics.minutes)}</div>
                                 </div>
                                 <div className="w-px bg-slate-600 h-8 self-center"></div>
                                 <div>
                                     <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Coste</div>
                                     <div className="text-xl font-bold text-blue-400">{formatDecimal(totalCost)}€</div>
                                 </div>
                             </div>
                         </div>
                         
                         {/* GRÁFICA CON EJE Y EXTERNO */}
                         <div className="flex-1 flex gap-2 relative pt-2 pb-10 border-b border-slate-700">
                             
                             {/* Columna Eje Y (Fuera) */}
                             <div className="w-8 flex flex-col justify-end relative h-full">
                                {gridLines.map(p => (
                                    <div key={p} className="absolute w-full text-right" style={{bottom: `${(p / peakGraphHeight) * 100}%`, transform: 'translateY(50%)'}}>
                                        <span className="text-[10px] font-bold text-white">{p}</span>
                                    </div>
                                ))}
                             </div>

                             {/* Área de Barras */}
                             <div className="flex-1 flex items-end gap-[1px] relative h-full">
                                {/* Líneas de grid horizontales */}
                                <div className="absolute inset-0 flex flex-col justify-end pointer-events-none z-0">
                                    {gridLines.map(p => (
                                        <div key={p} className="absolute w-full border-t border-slate-700/50" style={{bottom: `${(p / peakGraphHeight) * 100}%`}}></div>
                                    ))}
                                </div>

                                {chartBars.map((bar) => (
                                    <div key={bar.pct} className="flex-1 flex flex-col justify-end group relative h-full z-10">
                                        <div 
                                            className={`w-full rounded-t-sm transition-all duration-300 ${bar.active ? 'bg-gradient-to-t from-blue-600 to-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.3)]' : 'bg-slate-800'}`} 
                                            style={{height: `${(bar.power / peakGraphHeight) * 100}%`}}
                                        ></div>
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block bg-black text-white text-[10px] p-1 rounded whitespace-nowrap z-30 border border-slate-600">
                                            {bar.pct}% : {Math.round(bar.power)} kW
                                        </div>
                                    </div>
                                ))}
                                
                                <div className="absolute top-0 bottom-0 w-0.5 border-l-2 border-dashed border-yellow-500 transition-all duration-75 pointer-events-none z-20" style={{left: `${state.startPct}%`}}></div>
                                <div className="absolute top-0 bottom-0 w-0.5 border-l-2 border-dashed border-green-500 transition-all duration-75 pointer-events-none z-20" style={{left: `${state.endPct}%`}}></div>
                            </div>
                         </div>

                         {/* SLIDER RANGO */}
                         <div className="relative h-12 mt-4 select-none ml-10">
                             <div className="absolute top-1/2 -translate-y-1/2 left-0 right-0 h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                 <div className="absolute top-0 bottom-0 bg-gradient-to-r from-yellow-500 via-blue-500 to-green-500 opacity-80" style={{left: `${state.startPct}%`, right: `${100-state.endPct}%`}}></div>
                             </div>
                             
                             <input 
                                id="slider-start"
                                type="range" min="0" max="99" 
                                value={state.startPct} 
                                onChange={e => handleChartChange('startPct', e.target.value)}

                    {/* OPTIMIZADORES */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
