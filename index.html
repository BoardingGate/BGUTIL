
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardingGate - Ecosistema Tesla</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Carga React Global -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; }
      .font-display { font-family: 'Orbitron', sans-serif; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1a1a1a; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      
      /* Animaciones */
      @keyframes road-move { 
        0% { background-position: 0 0; } 
        100% { background-position: -60px 0; }
      }
      .animate-road-move { animation-name: road-move; animation-timing-function: linear; animation-iteration-count: infinite; }
      
      /* Efecto Glow para pestañas */
      .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
      .tab-inactive { border-bottom: 2px solid transparent; color: #94a3b8; }
      .tab-inactive:hover { color: #e2e8f0; background: rgba(255, 255, 255, 0.05); }
      
      /* Tabla */
      .custom-table th { padding: 0.75rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #334155; }
      .custom-table td { padding: 0.75rem; font-size: 0.875rem; color: #cbd5e1; border-bottom: 1px solid #1e293b; font-family: monospace; }
      .custom-table tr:last-child td { border-bottom: none; }
      .custom-table tr:hover td { background-color: rgba(30, 41, 59, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error(error);
        const root = document.getElementById('root');
        if(root && root.innerHTML === "") {
           document.body.innerHTML = '<div style="color:#ff9999; padding:20px; background:#330000; font-family:monospace;"><h2>⚠️ Error de inicialización:</h2><p>' + message + '</p><p>Intenta recargar la página.</p></div>';
        }
      };
    </script>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { createRoot } = ReactDOM;
      
      // ESTILO COMÚN PARA INPUTS (Gris Fondo, Amarillo Texto)
      const INPUT_STYLE = "w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-2 text-yellow-300 font-mono font-bold focus:outline-none focus:border-yellow-500 text-sm placeholder-zinc-500 transition-colors";

      // --- ICONOS ---
      const Icons = {
        Wind: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
        Thermometer: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>,
        TrendingUp: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
        Gauge: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>,
        Zap: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
        Fuel: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>,
        Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
        Euro: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>,
        LogOut: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
        Piggy: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 5c-1.5 0-2.8.6-3.5 1.5A9 9 0 0 0 3 12c0 5 4 9 9 9s9-4 9-9a9 9 0 0 0-4-7.5c.7-.9 2-1.5 3.5-1.5.8 0 1.5.2 2 .6V4c-.5-.4-1.2-.6-2-.6z"/><path d="M16 14c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/><path d="M10 14c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/></svg>,
        Construction: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="8" rx="1"/><path d="M17 14v7"/><path d="M7 14v7"/><path d="M17 3v3"/><path d="M7 3v3"/><path d="M10 14 2.3 6.3"/><path d="m14 6 7.7 7.7"/><path d="m8 6 8 8"/></svg>,
        Table: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3h18v18H3z"/><path d="M21 9H3"/><path d="M21 15H3"/><path d="M12 3v18"/></svg>,
        Wrench: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      };

      // --- FÍSICA (Simulador) ---
      const calculateConsumption = (params) => {
        const mass = 1800; const cr = 0.006; const g = 9.81;
        const rho = 1.225; const cd = 0.219; const area = 2.22; 
        const drivetrainEfficiency = 0.90;
        const speedMs = params.speed / 3.6; 
        const gradientRad = Math.atan(params.gradient / 100);
        const fRoll = mass * g * cr * Math.cos(gradientRad);
        const relativeSpeed = speedMs - (params.windSpeed / 3.6);
        const fAero = 0.5 * rho * cd * area * Math.sign(relativeSpeed) * (relativeSpeed ** 2);
        const fGrade = mass * g * Math.sin(gradientRad);
        const totalForce = fRoll + fAero + fGrade;
        let powerWatts = totalForce * speedMs;
        let finalPowerKw = powerWatts > 0 ? (powerWatts / 1000) / drivetrainEfficiency : (powerWatts / 1000) * 0.7; 
        const tempDiff = Math.abs(20 - params.temperature);
        const climatePowerKw = 0.5 + (tempDiff * 0.15);
        const totalPowerKw = finalPowerKw + climatePowerKw;
        let consumption = 0;
        if (params.speed > 0) consumption = (totalPowerKw / params.speed) * 100;
        const BASE_PHYSICS_REF = 14.0; 
        const scalar = params.electricConsumptionRef / BASE_PHYSICS_REF;
        consumption = consumption * scalar;
        return Math.max(consumption < -10 ? -10 : consumption, -10); 
      };

      // --- COMPONENTES DEL SIMULADOR ---
      const ControlPanel = ({ params, setParams, costs, setCosts }) => {
        const handleChange = (key, value) => setParams(prev => ({ ...prev, [key]: parseFloat(value) }));
        const handleCostChange = (key, value) => setCosts(prev => ({ ...prev, [key]: parseFloat(value) }));

        return (
            <div className="bg-slate-900/50 backdrop-blur-lg border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 className="text-xl font-display font-bold text-white mb-6 flex items-center gap-2">
                    <Icons.Settings /> Parámetros de Simulación
                </h2>
                <div className="space-y-6">
                    {[
                        { icon: Icons.Gauge, label: "Velocidad", key: "speed", min: 0, max: 200, unit: "km/h" },
                        { icon: Icons.Thermometer, label: "Temperatura", key: "temperature", min: -20, max: 50, unit: "°C" },
                        { icon: Icons.TrendingUp, label: "Desnivel", key: "gradient", min: -20, max: 20, unit: "%" },
                        { icon: Icons.Wind, label: "Viento", key: "windSpeed", min: -50, max: 50, unit: "km/h", customLabel: val => `${Math.abs(val)} km/h ${val < 0 ? 'Contra' : val > 0 ? 'Favor' : ''}` }
                    ].map((item) => (
                        <div key={item.key}>
                            <div className="flex justify-between mb-2 text-sm">
                                <span className="text-slate-400 flex items-center gap-1"><item.icon /> {item.label}</span>
                                <span className="text-blue-400 font-mono font-bold">
                                    {item.customLabel ? item.customLabel(params[item.key]) : `${params[item.key]} ${item.unit}`}
                                </span>
                            </div>
                            <input type="range" min={item.min} max={item.max} value={params[item.key]} 
                                onChange={(e) => handleChange(item.key, e.target.value)}
                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                        </div>
                    ))}

                    <div className="pt-6 border-t border-slate-800">
                        <h3 className="text-sm font-bold text-slate-300 mb-4">Configuración Avanzada</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs text-slate-500 block mb-1">Electricidad (€/kWh)</label><input type="number" step="0.01" value={costs.electricityPrice} onChange={(e) => handleCostChange('electricityPrice', e.target.value)} className={INPUT_STYLE} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Gasolina (€/L)</label><input type="number" step="0.01" value={costs.gasPrice} onChange={(e) => handleCostChange('gasPrice', e.target.value)} className={INPUT_STYLE} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Consumo Gasolina (L/100)</label><input type="number" step="0.1" value={costs.gasConsumptionRef} onChange={(e) => handleCostChange('gasConsumptionRef', e.target.value)} className={INPUT_STYLE} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Consumo EV (kWh/100)</label><input type="number" step="0.1" value={params.electricConsumptionRef} onChange={(e) => handleChange('electricConsumptionRef', e.target.value)} className={INPUT_STYLE} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Batería (kWh)</label><input type="number" step="1" value={params.batteryCapacity} onChange={(e) => handleChange('batteryCapacity', e.target.value)} className={INPUT_STYLE} /></div>
                        </div>
                    </div>
                </div>
            </div>
        );
      };

      const ResultsDisplay = ({ consumption, params, costs }) => {
        const costPer100ElecRaw = consumption * costs.electricityPrice;
        const costPer100GasRaw = costs.gasConsumptionRef * costs.gasPrice;
        const costPerKmElec = (costPer100ElecRaw / 100).toFixed(3);
        const costPerKmGas = (costPer100GasRaw / 100).toFixed(3);
        const savingsRaw = costPer100GasRaw - costPer100ElecRaw;
        const extraKm = Math.max(0, (costPerKmElec > 0.0001 ? (savingsRaw / parseFloat(costPerKmElec)) : 0)).toFixed(0);
        const range = consumption > 0.1 ? ((params.batteryCapacity / consumption) * 100).toFixed(0) : '---';

        return (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="text-slate-400 text-sm mb-1 flex items-center gap-2"><Icons.Zap className="w-4 h-4"/> Consumo</div>
                    <div className="text-4xl font-display font-bold text-white tabular-nums">{consumption.toFixed(1)}<span className="text-lg text-slate-500 ml-2 font-sans font-normal">kWh/100</span></div>
                    <div className="text-sm text-blue-400 mt-2 font-bold">Autonomía: {range} km</div>
                </div>

                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-start shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-green-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="flex flex-col items-center w-full mb-4">
                        <div className="text-slate-400 text-sm mb-1 flex items-center gap-2"><Icons.Euro className="w-4 h-4"/> Coste Eléctrico</div>
                        <div className="text-4xl font-display font-bold text-green-400 tabular-nums">{costPer100ElecRaw.toFixed(2)}€<span className="text-lg text-slate-500 ml-2 font-sans font-normal">/100km</span></div>
                        <div className="text-sm text-green-300/70 mt-1 font-mono font-bold">{costPerKmElec} €/km</div>
                        <div className="text-xs text-slate-500 mt-1">Ref: {costs.electricityPrice} €/kWh</div>
                    </div>
                    <div className="w-full h-px bg-slate-700 mb-3"></div>
                    <div className="w-full flex flex-col items-center">
                        <div className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-1">Ahorro vs Térmico</div>
                        <div className="flex items-baseline gap-3">
                            <span className="text-lg font-bold text-white">+{savingsRaw.toFixed(2)}€</span>
                            <span className="text-xs text-slate-500">➜</span>
                            <span className="text-lg font-bold text-blue-400">+{extraKm} km</span>
                        </div>
                        <div className="text-[10px] text-slate-500 mt-0">por cada 100km recorridos</div>
                    </div>
                </div>

                <div className="bg-slate-900/50 backdrop-blur border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center shadow-lg group relative overflow-hidden">
                    <div className="absolute inset-0 bg-orange-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                    <div className="text-slate-400 text-sm mb-1 flex items-center gap-2"><Icons.Fuel className="w-4 h-4"/> Consumo en Térmico</div>
                    <div className="text-4xl font-display font-bold text-orange-400 tabular-nums">{costPer100GasRaw.toFixed(2)}€<span className="text-lg text-slate-500 ml-2 font-sans font-normal">/100km</span></div>
                    <div className="text-sm text-orange-300/70 mt-2 font-mono font-bold">{costPerKmGas} €/km</div>
                    <div className="text-xs text-slate-500 mt-4">Ref: {costs.gasConsumptionRef}L/100 a {costs.gasPrice}€/L</div>
                </div>
            </div>
        );
      };

      const Visualizer = ({ params }) => {
        const isMoving = params.speed > 0;
        const isHeadwind = params.windSpeed < 0;
        const windParticles = Array.from({ length: Math.abs(params.windSpeed) * 1.5 }).map((_, i) => ({
            id: i, top: Math.random() * 100 + '%', delay: Math.random() * 2 + 's',
        }));

        return (
            <div className="relative h-80 w-full bg-gradient-to-b from-[#2a0808] to-slate-950 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl mb-8">
                 <div className="absolute top-4 left-4 right-4 flex justify-between z-20">
                    <div className="space-y-2">
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-blue-400 flex items-center gap-2"><Icons.Gauge className="w-3 h-3" /> {params.speed} km/h</div>
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-green-400 flex items-center gap-2"><Icons.TrendingUp className="w-3 h-3" /> {params.gradient}% Desnivel</div>
                    </div>
                    <div className="space-y-2 text-right">
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-orange-400 flex items-center gap-2 ml-auto"><Icons.Thermometer className="w-3 h-3" /> {params.temperature}°C</div>
                        <div className="bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono text-cyan-400 flex items-center gap-2 ml-auto"><Icons.Wind className="w-3 h-3" /> {Math.abs(params.windSpeed)} km/h {isHeadwind ? 'Contra' : 'Favor'}</div>
                    </div>
                </div>
                <div className="absolute inset-0 bg-red-900/10"></div>
                {params.windSpeed !== 0 && (
                    <div className="absolute inset-0 pointer-events-none z-10">
                        {windParticles.map(p => (
                            <div key={p.id} className={`absolute h-0.5 bg-white/20 rounded-full ${isHeadwind ? 'wind-particle-head' : 'wind-particle-tail'}`}
                                style={{ top: p.top, left: isHeadwind ? '100%' : '-10%', width: Math.random() * 50 + 50 + 'px', animationDuration: '0.8s', animationDelay: p.delay }} />
                        ))}
                    </div>
                )}
                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-[400px] h-[200px] z-20 transition-transform duration-300" style={{ transform: `translateX(-50%) rotate(${-params.gradient}deg)` }}>
                    <img src="tesla_model_3.png" alt="Tesla Model 3" className="w-full h-full object-contain relative z-10 filter drop-shadow-2xl contrast-125 brightness-90" />
                    <div className={`absolute bottom-[20.5%] left-[12.8%] w-[12.1%] aspect-square rounded-full border-2 border-slate-400/30 border-t-white/80 z-20 ${isMoving ? 'animate-spin-fast' : ''}`}></div>
                    <div className={`absolute bottom-[20.5%] right-[13%] w-[12.1%] aspect-square rounded-full border-2 border-slate-400/30 border-t-white/80 z-20 ${isMoving ? 'animate-spin-fast' : ''}`}></div>
                </div>
                <div className="absolute bottom-0 w-full h-24 bg-slate-800 overflow-hidden transform perspective-xl rotate-x-60">
                     <div className={`absolute top-10 left-0 right-0 h-1 w-full ${isMoving ? 'animate-road-move' : ''}`} 
                        style={{ backgroundImage: 'linear-gradient(90deg, rgba(100,116,139,1) 50%, transparent 50%)', backgroundSize: '60px 100%', animationDuration: isMoving && params.speed > 0 ? `${200 / params.speed}s` : '0s' }}></div>
                </div>
            </div>
        );
      };

      // --- NUEVO: CALCULADORA DE AMORTIZACIÓN (RELOJ CUCO) ---
      const AmortizationCalculator = () => {
        const [data, setData] = useState({
            priceEV: 43000, priceICE: 45000, moves: 7000, aidICE: 0,
            kmPerYear: 20000, consumptionEV: 16.0, consumptionICE: 6.0,
            priceElec: 0.10, priceFuel: 1.45, 
            yearsToProject: 20,
            maintenanceEV: 60, maintenanceICE: 300,
            breakdownRateEV: 25, breakdownRateICE: 10,
            taxSavingsEV: 50, taxSavingsICE: 0
        });
        
        const [showTable, setShowTable] = useState(true);

        const handleChange = (field, value) => setData({...data, [field]: parseFloat(value) || 0});

        // Cálculos
        const netPriceEV = data.priceEV - data.moves;
        const netPriceICE = data.priceICE - data.aidICE;
        const initialDifference = netPriceEV - netPriceICE;
        
        // Calcular coste total de averías estimado y prorratearlo
        const totalBreakdownEV = data.priceEV * (data.breakdownRateEV / 100);
        const totalBreakdownICE = data.priceICE * (data.breakdownRateICE / 100);
        const annualBreakdownEV = totalBreakdownEV / data.yearsToProject;
        const annualBreakdownICE = totalBreakdownICE / data.yearsToProject;

        // Costes Operativos Anuales Totales
        const annualFuelCost = (data.kmPerYear / 100) * data.consumptionICE * data.priceFuel;
        const annualElecCost = (data.kmPerYear / 100) * data.consumptionEV * data.priceElec;
        
        // Coste Anual Completo
        const totalAnnualCostEV = annualElecCost + data.maintenanceEV + annualBreakdownEV - data.taxSavingsEV;
        const totalAnnualCostICE = annualFuelCost + data.maintenanceICE + annualBreakdownICE - data.taxSavingsICE;

        const totalAnnualSavings = totalAnnualCostICE - totalAnnualCostEV;

        const breakEvenYears = initialDifference > 0 ? (initialDifference / totalAnnualSavings) : 0;
        const breakEvenKm = initialDifference > 0 ? (breakEvenYears * data.kmPerYear) : 0;
        
        const totalSavingsProjected = (totalAnnualSavings * data.yearsToProject) - initialDifference;
        const operatingSavingsTotal = totalAnnualSavings * data.yearsToProject;
        const effectiveCost = netPriceEV - operatingSavingsTotal;

        // Generar datos de la tabla
        const tableRows = [];
        for (let i = 0; i <= data.yearsToProject; i++) {
            const cumCostEV = netPriceEV + (totalAnnualCostEV * i);
            const cumCostICE = netPriceICE + (totalAnnualCostICE * i);
            const currentKm = data.kmPerYear * i;

            tableRows.push({
                year: i,
                km: currentKm,
                ev: cumCostEV,
                ice: cumCostICE,
                diff: cumCostICE - cumCostEV 
            });
        }

        return (
            <div className="space-y-6">
                {/* Tarjeta de Resultados Principales */}
                <div className="bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-700 rounded-2xl p-8 text-center shadow-2xl">
                    <h3 className="text-slate-400 text-sm font-display uppercase tracking-widest mb-4">Análisis de Rentabilidad</h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                        {/* 1. AHORRO NETO */}
                        <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 relative overflow-hidden">
                            <div className="absolute inset-0 bg-green-500/5"></div>
                            <div className="relative z-10">
                                <div className="text-xs text-green-400 mb-2 uppercase font-bold">Ahorro Neto ({data.yearsToProject} años)</div>
                                <div className={`text-4xl font-bold font-display ${totalSavingsProjected >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                    {totalSavingsProjected > 0 ? '+' : ''}{Math.round(totalSavingsProjected).toLocaleString()}€
                                </div>
                            </div>
                        </div>

                        {/* 2. COSTE REAL */}
                        <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 relative overflow-hidden">
                             <div className="relative z-10">
                                <div className="text-xs text-blue-300 mb-2 uppercase font-bold">Coste Real vs Térmico</div>
                                <div className="text-3xl font-bold font-display text-white">
                                    {effectiveCost.toLocaleString()}€
                                </div>
                                <div className="text-[10px] text-slate-500 leading-tight mt-2">Precio EV menos ahorro generado</div>
                            </div>
                        </div>

                         {/* 3. PUNTO DE EQUILIBRIO */}
                         <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-600 relative overflow-hidden">
                            <div className="text-xs text-slate-500 mb-3 uppercase font-bold">Punto de Equilibrio</div>
                            <div className="flex justify-around items-center">
                                <div>
                                    <div className={`text-2xl font-bold font-display ${initialDifference <= 0 ? 'text-green-400' : 'text-white'}`}>
                                        {initialDifference <= 0 ? "0" : breakEvenYears.toFixed(1)} <span className="text-sm font-sans font-normal text-slate-400">años</span>
                                    </div>
                                </div>
                                <div className="h-8 w-px bg-slate-700"></div>
                                <div>
                                    <div className={`text-2xl font-bold font-display ${initialDifference <= 0 ? 'text-green-400' : 'text-white'}`}>
                                        {initialDifference <= 0 ? "0" : Math.round(breakEvenKm).toLocaleString()} <span className="text-sm font-sans font-normal text-slate-400">km</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* Columna Eléctrico */}
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                        <h4 className="text-blue-400 font-display font-bold mb-4 flex items-center gap-2"><Icons.Zap /> Vehículo Eléctrico</h4>
                        <div className="space-y-4">
                            <div><label className="text-xs text-slate-500 block mb-1">Precio Compra (€)</label><input type="number" value={data.priceEV} onChange={e=>handleChange('priceEV', e.target.value)} className={INPUT_STYLE} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Ayudas / MOVES (€)</label><input type="number" value={data.moves} onChange={e=>handleChange('moves', e.target.value)} className={INPUT_STYLE} /></div>
                            
                            <div className="pt-2 border-t border-slate-800"><h5 className="text-xs font-bold text-slate-400 mb-2 flex gap-2 items-center"><Icons.Wrench className="w-3 h-3"/> Mantenimiento y Averías</h5>
                                <div className="grid grid-cols-3 gap-2">
                                    <div><label className="text-[10px] text-slate-500 block mb-1">Mtto. Anual</label><input type="number" value={data.maintenanceEV} onChange={e=>handleChange('maintenanceEV', e.target.value)} className={INPUT_STYLE} /></div>
                                    <div><label className="text-[10px] text-slate-500 block mb-1">% Averías</label><input type="number" step="0.1" value={data.breakdownRateEV} onChange={e=>handleChange('breakdownRateEV', e.target.value)} className={INPUT_STYLE} /></div>
                                    <div><label className="text-[10px] text-slate-500 block mb-1">Ahorro Impuestos</label><input type="number" value={data.taxSavingsEV} onChange={e=>handleChange('taxSavingsEV', e.target.value)} className={INPUT_STYLE} /></div>
                                </div>
                            </div>

                            <div className="pt-2 border-t border-slate-800">
                                <h5 className="text-xs font-bold text-slate-400 mb-2">Consumo</h5>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-slate-500 block mb-1">kWh/100km</label><input type="number" step="0.1" value={data.consumptionEV} onChange={e=>handleChange('consumptionEV', e.target.value)} className={INPUT_STYLE} /></div>
                                    <div><label className="text-[10px] text-slate-500 block mb-1">Precio €/kWh</label><input type="number" step="0.01" value={data.priceElec} onChange={e=>handleChange('priceElec', e.target.value)} className={INPUT_STYLE} /></div>
                                </div>
                            </div>
                            <div className="pt-2 text-right text-sm text-slate-400">Precio Final: <span className="text-white font-bold">{(data.priceEV - data.moves).toLocaleString()}€</span></div>
                        </div>
                    </div>

                    {/* Columna Térmico */}
                    <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-6">
                        <h4 className="text-orange-400 font-display font-bold mb-4 flex items-center gap-2"><Icons.Fuel /> Vehículo Térmico</h4>
                        <div className="space-y-4">
                            <div><label className="text-xs text-slate-500 block mb-1">Precio Compra (€)</label><input type="number" value={data.priceICE} onChange={e=>handleChange('priceICE', e.target.value)} className={INPUT_STYLE} /></div>
                            <div><label className="text-xs text-slate-500 block mb-1">Ayudas / Plan Renove (€)</label><input type="number" value={data.aidICE} onChange={e=>handleChange('aidICE', e.target.value)} className={INPUT_STYLE} /></div>
                            
                            <div className="pt-2 border-t border-slate-800"><h5 className="text-xs font-bold text-slate-400 mb-2 flex gap-2 items-center"><Icons.Wrench className="w-3 h-3"/> Mantenimiento y Averías</h5>
                                <div className="grid grid-cols-3 gap-2">
                                    <div><label className="text-[10px] text-slate-500 block mb-1">Mtto. Anual</label><input type="number" value={data.maintenanceICE} onChange={e=>handleChange('maintenanceICE', e.target.value)} className={INPUT_STYLE} /></div>
                                    <div><label className="text-[10px] text-slate-500 block mb-1">% Averías</label><input type="number" step="0.1" value={data.breakdownRateICE} onChange={e=>handleChange('breakdownRateICE', e.target.value)} className={INPUT_STYLE} /></div>
                                    <div><label className="text-[10px] text-slate-500 block mb-1">Ahorro Impuestos</label><input type="number" value={data.taxSavingsICE} onChange={e=>handleChange('taxSavingsICE', e.target.value)} className={INPUT_STYLE} /></div>
                                </div>
                            </div>

                            <div className="pt-2 border-t border-slate-800">
                                <h5 className="text-xs font-bold text-slate-400 mb-2">Consumo</h5>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-slate-500 block mb-1">L/100km</label><input type="number" step="0.1" value={data.consumptionICE} onChange={e=>handleChange('consumptionICE', e.target.value)} className={INPUT_STYLE} /></div>
                                    <div><label className="text-[10px] text-slate-500 block mb-1">Precio €/L</label><input type="number" step="0.01" value={data.priceFuel} onChange={e=>handleChange('priceFuel', e.target.value)} className={INPUT_STYLE} /></div>
                                </div>
                            </div>
                            <div className="pt-2 text-right text-sm text-slate-400">Precio Final: <span className="text-white font-bold">{(data.priceICE - data.aidICE).toLocaleString()}€</span></div>
                        </div>
                    </div>
                </div>

                {/* Parámetros Comunes */}
                <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                    <h4 className="text-slate-300 font-bold mb-4 text-sm">Variables de Comparación</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label className="text-xs text-slate-500 block mb-1">Kilómetros Anuales</label><input type="number" value={data.kmPerYear} onChange={e=>handleChange('kmPerYear', e.target.value)} className={INPUT_STYLE} /></div>
                        <div><label className="text-xs text-slate-500 block mb-1">Años a proyectar</label><input type="number" value={data.yearsToProject} onChange={e=>handleChange('yearsToProject', e.target.value)} className={INPUT_STYLE} /></div>
                    </div>
                </div>

                {/* Botón y Tabla Detallada */}
                <div className="mt-8">
                    <button 
                        onClick={() => setShowTable(!showTable)}
                        className="w-full py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-sm font-medium text-slate-300 transition-colors flex items-center justify-center gap-2">
                        <Icons.Table /> {showTable ? 'Ocultar Desglose' : 'Ver Desglose Detallado Año a Año'}
                    </button>

                    {showTable && (
                        <div className="mt-4 overflow-x-auto rounded-xl border border-slate-800 animate-fade-in">
                            <table className="w-full custom-table">
                                <thead className="bg-slate-900">
                                    <tr>
                                        <th>Año</th>
                                        <th>Kms Totales</th>
                                        <th>Coste Acumulado EV</th>
                                        <th>Coste Acumulado ICE</th>
                                        <th>Diferencia (Ahorro)</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-slate-900/50">
                                    {tableRows.map((row) => (
                                        <tr key={row.year}>
                                            <td className="font-bold text-slate-500">{row.year}</td>
                                            <td className="text-slate-400">{row.km.toLocaleString()}</td>
                                            <td className="text-blue-300">{Math.round(row.ev).toLocaleString()}€</td>
                                            <td className="text-orange-300">{Math.round(row.ice).toLocaleString()}€</td>
                                            <td className={row.diff >= 0 ? 'text-green-400 font-bold' : 'text-red-400'}>
                                                {row.diff > 0 ? '+' : ''}{Math.round(row.diff).toLocaleString()}€
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
                
                <div className="text-center mt-8">
                    <a href="https://docs.google.com/spreadsheets/d/1bLZmgVGTBqg2bS2E45JpORjs9eK2nb05AWXYLLDY-RI/edit?usp=drivesdk" target="_blank" className="inline-flex items-center gap-2 text-xs text-slate-500 hover:text-blue-400 transition-colors">
                        <Icons.Piggy /> Ver hoja de cálculo original ("Reloj Cuco") en Google Drive
                    </a>
                </div>
            </div>
        );
      };

      // --- COMPONENTE PLACEHOLDER ---
      const PlaceholderTab = () => (
        <div className="flex flex-col items-center justify-center h-96 bg-slate-900/30 rounded-3xl border border-slate-800 border-dashed p-8 text-center">
            <div className="bg-slate-800 p-4 rounded-full mb-4 text-slate-400"><Icons.Construction /></div>
            <h3 className="text-xl font-display font-bold text-white mb-2">En Construcción</h3>
            <p className="text-slate-400 text-sm max-w-md mb-8">Esta funcionalidad estará disponible próximamente. Mientras tanto, puedes utilizar la versión completa en Excel.</p>
            <a href="https://docs.google.com/spreadsheets/d/1bLZmgVGTBqg2bS2E45JpORjs9eK2nb05AWXYLLDY-RI/edit?usp=drivesdk" 
               target="_blank"
               className="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-lg font-medium transition-all shadow-lg hover:shadow-green-900/20 flex items-center gap-2">
                <Icons.Piggy />
                VERSIÓN EN EXCEL de Google Drive
            </a>
            <p className="text-xs text-slate-600 mt-2">(haga un duplicado para su uso particular)</p>
         </div>
      );

      // --- APP PRINCIPAL ---
      const App = () => {
        const [activeTab, setActiveTab] = useState('simulator'); 

        const [simParams, setSimParams] = useState({ speed: 120, temperature: 20, gradient: 0, windSpeed: 0, electricConsumptionRef: 14, batteryCapacity: 60 });
        const [simCosts, setSimCosts] = useState({ electricityPrice: 0.08, gasPrice: 1.45, gasConsumptionRef: 6.5 });
        const [consumption, setConsumption] = useState(0);

        useEffect(() => { setConsumption(calculateConsumption(simParams)); }, [simParams]);

        const handleBack = () => { if (window.history.length > 1) window.history.back(); else window.close(); };

        const renderContent = () => {
            switch(activeTab) {
                case 'simulator':
                    return (
                        <>
                            <Visualizer params={simParams} />
                            <ResultsDisplay consumption={consumption} params={simParams} costs={simCosts} />
                            <ControlPanel params={simParams} setParams={setSimParams} costs={simCosts} setCosts={setSimCosts} />
                        </>
                    );
                case 'amortization':
                    return <AmortizationCalculator />;
                case 'tariff':
                case 'charge':
                    return <PlaceholderTab />;
                default:
                    return null;
            }
        };

        const TabButton = ({ id, label }) => (
            <button 
                onClick={() => setActiveTab(id)}
                className={`px-4 py-3 text-sm font-medium transition-all uppercase tracking-wider ${activeTab === id ? 'tab-active' : 'tab-inactive'}`}
            >
                {label}
            </button>
        );

        return (
            <div className="min-h-screen bg-[#0a0a0a] text-white p-4 md:p-8">
                <div className="max-w-5xl mx-auto">
                    <header className="mb-6">
                        <div className="flex justify-between items-end border-b border-slate-800 pb-4">
                            <div>
                                <h1 className="text-4xl md:text-5xl font-display font-bold">
                                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Boarding</span>
                                    <span className="text-red-600">Gate</span>
                                </h1>
                                <p className="text-slate-500 font-light tracking-widest text-sm mt-1">TESLA EFFICIENCY TOOLS</p>
                                <p className="text-[10px] text-slate-600 font-mono mt-1">
                                    PHYSICS ENGINE V2.1 • TCO CALC V1.2
                                </p>
                            </div>
                            <div className="flex flex-col items-end gap-2">
                                <button onClick={handleBack} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                                    <Icons.LogOut /> Volver
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex overflow-x-auto gap-2 border-b border-slate-800/50 mt-4">
                            <TabButton id="simulator" label="Simulador" />
                            <TabButton id="amortization" label="Amortización" />
                            <TabButton id="tariff" label="Comparar Tarifas" />
                            <TabButton id="charge" label="Carga" />
                        </div>
                    </header>

                    <main className="animate-fade-in">
                        {renderContent()}
                    </main>
                </div>
            </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
