<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Partículas Interactivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #ccc;
        }

        /* Botones de formas */
        .shape-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button.active {
            background: #4f46e5;
            border-color: #4f46e5;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
        }

        /* Selector de color */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Feedback visual de la cámara */
        #webcam-preview {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            transform: scaleX(-1); /* Espejo */
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        #webcam-preview:hover {
            opacity: 1;
        }

        .status {
            font-size: 0.75rem;
            margin-top: 10px;
            color: #888;
            text-align: center;
        }
        .status span {
            color: #4f46e5;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- UI -->
    <div id="ui-panel">
        <h2>Control de Partículas</h2>
        
        <div class="control-group">
            <label>Color de Partículas</label>
            <input type="color" id="colorPicker" value="#00ffff">
        </div>

        <div class="control-group">
            <label>Seleccionar Forma</label>
            <div class="shape-grid">
                <button onclick="setShape('sphere')" class="active" id="btn-sphere">Esfera</button>
                <button onclick="setShape('heart')" id="btn-heart">Corazón</button>
                <button onclick="setShape('saturn')" id="btn-saturn">Saturno</button>
                <button onclick="setShape('spiral')" id="btn-spiral">Espiral DNA</button>
                <button onclick="setShape('fireworks')" id="btn-fireworks">Fuegos Art.</button>
                <button onclick="setShape('buddha')" id="btn-buddha">Estatua (Geo)</button>
            </div>
        </div>

        <div class="status" id="hand-status">
            Estado: Buscando manos...
        </div>
        <div class="status" style="margin-top:5px; font-size: 0.7rem;">
            Abre la mano para expandir.<br>Cierra el puño para comprimir.
        </div>
    </div>

    <!-- Webcam feed (hidden from main view but used for logic) -->
    <video id="webcam-preview" playsinline></video>

    <!-- Canvas para Three.js -->
    <div id="canvas-container"></div>

    <!-- Scripts: Three.js y MediaPipe -->
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';
        import { Hands } from 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
        import { Camera } from 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1632432244/camera_utils.js';

        // --- Configuración Global ---
        const PARTICLE_COUNT = 15000;
        const PARTICLE_SIZE = 0.05;
        let currentShape = 'sphere';
        let handTension = 0; // 0 = Abierta (Relajada), 1 = Puño (Tensión)
        let time = 0;

        // --- Escena Three.js ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 8;
        camera.position.y = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // --- Sistema de Partículas ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // A donde quieren ir
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        // Inicializar posiciones aleatorias
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 10;
            targetPositions[i] = positions[i];
            colors[i] = 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Shader Material para mejor look
        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- Generadores de Formas ---
        function getPointOnSphere(i) {
            const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
            const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
            const r = 3;
            return {
                x: r * Math.cos(theta) * Math.sin(phi),
                y: r * Math.sin(theta) * Math.sin(phi),
                z: r * Math.cos(phi)
            };
        }

        function getPointOnHeart(i) {
            // Formula paramétrica del corazón
            const t = (i / PARTICLE_COUNT) * Math.PI * 2;
            const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT); // Distribución esférica base
            // Adaptación de fórmula 3D
            const x = 16 * Math.pow(Math.sin(phi), 3) * Math.cos(t);
            const y = 13 * Math.cos(phi) - 5 * Math.cos(2*phi) - 2 * Math.cos(3*phi) - Math.cos(4*phi);
            const z = 16 * Math.pow(Math.sin(phi), 3) * Math.sin(t);
            return { x: x * 0.15, y: y * 0.15 + 1, z: z * 0.15 };
        }

        function getPointOnSaturn(i) {
            const ratio = 0.7; // 70% planeta, 30% anillos
            if (i < PARTICLE_COUNT * ratio) {
                // Esfera
                const idx = i;
                const total = PARTICLE_COUNT * ratio;
                const phi = Math.acos(-1 + (2 * idx) / total);
                const theta = Math.sqrt(total * Math.PI) * phi;
                const r = 2;
                return {
                    x: r * Math.cos(theta) * Math.sin(phi),
                    y: r * Math.sin(theta) * Math.sin(phi),
                    z: r * Math.cos(phi)
                };
            } else {
                // Anillo
                const idx = i - PARTICLE_COUNT * ratio;
                const angle = (idx / (PARTICLE_COUNT * (1-ratio))) * Math.PI * 2 * 10; // *10 para densidad
                const r = 3 + Math.random() * 1.5;
                return {
                    x: r * Math.cos(angle),
                    y: (Math.random() - 0.5) * 0.1,
                    z: r * Math.sin(angle)
                };
            }
        }

        function getPointOnSpiral(i) {
            const t = i / PARTICLE_COUNT * 20 * Math.PI;
            const x = Math.cos(t) * (1 + t * 0.02);
            const z = Math.sin(t) * (1 + t * 0.02);
            const y = (i / PARTICLE_COUNT) * 8 - 4;
            return { x: x, y: y, z: z };
        }
        
        function getPointOnBuddha(i) {
            // Aproximación matemática de una figura sentada (dos esferas achatadas + base)
            const t = i / PARTICLE_COUNT;
            if(t < 0.4) {
                // Base / Piernas (Toroide parcial)
                const u = t / 0.4 * Math.PI * 2 * 10;
                const v = Math.random() * Math.PI * 2;
                const R = 2; const r = 0.8;
                return {
                    x: (R + r * Math.cos(v)) * Math.cos(u) * 0.8,
                    y: r * Math.sin(v) - 2,
                    z: (R + r * Math.cos(v)) * Math.sin(u) * 0.8
                }
            } else if (t < 0.8) {
                // Cuerpo
                const p = getPointOnSphere(i);
                return {x: p.x * 0.7, y: p.y * 0.8, z: p.z * 0.7};
            } else {
                // Cabeza
                const p = getPointOnSphere(i);
                return {x: p.x * 0.4, y: p.y * 0.4 + 2, z: p.z * 0.4};
            }
        }

        function getPointOnFireworks(i) {
            // Solo dispersión
            return getPointOnSphere(i);
        }

        // --- Lógica de transición de formas ---
        function updateTargetShape(shapeType) {
            currentShape = shapeType;
            
            // Actualizar botones UI
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            const btnId = `btn-${shapeType}`;
            const btn = document.getElementById(btnId);
            if(btn) btn.classList.add('active');

            const pArray = geometry.attributes.position.array;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p;
                switch (shapeType) {
                    case 'heart': p = getPointOnHeart(i); break;
                    case 'saturn': p = getPointOnSaturn(i); break;
                    case 'spiral': p = getPointOnSpiral(i); break;
                    case 'buddha': p = getPointOnBuddha(i); break;
                    case 'fireworks': p = getPointOnSphere(i); break; // Base sphere
                    default: p = getPointOnSphere(i); break;
                }
                
                targetPositions[i * 3] = p.x;
                targetPositions[i * 3 + 1] = p.y;
                targetPositions[i * 3 + 2] = p.z;
            }
        }
        
        // Exponer función al contexto global para los botones HTML
        window.setShape = updateTargetShape;
        updateTargetShape('sphere'); // Inicio

        // --- Color Picker ---
        const colorPicker = document.getElementById('colorPicker');
        colorPicker.addEventListener('input', (e) => {
            material.color.set(e.target.value);
        });

        // --- MediaPipe Hands Logic ---
        const videoElement = document.getElementById('webcam-preview');
        const statusElement = document.getElementById('hand-status');

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Calcular tensión (distancia entre punta dedo índice y muñeca)
                // Indice 0 = Muñeca, Indice 8 = Punta Índice, 12 = Punta Corazón, etc.
                const wrist = landmarks[0];
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const middleTip = landmarks[12];

                // Distancia euclidiana simple aproximada
                const d = Math.sqrt(
                    Math.pow(indexTip.x - wrist.x, 2) + 
                    Math.pow(indexTip.y - wrist.y, 2)
                );

                // Normalización aproximada: 
                // Mano abierta d ~ 0.3 a 0.5
                // Puño cerrado d ~ 0.1 a 0.2
                // Queremos handTension 1 (puño) a 0 (abierta)
                
                const minOpen = 0.15;
                const maxOpen = 0.4;
                let tension = 1 - ((d - minOpen) / (maxOpen - minOpen));
                tension = Math.max(0, Math.min(1, tension)); // Clamp 0-1

                // Suavizado (Lerp)
                handTension += (tension - handTension) * 0.1;

                statusElement.innerHTML = `Mano detectada. <br>Tensión: <span>${(handTension * 100).toFixed(0)}%</span>`;
            } else {
                // Si no hay mano, relajar tensión
                handTension += (0 - handTension) * 0.05;
                statusElement.innerHTML = "Estado: Buscando manos...";
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });
        cameraFeed.start();

        // --- Bucle de Animación ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            controls.update();

            const positions = geometry.attributes.position.array;

            // Factor de expansión basado en la mano
            // Si handTension es 1 (puño), scaleFactor es pequeño (compresión)
            // Si handTension es 0 (abierta), scaleFactor es 1 (normal)
            
            // Efecto inverso: Cerrar mano = Energía concentrada (Tiembla, se encoge)
            // Abrir mano = Expansión
            
            const explosionFactor = currentShape === 'fireworks' ? (Math.sin(time) + 1.5) : 1;
            const baseScale = 1 - (handTension * 0.7); // Se encoge al 30% si cierras puño
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                // Interpolación lineal hacia la forma objetivo (Morphing)
                // Velocidad de morphing
                const lerpSpeed = 0.05;
                
                let tx = targetPositions[ix];
                let ty = targetPositions[iy];
                let tz = targetPositions[iz];

                // Modificadores especiales
                if (currentShape === 'fireworks') {
                    // Si es fireworks, añadimos movimiento hacia afuera
                    tx *= explosionFactor;
                    ty *= explosionFactor;
                    tz *= explosionFactor;
                }

                // Aplicar movimiento hacia la forma target
                positions[ix] += (tx - positions[ix]) * lerpSpeed;
                positions[iy] += (ty - positions[iy]) * lerpSpeed;
                positions[iz] += (tz - positions[iz]) * lerpSpeed;

                // INTERACCIÓN CON MANO:
                // Aplicamos la escala desde el centro (0,0,0)
                // Usamos una variable temporal para renderizado, no guardamos en array para no perder la forma
                // Pero como estamos modificando el buffer directamente, debemos aplicar la logica inversa o usar un shader.
                // Para simplificar en CPU: 
                // Calculamos la posición visual final
                
                const noise = handTension * 0.1 * (Math.random() - 0.5); // Temblor por tensión

                // Mover hacia el centro si hay tensión
                const currentX = positions[ix];
                const currentY = positions[iy];
                const currentZ = positions[iz];

                // Renderizamos la posición modificada visualmente en este frame
                // Nota: BufferGeometry guarda estado. 
                // Estrategia: Guardar forma "ideal" en target, y en cada frame mover `positions` hacia `target * escala`
                
                const targetXScaled = tx * baseScale + noise;
                const targetYScaled = ty * baseScale + noise;
                const targetZScaled = tz * baseScale + noise;

                // Sobrescribimos el lerp anterior para incluir la escala de la mano dinámicamente
                positions[ix] += (targetXScaled - positions[ix]) * 0.1; 
                positions[iy] += (targetYScaled - positions[iy]) * 0.1;
                positions[iz] += (targetZScaled - positions[iz]) * 0.1;
            }

            geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // Manejo de redimensionado
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
