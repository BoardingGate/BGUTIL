<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partículas 3D + Control Gestual</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* Contenedor UI */
        #ui-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 260px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #444;
            color: white;
            z-index: 100;
        }

        h3 { margin: 0 0 10px 0; font-size: 16px; color: #4f46e5; text-transform: uppercase; }

        .control-row { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }

        /* Botones */
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        button {
            background: #333; border: 1px solid #555; color: white;
            padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
            transition: 0.2s;
        }
        button:hover { background: #444; }
        button.active { background: #4f46e5; border-color: #6366f1; }

        /* Input Color */
        input[type="color"] { width: 100%; height: 35px; border: none; cursor: pointer; }

        /* Mensajes de error / carga */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 200;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid #4f46e5; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Video oculto pero necesario para la logica */
        #input-video { display: none; } 
        
        /* Pequeño preview de cámara */
        #cam-preview {
            position: absolute; bottom: 10px; left: 10px; width: 120px;
            border-radius: 8px; opacity: 0.5; z-index: 90; transform: scaleX(-1);
        }
    </style>

    <!-- Mapa de importación para asegurar versiones compatibles -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- Librerías de MediaPipe (scripts normales) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Pantalla de Carga -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Cargando motor gráfico...</div>
    </div>

    <!-- UI -->
    <div id="ui-container">
        <h3>Control de Partículas</h3>
        
        <div class="control-row">
            <label>Color</label>
            <input type="color" id="color-picker" value="#00aaff">
        </div>

        <div class="control-row">
            <label>Formas</label>
            <div class="grid-buttons">
                <button onclick="changeShape('sphere')" class="active" id="btn-sphere">Esfera</button>
                <button onclick="changeShape('heart')" id="btn-heart">Corazón</button>
                <button onclick="changeShape('saturn')" id="btn-saturn">Saturno</button>
                <button onclick="changeShape('buddha')" id="btn-buddha">Estatua</button>
                <button onclick="changeShape('fireworks')" id="btn-fireworks">Explosión</button>
            </div>
        </div>
        
        <div class="control-row">
            <label id="hand-status">Esperando cámara...</label>
        </div>
    </div>

    <!-- Video Element -->
    <video id="input-video" playsinline></video>
    <canvas id="cam-preview"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. Verificación de Seguridad ---
        if (window.location.protocol === 'file:') {
            alert("⚠️ ERROR: Estás abriendo este archivo directamente.\n\nPor seguridad del navegador, la cámara NO funcionará.\n\nDebes usar un servidor local (ej: VS Code Live Server).");
            document.getElementById('loading-text').innerText = "Error: Abre con servidor local (http://localhost)";
            throw new Error("File protocol detected");
        }

        // --- 2. Configuración Three.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;
        camera.position.y = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // --- 3. Sistema de Partículas ---
        const PARTICLE_COUNT = 12000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        
        // Inicializar en esfera
        for(let i=0; i<PARTICLE_COUNT; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = 4;
            
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
            targetPositions[i*3] = x; targetPositions[i*3+1] = y; targetPositions[i*3+2] = z;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x00aaff,
            size: 0.08,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 4. Funciones de Matemáticas de Formas ---
        function getShapePosition(type, i) {
            const idx = i;
            const total = PARTICLE_COUNT;
            
            // Distribución esférica base (Fibonacci sphere algorithm para distribución uniforme)
            const phi = Math.acos(1 - 2 * (idx + 0.5) / total);
            const theta = Math.PI * (1 + Math.sqrt(5)) * idx; 

            if (type === 'sphere') {
                const r = 4;
                return {
                    x: r * Math.cos(theta) * Math.sin(phi),
                    y: r * Math.sin(theta) * Math.sin(phi),
                    z: r * Math.cos(phi)
                };
            }
            if (type === 'heart') {
                // Ecuación paramétrica de corazón 3D
                const t = theta; 
                const p = phi * 2; // Estirar rango
                const x = 16 * Math.pow(Math.sin(p), 3) * Math.cos(t);
                const y = 13 * Math.cos(p) - 5 * Math.cos(2*p) - 2 * Math.cos(3*p) - Math.cos(4*p);
                const z = 16 * Math.pow(Math.sin(p), 3) * Math.sin(t);
                return { x: x*0.2, y: y*0.2 + 2, z: z*0.2 };
            }
            if (type === 'saturn') {
                if (i < total * 0.7) { // Planeta
                    const r = 2.5;
                    return {
                        x: r * Math.cos(theta) * Math.sin(phi),
                        y: r * Math.sin(theta) * Math.sin(phi),
                        z: r * Math.cos(phi)
                    };
                } else { // Anillos
                    const angle = (i / (total * 0.3)) * Math.PI * 2 * 5;
                    const r = 3.5 + Math.random() * 2;
                    return { x: r * Math.cos(angle), y: (Math.random()-0.5)*0.2, z: r * Math.sin(angle) };
                }
            }
            if (type === 'buddha') {
                 // Forma abstracta "sentada" (dos elipsoides)
                const t = i / total;
                if(t < 0.5) { // Base
                     const r = 3; 
                     return { x: r * Math.cos(theta)*Math.sin(phi), y: (r * Math.sin(theta)*Math.sin(phi) * 0.3) - 2, z: r * Math.cos(phi) };
                } else { // Torso/Cabeza
                     const r = 1.5; 
                     return { x: r * Math.cos(theta)*Math.sin(phi), y: (r * Math.sin(theta)*Math.sin(phi)) + 1, z: r * Math.cos(phi) };
                }
            }
            if (type === 'fireworks') {
                // Retornar posición aleatoria muy lejana
                 return { x: (Math.random()-0.5)*30, y: (Math.random()-0.5)*30, z: (Math.random()-0.5)*30 };
            }
            return {x:0, y:0, z:0};
        }

        let currentShape = 'sphere';
        window.changeShape = (shape) => {
            currentShape = shape;
            // UI Update
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${shape}`).classList.add('active');

            // Calcular nuevos targets
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const pos = getShapePosition(shape, i);
                targetPositions[i*3] = pos.x;
                targetPositions[i*3+1] = pos.y;
                targetPositions[i*3+2] = pos.z;
            }
        };

        document.getElementById('color-picker').addEventListener('input', (e) => {
            material.color.set(e.target.value);
        });

        // --- 5. MediaPipe Hands y Webcam ---
        const videoElement = document.getElementById('input-video');
        const previewCanvas = document.getElementById('cam-preview');
        const ctxPreview = previewCanvas.getContext('2d');
        const statusLabel = document.getElementById('hand-status');
        
        let handTension = 0; // 0 = Abierta, 1 = Cerrada

        function onResults(results) {
            // Dibujar preview pequeño
            ctxPreview.save();
            ctxPreview.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            ctxPreview.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(ctxPreview, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                }
            }
            ctxPreview.restore();

            // Logica
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                
                // Medir distancia entre Muñeca (0) y Punta Indice (8) y Punta Pulgar (4)
                // Un puño cerrado tiene las puntas cerca de la muñeca (relativamente)
                // O mejor: Distancia entre punta indice (8) y base indice (5)
                
                // Distancia Indice (8) a Palma (0)
                const d_index = Math.sqrt(Math.pow(lm[8].x - lm[0].x, 2) + Math.pow(lm[8].y - lm[0].y, 2));
                
                // Calibración aproximada
                // Mano abierta d ~ 0.3 o más
                // Puño d ~ 0.15 o menos
                
                // Invertimos: Queremos que Puño sea 1 y Abierta 0
                let t = 1 - ((d_index - 0.15) / (0.4 - 0.15));
                t = Math.max(0, Math.min(1, t)); // Clampear entre 0 y 1

                // Interpolación suave
                handTension += (t - handTension) * 0.1;
                
                statusLabel.innerText = `Tensión Mano: ${Math.round(handTension * 100)}%`;
                statusLabel.style.color = handTension > 0.8 ? '#ff4444' : '#00ff00';
            } else {
                statusLabel.innerText = "Mano no detectada";
                statusLabel.style.color = "#aaa";
                // Relajar tensión
                handTension += (0 - handTension) * 0.05;
            }
        }

        // Inicialización asíncrona segura
        async function startApp() {
            // 1. Mostrar escena 3D básica inmediatamente
            document.getElementById('loading-text').innerText = "Cargando IA de manos...";
            
            try {
                const hands = new Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});
                
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                hands.onResults(onResults);

                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 320,
                    height: 240
                });
                
                await cameraUtils.start();
                document.getElementById('loading-screen').style.display = 'none'; // Ocultar carga
                
            } catch (err) {
                console.error(err);
                document.getElementById('loading-text').innerText = "Error accediendo a cámara. Revisa permisos.";
                // Aun si falla la cámara, dejamos correr Three.js
                setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 2000);
            }
        }

        // --- 6. Loop de Animación Principal ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const p = geometry.attributes.position.array;
            
            // Factor de interacción:
            // Si hay tensión (puño), comprimir hacia el centro.
            // Si no, forma normal.
            const scale = 1 - (handTension * 0.6); // Se reduce hasta 40% del tamaño
            const vibration = handTension * 0.05;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const ix = i*3; const iy = i*3+1; const iz = i*3+2;
                
                // 1. Mover hacia target (forma)
                const tx = targetPositions[ix];
                const ty = targetPositions[iy];
                const tz = targetPositions[iz];

                // Interpolación hacia la forma deseada (Lerp)
                p[ix] += (tx - p[ix]) * 0.05;
                p[iy] += (ty - p[iy]) * 0.05;
                p[iz] += (tz - p[iz]) * 0.05;

                // 2. Aplicar efecto de Mano (Escala desde el centro)
                // Truco: No modificamos 'p' permanentemente por la escala, 
                // sino que calculamos el punto visual. 
                // Pero como ThreeJS usa buffer, necesitamos un truco visual.
                // Modificaremos el target dinámicamente en el siguiente frame? No.
                // Aplicamos una fuerza hacia el centro en el array actual.
                
                if (handTension > 0.01) {
                    p[ix] = p[ix] * (1 - handTension * 0.02) + (Math.random()-0.5)*vibration;
                    p[iy] = p[iy] * (1 - handTension * 0.02) + (Math.random()-0.5)*vibration;
                    p[iz] = p[iz] * (1 - handTension * 0.02) + (Math.random()-0.5)*vibration;
                } else {
                    // Fuerza de restauración suave si se encogió demasiado
                    // (Ya manejado por el Lerp hacia targetPositions arriba)
                }
            }

            geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Iniciar todo
        animate(); // Empezar loop gráfico ya
        startApp(); // Iniciar carga de IA
    </script>
</body>
</html>
